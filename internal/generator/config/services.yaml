    packageProfile: controller-backed
    selection:
      enabled: true
      mode: explicit
      includeKinds:
        - GovernanceInstance
    generation:
      controller:
        strategy: generated
      serviceManager:
        strategy: generated
      registration:
        strategy: generated
      webhooks:
        strategy: none
      resources:
        - kind: GovernanceInstance
          formalSpec: governanceinstance
          async:
            strategy: lifecycle
            runtime: generatedruntime
            formalClassification: lifecycle
          serviceManager:
            packagePath: accessgovernancecp/governanceinstance
        - kind: GovernanceInstanceConfiguration
          controller:
            strategy: none
          serviceManager:
            strategy: none
        - kind: SenderConfig
          controller:
            strategy: none
          serviceManager:
            strategy: none

