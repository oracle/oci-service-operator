                - +kubebuilder:validation:Optional
          statusFields:
            - name: LoadBalancerId
              type: string
              tag: 'json:"loadBalancerId,omitempty"'
              comments:
                - The bound load balancer OCID used to address this routing policy.
          async:
            strategy: lifecycle
            runtime: generatedruntime
            formalClassification: lifecycle
        - kind: RuleSet
          specFields:
            - name: LoadBalancerId
              type: string
              tag: 'json:"loadBalancerId,omitempty"'
              comments:
                - "The OCID of the load balancer that owns this rule set."
              markers:
                - +kubebuilder:validation:Optional
          statusFields:
            - name: LoadBalancerId
              type: string
              tag: 'json:"loadBalancerId,omitempty"'
