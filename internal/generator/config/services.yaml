              markers:
                - +kubebuilder:validation:Required
          statusFields:
            - name: LoadBalancerId
              type: string
              tag: 'json:"loadBalancerId,omitempty"'
              comments:
                - The bound load balancer OCID used to address this backend.
            - name: BackendSetName
              type: string
              tag: 'json:"backendSetName,omitempty"'
              comments:
                - The bound backend set name used to address this backend.
          sample:
            body: |-
