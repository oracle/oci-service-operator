    packageProfile: controller-backed
    selection:
      enabled: true
      mode: explicit
      includeKinds:
        - ScheduledQuery
    generation:
      controller:
        strategy: generated
      serviceManager:
        strategy: generated
      registration:
        strategy: generated
      webhooks:
        strategy: none
      resources:
        - kind: ScheduledQuery
          formalSpec: scheduledquery
          async:
            strategy: lifecycle
            runtime: generatedruntime
            formalClassification: lifecycle
          specFields:
            - name: ApmDomainId
              type: string
              tag: 'json:"apmDomainId"'
              comments:
                - The APM Domain ID the request is intended for.
              markers:
                - +kubebuilder:validation:Required
            - name: ScheduledQueryRetentionCriteria
              type: string
              tag: 'json:"scheduledQueryRetentionCriteria"'
              comments:
                - Retention criteria for the scheduled query. The live service rejects create requests when this value is omitted.
              markers:
                - +kubebuilder:validation:Required
          statusFields:
            - name: ApmDomainId
              type: string
              tag: 'json:"apmDomainId,omitempty"'
              comments:
                - The bound APM Domain ID used to address this scheduled query.
          sample:
            body: |-
              #
              # Replace the APM Domain OCID below before running e2e.
