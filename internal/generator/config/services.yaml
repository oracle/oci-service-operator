                type: HOSTING
                unitCount: 1
                unitShape: SMALL_COHERE
                description: OSOK DedicatedAiCluster sample
                freeformTags:
                  managed-by: oci-service-operator
        - kind: Endpoint
          formalSpec: endpoint
          sample:
            body: |-
              #
              # Replace the compartment, model, and DedicatedAiCluster OCIDs before running e2e.
              # The controller may bind an existing Endpoint only when the returned OCI list item
              # matches spec.compartmentId, spec.modelId, spec.dedicatedAiClusterId, and any
              # populated spec.displayName.
              #
              apiVersion: generativeai.oracle.com/v1beta1
              kind: Endpoint
              metadata:
                name: endpoint-sample
              spec:
                compartmentId: ocid1.compartment.oc1..exampleuniqueID
                modelId: ocid1.generativeaimodel.oc1..exampleuniqueID
                dedicatedAiClusterId: ocid1.generativeaidedicatedaicluster.oc1..exampleuniqueID
                displayName: osok-endpoint-sample
                description: OSOK Endpoint sample
                contentModerationConfig:
                  isEnabled: false
                freeformTags:
                  managed-by: oci-service-operator
        - kind: Model
          formalSpec: model
          sample:
            body: |-
              #
              # Replace the compartment, base model, and DedicatedAiCluster OCIDs before running e2e.
              # Keeping spec.displayName empty disables pre-create reuse; setting it allows the
              # controller to bind an existing custom Model only when the returned OCI list item
              # matches spec.compartmentId, spec.baseModelId, spec.fineTuneDetails.dedicatedAiClusterId,
              # and any populated spec.displayName.
              #
              apiVersion: generativeai.oracle.com/v1beta1
              kind: Model
