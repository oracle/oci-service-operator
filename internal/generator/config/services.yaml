                name: macorder-sample
              spec:
                compartmentId: ocid1.compartment.oc1..exampleuniqueID
                displayName: "macorder-sample"
                orderDescription: "Initial Mac server order"
                orderSize: 1
                shape: M4_PRO_MAC_MINI_64GB_2TB
                commitmentTerm: YEARS_3
