  - service: tenantmanagercontrolplane
    sdkPackage: github.com/oracle/oci-go-sdk/v65/tenantmanagercontrolplane
    group: tenantmanagercontrolplane
    version: v1beta1
    phase: security-and-identity
    packageProfile: controller-backed
    selection:
      enabled: true
      mode: explicit
      includeKinds:
        - Domain
        - Organization
        - DomainGovernance
    observedState:
      excludedFieldPaths:
        Domain:
          - SystemTags
        Organization:
          - SystemTags
    generation:
      controller:
        strategy: generated
      serviceManager:
        strategy: generated
      registration:
        strategy: generated
      webhooks:
        strategy: none
      resources:
        - kind: Domain
          formalSpec: domain
          async:
            strategy: workrequest
            runtime: generatedruntime
            formalClassification: workrequest
            workRequest:
              source: service-sdk
              phases:
                - create
          serviceManager:
            packagePath: tenantmanagercontrolplane/domain
          specFields:
            - name: Status
              type: string
              tag: 'json:"status,omitempty"'
              comments:
                - Optional exact-match filter used to narrow list-based binding and delete confirmation reads.
                - Supported values include `PENDING`, `RELEASING`, `RELEASED`, `EXPIRING`, `REVOKING`, `REVOKED`, `ACTIVE`, and `FAILED`.
              markers:
                - +kubebuilder:validation:Optional
            - name: LifecycleState
              type: string
              tag: 'json:"lifecycleState,omitempty"'
              comments:
                - Optional exact-match filter used to narrow list-based binding and delete confirmation reads.
                - Supported values include `CREATING`, `ACTIVE`, `INACTIVE`, `UPDATING`, `FAILED`, and `TERMINATED`.
              markers:
                - +kubebuilder:validation:Optional
          statusFields:
            - name: CompartmentId
              type: string
              tag: 'json:"compartmentId,omitempty"'
              comments:
                - The tenancy OCID recorded for list identity matching and replacement-only drift checks.
            - name: Status
              type: string
              tag: 'json:"sdkStatus,omitempty"'
              comments:
                - The raw domain status returned by Tenant Manager Control Plane.
            - name: SubscriptionEmail
              type: string
              tag: 'json:"subscriptionEmail,omitempty"'
              comments:
                - The accepted subscription email tracked from the spec because the SDK does not echo it on reads.
            - name: IsGovernanceEnabled
              type: bool
              tag: 'json:"isGovernanceEnabled,omitempty"'
              comments:
                - Whether governance was requested for the bound domain; tracked from the spec because the SDK does not echo it on reads.
          sample:
            body: |-
              #
              # Replace the compartment OCID and domain name below before running e2e.
              # `spec.domainName` is the OCI identity surface; metadata.name is only the Kubernetes object name.
              #
              apiVersion: tenantmanagercontrolplane.oracle.com/v1beta1
              kind: Domain
              metadata:
                name: domain-sample
              spec:
                compartmentId: ocid1.tenancy.oc1..exampleuniqueID
                domainName: example.com
                subscriptionEmail: admin@example.com
                isGovernanceEnabled: false
        - kind: Organization
          formalSpec: organization
          async:
            strategy: workrequest
            runtime: generatedruntime
            formalClassification: workrequest
            workRequest:
              source: service-sdk
              phases:
                - update
          serviceManager:
            packagePath: tenantmanagercontrolplane/organization
          specFields:
            - name: OrganizationId
              type: string
              tag: 'json:"organizationId,omitempty"'
              comments:
                - The OCI identifier of the existing organization to bind directly.
              markers:
                - +kubebuilder:validation:Optional
            - name: CompartmentId
              type: string
              tag: 'json:"compartmentId,omitempty"'
              comments:
                - The tenancy OCID containing the existing organization when binding by list lookup.
                - Provide this when `organizationId` is not set; reconcile requires `ListOrganizations` to return a unique match.
              markers:
                - +kubebuilder:validation:Optional
            - name: DefaultUcmSubscriptionId
              type: string
              tag: 'json:"defaultUcmSubscriptionId,omitempty"'
              comments:
                - Desired default Universal Credits Model subscription for the bound organization.
                - Omit this field to leave the current OCI value unchanged.
              markers:
                - +kubebuilder:validation:Optional
          sample:
            body: |-
              #
              # Tenant Manager Control Plane does not expose CreateOrganization or DeleteOrganization.
              # This sample binds an existing Organization by OCID and optionally
              # reconciles defaultUcmSubscriptionId in place.
              #
              apiVersion: tenantmanagercontrolplane.oracle.com/v1beta1
              kind: Organization
              metadata:
                name: organization-sample
              spec:
                organizationId: ocid1.organization.oc1..exampleuniqueID
                defaultUcmSubscriptionId: ocid1.subscription.oc1..exampleuniqueID
        - kind: DomainGovernance
          formalSpec: domaingovernance
          async:
            strategy: lifecycle
            runtime: generatedruntime
            formalClassification: lifecycle

  - service: usageapi
    sdkPackage: github.com/oracle/oci-go-sdk/v65/usageapi
    group: usageapi
    version: v1beta1
    phase: eventing-messaging-and-observability
    packageProfile: controller-backed
    selection:
      enabled: true
      mode: explicit
      includeKinds:
        - CustomTable
        - Query
        - Schedule
        - UsageCarbonEmissionsQuery
    async:
      strategy: lifecycle
      runtime: generatedruntime
      formalClassification: lifecycle
    generation:
      controller:
        strategy: generated
      serviceManager:
        strategy: generated
      registration:
        strategy: generated
      webhooks:
        strategy: none
      resources:
        - kind: CustomTable
          formalSpec: customtable
          sample:
            body: |-
              #
              # Replace the OCI identifiers below before running e2e.
              # Update metadata.name and spec.savedCustomTable.displayName if you want to force a
              # fresh create instead of binding to an existing CustomTable with the same saved
              # report scope and rendered table shape.
              #
              apiVersion: usageapi.oracle.com/v1beta1
              kind: CustomTable
              metadata:
                name: customtable-sample
              spec:
                compartmentId: ocid1.compartment.oc1..exampleuniqueID
                savedReportId: ocid1.savedreport.oc1..exampleuniqueID
                savedCustomTable:
                  displayName: "customtable-sample"
                  rowGroupBy:
                    - compartmentId
                  columnGroupBy:
                    - service
                  groupByTag:
                    - namespace: oracle
                      key: createdBy
                  compartmentDepth: 2
                  version: 1
        - kind: Query
          formalSpec: query
          sample:
            body: |-
              #
              # Replace the OCI identifiers below before running e2e.
              # Update metadata.name and spec.queryDefinition.displayName if you want to force a
              # fresh create instead of binding to an existing Query with the same saved
              # definition in the same compartment.
              #
              apiVersion: usageapi.oracle.com/v1beta1
              kind: Query
              metadata:
                name: query-sample
              spec:
                compartmentId: ocid1.compartment.oc1..exampleuniqueID
                queryDefinition:
                  displayName: "query-sample"
                  reportQuery:
                    tenantId: ocid1.tenancy.oc1..exampleuniqueID
                    granularity: MONTHLY
                    queryType: COST
                    groupBy:
                      - service
                    dateRangeName: LAST_THREE_MONTHS
                  costAnalysisUI:
                    graph: BARS
                    isCumulativeGraph: false
                  version: 1
        - kind: Schedule
          formalSpec: schedule
          sample:
            body: |-
              #
              # Replace the OCI identifiers and Object Storage values below before running e2e.
              # Update spec.description, spec.outputFileFormat, spec.resultLocation, or tags to
              # exercise supported in-place updates on an existing Schedule.
              # Changing spec.name, spec.compartmentId, spec.scheduleRecurrences, spec.timeScheduled,
              # spec.savedReportId, or spec.queryProperties requires recreation and is rejected on
              # an already bound Schedule.
              #
              apiVersion: usageapi.oracle.com/v1beta1
              kind: Schedule
              metadata:
                name: schedule-sample
              spec:
                name: schedule-sample
                compartmentId: ocid1.compartment.oc1..exampleuniqueID
                resultLocation:
                  locationType: OBJECT_STORAGE
                  region: us-ashburn-1
                  namespace: example-namespace
                  bucketName: usage-reports
                scheduleRecurrences: "DAILY"
                timeScheduled: "2026-01-15T15:00:00Z"
                description: "Daily usage export"
                outputFileFormat: CSV
                queryProperties:
                  granularity: DAILY
                  dateRange:
                    dateRangeType: DYNAMIC
                    dynamicDateRangeType: LAST_7_DAYS
                freeformTags:
                  workload: finops
        - kind: UsageCarbonEmissionsQuery
          async:
            strategy: lifecycle
            runtime: generatedruntime
            formalClassification: lifecycle

