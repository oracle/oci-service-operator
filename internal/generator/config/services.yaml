              kind: Backend
              metadata:
                name: backend-sample
              spec:
                loadBalancerId: ocid1.loadbalancer.oc1..<unique_ID>
                backendSetName: example_backend_set
                ipAddress: "10.0.0.3"
                port: 8080
                weight: 1
                backup: false
                drain: false
                offline: false
        - kind: BackendSet
          formalSpec: backendset
          specFields:
            - name: LoadBalancerId
              type: string
              tag: 'json:"loadBalancerId"'
              comments:
                - "The OCID (https://docs.cloud.oracle.com/Content/General/Concepts/identifiers.htm) of the load balancer that owns this backend set."
              markers:
                - +kubebuilder:validation:Required
          statusFields:
            - name: LoadBalancerId
              type: string
              tag: 'json:"loadBalancerId,omitempty"'
              comments:
                - The bound load balancer OCID used to address this backend set.
          sample:
            body: |-
              apiVersion: loadbalancer.oracle.com/v1beta1
              kind: BackendSet
              metadata:
                name: backendset-sample
              spec:
                loadBalancerId: ocid1.loadbalancer.oc1..<unique_ID>
                name: example_backend_set
                policy: ROUND_ROBIN
                healthChecker:
                  protocol: HTTP
                  urlPath: /healthz
                  port: 8080
                  returnCode: 200
        - kind: Certificate
          async:
            strategy: lifecycle
            runtime: generatedruntime
            formalClassification: lifecycle
        - kind: Hostname
          async:
            strategy: lifecycle
            runtime: generatedruntime
            formalClassification: lifecycle
        - kind: Listener
          formalSpec: listener
          async:
            strategy: workrequest
            runtime: generatedruntime
            formalClassification: workrequest
            workRequest:
              source: service-sdk
              phases:
                - create
                - update
                - delete
          specFields:
            - name: LoadBalancerId
              type: string
              tag: 'json:"loadBalancerId"'
              comments:
                - "The OCID (https://docs.cloud.oracle.com/Content/General/Concepts/identifiers.htm) of the load balancer that owns this listener."
              markers:
                - +kubebuilder:validation:Required
          statusFields:
            - name: LoadBalancerId
              type: string
              tag: 'json:"loadBalancerId,omitempty"'
              comments:
                - The bound load balancer OCID used to address this listener.
          sample:
            body: |-
              apiVersion: loadbalancer.oracle.com/v1beta1
              kind: Listener
              metadata:
                name: listener-sample
              spec:
                loadBalancerId: ocid1.loadbalancer.oc1..<unique_ID>
                name: example_listener
                defaultBackendSetName: example_backend_set
                port: 80
                protocol: HTTP
        - kind: LoadBalancer
          formalSpec: loadbalancer
          sample:
            body: |-
              apiVersion: loadbalancer.oracle.com/v1beta1
              kind: LoadBalancer
              metadata:
                name: loadbalancer-sample
              spec:
                compartmentId: ocid1.compartment.oc1..<unique_ID>
                displayName: example_load_balancer
                shapeName: Flexible
                subnetIds:
                  - ocid1.subnet.oc1..<unique_ID>
                shapeDetails:
                  minimumBandwidthInMbps: 10
                  maximumBandwidthInMbps: 10
        - kind: PathRouteSet
          specFields:
            - name: LoadBalancerId
              type: string
              tag: 'json:"loadBalancerId,omitempty"'
              comments:
                - "The OCID of the load balancer that owns this path route set."
              markers:
                - +kubebuilder:validation:Optional
          statusFields:
            - name: LoadBalancerId
              type: string
              tag: 'json:"loadBalancerId,omitempty"'
              comments:
                - The bound load balancer OCID used to address this path route set.
          async:
            strategy: lifecycle
            runtime: generatedruntime
            formalClassification: lifecycle
        - kind: RoutingPolicy
          specFields:
            - name: LoadBalancerId
              type: string
              tag: 'json:"loadBalancerId,omitempty"'
              comments:
