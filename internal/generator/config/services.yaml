          statusFields:
            - name: AdminUsernameSource
              type: shared.UsernameSource
              tag: 'json:"adminUsernameSource,omitempty,omitzero"'
              comments:
                - The last applied secret reference for the administrative username.
            - name: AdminPasswordSource
