            - name: ArtifactPath
              type: string
              tag: 'json:"artifactPath,omitempty"'
              comments:
                - The observed artifact path used to address the artifact content.
            - name: Version
              type: string
              tag: 'json:"version,omitempty"'
              comments:
                - The observed artifact version used to address the artifact content.
            - name: DisplayName
              type: string
              tag: 'json:"displayName,omitempty"'
              comments:
                - The observed artifact display name returned by OCI.
            - name: CompartmentId
              type: string
              tag: 'json:"compartmentId,omitempty"'
              comments:
                - The observed compartment OCID returned by OCI.
            - name: Sha256
              type: string
              tag: 'json:"sha256,omitempty"'
              comments:
                - The observed SHA256 digest for the artifact content.
            - name: SizeInBytes
              type: int64
              tag: 'json:"sizeInBytes,omitempty"'
              comments:
                - The observed artifact size in bytes.
            - name: LifecycleState
              type: string
              tag: 'json:"lifecycleState,omitempty"'
              comments:
                - The observed artifact lifecycle state returned by OCI.
            - name: Etag
              type: string
              tag: 'json:"etag,omitempty"'
              comments:
                - The latest observed entity tag for optimistic overwrite checks.
          sample:
            metadataName: genericartifactcontentbypath-sample
            spec: |2-
                compartmentId: ocid1.compartment.oc1..exampleuniqueID
                repositoryId: ocid1.repository.oc1..exampleuniqueID
