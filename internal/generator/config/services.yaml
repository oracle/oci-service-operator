                baseModelId: ocid1.generativeaimodel.oc1..exampleuniqueID
                displayName: osok-model-sample
                description: OSOK Model sample
                fineTuneDetails:
                  dedicatedAiClusterId: ocid1.generativeaidedicatedaicluster.oc1..exampleuniqueID
                  trainingDataset:
