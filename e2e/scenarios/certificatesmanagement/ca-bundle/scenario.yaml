version: 1
name: certificates-management-ca-bundle-basic-crud
service: certificatesmanagement
namespace: default
timeout: 30m
pollInterval: 10s
create: create.yaml
update: update.yaml
ready:
  conditionTypes: [Active]
  lifecycleStates: [ACTIVE]
  requireOCID: true
  fieldsEqual:
    - desired: spec.name
      observed: status.name
    - desired: spec.description
      observed: status.description
    - desired: spec.freeformTags.osok-e2e-phase
      observed: status.freeformTags.osok-e2e-phase
failureConditionTypes: [Failed]
delete:
  enabled: true
  timeout: 30m
  cleanupDependencies: true
cleanupOnFailure: true
