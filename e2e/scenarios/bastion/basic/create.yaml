apiVersion: bastion.oracle.com/v1beta1
kind: Bastion
metadata:
  name: osok-bastion-${OSOK_E2E_SUFFIX}
spec:
  bastionType: STANDARD
  compartmentId: ${OCI_COMPARTMENT_ID}
  targetSubnetId: ${OCI_SUBNET_ID}
  name: osok-bastion-${OSOK_E2E_SUFFIX}
  clientCidrBlockAllowList:
    - 10.0.0.0/8
  maxSessionTtlInSeconds: 1800
  dnsProxyStatus: DISABLED
  freeformTags:
    osok-e2e-phase: create
