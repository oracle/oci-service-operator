version: 1
name: events-rule-basic-crud
service: events
namespace: default
timeout: 20m
pollInterval: 10s
create: create.yaml
update: update.yaml
ready:
  conditionTypes: [Active]
  lifecycleStates: [INACTIVE]
  requireOCID: true
  fieldsEqual:
    - desired: spec.displayName
      observed: status.displayName
    - desired: spec.condition
      observed: status.condition
    - desired: spec.description
      observed: status.description
    - desired: spec.freeformTags
      observed: status.freeformTags
failureConditionTypes: [Failed]
delete:
  enabled: true
  timeout: 20m
  cleanupDependencies: true
cleanupOnFailure: true
