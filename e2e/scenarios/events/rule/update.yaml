apiVersion: events.oracle.com/v1beta1
kind: Rule
metadata:
  name: osok-event-rule-${OSOK_E2E_SUFFIX}
spec:
  compartmentId: ${OCI_COMPARTMENT_ID}
  displayName: osok-event-rule-updated-${OSOK_E2E_SUFFIX}
  description: OSOK lifecycle test event rule updated
  isEnabled: false
  condition: '{"eventType":"com.oraclecloud.virtualnetwork.createvcn.end"}'
  actions:
    actions:
      - actionType: ONS
        isEnabled: false
        description: Disabled OSOK lifecycle notification updated
        topicId: ${OCI_NOTIFICATION_TOPIC_ID}
  freeformTags:
    osok-e2e-phase: update
