apiVersion: loadbalancer.oracle.com/v1beta1
kind: LoadBalancer
metadata:
  name: osok-lb-${OSOK_E2E_SUFFIX}
spec:
  compartmentId: ${OCI_COMPARTMENT_ID}
  displayName: osok-lb-updated-${OSOK_E2E_SUFFIX}
  shapeName: flexible
  subnetIds:
    - ${OCI_SUBNET_ID}
  shapeDetails:
    minimumBandwidthInMbps: 10
    maximumBandwidthInMbps: 10
  isPrivate: true
  freeformTags:
    osok-e2e-phase: update
