apiVersion: redis.oracle.com/v1beta1
kind: RedisCluster
metadata:
  name: osok-redis-${OSOK_E2E_SUFFIX}
spec:
  displayName: osok-rds-${OSOK_E2E_SUFFIX}
  compartmentId: ${OCI_COMPARTMENT_ID}
  nodeCount: 2
  softwareVersion: ${OCI_REDIS_SOFTWARE_VERSION}
  nodeMemoryInGBs: 8
  subnetId: ${OCI_SUBNET_ID}
  freeformTags:
    osok-e2e-phase: create
