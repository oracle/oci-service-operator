apiVersion: autoscaling.oracle.com/v1beta1
kind: AutoScalingConfiguration
metadata:
  name: osok-autoscaling-${OSOK_E2E_SUFFIX}
spec:
  compartmentId: ${OCI_COMPARTMENT_ID}
  displayName: osok-autoscaling-${OSOK_E2E_SUFFIX}
  isEnabled: false
  coolDownInSeconds: 300
  resource:
    id: ${OCI_INSTANCE_POOL_ID}
    type: instancePool
  policies:
    - policyType: scheduled
      displayName: osok-autoscaling-policy-${OSOK_E2E_SUFFIX}
      isEnabled: false
      capacity:
        min: 1
        max: 1
        initial: 1
      executionSchedule:
        type: cron
        expression: "0 0 0 ? * * *"
        timezone: UTC
  freeformTags:
    osok-e2e-phase: create
