version: 1
name: ons-subscription-basic-crud
service: ons
namespace: default
timeout: 20m
pollInterval: 10s
create: create.yaml
update: update.yaml
ready:
  conditionTypes: [Active]
  lifecycleStates: [ACTIVE]
  requireOCID: true
  fieldsEqual:
    - desired: spec.topicId
      observed: status.topicId
    - desired: spec.protocol
      observed: status.protocol
    - desired: spec.endpoint
      observed: status.endpoint
    - desired: spec.freeformTags
      observed: status.freeformTags
failureConditionTypes: [Failed]
delete:
  enabled: true
  timeout: 20m
  cleanupDependencies: true
cleanupOnFailure: true
