version: 1
name: logging-custom-log-basic-crud
service: logging
namespace: default
timeout: 20m
pollInterval: 10s
create: create.yaml
update: update.yaml
ready:
  conditionTypes: [Active]
  lifecycleStates: [ACTIVE]
  requireOCID: true
  fieldsEqual:
    - desired: spec.displayName
      observed: status.displayName
    - desired: spec.logGroupId
      observed: status.logGroupId
    - desired: spec.logType
      observed: status.logType
    - desired: spec.isEnabled
      observed: status.isEnabled
    - desired: spec.retentionDuration
      observed: status.retentionDuration
    - desired: spec.freeformTags
      observed: status.freeformTags
failureConditionTypes: [Failed]
delete:
  enabled: true
  timeout: 20m
  cleanupDependencies: true
cleanupOnFailure: true
