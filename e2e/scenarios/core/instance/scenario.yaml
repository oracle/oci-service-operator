version: 1
name: core-instance-basic-crud
service: core
namespace: default
timeout: 40m
pollInterval: 15s
create: create.yaml
update: update.yaml
ready:
  conditionTypes: [Active]
  lifecycleStates: [RUNNING]
  requireOCID: true
  fieldsEqual:
    - desired: spec.displayName
      observed: status.displayName
    - desired: spec.freeformTags
      observed: status.freeformTags
failureConditionTypes: [Failed]
delete:
  enabled: true
  timeout: 40m
  cleanupDependencies: true
cleanupOnFailure: true
