apiVersion: core.oracle.com/v1beta1
kind: Instance
metadata:
  name: osok-instance-${OSOK_E2E_SUFFIX}
spec:
  compartmentId: ${OCI_COMPARTMENT_ID}
  availabilityDomain: ${OCI_AVAILABILITY_DOMAIN}
  subnetId: ${OCI_SUBNET_ID}
  displayName: osok-instance-updated-${OSOK_E2E_SUFFIX}
  shape: ${OCI_COMPUTE_SHAPE}
  shapeConfig:
    ocpus: 1
    memoryInGBs: 16
  instanceOptions:
    areLegacyImdsEndpointsDisabled: true
  sourceDetails:
    sourceType: image
    imageId: ${OCI_IMAGE_ID}
  freeformTags:
    osok-e2e-phase: create
