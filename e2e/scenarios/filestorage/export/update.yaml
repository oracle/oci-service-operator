apiVersion: filestorage.oracle.com/v1beta1
kind: Export
metadata:
  name: osok-export-${OSOK_E2E_SUFFIX}
spec:
  exportSetId: ${OCI_FILE_STORAGE_EXPORT_SET_ID}
  fileSystemId: ${OCI_FILE_SYSTEM_ID}
  path: /osok-${OSOK_E2E_ID}
  exportOptions:
    - source: 0.0.0.0/0
      requirePrivilegedSourcePort: true
      access: READ_WRITE
      identitySquash: ROOT
      anonymousUid: 65534
      anonymousGid: 65534
      allowedAuth: [SYS]
