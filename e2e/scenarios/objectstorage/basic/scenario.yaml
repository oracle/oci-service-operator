version: 1
name: objectstorage-bucket-basic-crud
service: objectstorage
namespace: default
timeout: 10m
pollInterval: 5s
create: create.yaml
update: update.yaml
ready:
  conditionTypes: [Active]
  requireOCID: true
  fieldsEqual:
    - desired: spec.name
      observed: status.name
    - desired: spec.metadata
      observed: status.metadata
failureConditionTypes: [Failed]
delete:
  enabled: true
  timeout: 10m
  cleanupDependencies: true
cleanupOnFailure: true
