apiVersion: containerengine.oracle.com/v1beta1
kind: Cluster
metadata:
  name: osok-oke-cluster-${OSOK_E2E_SUFFIX}
spec:
  name: osok-oke-cluster-${OSOK_E2E_SUFFIX}
  compartmentId: ${OCI_COMPARTMENT_ID}
  vcnId: ${OCI_VCN_ID}
  kubernetesVersion: ${OCI_KUBERNETES_VERSION}
  endpointConfig:
    subnetId: ${OCI_SUBNET_ID}
    isPublicIpEnabled: false
  options:
    serviceLbSubnetIds:
      - ${OCI_SUBNET_ID}
  type: BASIC_CLUSTER
  freeformTags:
    osok-e2e-phase: update
