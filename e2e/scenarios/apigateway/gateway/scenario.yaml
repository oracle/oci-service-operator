version: 1
name: api-gateway-basic-crud
service: apigateway
namespace: default
timeout: 45m
pollInterval: 15s
create: create.yaml
update: update.yaml
ready:
  conditionTypes: [Active]
  requireOCID: true
failureConditionTypes: [Failed]
relatedObjects:
  - apiVersion: v1
    kind: Secret
    requiredDataKeys: [hostname]
    deleteWithResource: true
delete:
  enabled: true
  timeout: 45m
  cleanupDependencies: true
cleanupOnFailure: true
