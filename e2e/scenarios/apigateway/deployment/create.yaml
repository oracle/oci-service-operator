apiVersion: apigateway.oracle.com/v1beta1
kind: ApiGatewayDeployment
metadata:
  name: osok-api-deploy-${OSOK_E2E_SUFFIX}
spec:
  gatewayId: ${OCI_APIGATEWAY_ID}
  compartmentId: ${OCI_COMPARTMENT_ID}
  displayName: osok-api-deploy-${OSOK_E2E_SUFFIX}
  pathPrefix: /osok-${OSOK_E2E_ID}
  routes:
    - path: /hello
      methods: [GET]
      backend:
        type: STOCK_RESPONSE_BACKEND
        status: 200
        body: OSOK live lifecycle create
  freeformTags:
    osok-e2e-phase: create
