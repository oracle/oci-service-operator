version: 1
name: monitoring-alarm-basic-crud
service: monitoring
namespace: default
timeout: 20m
pollInterval: 10s
create: create.yaml
update: update.yaml
ready:
  conditionTypes: [Active]
  lifecycleStates: [ACTIVE]
  requireOCID: true
  fieldsEqual:
    - desired: spec.displayName
      observed: status.displayName
    - desired: spec.query
      observed: status.query
    - desired: spec.destinations
      observed: status.destinations
    - desired: spec.freeformTags
      observed: status.freeformTags
failureConditionTypes: [Failed]
delete:
  enabled: true
  timeout: 20m
  cleanupDependencies: true
cleanupOnFailure: true
