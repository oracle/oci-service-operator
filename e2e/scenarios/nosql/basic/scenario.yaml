version: 1
name: nosql-table-basic-crud
service: nosql
namespace: default
timeout: 30m
pollInterval: 10s
create: create.yaml
update: update.yaml
ready:
  conditionTypes: [Active]
  lifecycleStates: [ACTIVE]
  requireOCID: true
  fieldsEqual:
    - desired: spec.name
      observed: status.name
    - desired: spec.tableLimits
      observed: status.tableLimits
    - desired: spec.freeformTags
      observed: status.freeformTags
failureConditionTypes: [Failed]
delete:
  enabled: true
  timeout: 30m
  cleanupDependencies: true
cleanupOnFailure: true
