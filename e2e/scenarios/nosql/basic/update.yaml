apiVersion: nosql.oracle.com/v1beta1
kind: Table
metadata:
  name: osok-table-${OSOK_E2E_SUFFIX}
spec:
  name: osok_table_${OSOK_E2E_ID}
  compartmentId: ${OCI_COMPARTMENT_ID}
  ddlStatement: CREATE TABLE osok_table_${OSOK_E2E_ID} (id INTEGER, payload STRING, PRIMARY KEY(id))
  tableLimits:
    maxReadUnits: 20
    maxWriteUnits: 10
    maxStorageInGBs: 1
    capacityMode: PROVISIONED
  freeformTags:
    osok-e2e-phase: updated
