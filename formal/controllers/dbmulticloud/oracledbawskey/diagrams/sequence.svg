status/finalizer: required /</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="174.3027" x="813" y="2115.7803">retain-until-confirmed-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="272.3984" x="813" y="2129.7803">requeue: provisioning, updating, terminating</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="265.3369" x="813" y="2143.7803">provider states: create CREATING; update</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="192.165" x="813" y="2157.7803">UPDATING; delete DELETING</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="234.9922" x="813" y="2171.7803">follow-up: create=GetWorkRequest -&gt;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="277.792" x="813" y="2185.7803">read-after-write; update=GetWorkRequest -&gt;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="273.1162" x="813" y="2199.7803">read-after-write; delete=GetWorkRequest -&gt;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="88.7031" x="813" y="2213.7803">confirm-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="273.1162" x="813" y="2227.7803">supported drift: displayName, freeformTags,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="77.0547" x="813" y="2241.7803">definedTags</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="230.3301" x="813" y="2255.7803">reject before mutate: force-new fields</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="315.9229" x="813" y="2269.7803">compartmentId, oracleDbConnectorId, awsKeyArn,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="152.1201" x="813" y="2283.7803">awsAccountId (+4 more)</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="144.751" x="813" y="2297.7803">create-only fields: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="279.3574" x="813" y="2311.7803">list lookup: unavailable filters compartmentId,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="297.2402" x="813" y="2325.7803">displayName, oracleDbAwsKeyId, lifecycleState</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="278.9404" x="813" y="2339.7803">(+2 more); exact declared filters match within</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="261.4746" x="813" y="2353.7803">the resource scope; duplicate matches fail</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="813" y="2367.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="150.2129" x="813" y="2381.7803">open gaps: seed-corpus</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="315.1777" x="813" y="2395.7803">The generated service manager uses the reviewed</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="286.3506" x="813" y="2409.7803">CRUD request, response, lifecycle, and status</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="118.2822" x="813" y="2423.7803">projection contract.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="301.1641" x="813" y="2437.7803">Work-request phases are declared per operation</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="261.4678" x="813" y="2451.7803">from the vendored SDK response surface.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="253.7021" x="813" y="2465.7803">Secret side effects are none and finalizer</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="284.0469" x="813" y="2479.7803">ownership is retained until confirmed deletion.</text><?plantuml-src jLXRSzis5dx7hpZJlYHJqOuJfqtbySwuTjfcuZOTEvcyw0KYGGar1R00A4Mxi_zzFrn8aPJKshlRoKCeNCxrEzyvi7sGgkQ6hyWkUQ4tKYsev9KLp7OxSvu_B8nkL76jAstewpB7lw9teX0bRohterRkLxuIzBEeriB9d1y-So__AUZilBV9ZT6R9Fr5UVRTo_vDfPtuOS-6ilok-7PyIfj2c7HYVlxwrOllHoUy-hJ_wjNvsUlNlVqWFjT62KDdtp8dNINeNlpH29KBogYOh-20p2lT5ASV3CyhSJE_sjZtOikMiX1KQktc-ajFf6rl_uiHyTnfCp0nkTfkZNqKByMRyWMs8GnwPSsLEto_V-0nKdfXw6HKiXItKWs3-FqvVpL_WrqliXvivVFYjJZhjlOIzARaPSx-pO9lzBwP2qJM2SjwTj0r336wgeGPBF_0hRWJkLQv76zzzU7-m_jxOTOo5xzmnHV2V4NSqd1fSEN3zJlcaqzwZTGEPKz6zr06HXHaXDLLuwHMqxHqMaY-G4xjQVoTxOvaRPfFx7hHIYX41M-FtexRmvj25G6aR1SiolxHYz6KXCBvHj0GVZ0t-SDsX_tLeQzJwhwV6Q_OkkTiUCHV6aPakXCEdwpqlet07m10jre_u3yE9-PI5OnNZXmEFk02022-r1KI4h91g1Q5-jeIhupWnHQxqZhBXggzCJWzfP-46waKeAXEUYTDMbf9Qq5YnoJTGirGb7rMoie9OwSpbUkLnyqAujuL4ogahIk-zPGscIazkERtVSNaMopUEmvqFVlcvKojj17FdmVdZMWidoDitcEFbiQ02M0ZSWokGAaSi_8QGN5Yv7AbTKrvsA4QKF5KVNttzkhZkrz_UaBWe3K4xx1r_tK-3ZXp07yruWp1iRpM7abzC4X55f5iR13dGnYhX19OHP6WTXEMZraNTqS67ZaBqqffLgsYjUJxpldK7m9Ep4YwsMRavktjsoTb1BKnKuUajp708bTm6aQKKl4ApTCW8bYr0KtpIligU4puZN0SGKucsu1QNwzODwccqfwl17o0t4ZFBIG_La4qQsSeBr5R-r8Z3biiUXH4Q-1FCCOZyt4A8nzkbhA3yWe-Me1ffjhocD2dtsxILvUWeBcIwpOGNXJOpS9uKHKPtu2dPwemidGarhngU30y8J0iBn6yohFDhhiCRPxurdFVrBKsG2yrTU4rsSQKF1VJ0S6mqWXHQhFwo1TsuiSbzEB2_s1tudUHEvhxRK6hnfix1OEWO3CbDj5WoqRirV8LEe8IlWTZaV40hYkZ9eJFgpm73U4qkEkS0dMnHECjAT9GAkkRJ7kKoFOfSIXsnLs-HCJGoRvWC82RUHNQPTB7mW7