y="2141.7803">displayName, freeformTags (+2 more)</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="230.3301" x="831" y="2155.7803">reject before mutate: force-new fields</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="92.5791" x="831" y="2169.7803">resourcesFilter</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="144.751" x="831" y="2183.7803">create-only fields: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="66.1445" x="831" y="2197.7803">list lookup:</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="322.9502" x="831" y="2211.7803">oci_dbmulticloud_multi_cloud_resource_discoveries</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="223.3027" x="831" y="2225.7803">filters compartmentId, displayName,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="203.0752" x="831" y="2239.7803">multiCloudResourceDiscoveryId,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="275.0713" x="831" y="2253.7803">oracleDbAzureConnectorId (+3 more); exact</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="254.4473" x="831" y="2267.7803">declared filters match within the resource</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="179.7646" x="831" y="2281.7803">scope; duplicate matches fail</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="831" y="2295.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="831" y="2309.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="315.1777" x="831" y="2323.7803">The generated service manager uses the reviewed</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="286.3506" x="831" y="2337.7803">CRUD request, response, lifecycle, and status</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="118.2822" x="831" y="2351.7803">projection contract.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="301.1641" x="831" y="2365.7803">Work-request phases are declared per operation</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="261.4678" x="831" y="2379.7803">from the vendored SDK response surface.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="253.7021" x="831" y="2393.7803">Secret side effects are none and finalizer</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="284.0469" x="831" y="2407.7803">ownership is retained until confirmed deletion.</text><?plantuml-src hLZRRXit47tdLmpQbmIrx3XEsbH62hHscXfnay9AqHS11hNBbTXGv9RaIb6A_djdUDcBB2b2MlZ1w-LmhcVEpDfzaBhcbY_1BNXfrbBFeUBA2URQanalFiojQNHvPPIny7LLu4_PaoX5nHlbVpRQl-LB0Ry8jH9U5dotp4H-4d3-h7V8hJNhfFr9TVxTq_vDRRpuwO4FLVLT-UssbB6bi4bYzkpvnPFljoJ8V3g_k7Xs_lnvxpoeBupLmiBvjynBhmHCn5-Dq8M04PIp9GOW2sMQyknNUhoYnplXJ6CBSIrTOLR2RjX2bW8gO_pCVEpfTrdLtmo05zxOWRyfxdoq7R1uAbvKJ_0ObQ4JikRQxxxV5pX6IoydhGubAt4hzJ2Ztp_Z5xCNU4egwy5HCIkVY_Fsw46rNbIyAjW_BCG6RvgPm3HxuLZF3xX2HwnHIjZ1wv-u4tUYCBgGsqTVlPkyUpCHTYKByIlNV2xiLy0T35yDhhoxkc641A1QRUa-sRg7FM552HOhh1elZHwdLsUbv7EigJkBVuywaL4kywbRpRE6KYYCTk_jU3oyANGP4CkwPC7eXrwEnY0qoZS23c1ngcsEZdLNIT4myZ6qpuyikU7yOpOKeKl3_8oXLOuHEecXJFMXnWZWW5jZFk0lZW7Ef2uPLnwyHSXWeX0SucEji5YXKe2TfB4HDy2L5RpSuAbqth6X8-GQIe_XjV27x0iajjPKgrewM4hdaFhsgRr5c_lrIk4ULL9v