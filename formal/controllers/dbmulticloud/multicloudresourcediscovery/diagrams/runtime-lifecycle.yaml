schemaVersion: 1
surface: repo-authored-semantics
service: dbmulticloud
slug: multicloudresourcediscovery
kind: MultiCloudResourceDiscovery
archetype: generated-service-manager
states:
- provisioning
- active
- updating
- terminating
repoAuthored:
  operations:
    create:
    - CreateMultiCloudResourceDiscovery
    update:
    - UpdateMultiCloudResourceDiscovery
    delete:
    - DeleteMultiCloudResourceDiscovery
  providerLifecycle:
    createPending:
    - IN_PROGRESS
    updatePending: []
    deletePending:
    - DELETING
  listLookup:
    filters:
    - compartmentId
    - displayName
    - multiCloudResourceDiscoveryId
    - oracleDbAzureConnectorId
    - resourceType
    - resourcesFilter
    - state
    matchRule: exact declared filters match within the resource scope; duplicate matches
      fail
  mutation:
    mutable:
    - compartmentId
    - definedTags
    - displayName
    - freeformTags
    - oracleDbConnectorId
    - resourceType
    forceNew:
    - resourcesFilter
  hooks:
    create:
    - helper: tfresource.CreateResource
    update:
    - helper: tfresource.UpdateResource
    delete:
    - helper: tfresource.DeleteResource
  followUp:
    create: GetWorkRequest -> read-after-write
    update: GetWorkRequest -> read-after-write
    delete: GetWorkRequest -> confirm-delete
notes:
- The generated service manager uses the reviewed CRUD request, response, lifecycle,
  and status projection contract.
- Work-request phases are declared per operation from the vendored SDK response surface.
- Secret side effects are none and finalizer ownership is retained until confirmed
  deletion.
