schemaVersion: 1
surface: repo-authored-semantics
service: osmanagementhub
slug: managementstation
kind: ManagementStation
archetype: generated-service-manager
states:
  - provisioning
  - active
  - updating
  - terminating
repoAuthored:
  providerLifecycle:
    createPending: ["CREATING"]
    updatePending: ["UPDATING"]
    deletePending: ["DELETING"]
  listLookup:
    filters: ["compartmentId","displayName","hostname"]
    matchRule: exact resource identity match; duplicate matches fail
  mutation:
    mutable: ["definedTags","description","displayName","freeformTags","hostname","isAutoConfigEnabled","mirror","proxy"]
    forceNew: ["compartmentId"]
  followUp:
    create: read-after-write
    update: read-after-write
    delete: confirm-delete
notes:
  - "The runtime uses its declared lifecycle-state contract for ManagementStation reconciliation."
  - "The credential-free mock exercises SDK request serialization, response projection, mutation when supported, and confirmed deletion."
