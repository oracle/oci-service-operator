roller-local policy.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="171.9854" x="792" y="1946.7803">service: osmanagementhub</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="115.9717" x="792" y="1960.7803">slug: scheduledjob</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="122.1992" x="792" y="1974.7803">kind: ScheduledJob</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="241.2402" x="792" y="1988.7803">archetype: generated-service-manager</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="156.4063" x="792" y="2002.7803">status/finalizer: required /</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="174.3027" x="792" y="2016.7803">retain-until-confirmed-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="272.3984" x="792" y="2030.7803">requeue: provisioning, updating, terminating</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="265.3369" x="792" y="2044.7803">provider states: create CREATING; update</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="352.3994" x="792" y="2058.7803">UPDATING; delete CREATING, UPDATING, DELETING</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="209.6992" x="792" y="2072.7803">follow-up: create=read-after-write;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="288.7158" x="792" y="2086.7803">update=read-after-write; delete=confirm-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="257.5713" x="792" y="2100.7803">supported drift: displayName, description,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="276.623" x="792" y="2114.7803">scheduleType, timeNextExecution (+5 more)</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="230.3301" x="792" y="2128.7803">reject before mutate: force-new fields</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="298.0537" x="792" y="2142.7803">compartmentId, locations, managedInstanceIds,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="233.8506" x="792" y="2156.7803">managedInstanceGroupIds (+3 more)</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="144.751" x="792" y="2170.7803">create-only fields: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="66.1445" x="792" y="2184.7803">list lookup:</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="303.5361" x="792" y="2198.7803">oci_os_management_hub_scheduled_jobs filters</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="316.7021" x="792" y="2212.7803">compartmentId, scheduleType, timeNextExecution,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="298.4502" x="792" y="2226.7803">operations (+9 more); exact schedule and target</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="228.7783" x="792" y="2240.7803">identity match; duplicate matches fail</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="792" y="2254.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="792" y="2268.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="325.2334" x="792" y="2282.7803">ACTIVE and INACTIVE are stable states; DELETED</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="245.1299" x="792" y="2296.7803">confirms deletion after pending lifecycle</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="41.2412" x="792" y="2310.7803">states.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="293.3574" x="792" y="2324.7803">Target selectors are mutually exclusive and are</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="224.8955" x="792" y="2338.7803">normalized before identity matching.</text><?plantuml-src fLXjSzis4lwENx7JVadcH3kkupQH9pUJshwShsvo4wTtNpJZWSYbX0O2M02Kh7RwtxjueqYz94ew-H2HMEphiyykRJyArN335s3dlD8heMPGSscHsUvaoikFCwDRLLrfgGryMvVqh-f9L5ZpLhf_QUNUyWN2lr4kqOcIxvUv5xyZd3tl7N9Zz2ffVrQV_V1T_wRI3d_SyQ6kVwY-tvRIfaAJ9ARFBywVlToIyERJ-VdvyxEBYzvvK5zgez30sVVC2ISHxl6t5bM9K82s2wxu31UetBoTdjwNSwnQYTL_z9JDHOLGQ-sc-h6dq-RhVp00NZfj1ZwcMFFHTf3u7Rwedz4nAQDqYeOhj_z-N-0OBRqyT3gagF5Eg64MNpxdvzCNTEfLDeEZSbfTu5btj5EX5pMlI_Od2x71J-qKARKEBUlv0LVaYD5IeXcy_f5RV8-bLgNOFlhctVsxd-xHB4M9FuU2c6-0MnY-6bnvTtNBVFL1BwcsGzsZhNlK1mOhC6YrR9tGQfnUdLQ2pwYczZG-5nkH8fVvn2vdMKE5ag8zU3iU3s-YgW9AsIPPKFopbwCne2Bvbd3P0nyvcw9X6r5_SHZf6BhVJumtQzrJDXJnbuRv66-KKqHM-CW6m0_5XpkjFz9_d0AO2bKnBXquGv0WSIe-FZQIYX4g0TGfYffh3LmQvDMQJeLrbWqDUrT8UWnlq0qC8h5JfxlJ9ImiXBN4NuVqt96HlYBxf1RIeR7ZYIhrmkF5T_PjDGARn3wi6nnDoC02t-AZktd4CjHx1Bf1m_rF2q_-yNAY5jhWqwSXR8EjvLDAbu_LOwGrrF_a7rMM688Qv927LvGEXuDWfTODbE4zD0GFpyzNxszUVxXz--ReX975aBJzddrb5VQ4iGTnb2PBQcCxBQbW0m081TPnrzgWpYSlTWKaU6ALu7KTNX_oBPuEt3iWIOxLmYoocQNWsu5D5C5r1ogn3kdMTXr6yCj_h-ElYRg-kRlvWkB0Nciv6wL4hYXy4gg5ufBcfg7Sq5iR43MLsdV1COKmw3YbEuNWiuwXM-czMKTuf3FV2_I3i0ta2sa-ra1qQ-CehwcxThL6F6PC