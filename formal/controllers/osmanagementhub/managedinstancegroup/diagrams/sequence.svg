l="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="288.7158" x="793" y="2115.7803">update=read-after-write; delete=confirm-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="257.5713" x="793" y="2129.7803">supported drift: displayName, description,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="116.7305" x="793" y="2143.7803">notificationTopicId,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="299.6191" x="793" y="2157.7803">autonomousSettings.isDataCollectionAuthorized</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="61.0723" x="793" y="2171.7803">(+4 more)</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="230.3301" x="793" y="2185.7803">reject before mutate: force-new fields</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="311.2266" x="793" y="2199.7803">compartmentId, osFamily, archType, vendorName</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="61.0723" x="793" y="2213.7803">(+1 more)</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="144.751" x="793" y="2227.7803">create-only fields: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="66.1445" x="793" y="2241.7803">list lookup:</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="337.8047" x="793" y="2255.7803">oci_os_management_hub_managed_instance_groups</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="287.0889" x="793" y="2269.7803">filters compartmentId, displayName, osFamily,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="281.2783" x="793" y="2283.7803">archType (+2 more); exact immutable identity</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="180.5303" x="793" y="2297.7803">match; duplicate matches fail</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="793" y="2311.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="793" y="2325.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="324.4541" x="793" y="2339.7803">ACTIVE is success and DELETED confirms deletion</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="129.9512" x="793" y="2353.7803">after lifecycle polling.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="329.1709" x="793" y="2367.7803">Software-source and managed-instance membership</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="297.3086" x="793" y="2381.7803">use explicit attach/detach operations around the</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="148.5723" x="793" y="2395.7803">primary CRUD lifecycle.</text><?plantuml-src hLXRRzis57xdhpZeNbBKIfeslJdeW3H9kw1PEpJfdWm4j4JPN2bI8ocxth3_liERBexSfXVa8P98dkjtldDeyudBccfQWLdIGgsvN419XM74j2jpcdzQQDN8ubG9fU6NCiU_ehUZO2LjX7sjf7r7AmQ_CR5YbkTqVCyL_uV1uL5laMgjrb7wm_BmsQF-IQaiUtNBXh9yLZpTtgLqmNJSCJzwylZXYwqTJdrSV_puwF39azww5vyhBPc6mwV4SYiONB6_6oPp1XaeKr595wnYqYwR-S7l_gsuaCPItF46pzTaoGi6fL9shZxtP9iavby2G7EhzC3Mw7DQsdQMFMBFouUuZC8mhBocqewVxs-uYvHUF5ePWfViaijXD5ySqSVpvxZgHDQ3fNnUF667xTAjJ3qlQPcJ_uZt3TusSuOXjioGdXrmYePe9GJJWy-lg64VMAvaphUNxhs_Ul_sYkaLprb8XRu7rC3mq-38-zCBub00QeKv7igUR9t3Uj2i0CsC4