y, immutability, README, and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="253.7158" x="700" y="2223.7803">tags update in place; compartmentId and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="213.2129" x="700" y="2237.7803">displayName require replacement.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="270.04" x="700" y="2251.7803">The runtime has no Kubernetes Secret side</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="45.1309" x="700" y="2265.7803">effects.</text><?plantuml-src fLXTRzis57tdho2sbnQpacPjjzP51wH9rWNDaY5fjnS30IrHDbUAr4ZARZhil--G5FNXo6k68YWIYPVtyznphse_2bKpmofgrwpGMw5Mj6JIScAxaoNBFwwCRbHnegKszDionqyna2XuoHhfVjRANRAAqr-ut70dSZOjSoC-SthqR738ZD7RLlkJykZ7xuStbNRypJqVolB7ueTTAMqARbg9vRFdJv-yt97mvjlpfq-V7Jr_FZWFwdDj53Vqw0VYX9EStl2_6gvoJZCuwKJ9ScSFJw252SXTyrfRuRIv8sjHS5fgxPRwqq2fJVV_9fJYiZOZ9zjWqz5kbFnx_g9yWkFQ6yz5pPIRlZyKU8YMGI8w7LAK_09XZIoyVCQUBb_WrAkiHqVvidZEZxgZUoLwKR8o9_-G41jzromvSkku9GC_gC-bqL9oCthzXbb-pNEjSh5xzCtLpTMx6sus8kU_CiLMt7n3cQNZLwChLoVdn9UVwWsAEzOzsxc7HZ2ye8PRBHidj9gthmuBmLQegJsCpralagKo7zZDAcaek4IqUs_7u_5Dhee0Kz8dYsO_3N8qfrn1lk5q0eCBPL9KfB_Y5OmZdjFkxqV6cxVkCHcB-4lZlCnffnoHMO4G5cgg4G8Ow8NM7_6B8Q2bK0LXqb5d014a1c3Wdsg9ueJAK7IEGhVTKIODPyKTJeLrbemTy2v1UaxVSZTbbuErEXETIc5f9Qm5h-rJTm5Rz_K9RX-LGZfkx7oXSbrvE5LGUbxCQ25iBTcTvxePJ3qEqHdUMBP4Tdn87XgDGTl3FWeAOa1VxFFW154xlZUcQSLVbwi9PoPWKYDwQ8-zi45QHzKIYbh7N6E3Ef-226dQOeeNBHPEm-jzBiRJAI_tN81_fJ1LihOHRA6cumJI5cflVOdKkavQQiJWXz_fsSNP-_FBj_yleLymbFAJIyuK4e86A8LY4dFG85juQmDIbb9xz3waD8PxEybxNmSUcWtl4sxQCuzT_06MedffeVcX1g9RlQEiH3VSrngY2_-yKO-Gw0tY2Svuw3xCO2IsxLfqMAyGemNG5gghIx0YnIO5xQ-1Z2mSvRB8s1Rakb254QMZVCDamuAJBHB3wpKI9JqZz2DXxD_CpukRfgwr0OffKnVUacqCnZ-V8xBpgcgS3sn6XFsjMOBBPjJteoU4qd1UQbEzPojB7trtH2jj-6DopV_akQDBVyQflu_X0690CsUARwF_bkod6j9oQg8bEXObEwoKn2lcyZMYdTFZGjUEQYN1jBHH0lacfiTm4FHTxTR37XvOE