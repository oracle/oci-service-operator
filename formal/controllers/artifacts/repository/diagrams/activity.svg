<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="2489px" preserveAspectRatio="none" style="width:1218px;height:2489px;background:#FCFCFD;" version="1.1" viewBox="0 0 1218 2489" width="1218px" zoomAndPan="magnify"><title>Activity - artifacts/Repository</title><defs/><g><rect fill="#FCFCFD" height="2489" style="stroke:none;stroke-width:1;" width="1218" x="0" y="0"/><g class="title" data-source-line="10"><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="194.4961" x="510.7043" y="30.7803">Activity - artifacts/Repository</text></g><ellipse cx="651.8591" cy="55" fill="#1D4ED8" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="none" height="444" rx="8" ry="8" style="stroke:#000000;stroke-width:1.5;" width="682.7979" x="308.3223" y="75"/><path d="M430.3906,75 L430.3906,82 L420.3906,92 L308.3223,92" fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="112.0684" x="311.3223" y="86.7803">Observe and Bind</text><rect fill="#F8FAFC" height="48" rx="8" ry="8" style="stroke:#0F172A;stroke-width:0.5;" width="304.7852" x="499.4666" y="109"/><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="136.9375" x="509.4666" y="129.7803">Start from shared flow</text><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="284.7852" x="509.4666" y="143.7803">shared/diagrams/shared-reconcile-activity.svg</text><rect fill="#F8FAFC" height="48" rx="8" ry="8" style="stroke:#0F172A;stroke-width:0.5;" width="306.3643" x="498.677" y="177"/><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="286.3643" x="508.677" y="197.7803">Read desired Repository spec, tracked status,</text><text fill=