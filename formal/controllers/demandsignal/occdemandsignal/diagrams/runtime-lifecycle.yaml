schemaVersion: 1
surface: repo-authored-semantics
service: demandsignal
slug: occdemandsignal
kind: OccDemandSignal
archetype: generated-service-manager
states:
- provisioning
- active
- updating
- terminating
repoAuthored:
  operations:
    create:
    - CreateOccDemandSignal
    update:
    - UpdateOccDemandSignal
    delete:
    - DeleteOccDemandSignal
  providerLifecycle:
    createPending:
    - CREATING
    updatePending: []
    deletePending:
    - DELETING
  listLookup:
    filters:
    - compartmentId
    - displayName
    - id
    - state
    matchRule: exact declared filters match within the resource scope; duplicate matches
      fail
  mutation:
    mutable:
    - compartmentId
    - definedTags
    - displayName
    - freeformTags
    - isActive
    - patchOperations.from
    - patchOperations.operation
    - patchOperations.position
    - patchOperations.selectedItem
    - patchOperations.selection
    - patchOperations.value
    forceNew:
    - occDemandSignalId
    - occDemandSignals
    - occDemandSignals.resourceType
    - occDemandSignals.units
    - occDemandSignals.values
    - occDemandSignals.values.comments
    - occDemandSignals.values.timeExpected
    - occDemandSignals.values.value
  hooks:
    create:
    - helper: tfresource.CreateResource
    update:
    - helper: tfresource.UpdateResource
    delete:
    - helper: tfresource.DeleteResource
  followUp:
    create: read-after-write
    update: read-after-write
    delete: confirm-delete
notes:
- The generated service manager uses the reviewed CRUD request, response, lifecycle,
  and status projection contract.
- CRUD responses use lifecycle/read-after-write convergence without a work-request
  tracker.
- Secret side effects are none and finalizer ownership is retained until confirmed
  deletion.
