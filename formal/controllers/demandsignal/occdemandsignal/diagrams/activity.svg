ont-size="14" lengthAdjust="spacing" textLength="275.4609" x="706.0914" y="2427.2803">convergence without a work-request tracker.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="253.7021" x="706.0914" y="2441.2803">Secret side effects are none and finalizer</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="284.0469" x="706.0914" y="2455.2803">ownership is retained until confirmed deletion.</text><ellipse cx="669.0914" cy="2157.5" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="669.0914" cy="2157.5" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="669.0914" x2="669.0914" y1="157" y2="177"/><polygon fill="#0F172A" points="665.0914,167,669.0914,177,673.0914,167,669.0914,171" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="820.5573" x2="820.5573" y1="341" y2="361"/><polygon fill="#0F172A" points="816.5573,351,820.5573,361,824.5573,351,820.5573,355" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="820.5573" x2="820.5573" y1="423" y2="443"/><polygon fill="#0F172A" points="816.5573,433,820.5573,443,824.5573,433,820.5573,437" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="527.6256" x2="517.6256" y1="257" y2="257"/><line style="stroke:#0F172A;stroke-width:1;" x1="517.6256" x2="517.6256" y1="257" y2="279"/><polygon fill="#0F172A" points="513.6256,269,517.6256,279,521.6256,269,517.6256,273" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="810.5573" x2="820.5573" y1="257" y2="257"/><line style="stroke:#0F172A;stroke-width:1;" x1="820.5573" x2="820.5573" y1="257" y2="279"/><polygon fill="#0F172A" points="816.5573,269,820.5573,279,824.5573,269,820.5573,273" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#