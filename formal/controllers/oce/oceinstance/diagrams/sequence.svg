ared delete sequence when finalizer</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="269.2471" x="782" y="1947.7803">retention, delete confirmation, work-request</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="199.2334" x="782" y="1961.7803">polling, or Secret cleanup apply.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="281.709" x="782" y="1975.7803">archetype batch: Generated service-manager</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="266.1504" x="782" y="1989.7803">controllers follow the shared resolution and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="259.9297" x="782" y="2003.7803">delete sequences with imported waits and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="134.6064" x="782" y="2017.7803">controller-local policy.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="74.6963" x="782" y="2031.7803">service: oce</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="108.1787" x="782" y="2045.7803">slug: oceinstance</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="112.0615" x="782" y="2059.7803">kind: OceInstance</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="241.2402" x="782" y="2073.7803">archetype: generated-service-manager</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="156.4063" x="782" y="2087.7803">status/finalizer: required /</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="174.3027" x="782" y="2101.7803">retain-until-confirmed-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="272.3984" x="782" y="2115.7803">requeue: provisioning, updating, terminating</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="265.3369" x="782" y="2129.7803">provider states: create CREATING; update</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="192.165" x="782" y="2143.7803">UPDATING; delete DELETING</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="234.9922" x="782" y="2157.7803">follow-up: create=GetWorkRequest -&gt;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="284.04" x="782" y="2171.7803">GetOceInstance; update=GetWorkRequest -&gt;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="279.3643" x="782" y="2185.7803">GetOceInstance; delete=GetWorkRequest -&gt;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="305.0332" x="782" y="2199.7803">GetOceInstance/ListOceInstances confirm-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="283.2813" x="782" y="2213.7803">supported drift: addOnFeatures, definedTags,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="197.2578" x="782" y="2227.7803">description, drRegion (+4 more)</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="230.3301" x="782" y="2241.7803">reject before mutate: force-new fields</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="178.1787" x="782" y="2255.7803">adminEmail, compartmentId,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="170.3994" x="782" y="2269.7803">identityStripe.serviceName,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="198.8164" x="782" y="2283.7803">identityStripe.tenancy (+6 more)</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="144.751" x="782" y="2297.7803">create-only fields: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="252.916" x="782" y="2311.7803">list lookup: oci_oce_oce_instances filters</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="291.8057" x="782" y="2325.7803">compartmentId, tenancyId, displayName; exact</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="319.8535" x="782" y="2339.7803">compartmentId, tenancyId, and name unique match</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="339.2607" x="782" y="2353.7803">outside FAILED, DELETING, and DELETED; duplicate</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="74.6963" x="782" y="2367.7803">matches fail</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="782" y="2381.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="782" y="2395.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="311.999" x="782" y="2409.7803">CREATING requeues as provisioning, UPDATING</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="295.709" x="782" y="2423.7803">requeues as updating, ACTIVE settles success,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="316.6885" x="782" y="2437.7803">and DELETING retains the finalizer until DELETED</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="138.5166" x="782" y="2451.7803">or confirmed absence.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="287.1982" x="782" y="2465.7803">Create, update, and delete persist and poll the</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="274.6748" x="782" y="2479.7803">OCE work request, recover the OceInstance</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="251.3848" x="782" y="2493.7803">identifier, and reread the instance before</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="105.834" x="782" y="2507.7803">projecting status.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="259.8887" x="782" y="2521.7803">Pre-create reuse requires compartmentId,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="298.1016" x="782" y="2535.7803">tenancyId, and name and adopts only one exact</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="287.9365" x="782" y="2549.7803">eligible match. Failed or deleting instances are</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="85.6064" x="782" y="2563.7803">never reused.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="307.3301" x="782" y="2577.7803">IdcsAccessToken is a create-time secret that OCI</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="294.1504" x="782" y="2591.7803">does not echo, so post-create parity normalizes</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="284.8193" x="782" y="2605.7803">it away. Only the reviewed update-detail fields</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="276.2744" x="782" y="2619.7803">reconcile in place; the remaining identity and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="234.2539" x="782" y="2633.7803">shape fields require replacement, and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="333.0674" x="782" y="2647.7803">ChangeOceInstanceCompartment stays out of scope.</text><?plantuml-src nLXhRnl75Vq-lsAGVd5Gah9YsN5eg80YoOaGDGeaf_uYe1Zkpf9JBMSsCxEasQB_lUVEOtT9YHAR8YWCGykTntsTU-wzwnwKReGLI-uMeZHhfUUy4hMJp7KhCr4ypArfTNbkQcFvdwe2_yh1Zb9MegtzHwFzps8f-O-oNacl2l7qdZlrJycFJmQBmbgpJhU_hew__MPuKXillt-aGrLzMxxRtMLiAMtQCJjv--RrTpixI7nQV_FcvFZjsy5wkBumLalBZzynhtmj-PtyhPMwa7pCJI6FRWfvfPqNUCCMgfIyCiRFp9V1DIwV-1VZN1JUs2sradbvQTSk-OryNxt6CYw31rKZj7_w_7338RSCJE_kg5KbhvNUTjnt9-BDx3rMwSfcQwcObM_bSRVqA2ZlAr4LxDyisCP_QcSItlJIiO4U_1oAM5FNqcwz_buuUIiBemkrk_JLpTtDJtVIhbGX_ogqc4lx5HUERx_QEd9pViKeuDoi4CxjkqSxvm1zAqjkfJDrwvNHq_Jgg5HYZfYwe_Xxt6yPvp1Ft6gURoXb3MltdexBsoUbBWCmMUyiFlxBm4TJBZNsjv8Fi0TTap6itqddjWsTykxvbIMfpd_DjhVGeMrtJFlBOP1JPDWGzY7q_DgO1_mHK7-cTCb4xRct00Hs8_JoIrCZ524E77cYaKqRBcehHRd1gdBUiMsvf0bsJ_aFqW_bIR1HTtLtbN9ygPm3N-sxvXeo1lUuLvMglRHkUgyBioIiB77NLJdYNchisE3nNfVADRNO48rz7OooidLY1b-G9HJ_riB_48-e8Vi1_dqAdCDOBuUcrCOql0YlUOF84zkUtrwUVRhw-OT3lG5vmIDFw_NxFFo43KzWgO7pS6lCanMXOXXRfJckywqBrv7d8jnv0fui4t8kmkjzgiNLeNPxDaAlIjbbbh9IOiSimF1Uxu8WXY2ToI6ukBo-F3m41Ez7rsQRYreA3IEnfr9QrAXq5Xx0MnT0CwiDuVWGTrlf1PoQT2NVof1kU6yt4GDfZU2C1x0IDpE7cmyL4DNg5HKL4kJnhH5q6NWKzQWDx0dA40mF4nY9RBrG7MwNiD41FFSw9yA8__hBHNhg8XCarsgL7K5NWPaSb9TrEHPh42oIrwhASxaITIk2uWbnuVK2pgk9B_goiAtpY6h6NTiqnWAjl6rAakHQMub2Jhaeonlz4RdRGkw8ePz1uIm_YRaR4KyMLZKa4p_ihPnJC5xz-OGjZGMHtCf_oCBpcQpmaozRic4Aza3AZhLSHoiS4-LIwKkuf1xnROvYES_kFEIWT4JD