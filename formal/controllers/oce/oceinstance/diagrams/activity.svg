g</text><path d="M685.7798,1963.5 L685.7798,2356.5 L665.7798,2360.5 L685.7798,2364.5 L685.7798,2757.5 A0,0 0 0 0 685.7798,2757.5 L1046.0405,2757.5 A0,0 0 0 0 1046.0405,2757.5 L1046.0405,1973.5 L1036.0405,1963.5 L685.7798,1963.5 A0,0 0 0 0 685.7798,1963.5" fill="#FFF7D6" style="stroke:#B45309;stroke-width:0.5;"/><path d="M1036.0405,1963.5 L1036.0405,1973.5 L1046.0405,1973.5 L1036.0405,1963.5" fill="#FFF7D6" style="stroke:#B45309;stroke-width:0.5;"/><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="101.165" x="691.7798" y="1979.2803">shared diagram:</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="284.7852" x="691.7798" y="1993.2803">shared/diagrams/shared-reconcile-activity.svg</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="265.3438" x="691.7798" y="2007.2803">Start from the shared reconcile activity and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="273.8955" x="691.7798" y="2021.2803">specialize provider-backed CRUD, wait, and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="182.875" x="691.7798" y="2035.2803">status-projection details here.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="229.5371" x="691.7798" y="2049.2803">Controller-local activity diagrams add</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="238.8955" x="691.7798" y="2063.2803">list-lookup hints, secret policies, delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="200.0332" x="691.7798" y="2077.2803">handling, and open formal gaps.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="281.709" x="691.7798" y="2091.2803">archetype batch: Generated service-manager</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="291.0469" x="691.7798" y="2105.2803">controllers specialize the shared reconcile path</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="189.8477" x="691.7798" y="2119.2803">with formal runtime ownership.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="74.6963" x="691.7798" y="2133.2803">service: oce</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="108.1787" x="691.7798" y="2147.2803">slug: oceinstance</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="112.0615" x="691.7798" y="2161.2803">kind: OceInstance</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="241.2402" x="691.7798" y="2175.2803">archetype: generated-service-manager</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="156.4063" x="691.7798" y="2189.2803">status/finalizer: required /</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="174.3027" x="691.7798" y="2203.2803">retain-until-confirmed-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="272.3984" x="691.7798" y="2217.2803">requeue: provisioning, updating, terminating</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="265.3369" x="691.7798" y="2231.2803">provider states: create CREATING; update</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="192.165" x="691.7798" y="2245.2803">UPDATING; delete DELETING</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="234.9922" x="691.7798" y="2259.2803">follow-up: create=GetWorkRequest -&gt;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="284.04" x="691.7798" y="2273.2803">GetOceInstance; update=GetWorkRequest -&gt;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="279.3643" x="691.7798" y="2287.2803">GetOceInstance; delete=GetWorkRequest -&gt;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="305.0332" x="691.7798" y="2301.2803">GetOceInstance/ListOceInstances confirm-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="283.2813" x="691.7798" y="2315.2803">supported drift: addOnFeatures, definedTags,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="197.2578" x="691.7798" y="2329.2803">description, drRegion (+4 more)</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="230.3301" x="691.7798" y="2343.2803">reject before mutate: force-new fields</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="178.1787" x="691.7798" y="2357.2803">adminEmail, compartmentId,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="170.3994" x="691.7798" y="2371.2803">identityStripe.serviceName,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="198.8164" x="691.7798" y="2385.2803">identityStripe.tenancy (+6 more)</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="144.751" x="691.7798" y="2399.2803">create-only fields: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="252.916" x="691.7798" y="2413.2803">list lookup: oci_oce_oce_instances filters</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="291.8057" x="691.7798" y="2427.2803">compartmentId, tenancyId, displayName; exact</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="319.8535" x="691.7798" y="2441.2803">compartmentId, tenancyId, and name unique match</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="339.2607" x="691.7798" y="2455.2803">outside FAILED, DELETING, and DELETED; duplicate</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="74.6963" x="691.7798" y="2469.2803">matches fail</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="691.7798" y="2483.2803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="691.7798" y="2497.2803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="311.999" x="691.7798" y="2511.2803">CREATING requeues as provisioning, UPDATING</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="295.709" x="691.7798" y="2525.2803">requeues as updating, ACTIVE settles success,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="316.6885" x="691.7798" y="2539.2803">and DELETING retains the finalizer until DELETED</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="138.5166" x="691.7798" y="2553.2803">or confirmed absence.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="287.1982" x="691.7798" y="2567.2803">Create, update, and delete persist and poll the</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="274.6748" x="691.7798" y="2581.2803">OCE work request, recover the OceInstance</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="251.3848" x="691.7798" y="2595.2803">identifier, and reread the instance before</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="105.834" x="691.7798" y="2609.2803">projecting status.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="259.8887" x="691.7798" y="2623.2803">Pre-create reuse requires compartmentId,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="298.1016" x="691.7798" y="2637.2803">tenancyId, and name and adopts only one exact</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="287.9365" x="691.7798" y="2651.2803">eligible match. Failed or deleting instances are</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="85.6064" x="691.7798" y="2665.2803">never reused.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="307.3301" x="691.7798" y="2679.2803">IdcsAccessToken is a create-time secret that OCI</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="294.1504" x="691.7798" y="2693.2803">does not echo, so post-create parity normalizes</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="284.8193" x="691.7798" y="2707.2803">it away. Only the reviewed update-detail fields</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="276.2744" x="691.7798" y="2721.2803">reconcile in place; the remaining identity and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="234.2539" x="691.7798" y="2735.2803">shape fields require replacement, and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="333.0674" x="691.7798" y="2749.2803">ChangeOceInstanceCompartment stays out of scope.</text><ellipse cx="654.7798" cy="2360.5" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="654.7798" cy="2360.5" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="654.7798" x2="654.7798" y1="157" y2="177"/><polygon fill="#0F172A" points="650.7798,167,654.7798,177,658.7798,167,654.7798,171" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="806.2456" x2="806.2456" y1="341" y2="361"/><polygon fill="#0F172A" points="802.2456,351,806.2456,361,810.2456,351,806.2456,355" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="806.2456" x2="806.2456" y1="409" y2="429"/><polygon fill="#0F172A" points="802.2456,419,806.2456,429,810.2456,419,806.2456,423" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="513.314" x2="503.314" y1="257" y2="257"/><line style="stroke:#0F172A;stroke-width:1;" x1="503.314" x2="503.314" y1="257" y2="279"/><polygon fill="#0F172A" points="499.314,269,503.314,279,507.314,269,503.314,273" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="796.2456" x2="806.2456" y1="257" y2="257"/><line style="stroke:#0F172A;stroke-width:1;" x1="806.2456" x2="806.2456" y1="257" y2="279"/><polygon fill="#0F172A" points="802.2456,269,806.2456,279,810.2456,269,806.2456,273" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="503.314" x2="503.314" y1="327" y2="495"/><line style="stroke:#0F172A;stroke-width:1;" x1="503.314" x2="642.7798" y1="495" y2="495"/><polygon fill="#0F172A" points="632.7798,491,642.7798,495,632.7798,499,636.7798,495" style="stroke:#0F172A;stroke-width:1;"/><line styl