xt fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="77.0547" x="691.3901" y="2106.7803">definedTags</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="279.3574" x="691.3901" y="2120.7803">reject before mutate: force-new fields topicId,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="277.416" x="691.3901" y="2134.7803">compartmentId, protocol, endpoint (+1 more)</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="144.751" x="691.3901" y="2148.7803">create-only fields: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="101.1787" x="691.3901" y="2162.7803">list lookup: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="691.3901" y="2176.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="691.3901" y="2190.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="274.6816" x="691.3901" y="2204.7803">PENDING requeues and ACTIVE succeeds;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="296.4268" x="691.3901" y="2218.7803">ORACLE_FUNCTIONS subscriptions can settle</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="284.7988" x="691.3901" y="2232.7803">immediately when no confirmation is required.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="305.0947" x="691.3901" y="2246.7803">UpdateSubscription returns the update body, and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="220.2334" x="691.3901" y="2260.7803">the 