4" lengthAdjust="spacing" textLength="247.4814" x="800" y="2115.7803">only a unique managed-list match in the</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="151.7441" x="800" y="2129.7803">requested compartment.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="800" y="2143.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="800" y="2157.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="284.7852" x="800" y="2171.7803">Live CIDR-list create, item/description update,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="282.502" x="800" y="2185.7803">and confirmed delete established the lifecycle</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="306.6396" x="800" y="2199.7803">and mutation contract without enabling any Cloud</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="153.3027" x="800" y="2213.7803">Guard detector or target.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="317.3994" x="800" y="2227.7803">`CREATING` and `UPDATING` requeue, `ACTIVE`</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="294.9023" x="800" y="2241.7803">succeeds, and `DELETING` retains the finalizer</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="245.875" x="800" y="2255.7803">until `DELETED` or confirmed absence.</text><?plantuml-src jLXRR-D457wVNp62brqHjrlsdgf8fIrBHTckseMdIkt47YV3sZDcPfmG4F-TRswExIPi0A5MQk8vSwxV-SvnpISX6wPPJSs25Mebv9oMh3AScEvanl9FSwrQMPofIcdwPPdZf-X95BnaRMM_KzA-PpMdt_DgoQt8sNQPM_4xfqSlUeTCQxMAsf-LHw-_