schemaVersion: 1
surface: repo-authored-semantics
service: cloudguard
slug: datamaskrule
kind: DataMaskRule
archetype: generated-service-manager
states:
- provisioning
- active
- updating
- terminating
repoAuthored:
  operations:
    create:
    - CreateDataMaskRule
    update:
    - UpdateDataMaskRule
    delete:
    - DeleteDataMaskRule
  providerLifecycle:
    createPending:
    - CREATING
    updatePending:
    - UPDATING
    deletePending:
    - DELETING
  listLookup:
    filters:
    - compartmentId
    - displayName
    - lifecycleState
    - accessLevel
    - opc-request-id
    - dataMaskRuleStatus
    - targetId
    - iamGroupId
    matchRule: exact declared filters match within the resource scope; duplicate matches
      fail
  mutation:
    mutable:
    - displayName
    - compartmentId
    - iamGroupId
    - targetSelected
    - dataMaskCategories
    - dataMaskRuleStatus
    - freeformTags
    - definedTags
    forceNew:
    - description
  hooks:
    create:
    - helper: tfresource.CreateResource
    update:
    - helper: tfresource.UpdateResource
    delete:
    - helper: tfresource.DeleteResource
  followUp:
    create: read-after-write
    update: read-after-write
    delete: confirm-delete
notes:
- The generated service manager uses the reviewed CRUD request, response, lifecycle,
  and status projection contract.
- CRUD responses use lifecycle/read-after-write convergence without a work-request
  tracker.
- Secret side effects are none and finalizer ownership is retained until confirmed
  deletion.
