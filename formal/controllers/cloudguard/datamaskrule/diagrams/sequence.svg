4155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="280.5195" x="795" y="2115.7803">displayName, lifecycleState, accessLevel (+4</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="277.7783" x="795" y="2129.7803">more); exact declared filters match within the</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="238.123" x="795" y="2143.7803">resource scope; duplicate matches fail</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="795" y="2157.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="795" y="2171.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="315.1777" x="795" y="2185.7803">The generated service manager uses the reviewed</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="286.3506" x="795" y="2199.7803">CRUD request, response, lifecycle, and status</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="118.2822" x="795" y="2213.7803">projection contract.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="287.875" x="795" y="2227.7803">CRUD responses use lifecycle/read-after-write</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="275.4609" x="795" y="2241.7803">convergence without a work-request tracker.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="253.7021" x="795" y="2255.7803">Secret side effects are none and finalizer</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="284.0469" x="795" y="2269.7803">ownership is retained until confirmed deletion.</text><?plantuml-src fLXDSzis4BtZL-oqbsGgsd5ivqEUT2QnqpGJ9-dOoSqNY0Gbr1300g0KjTF_tWSGf4XQIfnqSWX5BFRpxTkbtQtK5RTyIMx12xEMUaubLqumrvtCU7uxjwRMnRbHnjBFPOv_HK-Y42MlbV_DQF-1BmNzBjHAU9dptJBNycz1HoUzGswjMIVjZygZfu_xDxNnujKT7yhoQV5aB6Li8MoIc9sS7ZzwFf88vjFvyV79qUbfxpogputLmjBH4-QbLuAknL-rqBcWZ79bwc9USriSNd3FttDtUrKhmHQo45GQusVcIq-TQs_-muXuxeqTk9V2R8_6yOd7ubdv2CTGXapAYck_-tvVu3vQUYdeT2XPYakfXmbyViAFPyzm6bHMWwDyLfoAe-xeJd6UbRpCsRyinaRlwfb0LhrmhES7dSCHQvGITl3w5NVYIkH6vt9yzDF7wu_lheLToLoyvvhFXVs9kAFXgy6LZ-TlMIWycHNAEjGz6Tr32rXHa1NEgDfBewVfrM4X-HmrTOVDxsmhahLbFd2hUQkX40hHxhtT70zl2br4WB9jiYZxjPUZAGaD-LfG7tnmDaN3jgBXuZ3IANNF3smmw_n3DXG9buRvc6wL8o8dGsG3uCVYqwKnj_YF8u2Pr0NZofEtW0J4KNpnfL8eHgm4eLCq-cf3N5d1YmrEfVEE3Gq7Lo0zfJV23mmA45EdkzCb7IsbSw2kVNekOQIlo3qefVB2kkcDpiqou6K9PM-B2HNILOfl0erDRdJeYtoJAt7jkHSJz6ekdBiKAw7emIydDtffh7ZuCCPiHUtu3BaAWGQ0r1RD3-TGLj03kcEVU-V8XHU3I9Kn5UNnFLN0Hk3bywlNBp-z_V3ctjc2nPYntPxzO0bsXB43RXMI2xLDBwrGhK7rfIQ7XDOkgWl9Qrg24ZP5aR1r4L_lywqv7RYtHnAEbT8kMpChoSU1tMXWzGvEcZgaMsqTBbvVllwEEj1EnMtWm1RNY1H2fTHSOJHQf05lNGJFJ9c0zllat0hFaTdaRKYmY5s9ztRJ826T1SpZ0VH5PkQW-Ru66hUsZl8INNHNQmEz5dwXz8qtY2Sw4y1uFuCDuwqNiaFl4Z4w8EX6j_qmeSz_NAIdhZRHifAhDX515HZCmNcXYeolmSGtkh2oz2HMNDKyEfvW5ryla3mLM6KxFuO-Jy9mkQwhobX0bkgg29PSRKkUY-c0IjY8PYHVlWccyCmyjtFXhv74FAW1hr2a5NOb_iGhceaIFsbPXq2ce19qRwR5kWd5CN1pRcKL_KzatD8R3Ssolalq5N9ZMoUInYNt-GB9m1ZwWgcEckSgphfaYaK1MaiFAV8BiIKQbvjAdB6Y3eCWP2YAXb9mgRQ3prI-5nlw8JGjRlZGSqsXW9y2I0jfkXzy-laBy8avR04Q3BgkUk4eSEItBQKsVrbLQaEVOz67_Qxn7YOn7PBEfb2ZsR8V4JTwBoGY7oMWjNpKel-xviB-QMHhJGkXmE2qGEqTF8rpw8Klsv8UD1FhAlqykz6DItsH9Z4zaOOb-Y8DVxSY-_pXCSybDXkppe14XmN0Y_ccyokCiImoKRQsqlVSsN6Il4W38QrYzvrgpT1waRWa5AgZmXSD-sOr9fpAalfkrui6nllMQBrhoGwaN5cpaWuuHNadJRd34t0Xx18MVSTALiuNdan9krVPj7d-lptscrfsxRFW58j-jcOPoU3EQhtzF4AdC1Jw8cwFCM24onDtL7mUupLw4cOPQqgU6Pkb9WWz5UZaW5to3RBQCzOEmjRGUY7qTdOn52oi8q5pDy1YrPAvjR6tMLf8M8KYHTzC60BmOZkv8puF6BVWDB-f1BwNuKzeEtn8yj2-hgbDjap5oRkgkuJhFJaA4O-YS95YIIuJRQsvzAv9JQSrmyx05S5dcSEpP7xQ-u1bJjMWyf3e9MZ11bh0Xsin7Ixu