<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="2462px" preserveAspectRatio="none" style="width:1259px;height:2462px;background:#FCFCFD;" version="1.1" viewBox="0 0 1259 2462" width="1259px" zoomAndPan="magnify"><title>Activity - cloudguard/SavedQuery</title><defs/><g><rect fill="#FCFCFD" height="2462" style="stroke:none;stroke-width:1;" width="1259" x="0" y="0"/><g class="title" data-source-line="10"><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="224.834" x="515.7983" y="30.7803">Activity - cloudguard/SavedQuery</text></g><ellipse cx="668.2173" cy="55" fill="#1D4ED8" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="none" height="444" rx="8" ry="8" style="stroke:#000000;stroke-width:1.5;" width="704.6045" x="313.7771" y="75"/><path d="M435.8455,75 L435.8455,82 L425.8455,92 L313.7771,92" fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="112.0684" x="316.7771" y="86.7803">Observe and Bind</text><rect fill="#F8FAFC" height="48" rx="8" ry="8" style="stroke:#0F172A;stroke-width:0.5;" width="304.7852" x="515.8247" y="109"/><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="136.9375" x="525.8247" y="129.7803">Start from shared flow</text><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="284.7852" x="525.8247" y="143.7803">shared/diagrams/shared-reconcile-activity.svg</text><rect fill="#F8FAFC" height="48" rx="8" ry="8" style="stroke:#0F172A;stroke-width:0.5;" width="317.2676" x="509.5835" y="177"/><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="297.2676" x="519.5835" y="197.7803">Read desired SavedQuery spec, tracked status,</text><text fi