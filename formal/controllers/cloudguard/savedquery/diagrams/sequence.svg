1,1521,264.9331,1525,274.9331,1529,270.9331,1525" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;stroke-dasharray:2,2;" x1="268.9331" x2="513.4077" y1="1525" y2="1525"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="226.4746" x="280.9331" y="1519.7803">requeue on provisioning, terminating</text></g><path d="M786,1546 L786,2198 A8,8 0 0 0 794,2206 L1126,2206 A8,8 0 0 0 1134,2198 L1134,1548 L1124,1538 L794,1538 A8,8 0 0 0 786,1546" fill="#FFF7D6" style="stroke:#B45309;stroke-width:0.5;"/><path d="M1124,1538 L1124,1544 A4,4 0 0 0 1128,1548 L1134,1548 L1124,1538" fill="#FFF7D6" style="stroke:#B45309;stroke-width:0.5;"/><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="101.165" x="792" y="1553.7803">shared diagram:</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="307.3916" x="792" y="1567.7803">shared/diagrams/shared-resolution-sequence.svg</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="143.1992" x="792" y="1581.7803">shared delete diagram:</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="284.833" x="792" y="1595.7803">shared/diagrams/shared-delete-sequence.svg</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="280.9297" x="792" y="1609.7803">Start from the shared resolution sequence for</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="260.7295" x="792" y="1623.7803">OCID binding, datasource pagination, and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="163.4268" x="792" y="1637.7803">create-or-update dispatch.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="301.1982" x="792" y="1651.7803">Layer the shared delete sequence when finalizer</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="269.2471" x="792" y="1665.7803">retention, delete confirmation, work-request</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="199.2334" x="792" y="1679.7803">polling, or Secret cleanup apply.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="281.709" x="792" y="1693.7803">archetype batch: Generated service-manager</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="266.1504" x="792" y="1707.7803">controllers follow the shared resolution and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="259.9297" x="792" y="1721.7803">delete sequences with imported waits and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="134.6064" x="792" y="1735.7803">controller-local policy.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="121.3994" x="792" y="1749.7803">service: cloudguard</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="105.8408" x="792" y="1763.7803">slug: savedquery</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="111.2822" x="792" y="1777.7803">kind: SavedQuery</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="241.2402" x="792" y="1791.7803">archetype: generated-service-manager</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="156.4063" x="792" y="1805.7803">status/finalizer: required /</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="174.3027" x="792" y="1819.7803">retain-until-confirmed-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="210.9023" x="792" y="1833.7803">requeue: provisioning, terminating</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="304.2607" x="792" y="1847.7803">provider states: create CREATING; update none;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="112.0479" x="792" y="1861.7803">delete DELETING</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="209.6992" x="792" y="1875.7803">follow-up: create=read-after-write;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="288.7158" x="792" y="1889.7803">update=read-after-write; delete=confirm-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="253.7021" x="792" y="1903.7803">supported drift: definedTags, description,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="236.9131" x="792" y="1917.7803">displayName, freeformTags (+1 more)</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="230.3301" x="792" y="1931.7803">reject before mutate: force-new fields</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="93.3721" x="792" y="1945.7803">compartmentId</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="144.751" x="792" y="1959.7803">create-only fields: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="271.626" x="792" y="1973.7803">list lookup: oci_cloud_guard_saved_queries</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="306.585" x="792" y="1987.7803">filters compartmentId, displayName; exact unique</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="249.7715" x="792" y="2001.7803">compartmentId plus displayName match</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="792" y="2015.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="792" y="2029.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="321.3301" x="792" y="2043.7803">The reviewed provider source classifies CREATING</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="231.9023" x="792" y="2057.7803">as create-pending and DELETING as</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="280.1777" x="792" y="2071.7803">delete-pending. The recorded trace observed</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="309.7363" x="792" y="2085.7803">ACTIVE create and update responses followed by</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="220.2539" x="792" y="2099.7803">404 confirmation after a 202 delete.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="295.709" x="792" y="2113.7803">Display name, query, description, and tag maps</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="327.6191" x="792" y="2127.7803">reconcile in place. ChangeSavedQueryCompartment</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="259.1436" x="792" y="2141.7803">remains outside the published runtime, so</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="222.5371" x="792" y="2155.7803">compartmentId is replacement-only.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="273.1367" x="792" y="2169.7803">Pre-create reuse is limited to a unique exact</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="281.6748" x="792" y="2183.7803">compartmentId plus displayName match. The</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="215.5508" x="792" y="2197.7803">runtime has no Secret side effects.</text><?plantuml-src fLZRRXit47tdLmpIbmJrolTSPAH0Ohkf4JTfRRTF1W9gTrPYJP4RaYj5BVhl7NB9lSXI8gJ8G-pbS6vdvipGza6eYXi-1plZXLuADOMIIulCjYSJdZzCZQvLSQwbDl13cTE_eYTHOCbhwNxModtWSuHVK2xGYPnlbhaLVoCSdlGEkJ5w6RKVb8SlZletbNRuzf4FPVcYUBukfKs19afCJawF3rwjINZpyVpu-EJmzBHt7jJdsYWqSFYSEU4amYr-hb7b21daKjV5jEQcsB_b2on-hz6is4mK2ANMRgA_z9JPTEyV1i1pfyt0kHXaEbgF3e_mPNb0nwICyYWghjpc-ts1NRJq4j3gaAB4Qw66wNjrmeydB-dKgwm6H_caECN3zkWHD2zBNkRiNnPYW_Vr12cd3Yth-G7dv8ZHKg8PV7xBBTvWhbKkre-UVBpz-FuMpKBa-2jNV8hc2N0Bmq-3An_FhvY77VI2G1tgtbkxHmrWi023LilQ2Qt6yTD-8VYKCBNxpUzP9v8bc4TsCKqQ2fGKxTRRpV7m9geYb2VhaWNPJxqSZG4LoTTKa6tfaQin5jO9-cl3ECVG_lpKUAFMFMD34Nzfc8rnfvpYiSB7rIlw03nSQ_r0_t5oVY9KmRXqu0oL0maJyFYbaWH4G06eInHrr0guDCYB5PqAwomRclMEaFGOtg7hcKCYf5PpgqbOc0jhYRAsQRac4wqQWVPfAQH3OyVtAjTpNoXpqdLLx44XR2NvohFNin27mTho2KNldVU0ruQQcKmIJDJkLEtRZ9vJV0vxtakjAyZ3LwW8QS-nvpUNR-wkFhpRCNwo5dAmsQllIkc603QKJaNP8gLDLz3b8PP2WNNSrJQeysbhYXjYdM4HA-KYVDxcMNFQSswB7BbL2ZDFHXQ23uEYehjNwvWtwOzNKlelBgylTqw_h-L7MbF0kKIkA4AIAONYaaQReV3fgmtbCf7QL-qkkJReE6KqkkeJYw6tw7lgWNZcYvT-8082FR6aULS3ZLkTexoaTdYijIcuL7GUyiORYYSuuqjmDuCDPordegtPESLegNBkLUg1lGwEO4-AHGhVAo3kiUGooYBZIsBGUrKOKJh01PSr3-x68WkVPvGowJcXu_sXftj-ADpMLQKD5IZKLU4jsTgKFCUntrDe51PtV6ht655VRaJbZGmuOWzAWrXgC_ToxEcFXp3NXgZZ1l_2tC74do7CQn_5cFY2sZHJk6pYi6p0FYpoQ28d678JwzbDedFkyXa5IMFX2qrPg9MWJ0_LGYLhstUwkTND6bsvdcTKmBw_YB6Txv0cnmHuGQMHkrqBh1-znpja85MKDsZRnFiZJsNVjXIRyarL