1.7803">sourceResponderRecipeId, compartmentId</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="144.751" x="815" y="2115.7803">create-only fields: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="279.3574" x="815" y="2129.7803">list lookup: unavailable filters compartmentId,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="234.2197" x="815" y="2143.7803">resourceMetadataOnly, displayName,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="283.6162" x="815" y="2157.7803">lifecycleState (+3 more); exact declared filters</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="264.585" x="815" y="2171.7803">match within the resource scope; duplicate</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="74.6963" x="815" y="2185.7803">matches fail</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="815" y="2199.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="815" y="2213.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="315.1777" x="815" y="2227.7803">The generated service manager uses the reviewed</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="286.3506" x="815" y="2241.7803">CRUD request, response, lifecycle, and status</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="118.2822" x="815" y="2255.7803">projection contract.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="287.875" x="815" y="2269.7803">CRUD responses use lifecycle/read-after-write</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="275.4609" x="815" y="2283.7803">convergence without a work-request tracker.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="253.7021" x="815" y="2297.7803">Secret side effects are none and finalizer</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="284.0469" x="815" y="2311.7803">ownership is retained until confirmed deletion.</text><?plantuml-src hLXDSzis4BtZLs3IIp8LxJZE9ptfJ6AdQIPktB6JcouG2Kge8O05G2bgf_-z3o10aPIKE6acXuZ4OZ_VlbtQtWfLCyEMr2vOgTT2pMd5fEN4TYSpLjpEZMvKUQwbDlIdgi2_iYTHyeerqlsgbVl0bfp-nkMAEr6m_J8tuczEJnxt3fanUXsrFwnEdZtgtrJQyTSxFbJLi_BfM4gRafieCNlyvFJXYv64Dn_FJqyVdpnvqZiFwWjj53Vqv2bnmabER_XV3LS5fnajf6xAUSDCUNpDRQqLR5tpGjISB4J9QQMrc-dFFOqsNVw7KCeAfyt0mnXfEXg7o1_nvzL374CPaYbgfjp--ts1ksZfPQ7J8KN5BuKQvl35OtOwUuvJhx8U71MpyWa_wOvswlEyObL1_YKXDlg-cN4ard5BUdxGSpXYj9JS35w_PfOZireLOdnqx-hcwlqDDojHyD-POdDkxb5cwV3LuChL-JlYQq_r2fKTwfwCxg4B32-fuLRBnWcjylZgk1HiZfhQu_OvsufagSn7TZLF6aek4Ut1s-tny2PNPS0esIQBPh_qSfHJhY3VS3h27_oD0P6jjByx33QdtU_xnbksxW4PYlXBmvJaM-K8oWeVt1Z-0GBqKkjR_CSGnaoeaZ3fg3C01cu00lnpBL6IK0-AVb5ei0rbqd1MRd0ghBDaQDjx0-cSlkLkR9E3f3hrdJfXwL9O2nexfEeITaQwxFrAICUDpQUgq4kFdINqlIid0GYDWHRkMCaSkr9oCvcgKjXQieqdkqded69JI7xZ651s_-VJgLfgmnyy22amlB5iXkpvk9C-xoXg3Sv0onnozHofSNmSkDIwfaKueZKmuodx_FhDgu_lFhpzblp1RiZXVl--lovxujc3n1hfXkQsqrOeuG0LGb6BP3OsgFDPR1k6HjZoCcBk8hm-v5vxElRmW31yguHP9aihmQPgDpuWUQhsOQYjIxoSwdBnvlBDjzNbiFwK2G2DAOIEbgg4OXB3r20lU6i3h6PI-vwuIn4CK8rKHwTjWAzlNxmtcnOTySot1Nw0xQYUMMY-gu7MhQsZh4AZxMfjuPWWwR7GUeDuWZCUe7Sps1BaUY4wH2yHemMafYgroOH--kCY_kfA52nBiKg9yAh0TXRESrbcR0tYHkSRKJdALqmsB3WUSHXUBv0ywRbdEsw6Fa_yBBffwbeRO9WsTUajsSPKhE0vxTCA0TaMHjJUIE2XY8P6SZiXbU6yqcRvaSqj6EU41i8Xr_nFNZWwysUSBXiVI0wIGKTdYg_RK2nfUto4C4zt0_OZaT0JEGvF9sGlDmvZsAN6w6XKlMIkM21Xc6oViIW05uKCupFQ9460heM357KBlYKeM-YQdv6oyLF5Am-YlbnCoEqirRNhnO-Uy