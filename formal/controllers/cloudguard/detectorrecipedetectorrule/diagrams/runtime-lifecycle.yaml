schemaVersion: 1
surface: repo-authored-semantics
service: cloudguard
slug: detectorrecipedetectorrule
kind: DetectorRecipeDetectorRule
archetype: generated-service-manager
states:
  - provisioning
  - active
  - updating
  - terminating
repoAuthored:
  providerLifecycle: {createPending: ["CREATING"], updatePending: ["UPDATING"], deletePending: ["DELETING"]}
  listLookup:
    filters: ["detectorRecipeId","compartmentId","details.name"]
    matchRule: exact parent recipe and rule name match; deleted rules are excluded
  mutation:
    mutable: ["details"]
    forceNew: ["detectorRecipeId"]
  followUp: {create: none, update: none, delete: confirm-delete}
notes:
  - "Detector rule identity is the service rule key nested under detectorRecipeId; status projects that key as the tracked identity."
