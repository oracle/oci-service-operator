schemaVersion: 1
surface: repo-authored-semantics
service: cloudguard
slug: datasource
kind: DataSource
archetype: generated-service-manager
states:
- provisioning
- active
- updating
- terminating
repoAuthored:
  operations:
    update:
    - UpdateDataSource
  providerLifecycle:
    createPending:
    - CREATING
    updatePending:
    - UPDATING
    deletePending:
    - DELETING
  listLookup:
    filters:
    - compartmentId
    - displayName
    - dataSourceFeedProvider
    matchRule: exact compartmentId, displayName, dataSourceFeedProvider match within
      the resource scope; duplicate matches fail
  mutation:
    mutable:
    - dataSourceDetails
    - definedTags
    - displayName
    - freeformTags
    - status
    forceNew:
    - compartmentId
    - dataSourceFeedProvider
  hooks:
    create:
    - helper: generatedruntime.Create
      entityType: DataSource
      action: CREATE
    update:
    - helper: generatedruntime.Update
      entityType: DataSource
      action: UPDATE
    delete:
    - helper: generatedruntime.Delete
      entityType: DataSource
      action: DELETE
  followUp:
    create: GetWorkRequest -> read-after-write
    update: GetWorkRequest -> read-after-write
    delete: confirm-delete
notes:
- The production runtime uses the declared work-request phases and service-local async
  adapter.
- Lifecycle success and pending states mirror the production service-manager semantics.
- Status projection is required, Secret side effects are none, and the finalizer policy
  is retain-until-confirmed-delete.
- Delete ownership is retained until a terminal lifecycle state or confirmed absence.
