.7803">yes</text><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="251.166" x="858.2644" y="968.7803">"Force-new or conflicting drift detected?"</text><polygon fill="#E2E8F0" points="873.4197,1135.5,1094.2751,1135.5,1106.2751,1147.5,1094.2751,1159.5,873.4197,1159.5,861.4197,1147.5,873.4197,1135.5" style="stroke:#1D4ED8;stroke-width:0.5;"/><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="220.8555" x="873.4197" y="1151.2803">"Supported mutable drift detected?"</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="21.7861" x="839.6335" y="1144.2803">yes</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="15.5723" x="1106.2751" y="1144.2803">no</text><rect fill="#F8FAFC" height="62" rx="8" ry="8" style="stroke:#0F172A;stroke-width:0.5;" width="304.8193" x="695.4814" y="1169.5"/><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="284.8193" x="705.4814" y="1190.2803">Apply UpdateWlpAgent only for mutable fields</text><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="244.3711" x="705.4814" y="1204.2803">certificateSignedRequest, definedTags,</text><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="83.248" x="705.4814" y="1218.2803">freeformTags</text><rect fill="#F8FAFC" height="34" rx="8" ry="8" style="stroke:#0F172A;stroke-width:0.5;" width="199.0059" x="1020.3008" y="1169.5"/><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="179.0059" x="1030.3008" y="1190.2803">Skip the no-op mutation path</text><polygon fill="#E2E8F0" points="983.8474,1237.5,995.8474,1249.5,983.8474,1261.5,971.8474,1249.5,983.8474,1237.5" style="stroke:#1D4ED8;stroke-width:0.5;"/><rect fill="#F8FAFC" height="90" rx="8" ry="8" style="stroke:#0F1