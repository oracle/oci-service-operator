.2825" y="1527.5"/><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="259.1299" x="854.2825" y="1548.2803">Project required status and finalizer policy</text><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="174.3027" x="854.2825" y="1562.2803">retain-until-confirmed-delete</text><rect fill="#F8FAFC" height="34" rx="8" ry="8" style="stroke:#0F172A;stroke-width:0.5;" width="169.4336" x="899.1306" y="1595.5"/><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="149.4336" x="909.1306" y="1616.2803">Requeue on terminating</text><path d="M692.7958,1651.5 L692.7958,1946.5 L672.7958,1950.5 L692.7958,1954.5 L692.7958,2249.5 A0,0 0 0 0 692.7958,2249.5 L1015.7118,2249.5 A0,0 0 0 0 1015.7118,2249.5 L1015.7118,1661.5 L1005.7118,1651.5 L692.7958,1651.5 A0,0 0 0 0 692.7958,1651.5" fill="#FFF7D6" style="stroke:#B45309;stroke-width:0.5;"/><path d="M1005.7118,1651.5 L1005.7118,1661.5 L1015.7118,1661.5 L1005.7118,1651.5" fill="#FFF7D6" style="stroke:#B45309;stroke-width:0.5;"/><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="101.165" x="698.7958" y="1667.2803">shared diagram:</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="284.7852" x="698.7958" y="1681.2803">shared/diagrams/shared-reconcile-activity.svg</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="265.3438" x="698.7958" y="1695.2803">Start from the shared reconcile activity and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="273.8955" x="698.7958" y="1709.2803">specialize provider-backed CRUD, wait, and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="182.875" x="698.7958" y="1723.2803">status-projection details here.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="229.5371" x="698.7958" y="1737.2803">Controller-local activity diagrams add</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="238.8955" x="698.7958" y="1751.2803">list-lookup hints, secret policies, delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="200.0332" x="698.7958" y="1765.2803">handling, and open formal gaps.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="281.709" x="698.7958" y="1779.2803">archetype batch: Generated service-manager</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="291.0469" x="698.7958" y="1793.2803">controllers specialize the shared reconcile path</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="189.8477" x="698.7958" y="1807.2803">with formal runtime ownership.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="121.3994" x="698.7958" y="1821.2803">service: cloudguard</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.5029" x="698.7958" y="1835.2803">slug: wlpagent</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="94.1582" x="698.7958" y="1849.2803">kind: WlpAgent</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="241.2402" x="698.7958" y="1863.2803">archetype: generated-service-manager</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="156.4063" x="698.7958" y="1877.2803">status/finalizer: required /</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="174.3027" x="698.7958" y="1891.2803">retain-until-confirmed-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="128.4131" x="698.7958" y="1905.2803">requeue: terminating</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="263.0674" x="698.7958" y="1919.2803">provider states: create none; update none;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="73.1787" x="698.7958" y="1933.2803">delete none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="209.6992" x="698.7958" y="1947.2803">follow-up: create=read-after-write;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="288.7158" x="698.7958" y="1961.2803">update=read-after-write; delete=confirm-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="256.8125" x="698.7958" y="1975.2803">supported drift: certificateSignedRequest,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="168.082" x="698.7958" y="1989.2803">definedTags, freeformTags</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="230.3301" x="698.7958" y="2003.2803">reject before mutate: force-new fields</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="229.5713" x="698.7958" y="2017.2803">agentVersion, compartmentId, osInfo</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="144.751" x="698.7958" y="2031.2803">create-only fields: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="288.7295" x="698.7958" y="2045.2803">list lookup: oci_cloud_guard_wlp_agents filters</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="270.8262" x="698.7958" y="2059.2803">compartmentId, agentVersion; exact unique</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="251.3506" x="698.7958" y="2073.2803">compartmentId plus agentVersion match</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="698.7958" y="2087.2803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="698.7958" y="2101.2803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="284.8193" x="698.7958" y="2115.2803">WlpAgent responses expose no lifecycle field.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="287.916" x="698.7958" y="2129.2803">The retained resource-local state-free wrapper</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="276.999" x="698.7958" y="2143.2803">marks a readable post-write resource Active.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="250.585" x="698.7958" y="2157.2803">Certificate signing request and tag maps</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="296.4814" x="698.7958" y="2171.2803">reconcile in place. Compartment, agent version,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="282.4678" x="698.7958" y="2185.2803">and OS information remain replacement-only.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="301.916" x="698.7958" y="2199.2803">Pre-create reuse uses exact compartmentId plus</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="280.9707" x="698.7958" y="2213.2803">agentVersion matching, and delete keeps the</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="287.1572" x="698.7958" y="2227.2803">finalizer until a NotFound reread. There are no</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="119.0547" x="698.7958" y="2241.2803">Secret side effects.</text><ellipse cx="661.7958" cy="1950.5" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="661.7958" cy="1950.5" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="661.7958" x2="661.7958" y1="157" y2="177"/><polygon fill="#0F172A" points="657.7958,167,661.7958,177,665.7958,167,661.7958,171" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="824.3849" x2="824.3849" y1="341" y2="361"/><polygon fill="#0F172A" points="820.3849,351,824.3849,361,828.3849,351,824.3849,355" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="824.3849" x2="824.3849" y1="409" y2="429"/><polygon fill="#0F172A" points="820.3849,419,824.3849,429,828.3849,419,824.3849,423" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="520.33" x2="499.2067" y1="257" y2="257"/><line style="stroke:#0F172A;stroke-width:1;" x1="499.2067" x2="499.2067" y1="257" y2="279"/><polygon fill="#0F172A" points="495.2067,269,499.2067,279,503.2067,269,499.2067,273" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="803.2616" x2="824.3849" y1="257" y2="257"/><line style="stroke:#0F172A;stroke-width:1;" x1="824.3849" x2="824.3849" y1="257" y2="279"/><polygon fill="#0F172A" points="820.3849,269,824.3849,279,828.3849,269,824.3849,273" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="499.2067" x2="499.2067" y1="313" y2="495"/><line style="stroke:#0F172A;stroke-width:1;" x1="499.2067" x2=