sequence for</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="260.7295" x="693" y="1449.7803">OCID binding, datasource pagination, and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="163.4268" x="693" y="1463.7803">create-or-update dispatch.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="301.1982" x="693" y="1477.7803">Layer the shared delete sequence when finalizer</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="269.2471" x="693" y="1491.7803">retention, delete confirmation, work-request</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="199.2334" x="693" y="1505.7803">polling, or Secret cleanup apply.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="281.709" x="693" y="1519.7803">archetype batch: Generated service-manager</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="266.1504" x="693" y="1533.7803">controllers follow the shared resolution and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="259.9297" x="693" y="1547.7803">delete sequences with imported waits and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="134.6064" x="693" y="1561.7803">controller-local policy.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="121.3994" x="693" y="1575.7803">service: cloudguard</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.5029" x="693" y="1589.7803">slug: wlpagent</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="94.1582" x="693" y="1603.7803">kind: WlpAgent</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="241.2402" x="693" y="1617.7803">archetype: generated-service-manager</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="156.4063" x="693" y="1631.7803">status/finalizer: required /</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="174.3027" x="693" y="1645.7803">retain-until-confirmed-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="128.4131" x="693" y="1659.7803">requeue: terminating</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="263.0674" x="693" y="1673.7803">provider states: create none; update none;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="73.1787" x="693" y="1687.7803">delete none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="209.6992" x="693" y="1701.7803">follow-up: create=read-after-write;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="288.7158" x="693" y="1715.7803">update=read-after-write; delete=confirm-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="256.8125" x="693" y="1729.7803">supported drift: certificateSignedRequest,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="168.082" x="693" y="1743.7803">definedTags, freeformTags</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="230.3301" x="693" y="1757.7803">reject before mutate: force-new fields</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="229.5713" x="693" y="1771.7803">agentVersion, compartmentId, osInfo</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="144.751" x="693" y="1785.7803">create-only fields: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="288.7295" x="693" y="1799.7803">list lookup: oci_cloud_guard_wlp_agents filters</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="270.8262" x="693" y="1813.7803">compartmentId, agentVersion; exact unique</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="251.3506" x="693" y="1827.7803">compartmentId plus agentVersion match</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="693" y="1841.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="693" y="1855.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="284.8193" x="693" y="1869.7803">WlpAgent responses expose no lifecycle field.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="287.916" x="693" y="1883.7803">The retained resource-local state-free wrapper</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="276.999" x="693" y="1897.7803">marks a readable post-write resource Active.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="250.585" x="693" y="1911.7803">Certificate signing request and tag maps</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="296.4814" x="693" y="1925.7803">reconcile in place. Compartment, agent version,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="282.4678" x="693" y="1939.7803">and OS information remain replacement-only.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="301.916" x="693" y="1953.7803">Pre-create reuse uses exact compartmentId plus</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="280.9707" x="693" y="1967.7803">agentVersion matching, and delete keeps the</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="287.1572" x="693" y="1981.7803">finalizer until a NotFound reread. There are no</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="119.0547" x="693" y="1995.7803">Secret side effects.</text><?plantuml-src hLXhRzis5FtENq5qNreWSfgcwSD51xGfjXNDcY7kjYy10bgwihdGf4PIThrX_ts75FLox3ReXg1899BtTSuzbwgxbReILgouMuh2RAHUy58eHynrAtEHtowigNLnRfIn_Bionqyns55GAMhbVp3QVnGhuZ-HMfENkTY_PoR_8dxoTB0eh3MRPFrnUVByoV2aDfxUtecXB9yNptPt6LkGJJlcJyzE7x_SsH7Sf_NJqwSdPsU3zMW-DrQJvIVFc9TU4P_HdpNfd7Z6SsNgOb4BMnp_hget2zAUBML1l3J6pytdWIdNdlgRSIvoR-mej9HYkxIR6psX5-LZBCCOgYWheVt-yyCDzx4oIB-peMH95rAFY_VogJYTly1gC5cDbl9vSKOdtT8TO5wKeipPFopcnZ_KSq95FJasY8EV8n1hb28xUlrMEBgYtEXSxYuzk9nTVfYHNSkSVXPQBCW-uCBnyQlHaSlpzoo0piqQa8vj7-sS0_qj5ToICwhsqkXfUdLSIB40fkwuUSxwBLaByyIj5ws5WXIoFNYwMHwV95r4ShA-M3pxVb2ZAIUD_JNnbdW8D6N2-ctXq3ZBAU_-VcY3I-SViV6MS6XSYsbl7Dau6RBg21z1vnV6tEANGE1pgGicbEVUWWhO2j3fSwK0GaI0eqCqUcdBXR8aYYrMfVEEZPs6CB1xodyatpaZ255djxCZ7Lz9vo1LXsnSm45hn3qifV9atVHQvsOL-B72w_V54HTX_JSi0Sj7CGTBjHDpv1q23q3N5aqCXu07RGwM7t9vZjmyZIFVR-qRoh37xHwegv29yms7rwZOgFfIS-U5hrqq5v9jgCWJBwX8sBwBhm_5rQnseHtOXQ1AQLUjYxKKmuH0aMizmYZ6aoiI6W60GANKGc5AM4I7jovYC5Sc4E4-fR3a1H9ExaFU5CcAztRRW9FM0YNm1nZ0pTp1ydqTD67rWOeI9BjhDLOx_WjEbLotuOIoexKSJ90gCh61F5phmihISreBLOjuF64INo-HWWgqxqLj7EfHKBnPNLN60azULqNmv6fRYXoIb1EqiSHOzZIJ2qt5LGFzKHZEc0359x5mHwoqHAMng_34hkWFoZsVXpV4LtM8VOfM09CpJPicUk0tQAKZljDdnhtNfM59DDfstDarCj7kNGcVBv4n1F0pvWcljKJ4R7IILwfservkZlMoQYe_Y1Zq2lI4GFbmssag3deL02xtzuL_M9NGPx4oBTx1eUj