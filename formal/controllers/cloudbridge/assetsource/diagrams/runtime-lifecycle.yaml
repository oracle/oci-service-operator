schemaVersion: 1
surface: repo-authored-semantics
service: cloudbridge
slug: assetsource
kind: AssetSource
archetype: generated-service-manager
states:
- provisioning
- active
- updating
- terminating
repoAuthored:
  operations:
    create:
    - CreateAssetSource
    update:
    - UpdateAssetSource
    delete:
    - DeleteAssetSource
  providerLifecycle:
    createPending:
    - CREATING
    updatePending: []
    deletePending:
    - DELETING
  listLookup:
    filters:
    - assetSourceId
    - compartmentId
    - displayName
    - state
    matchRule: exact declared filters match within the resource scope; duplicate matches
      fail
  mutation:
    mutable:
    - areHistoricalMetricsCollected
    - areRealtimeMetricsCollected
    - assetsCompartmentId
    - compartmentId
    - definedTags
    - discoveryCredentials.secretId
    - discoveryCredentials.type
    - discoveryScheduleId
    - displayName
    - freeformTags
    - replicationCredentials.secretId
    - replicationCredentials.type
    - systemTags
    - type
    - vcenterEndpoint
    forceNew:
    - environmentId
    - inventoryId
  hooks:
    create:
    - helper: tfresource.CreateResource
    update:
    - helper: tfresource.UpdateResource
    - helper: tfresource.WaitForUpdatedState
    delete:
    - helper: tfresource.DeleteResource
  followUp:
    create: GetWorkRequest -> read-after-write
    update: GetWorkRequest -> read-after-write
    delete: GetWorkRequest -> confirm-delete
notes:
- The generated service manager uses the reviewed CRUD request, response, lifecycle,
  and status projection contract.
- Work-request phases are declared per operation from the vendored SDK response surface.
- Secret side effects are none and finalizer ownership is retained until confirmed
  deletion.
