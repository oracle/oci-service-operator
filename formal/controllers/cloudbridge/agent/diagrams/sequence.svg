ily="Helvetica" font-size="14" lengthAdjust="spacing" textLength="174.3027" x="740" y="1847.7803">retain-until-confirmed-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="272.3984" x="740" y="1861.7803">requeue: provisioning, updating, terminating</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="304.2607" x="740" y="1875.7803">provider states: create CREATING; update none;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="112.0479" x="740" y="1889.7803">delete DELETING</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="209.6992" x="740" y="1903.7803">follow-up: create=read-after-write;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="288.7158" x="740" y="1917.7803">update=read-after-write; delete=confirm-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="279.3711" x="740" y="1931.7803">supported drift: compartmentId, definedTags,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="171.9512" x="740" y="1945.7803">displayName, freeformTags</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="230.3301" x="740" y="1959.7803">reject before mutate: force-new fields</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="256.8262" x="740" y="1973.7803">agentType, agentVersion, environmentId,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="62.2549" x="740" y="1987.7803">osVersion</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="144.751" x="740" y="2001.7803">create-only fields: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="263.0469" x="740" y="2015.7803">list lookup: oci_cloud_bridge_agents filters</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="240.4541" x="740" y="2029.7803">agentId, compartmentId, displayName,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="289.8506" x="740" y="2043.7803">environmentId (+1 more); exact declared filters</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="264.585" x="740" y="2057.7803">match within the resource scope; duplicate</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="74.6963" x="740" y="2071.7803">matches fail</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="740" y="2085.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="740" y="2099.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="315.1777" x="740" y="2113.7803">The generated service manager uses the reviewed</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="286.3506" x="740" y="2127.7803">CRUD request, response, lifecycle, and status</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="118.2822" x="740" y="2141.7803">projection contract.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="287.875" x="740" y="2155.7803">CRUD responses use lifecycle/read-after-write</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="275.4609" x="740" y="2169.7803">convergence without a work-request tracker.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="253.7021" x="740" y="2183.7803">Secret side effects are none and finalizer</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="284.0469" x="740" y="2197.7803">ownership is retained until confirmed deletion.</text><?plantuml-src jLZRRjms47tdLmpQbmHTsN5Yvo8Z1H8xJOEu2M0xVJ8GSAMHbZMNL4bgDzkY_zxXHRVrRkAsAFAGbJYSwvap8zjReHfk-1BiWfTwBLGD5PSMcUrFvhouhOrkLNccfJRmVLNGlt8aKMB5M-b-qifzu4k4dr6kq8c2xvQv4dyW71sF3hanUfsqFwgEdZqUtrJQuUixFbJLi_BfjfGs9PeaCJy-UVBenPQ4Dv_EdpmvFZev6Pq7zOKs2WqSFMLEE8bmXR-tg0g430gfst9kH5dZuQiQbMCBKI9KMhkv_Z9IPBixVp80NZXj9ewb0BkZxSZmCJwl7j4nAQCSYeOhj_l-ME0-MaR1zpgagF12g6dgNXpp9_FdTEfLDfEZObwUu55_TASipojU5Uml5cA3z-qSAPyEBHlv0MVaYD5IefcyViqjNcAXLI6sZxxxUFNn_HMQbIZm5wvuZUOxu1QchoPNFfwzOxxae5TKqAdksTOz0h_14WnQBLidjChJgyDIy9fgQW_ZSpQ8P5sP3-ogxZIKA2dQlRVZyVGcgZ90amt9Wkp7KOvoG4NoBK907NcPmc23ZByn3J67_lS3u-rPzv1DHVobQIBoGJc5OeKFAK8zb1ikjBwb_pYvF1UgP5mwS8P0G79KRlpII4f_o3rGRoZgeGrmQP2N6peLrbasjUXz8EaStgABbf3OfrVQAn4Mbi9QugTz2Yv8Uz1W7rH2EZGs1-wVtvMp6rNefGV7CZv3AMmZ-SQp5HsYMWcZLJo41pySmL8RVFWmn6UmjNnE2V51-VAtXbgR_A6YKVCJzlTvT4PnEunHIQqRAC8BQAZadcZFBj-ykdxtuUstKq8sGbfs-_9F4xp3untmQIY3f2ysnOfgCIcgK60TTwqDwdoU8hOXOGtB19dpy7gVK_4q-hL7X3ogX5bs-bU2zw4GvcxKKFUOv2JN9VdypSMR-oJPutUagekgaCWLXK6dbL1SqkWo52EzjG44SwazKE-JK8EEKzgIVpvx63g9tfjDh6ywys2b7qGoeEUMDD_NG7HhS9HNr0TtjKP0TQ3oTOtUK3p16G-n-ncClBHUY1wJIuhH4ZnkL0VlsL23O4-ALHU-Lq0aOybbb6N6ryIIDweqedA0AovR7jnDI0gl5vGowMbWuFQffpDF_5TjqsX3A8IsARqbsvgA5vZ3b0WOhIKq_SfhNjifAq1b42jjblw8NU9lM3YO-pS8ozPxdrFtK_jb2jVHVyi2trnl6heUVlxgUqYh6KmOPiQqJISiCUeTnhhZvzYrFNpLALjoLomeHJGulj0SfleNCaodP8K50LWBHrBW5ZXGYIrqWwUiR3sH-xm5KLyWBkGmgdJZHi5JR_WcfHlETrmi7s6f9DGLxhxO7IVOGoaakGEhDsZxcleZpuBVjfIQ_5NJo0ry2b18tQxe1TdgTDseM4BO7XGZV10ozm84zuy1qofOe2G-XGKLoD8m2dFWfQkwl1_4KN6P7azlL8JjM2HwFnA9RJqMYMpQYUppXuTaLBGtw7L6SB4qR1tMczulFqsoG1tPsWWtScV7IV8YiNJQSEuxO-88UPbemC_fdhjUHhhCMfetCalg-nKg6DZUPhQsfewTY4KRerV2znlXSnOfmV-wKHJ9aYowdb2Cg1