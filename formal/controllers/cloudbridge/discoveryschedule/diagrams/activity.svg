<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="2251px" preserveAspectRatio="none" style="width:1264px;height:2251px;background:#FCFCFD;" version="1.1" viewBox="0 0 1264 2251" width="1264px" zoomAndPan="magnify"><title>Activity - cloudbridge/DiscoverySchedule</title><defs/><g><rect fill="#FCFCFD" height="2251" style="stroke:none;stroke-width:1;" width="1264" x="0" y="0"/><g class="title" data-source-line="10"><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="276.1855" x="492.8433" y="30.7803">Activity - cloudbridge/DiscoverySchedule</text></g><ellipse cx="670.2578" cy="55" fill="#1D4ED8" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="none" height="472" rx="8" ry="8" style="stroke:#000000;stroke-width:1.5;" width="623.2236" x="387.6406" y="75"/><path d="M509.709,75 L509.709,82 L499.709,92 L387.6406,92" fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="112.0684" x="390.6406" y="86.7803">Observe and Bind</text><rect fill="#F8FAFC" height="48" rx="8" ry="8" style="stroke:#0F172A;stroke-width:0.5;" width="304.7852" x="517.8652" y="109"/><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="136.9375" x="527.8652" y="129.7803">Start from shared flow</text><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="284.7852" x="527.8652" y="143.7803">shared/diagrams/shared-reconcile-activity.svg</text><rect fill="#F8FAFC" height="48" rx="8" ry="8" style="stroke:#0F172A;stroke-width:0.5;" width="314.1504" x="513.1826" y="177"/><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="294.1504" x="523.1826" y="197.7803">Read desired DiscoverySchedule spec, tracked</