8" y="1873.7803">delete DELETING</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="209.6992" x="738" y="1887.7803">follow-up: create=read-after-write;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="288.7158" x="738" y="1901.7803">update=read-after-write; delete=confirm-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="270.0264" x="738" y="1915.7803">supported drift: assetSourceIds, assetType,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="313.9883" x="738" y="1929.7803">compartmentId, compute.connectedNetworks (+69</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="36.5586" x="738" y="1943.7803">more)</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="230.3301" x="738" y="1957.7803">reject before mutate: force-new fields</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="259.1299" x="738" y="1971.7803">externalAssetKey, inventoryId, sourceKey</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="144.751" x="738" y="1985.7803">create-only fields: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="261.4746" x="738" y="1999.7803">list lookup: oci_cloud_bridge_assets filters</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="307.3574" x="738" y="2013.7803">assetId, assetType, compartmentId, displayName</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="278.9404" x="738" y="2027.7803">(+4 more); exact declared filters match within</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="261.4746" x="738" y="2041.7803">the resource scope; duplicate matches fail</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="738" y="2055.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="738" y="2069.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="315.1777" x="738" y="2083.7803">The generated service manager uses the reviewed</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="286.3506" x="738" y="2097.7803">CRUD request, response, lifecycle, and status</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="118.2822" x="738" y="2111.7803">projection contract.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="287.875" x="738" y="2125.7803">CRUD responses use lifecycle/read-after-write</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="275.4609" x="738" y="2139.7803">convergence without a work-request tracker.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="253.7021" x="738" y="2153.7803">Secret side effects are none and finalizer</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="284.0469" x="738" y="2167.7803">ownership is retained until confirmed deletion.</text><?plantuml-src hLXRRnD757wVNp6YBo2y2I7XveXAa50QaO94G7s9XCQxP-rfnZFRcLaRj-f_xpUNNQyT6r8L8OHtvyovVkSxPt4tKZV2YZbtCr6PfTHJNWlbYBd-P2BAcwarhQxEZ3AM_rIN-5CD92ggHQlyBqRxzs9E_5TI2_Ao5BjbhkHVn8zE1eV2MhFCsX_LHyyU3szgu-drBH_g-bdrT5lAs8fibfYSF3b-z69B8fZFvyV79qTFdWpEe_hIM4sM7prbNdf5_8h-R4cNn0jUAjDM4okhAHs-SeuycycAU6sCdvYl0qMkk_CturoKtjWDntA0tT5sPFIOdjUFS0nboA5iXFQxxmy5xg9b47olGycQBgNUJDs