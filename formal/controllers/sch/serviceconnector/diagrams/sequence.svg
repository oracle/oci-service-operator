xt fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="273.1641" x="814" y="2129.7803">create, update, delete work-request phases.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="304.9854" x="814" y="2143.7803">Lifecycle success states are ACTIVE, INACTIVE;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="257.6396" x="814" y="2157.7803">pending create, update, and delete states</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="256.833" x="814" y="2171.7803">requeue until the corresponding follow-up</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="68.4824" x="814" y="2185.7803">converges.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="251.3506" x="814" y="2199.7803">Status projection is required, Secret side</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="260.7021" x="814" y="2213.7803">effects are none, and the finalizer policy is</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="178.1924" x="814" y="2227.7803">retain-until-confirmed-delete.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="278.5918" x="814" y="2241.7803">Delete policy required retains ownership until</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="206.9785" x="814" y="2255.7803">DELETED or confirmed absence.</text><?plantuml-src fLVRRjms47tdLmpQbmHTsN5ivoB31HBRJOsuIH4xVLeWu4hKBXijgPBKRhP5_xqpl6YblJXEWpnaBGxdUkRCq7wMgk66py7EUAcNKasXuhKLp7Od4rvydXhTgl92rzh0ZrM1_ygUH2agtjRk5wtSEpuNyAke5yB9Wk-MkPL_2pWwwHroO_GoQdzI7Jr_sh-fj1EljtoegkVbiqqfRKfXeiJavFJuoSiD2J8Vpu-FJuvEJtldNdsXZH86Zfun9rqju5RyrGfL2CZ05hF3Ms4Mi