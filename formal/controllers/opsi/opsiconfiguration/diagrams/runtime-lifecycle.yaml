schemaVersion: 1
surface: repo-authored-semantics
service: opsi
slug: opsiconfiguration
kind: OpsiConfiguration
archetype: generated-service-manager
states:
- provisioning
- active
- updating
- terminating
repoAuthored:
  operations:
    update:
    - UpdateOpsiConfiguration
  providerLifecycle:
    createPending:
    - CREATING
    updatePending:
    - UPDATING
    deletePending:
    - DELETING
  listLookup:
    filters:
    - compartmentId
    - displayName
    - opsiConfigType
    matchRule: exact compartmentId, displayName, opsiConfigType match within the resource
      scope; duplicate matches fail
  mutation:
    mutable:
    - displayName
    - description
    - freeformTags
    - definedTags
    - systemTags
    - jsonData
    forceNew:
    - compartmentId
    - opsiConfigType
  hooks:
    create:
    - helper: tfresource.CreateResource
    - helper: tfresource.WaitForWorkRequestWithErrorHandling
      entityType: opsiconfiguration
      action: CREATE_OPSI_CONFIGURATION
    update:
    - helper: tfresource.UpdateResource
    - helper: tfresource.WaitForWorkRequestWithErrorHandling
      entityType: opsiconfiguration
      action: UPDATE_OPSI_CONFIGURATION
    delete:
    - helper: tfresource.DeleteResource
    - helper: tfresource.WaitForWorkRequestWithErrorHandling
      entityType: opsiconfiguration
      action: DELETE_OPSI_CONFIGURATION
  followUp:
    create: GetWorkRequest -> GetOpsiConfiguration
    update: GetWorkRequest -> GetOpsiConfiguration
    delete: confirm-delete
notes:
- The production runtime uses the declared work-request phases and service-local async
  adapter.
- Lifecycle success and pending states mirror the production service-manager semantics.
- Status projection is required, Secret side effects are none, and the finalizer policy
  is retain-until-confirmed-delete.
- Delete ownership is retained until a terminal lifecycle state or confirmed absence.
