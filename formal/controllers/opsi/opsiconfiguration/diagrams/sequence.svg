"#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="174.3027" x="815" y="2115.7803">retain-until-confirmed-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="272.3984" x="815" y="2129.7803">requeue: provisioning, updating, terminating</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="265.3369" x="815" y="2143.7803">provider states: create CREATING; update</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="192.165" x="815" y="2157.7803">UPDATING; delete DELETING</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="234.9922" x="815" y="2171.7803">follow-up: create=GetWorkRequest -&gt;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="317.502" x="815" y="2185.7803">GetOpsiConfiguration; update=GetWorkRequest -&gt;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="277.4297" x="815" y="2199.7803">GetOpsiConfiguration; delete=confirm-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="257.5713" x="815" y="2213.7803">supported drift: displayName, description,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="233.0439" x="815" y="2227.7803">freeformTags, definedTags (+2 more)</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="230.3301" x="815" y="2241.7803">reject before mutate: force-new fields</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="198.4268" x="815" y="2255.7803">compartmentId, opsiConfigType</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="144.751" x="815" y="2269.7803">create-only fields: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="249.8193" x="815" y="2283.7803">list lookup: oci_opsi_opsi_configurations</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="223.3027" x="815" y="2297.7803">filters compartmentId, displayName,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="239.668" x="815" y="2311.7803">opsiConfigType; exact compartmentId,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="291.0264" x="815" y="2325.7803">displayName, opsiConfigType match within the</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="238.123" x="815" y="2339.7803">resource scope; duplicate matches fail</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="815" y="2353.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="815" y="2367.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="258.3711" x="815" y="2381.7803">The production runtime uses the declared</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="279.3506" x="815" y="2395.7803">work-request phases and service-local async</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="51.3721" x="815" y="2409.7803">adapter.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="294.9229" x="815" y="2423.7803">Lifecycle success and pending states mirror the</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="244.3301" x="815" y="2437.7803">production service-manager semantics.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="251.3506" x="815" y="2451.7803">Status projection is required, Secret side</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="260.7021" x="815" y="2465.7803">effects are none, and the finalizer policy is</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="178.1924" x="815" y="2479.7803">retain-until-confirmed-delete.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="271.585" x="815" y="2493.7803">Delete ownership is retained until a terminal</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="226.4404" x="815" y="2507.7803">lifecycle state or confirmed absence.</text><?plantuml-src jLXhRzms5ltENq6qNrAinuxpQDCnl41hkwbHRrpO2V9bW80ZKJDSSqYLf6OoBVQ_zroIqaZpI1na2mEs99BtUUwvb_OFojJ2YGNtSr7QbJ8pNWdj9VFTobGK3pDd6rDUM6qT_xOgy5FsTfIo4eqElrWJteY5vBzAlPH15MB_ddlrf-IdBtgBmZcxojAVLgS_FEkVD3R8dtTigAeVok-tTrbNIfTtJ5-yVFxqnwqTf3wlFt_-ulJbozvw55zOPwJZfz-pe8AM_5x-qKXJI3xYjlRgv1Q_BgofrAnn8YXhs5oLabVMXgdzs9FcsuD_CSv54QmRM9UzR9UstPFFvAlgAPOX385KjJ1X__d-XiT8wKMWaw5L9M-K6SRlnnVY-VGLLabaFLWgfkLBUTejxUJcLIMgWlsFHT_uRyrK8gX1UjQpWoEAmLcjfHjy_bbuUISBQmgrlVJDxVtjR_VIBLKX_oECc4dt3HUU3pyDZjnUN3FAExTBP7Ke-sZh72h0oP8xwQrkABNZ_EcaL6A6dFgJz3xQR1crQJxsorahePGQtXuydPQ79wKf8pxP9bXyzEzUZCPS6knl9Dz182pEBh7DVZezT7VCk-SdZdJxy1qRRg53mw2CDyBXbbVatcu9H1Zm6siVy4V0bQao9HCwyE003fm13EJ7MYCjCISSDMDGO6ikj9EYN6DL-U3PK3lPWzrZ_bg6NQqIDDKfw0GgpnVAUn3P8M4tqBGZpJ-fb0xI-V7457P165f0udLvn4lbQotMn6n74sExas_NjVmkUkbauyKK8IBN21oDG-734gGKr83AE6JB1RmFSjStRMtDYxZ8Qu23UFdYxkgdjzTlNdzPaA0x1cg_ZLyJ_ZrUxG5TZPX2TYgh9S6ddtvbk0yYD3wAerYcwk0PeRBCuBgCdmyPc5PtRJomlQ1DRj7gMYenCVjy16mdPZzSKeQoW3P3brStLr-QeK_fQ6DIQ2aCWe0ggfGH6ltJ8KBuwYFCfjfI4Jmc7Ku6WQ1dmodsCbOilhjrGafUeoh0GpHnwY7viGgIMHj3HOMwsfMQeDd2ar2Hh84_qHW2w-CK9bvSpLM7