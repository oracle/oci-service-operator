schemaVersion: 1
surface: repo-authored-semantics
service: opsi
slug: chargebackplan
kind: ChargebackPlan
archetype: generated-service-manager
states:
  - provisioning
  - active
  - updating
  - terminating
repoAuthored:
  providerLifecycle:
    createPending: ["CREATING"]
    updatePending: ["UPDATING"]
    deletePending: ["DELETING"]
  listLookup:
    filters: ["compartmentId","entitySource","planName","planType"]
    matchRule: exact resource identity match; duplicate matches fail
  mutation:
    mutable: ["definedTags","freeformTags","planCustomItems","planDescription","planName"]
    forceNew: ["compartmentId","entitySource","jsonData","planType"]
  followUp:
    create: read-after-write
    update: read-after-write
    delete: confirm-delete
notes:
  - "The runtime uses its declared lifecycle-state contract for ChargebackPlan reconciliation."
  - "The credential-free mock exercises SDK request serialization, response projection, mutation when supported, and confirmed deletion."
