schemaVersion: 1
surface: repo-authored-semantics
service: opsi
slug: enterprisemanagerbridge
kind: EnterpriseManagerBridge
archetype: generated-service-manager
states:
- provisioning
- active
- updating
- terminating
repoAuthored:
  operations:
    update:
    - UpdateEnterpriseManagerBridge
  providerLifecycle:
    createPending:
    - CREATING
    updatePending:
    - UPDATING
    deletePending:
    - DELETING
  listLookup:
    filters:
    - compartmentId
    - displayName
    - objectStorageBucketName
    matchRule: exact compartmentId, displayName, objectStorageBucketName match within
      the resource scope; duplicate matches fail
  mutation:
    mutable:
    - definedTags
    - description
    - displayName
    - freeformTags
    forceNew:
    - compartmentId
    - objectStorageBucketName
  hooks:
    create:
    - helper: generatedruntime.Create
      entityType: EnterpriseManagerBridge
      action: CREATED
    update:
    - helper: generatedruntime.Update
      entityType: EnterpriseManagerBridge
      action: UPDATED
    delete:
    - helper: generatedruntime.Delete
      entityType: EnterpriseManagerBridge
      action: DELETED
  followUp:
    create: read-after-write
    update: read-after-write
    delete: confirm-delete
notes:
- The production runtime uses the declared work-request phases and service-local async
  adapter.
- Lifecycle success and pending states mirror the production service-manager semantics.
- Status projection is required, Secret side effects are none, and the finalizer policy
  is retain-until-confirmed-delete.
- Delete ownership is retained until a terminal lifecycle state or confirmed absence.
