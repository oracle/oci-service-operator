engthAdjust="spacing" textLength="288.7158" x="804" y="2115.7803">update=read-after-write; delete=confirm-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="265.3574" x="804" y="2129.7803">supported drift: definedTags, freeformTags</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="230.3301" x="804" y="2143.7803">reject before mutate: force-new fields</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="279.3643" x="804" y="2157.7803">compartmentId, connectionCredentialDetails,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="294.5332" x="804" y="2171.7803">connectionDetails, credentialDetails (+15 more)</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="144.751" x="804" y="2185.7803">create-only fields: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="279.3848" x="804" y="2199.7803">list lookup: oci_opsi_database_insights filters</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="315.9775" x="804" y="2213.7803">compartmentId, databaseConnectorId, databaseId,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="275.8574" x="804" y="2227.7803">enterpriseManagerBridgeId (+5 more); exact</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="287.1367" x="804" y="2241.7803">resource identity match; duplicate matches fail</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="804" y="2255.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="804" y="2269.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="272.3369" x="804" y="2283.7803">The runtime uses its declared lifecycle-state</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="264.585" x="804" y="2297.7803">contract for DatabaseInsight reconciliation.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="301.123" x="804" y="2311.7803">The credential-free mock exercises SDK request</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="265.3643" x="804" y="2325.7803">serialization, response projection, mutation</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="252.9434" x="804" y="2339.7803">when supported, and confirmed deletion.</text><?plantuml-src fLXRRnGt57xthpXgNq1a4a8IBXjH2PAK8bAe2Bn5GjuPpww9rvxQdbtIgl-zv_WoEpFPXGN40pk-dEjtldCSToDrmorVW9lpogoada7DbHFCTJjJNjxCh6brTMQKiV1hNUA_gdUY4ZLlbV_TQF-MBmJy8THIU5dopMUkv3y23ezxcznQiqhI7zQ7JnxrRshZnSixDjJra-hn-9InbR3fnFJuvEZXiz49Kf_sZuwE3qzEUlj1V6ci5XOE7pCllH9m9VvkXIu5560Q9m_EkUTJxiHhxUHixjbSLW9gO_pKVEd9SldQlmo0bzxOWMt9nxmrTauy4a_hXxYDmZ2Cik7QRxxVFx2Bb9x_dGmbQt4fzJ1wpuxvqVGfxfB8Ph1LJgiJSTXjtSdCqvhN9VkF1T_WJJiL658l7ElP0MTeY3LA2JjOVecXVIzAeqivtlhbtTMxDrV2BcKf_kIQpuJz1RY3uTBWohkpruoo3cQ9EHtAtXlTG_nRKO4LpgZMIwCdQUcWado6ENK7yRjO7oboclVTSfObL4AXjrjln-tXJQ6hW4ws3XOKl_LYD06XyNmhO8G_j3SvnDQdwUxGsGbql-zPqkpyVJOyGfU68PciXQDJJf9pO_W72C2bCJVu7qStfb9NZ2iFtY8my0P2G7nf5AOav0EmNZIMrYrmPGMlRd5NEk_OK3TPWwSdy4huiKw1zDI9xyH91mlf71BODb6Ng6SaozshfVB2kicrBis2iBD0UQ-hFQZIIGoh5eHaNBpMUJLyu4bX6ojTLlNIocg6Ut3lmGaiZ1NtxuTOMD4wFiKmKW08Fgr5Qa2BCUb87bWxssm-mnXvCR8QLP_B870S6cLC0sMu0msYYkZyxFt5Ym-ltxxwdWYZGI7Acmt_ySnjS7G3LXjC24gEjRZ490zm8pKuptthWZWARomfIC0MLKBbULZUPbxStJcoMwIWqRMqYsp2Kl9hVTTnB89hlGb-CM7fSaxO-SNbnVSbRBly7A9I2Qun9bYDjTHSOGUs631STG68KsMed7R9ZXMUOmwIqPGA4IeVr-rjX4tQeuh27qYKOAOE9U-g89grDfJNM6XtfKQSPgmIIA8rw4ymX