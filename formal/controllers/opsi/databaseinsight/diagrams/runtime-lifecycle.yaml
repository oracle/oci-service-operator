schemaVersion: 1
surface: repo-authored-semantics
service: opsi
slug: databaseinsight
kind: DatabaseInsight
archetype: generated-service-manager
states:
  - provisioning
  - active
  - updating
  - terminating
repoAuthored:
  providerLifecycle:
    createPending: ["CREATING"]
    updatePending: ["UPDATING"]
    deletePending: ["DELETING"]
  listLookup:
    filters: ["compartmentId","databaseConnectorId","databaseId","enterpriseManagerBridgeId","enterpriseManagerEntityIdentifier","enterpriseManagerIdentifier","entitySource","exadataInsightId","opsiPrivateEndpointId"]
    matchRule: exact resource identity match; duplicate matches fail
  mutation:
    mutable: ["definedTags","freeformTags"]
    forceNew: ["compartmentId","connectionCredentialDetails","connectionDetails","credentialDetails","databaseConnectorId","databaseId","databaseResourceType","dbmPrivateEndpointId","deploymentType","enterpriseManagerBridgeId","enterpriseManagerEntityIdentifier","enterpriseManagerIdentifier","entitySource","exadataInsightId","isAdvancedFeaturesEnabled","managementAgentId","opsiPrivateEndpointId","serviceName","systemTags"]
  followUp:
    create: read-after-write
    update: read-after-write
    delete: confirm-delete
notes:
  - "The runtime uses its declared lifecycle-state contract for DatabaseInsight reconciliation."
  - "The credential-free mock exercises SDK request serialization, response projection, mutation when supported, and confirmed deletion."
