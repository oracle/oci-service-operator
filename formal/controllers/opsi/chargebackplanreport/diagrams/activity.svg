.7803">Apply explicit follow-up semantics</text><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="145.8926" x="835.4136" y="1447.7803">create=read-after-write;</text><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="288.7158" x="835.4136" y="1461.7803">update=read-after-write; delete=confirm-delete</text><rect fill="#F8FAFC" height="34" rx="8" ry="8" style="stroke:#0F172A;stroke-width:0.5;" width="318.7783" x="820.3823" y="1495"/><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="298.7783" x="830.3823" y="1515.7803">Return success for the PRESENT success state</text><rect fill="#F8FAFC" height="48" rx="8" ry="8" style="stroke:#0F172A;stroke-width:0.5;" width="279.1299" x="840.2065" y="1549"/><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="259.1299" x="850.2065" y="1569.7803">Project required status and finalizer policy</text><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="174.3027" x="850.2065" y="1583.7803">retain-until-confirmed-delete</text><rect fill="#F8FAFC" height="34" rx="8" ry="8" style="stroke:#0F172A;stroke-width:0.5;" width="313.4189" x="823.062" y="1617"/><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="293.4189" x="833.062" y="1637.7803">Requeue on provisioning, updating, terminating</text><rect fill="#F8FAFC" height="34" rx="8" ry="8" style="stroke:#0F172A;stroke-width:0.5;" width="271.3779" x="844.0825" y="1671"/><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="251.3779" x="854.0825" y="1691.7803">Keep promotion blocked on seed-corpus</text><path d="M690.7578,1727 L690.7578,2008 L670.7578,2012 L690.7578,2016 L690.7578,2297 A0,0 0 0 0 690.7578,2297 L1006.6807,2297 A0,0 0 0 0 1006.6807,2297 L1006.6807,1737 L996.6807,1727 L690.7578,1727 A0