ields name,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="307.3711" x="797" y="2115.7803">awrHubId, compartmentId, associatedResourceId</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="61.0723" x="797" y="2129.7803">(+1 more)</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="144.751" x="797" y="2143.7803">create-only fields: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="277.0332" x="797" y="2157.7803">list lookup: oci_opsi_awr_hub_sources filters</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="306.9609" x="797" y="2171.7803">awrHubId, compartmentId, name, type (+2 more);</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="279.3506" x="797" y="2185.7803">exact awrHubId, compartmentId, name, type,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="295.709" x="797" y="2199.7803">associatedResourceId, associatedOpsiId match</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="279.3711" x="797" y="2213.7803">within the resource scope; duplicate matches</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="17.8965" x="797" y="2227.7803">fail</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="797" y="2241.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="797" y="2255.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="258.3711" x="797" y="2269.7803">The production runtime uses the declared</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="279.3506" x="797" y="2283.7803">work-request phases and service-local async</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="51.3721" x="797" y="2297.7803">adapter.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="294.9229" x="797" y="2311.7803">Lifecycle success and pending states mirror the</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="244.3301" x="797" y="2325.7803">production service-manager semantics.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="251.3506" x="797" y="2339.7803">Status projection is required, Secret side</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="260.7021" x="797" y="2353.7803">effects are none, and the finalizer policy is</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="178.1924" x="797" y="2367.7803">retain-until-confirmed-delete.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="271.585" x="797" y="2381.7803">Delete ownership is retained until a terminal</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="226.4404" x="797" y="2395.7803">lifecycle state or confirmed absence.</text><?plantuml-src fLVPRXit57tdLroqBmcgiUCiJIB31HB7ROowTM4dw8i1WvhXI6n6v9JaI56B_diFbzcqf6uBFrZ3vQxdddjfFqbLSyENP1Uyq6kfvbJooWfckvqPpp_DZMvKSQuhRUZhCiTVCJXHY98tbVjUA_SpNmfwBwgLS3Bd-y_SoZy4dJmVR79Zz3f9VrAUl7mwlAcq4sztR2ZBbyMtswUqAOH99sRFNpnxydhhX5UVzfyzUtxouiLWFuZFjL72qCctp4bN2ReLlpT2vO8oqhMLns_MvdqpkzMDoGLRo49GgRMRwSy3GRQzyoSZuhdJPcHOSh3TslPCF1MloYVOXZ34KDPSkVttXmSU8cNWV2UZagMuaceSkjVF-RFPA-nwaVLeAvyLByH9jxMJbbSbBtFs5mk-qO_DJ22UJbWsi8FEOOZHLINCQFajj-96v5hbSdlhg-lRwnzlX