xt fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="156.4063" x="796" y="2115.7803">status/finalizer: required /</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="174.3027" x="796" y="2129.7803">retain-until-confirmed-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="272.3984" x="796" y="2143.7803">requeue: provisioning, updating, terminating</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="265.3369" x="796" y="2157.7803">provider states: create CREATING; update</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="192.165" x="796" y="2171.7803">UPDATING; delete DELETING</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="209.6992" x="796" y="2185.7803">follow-up: create=read-after-write;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="288.7158" x="796" y="2199.7803">update=read-after-write; delete=confirm-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="269.2471" x="796" y="2213.7803">supported drift: freeformTags, definedTags,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="121.4131" x="796" y="2227.7803">isAutoSyncEnabled</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="230.3301" x="796" y="2241.7803">reject before mutate: force-new fields</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="182.8613" x="796" y="2255.7803">compartmentId, entitySource,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="175.0957" x="796" y="2269.7803">enterpriseManagerIdentifier,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="234.6162" x="796" y="2283.7803">enterpriseManagerBridgeId (+5 more)</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="144.751" x="796" y="2297.7803">create-only fields: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="271.5986" x="796" y="2311.7803">list lookup: oci_opsi_exadata_insights filters</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="182.8613" x="796" y="2325.7803">compartmentId, entitySource,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="173.5439" x="796" y="2339.7803">enterpriseManagerBridgeId,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="275.0713" x="796" y="2353.7803">enterpriseManagerEntityIdentifier (+1 more);</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="220.2129" x="796" y="2367.7803">exact compartmentId, entitySource,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="173.5439" x="796" y="2381.7803">enterpriseManagerBridgeId,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="210.1094" x="796" y="2395.7803">enterpriseManagerEntityIdentifier,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="298.0537" x="796" y="2409.7803">exadataInfraId match within the resource scope;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="134.627" x="796" y="2423.7803">duplicate matches fail</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="796" y="2437.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="796" y="2451.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="258.3711" x="796" y="2465.7803">The production runtime uses the declared</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="279.3506" x="796" y="2479.7803">work-request phases and service-local async</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="51.3721" x="796" y="2493.7803">adapter.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="294.9229" x="796" y="2507.7803">Lifecycle success and pending states mirror the</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="244.3301" x="796" y="2521.7803">production service-manager semantics.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="251.3506" x="796" y="2535.7803">Status projection is required, Secret side</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="260.7021" x="796" y="2549.7803">effects are none, and the finalizer policy is</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="178.1924" x="796" y="2563.7803">retain-until-confirmed-delete.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="288.7227" x="796" y="2577.7803">Provider DisableExadataInsight operations are</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="283.3086" x="796" y="2591.7803">intentionally excluded because the production</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="280.9092" x="796" y="2605.7803">service manager uses the primary create and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="111.3027" x="796" y="2619.7803">delete operations.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="271.585" x="796" y="2633.7803">Delete ownership is retained until a terminal</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="226.4404" x="796" y="2647.7803">lifecycle state or confirmed absence.</text><?plantuml-src pLXRRnit5dxdhpZelYIenuwRk4rbk81ZkwbHRr94AR0F0WngXYEnvf2p94UATh7_VS_XPQJH9RRt0XH-yCoGFDVlVETGxa7gbblUW9lpoYobda7DbHFCzIjJNZxChEbqTMMKiV2NkiI_QcD79MhUAV-pqVu3RmJy8jH2U5do_Nl6yXy2JjziB79hpJ99VrMV_l3Tvabjl7YtOqDT_r1zlxtBs4hOj6Fwvkprgn-tTf3wjFxwzPlJixEDzI2-D5OB2wVVCo-z4Z0MV--4BWKKO5edJsw-y8fxVgkTdCqzcyjAG6sCdvel6w9SFlLF1i1BR-p0jEHYNjhsJNmdtjQlS1c5OHHboxNVVtvpmrEaRBZVor2o5dTI3uFtunl-UleMLqbaErWgfzMPEEsNTXBpjkProVx5Wc_mQpSL654l7Dkm0wxG46kK4dRm-HrtufCeZIxbzj8t7ySVVnqBkv2b-2lNV2RiDy0T33yDZdoykcMKT30BJEbGzj7MEOI_5HLOuOpgl3Hwb3wTL9BFCAVk9BuNwor5JlEnMyooX4eezFRWwRWyF2bq5S39ri62ugUD68r0QDpV2HZ23yrD_h3rPZewz7K4_VCBIugTVyc6M-ZGC2AZjN3qoKdoRGly0G1mPym3_kFen5JgYd7bmLk41Hv008WlhSA4X6m0Lel6kbe1LrRmQeMhqdd7Xgh96DmzWlV2RwaKI4szz5wQTD18vv2y3acwGpL3KUv5BPKNreqckZGDuQP1SRVL4KIfOzFPKXnDDBuAsrhfijHtLbOpWJlthDs4ixV1ibeAEz4llZs5nbZnycK8ZHMTurCCAiM3i4HQo0D403895j8X7wumP5uClK0JhcMGjnKePKmBPJW1BGACYFtgqytbvziFxvyHRhGcX7o_rVzn5lSukGUrBMO71SUYN6321n2I6fpdldD178KsrXOaY8ig0VGwV3vaNLnzObGFo42JQscRRC12ybsd9ngBOGyCOwRIoPofwvkxcsTb2YjjelT9px4fbU0QWu56r59pXItOOgJmgmlecof3DVMKj5ZXEGO_cKmv4A7wyRjTHRYaDQehV42g13DrAFcf2g9PQqDvZMMsApNYCsEKq16jGN-2CPJ1focCxBgSonxY3Vhe46GJdSlc27x_xJezzGaAcfLSv42GAEHAXyOBLHLyYQm_qPMLjGUnuAhZmV24pF1vZi5Jn5thNZMq-OWQsRXhMsCHrT2r5MbodQrvAKPGMo5gOvlFVEQE6CvPsCohy8A1kEoy6QzqUQCf61Nx9FuGfOSfdH3GT6GqYZ1OpeKMosYsOrzZHBP3UckwsxEOsH9UV7iMYP2bbf4968RQs40R7APVzYZxeivJDj3PS5_ECTZOKh_WXFB_KurRSYdMbgFxGJCifKVruEUYfr7cIjEASwWwwfIKsh2LCCIbMay7flKRYS929j