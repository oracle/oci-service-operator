vetica" font-size="14" lengthAdjust="spacing" textLength="156.4063" x="773" y="2129.7803">status/finalizer: required /</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="174.3027" x="773" y="2143.7803">retain-until-confirmed-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="272.3984" x="773" y="2157.7803">requeue: provisioning, updating, terminating</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="265.3369" x="773" y="2171.7803">provider states: create CREATING; update</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="192.165" x="773" y="2185.7803">UPDATING; delete DELETING</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="234.9922" x="773" y="2199.7803">follow-up: create=GetWorkRequest -&gt;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="275.4746" x="773" y="2213.7803">GetHostInsight; update=GetWorkRequest -&gt;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="235.4023" x="773" y="2227.7803">GetHostInsight; delete=confirm-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="265.3574" x="773" y="2241.7803">supported drift: definedTags, freeformTags</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="230.3301" x="773" y="2255.7803">reject before mutate: force-new fields</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="256.0127" x="773" y="2269.7803">compartmentId, entitySource, computeId,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="194.9404" x="773" y="2283.7803">managementAgentId (+4 more)</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="144.751" x="773" y="2297.7803">create-only fields: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="248.2402" x="773" y="2311.7803">list lookup: oci_opsi_host_insights filters</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="256.0127" x="773" y="2325.7803">compartmentId, entitySource, computeId,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="236.1816" x="773" y="2339.7803">managementAgentId (+4 more); exact</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="256.0127" x="773" y="2353.7803">compartmentId, entitySource, computeId,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="312.8535" x="773" y="2367.7803">managementAgentId, enterpriseManagerIdentifier,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="173.5439" x="773" y="2381.7803">enterpriseManagerBridgeId,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="210.1094" x="773" y="2395.7803">enterpriseManagerEntityIdentifier,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="266.1504" x="773" y="2409.7803">exadataInsightId match within the resource</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="179.7646" x="773" y="2423.7803">scope; duplicate matches fail</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="773" y="2437.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="773" y="2451.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="258.3711" x="773" y="2465.7803">The production runtime uses the declared</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="279.3506" x="773" y="2479.7803">work-request phases and service-local async</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="51.3721" x="773" y="2493.7803">adapter.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="294.9229" x="773" y="2507.7803">Lifecycle success and pending states mirror the</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="244.3301" x="773" y="2521.7803">production service-manager semantics.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="251.3506" x="773" y="2535.7803">Status projection is required, Secret side</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="260.7021" x="773" y="2549.7803">effects are none, and the finalizer policy is</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="178.1924" x="773" y="2563.7803">retain-until-confirmed-delete.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="266.1367" x="773" y="2577.7803">Provider DisableHostInsight operations are</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="283.3086" x="773" y="2591.7803">intentionally excluded because the production</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="280.9092" x="773" y="2605.7803">service manager uses the primary create and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="111.3027" x="773" y="2619.7803">delete operations.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="271.585" x="773" y="2633.7803">Delete ownership is retained until a terminal</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="226.4404" x="773" y="2647.7803">lifecycle state or confirmed absence.</text><?plantuml-src nLXRRnkt4dxdho3QbmIrxBXnsbI62oHssXfrcy9EqHS10RKxAx7Xadj8hXITel-zCxpiHPT4JOjpu0VlBeV3kNpppL3kdTIDiABcRYbAivPwmIkX733NhSn5yMvXJQlBQwECvPzN1VwL0uaIAj4g_vtH_cTH0_y1r0gyBCH-cGVvN-3d5uD5OQrP9-rFglEllnpkrCR3onqRgkhhygjjAMDBi4bYVl7iwPDljYJe-BJ-zEd5-RDdW_MWlZ1MW-NdNp4llGB-0FzfGHV09zmqJfxzO9o_rKukbfujPGcyCiRFpVk17fUt_C4u5uKtTcHNyYylRJi6NyBpwWakep8CeMo4zllt3mMEqJBmlTEXP0LtKeyZzys5U3f_ZgkaiXaj5VFo6PntIpjPULw9gc1_ik0R_x6T0uRJWsC3E_Wr6cADKc17dryA1_TG65t8xQNFNZ-y_l41x4eMy9FGOW7sCouS7tyQRNbzVSieuzoiC9zZtITR-n3x5afkmHdLUcdqD7qwAwLOO4xTMNoVz2AJdEPJjrfa3IKezFRWxhWytWcw3CXaVR3uvDj1ZAOSDCgtM5Ozzj3Mv0ph9MdVsD4fxvuVMJhL-STiB4ARnk6OzihH8IV9iI7iG-hvdJ7ly9z0y-TIbqmepxr5GA0qfXxUDmfJ4VB0iKuqbjE62sL1b1jSbSuxDZwNB47fAVyU_F0yG3hgL7UgfEErT0u9wv2QEpnZeCSzggJoODrqfWjJ4rPgr7LRdl2eyi6qje2JkDfwe9Kww2Iv5uiWp1zzSJ7JjR7m-77msKBhn1n3HOuIF4W9MOT9HNB0sZXatpN6miF0GZpwHWPbG_ULCGqlWYnl42r4qTVthrwykVtv-sCZY4Q4AEutzjEoiiUnFVXhCE2eDTRM2XCumeFKt7dXMnVKKJXZYV04LYWJscx2vqEcnTMFHlB0RZIsahREHw-asF8LyJpJssYAUKbxSbvkNjszEZulL2SxQdCW2WL2e-SeKqaj5FPCYs71hox0QwuC5SGnER3W1KOwsKe1Xr2t-Drk8Z3I6Y4V7v3Uk9axr7pi0T6itb1HOQNjQer8p6WaA4Hhq9zW36Nik0CZ8wwNiWDpZJuwHDHCv-euuR_-SfEUkio4avLSvK2GAgGuXyQ3AYTYZKmzqwMLbUUm4geLmV04m_1vYS5JH3nzVndRV4BDvw5j6cCHmhnjIZh9jROI1Knf5CAMMxuH2tV2AWjG6LlJ6xk7tw7mV4vVWDSjMJX55i4gdMXOHniT-n1zyPwzs5xsue6yMEBlp8byh9Fz4vsryCKIuuETwpqE0f-kEiY2RQnqERItWJem3dRFuaihomNitVSg73hQ_LvWMaGgFFGZcCtNqgFjt2-1TGJf2jF09IzRwccKoY1Ac15IzHtSD7wGAonSOXRSuOaQ8g8Gw2MMHE6FBQmX7WZd0HEvakX0ry6CbeZRFtvIOgCNJQCs_DU0pX4jQVnS4UbbbH5t8-3Ez0YvWGqJq3CRvkhxErtgSBkqhUPBKDXG-19nvh1FXwPuvQkSgDFOKk_Jwqn7g5qDJfbfH2J6xsgd-rxETBH_g306voY5Et54XP40XmfZ