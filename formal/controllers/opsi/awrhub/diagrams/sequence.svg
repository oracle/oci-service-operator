ngthAdjust="spacing" textLength="192.165" x="753" y="2115.7803">UPDATING; delete DELETING</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="315.1299" x="753" y="2129.7803">follow-up: create=GetWorkRequest -&gt; GetAwrHub;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="255.2334" x="753" y="2143.7803">update=GetWorkRequest -&gt; GetAwrHub;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="135.0234" x="753" y="2157.7803">delete=confirm-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="273.1162" x="753" y="2171.7803">supported drift: displayName, freeformTags,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="77.0547" x="753" y="2185.7803">definedTags</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="230.3301" x="753" y="2199.7803">reject before mutate: force-new fields</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="301.9365" x="753" y="2213.7803">operationsInsightsWarehouseId, compartmentId,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="166.5371" x="753" y="2227.7803">objectStorageBucketName</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="144.751" x="753" y="2241.7803">create-only fields: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="227.2266" x="753" y="2255.7803">list lookup: oci_opsi_awr_hubs filters</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="301.9365" x="753" y="2269.7803">operationsInsightsWarehouseId, compartmentId,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="324.0918" x="753" y="2283.7803">displayName, objectStorageBucketName (+1 more);</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="238.1367" x="753" y="2297.7803">exact operationsInsightsWarehouseId,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="185.9648" x="753" y="2311.7803">compartmentId, displayName,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="290.2607" x="753" y="2325.7803">objectStorageBucketName, id match within the</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="238.123" x="753" y="2339.7803">resource scope; duplicate matches fail</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="753" y="2353.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="753" y="2367.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="258.3711" x="753" y="2381.7803">The production runtime uses the declared</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="279.3506" x="753" y="2395.7803">work-request phases and service-local async</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="51.3721" x="753" y="2409.7803">adapter.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="294.9229" x="753" y="2423.7803">Lifecycle success and pending states mirror the</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="244.3301" x="753" y="2437.7803">production service-manager semantics.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="251.3506" x="753" y="2451.7803">Status projection is required, Secret side</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="260.7021" x="753" y="2465.7803">effects are none, and the finalizer policy is</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="178.1924" x="753" y="2479.7803">retain-until-confirmed-delete.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="271.585" x="753" y="2493.7803">Delete ownership is retained until a terminal</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="226.4404" x="753" y="2507.7803">lifecycle state or confirmed absence.</text><?plantuml-src lLTRRnit5dxdho3QbmHhsN6JjAaCBv0utYQejrdO2VnY8A1cE18t53abELQqY_tl_Gulend5iXLiMlZ16bxEzJlVEVIVb6c54qlk5wAsAsNcl17QI-RxdPceFisTxKnzPhLr_FkcmbyzE57BHdGw_CEQy9jOIlv6wbiPL2NkFdEb_YFvyRF1fd3EhhBq9ytnJpyCRneRvAilR6YQd-eVjqzPLqkNJyoUFN_wvEUj4wG-xpzz-kpu-VF1VXHVMMUauyS_ig22blnA_jv9Kqa-uRRrwkZbohtfPcoXQiaRQyFCVXw8yENqVnddeWhMZKpAhfMjRP_a3_95ymJR48RegLQOSFVzuO5zf0pSxcLerSWBPSP1-_cPU3fxWLqIsOwsgbdzN1xtMryav4KZcehzZqNV-A_TJ2AIGNesi8EVmH1djPPkjFnAU7afAsigjRtrtRkhTxzUINUhAlbFOSHSkk-uy7oyDBhoxkmjesHpUujKZcKVRDq3x9sikPFUwYueQwPvwQXMOewS-gFqFTaScPGq7_hRUP5GImrlTzvEs-ERqjGHb6mJB3xv-o16KouDpdUI9zZ1pEm7snoYAsCVfxp__SYHGXyUi_4HkZIEn7GZ7BvuHJvbiCU4ymjhF-6VWD4pPMecTE310GOuY8JBpwr60cBqEQh3e7xMN6WdHRt6hlB1ix5ACWAdf_mN6R8g2UhffVPIbETBvJt8QPU42uXF8loZHkaWdP_U6DjA9oXZ_gtnQhu8_Xh9MDZEoxVrmOsfx99miuGQVFDQ-LQBDL4ODktitx8ALm0pDBtgO54YjqT_E-PBw-JZnp44JdPUp10qyfimqZdKFon6Pi4GA91TDfyXD45cnxMrBQ_Y2cy132BYiylpb-_V_lRB7c63bXYwkwtvwYpSOVGTA4DqFGIcuhb5maQfLuRx84BdepWALQe1dY4fwmoirt5vbrLfDnksumnCQfHR5WMtIcoS0JPlp00UATBvP8dqw_EByxqYJKWV2YkkLLeA0r-mtIWZD3gSWwDOzH4CCsq9qlj4rSaW4Bji8OLGngB3kbkdBESzWYz-0D_SpZmaxwiWcRKnL3Gec2-b9bWLQ55oapNm9nf3GDjFOIAnrKBro5p2Hm-Ct9Y2yWF-uL-lywy-7r6pLhSb42GArEHXlDJrHAnG