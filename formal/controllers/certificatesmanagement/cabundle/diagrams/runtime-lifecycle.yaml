schemaVersion: 1
surface: repo-authored-semantics
service: certificatesmanagement
slug: cabundle
kind: CaBundle
archetype: generated-service-manager
states:
  - provisioning
  - active
  - updating
  - terminating
repoAuthored:
  providerLifecycle:
    createPending: ["CREATING"]
    updatePending: ["UPDATING"]
    deletePending: ["DELETING"]
  listLookup:
    filters: ["caBundleId","compartmentId","name","state"]
    matchRule: exact resource identity match; duplicate matches fail
  mutation:
    mutable: ["caBundlePem","compartmentId","definedTags","description","freeformTags"]
    forceNew: ["name"]
  followUp:
    create: read-after-write
    update: read-after-write
    delete: confirm-delete
notes:
  - "The CaBundle runtime retains package-local lifecycle, identity, mutation, and delete handling."
  - "The credential-free evidence mock verifies the recorded create/update payloads, SDK response decoding, status projection, and delete confirmation."
