just="spacing" textLength="279.3506" x="777" y="2129.7803">work-request phases and service-local async</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="51.3721" x="777" y="2143.7803">adapter.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="294.9229" x="777" y="2157.7803">Lifecycle success and pending states mirror the</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="244.3301" x="777" y="2171.7803">production service-manager semantics.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="251.3506" x="777" y="2185.7803">Status projection is required, Secret side</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="260.7021" x="777" y="2199.7803">effects are none, and the finalizer policy is</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="178.1924" x="777" y="2213.7803">retain-until-confirmed-delete.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="271.585" x="777" y="2227.7803">Delete ownership is retained until a terminal</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="226.4404" x="777" y="2241.7803">lifecycle state or confirmed absence.</text><?plantuml-src hLTRSnCt57xNhpZJli3KJWWaNCpG6KWePGZGIM3wuXTvLskBhAMjfBLnE_tl_QILzkBOmRGTPiXQbtFzpdUEx8rK5JTyINR1SxsMQau5BwrWjjsPyUncRdIjydDTQaC_5Xd-vRqJkIXuNRfVj78V-5BGhw9S2ISplllCjVnJqCbfRvCRezTH-eFYvCd3_asbdNXrouQYU98_tZwbJIvCF34xFNlquDdM2Qy-xZzwT7foTjRR3-8pRPGmTFAOEUbAGTVYZrgeJD2ObbpnkLWAvV17kUCBxlYrhaqcs4BcWWgjtKn_xKcqwV9VZ8XdJfk1XT7JjBNjedWedXOFi0rX2AQik7Axx_SF72Ab5uLMHYaBSIdLC8RFJlcZsLFiUf7LO2kRvMVYfDswbP-d1IyozZSBlj6xUYOGM2Siwzb1vp34wB8KPh3yYbjn9JAjChczzSF7wu_lheLPoKoy3manFn2tD5mQNFbu_fRvt9DU8RD3sQEjUwW28t8omkgoTbAhILm