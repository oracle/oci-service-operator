before mutate: force-new fields</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="207.0195" x="812" y="2115.7803">managementAgentId, name, type</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="144.751" x="812" y="2129.7803">create-only fields: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="66.1445" x="812" y="2143.7803">list lookup:</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="313.6396" x="812" y="2157.7803">oci_management_agent_named_credentials filters</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="214.0195" x="812" y="2171.7803">managementAgentId, name; exact</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="277.8262" x="812" y="2185.7803">managementAgentId, name match within the</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="238.123" x="812" y="2199.7803">resource scope; duplicate matches fail</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="812" y="2213.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="812" y="2227.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="258.3711" x="812" y="2241.7803">The production runtime uses the declared</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="279.3506" x="812" y="2255.7803">work-request phases and service-local async</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="51.3721" x="812" y="2269.7803">adapter.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="294.9229" x="812" y="2283.7803">Lifecycle success and pending states mirror the</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="244.3301" x="812" y="2297.7803">production service-manager semantics.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="251.3506" x="812" y="2311.7803">Status projection is required, Secret side</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="260.7021" x="812" y="2325.7803">effects are none, and the finalizer policy is</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="178.1924" x="812" y="2339.7803">retain-until-confirmed-delete.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="271.585" x="812" y="2353.7803">Delete ownership is retained until a terminal</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="226.4404" x="812" y="2367.7803">lifecycle state or confirmed absence.</text><?plantuml-src jLTRRzis57xdho2sbmsmacPjjzP11dHfjnNBrg5ftmmKj4JPN6LI8ocxth3_lk_m8icAlQMx80-nnCDp_SvtZjnxfLjXnOQxjQZCJkaLhqNZ97FzoLAKxrVMTBgwDesn_DEwn5yragXaBRh6Vskq_qbi9FzUDblfLIcEozogtoI_U3Gw5DQQNTB-eBxuwelnJMsy_EQE3tNzLVNbLChOIjeaiNpq-E63fnC9Cf_E7pvyTF7uyUWyg2-DrTBoYo-PLxwH_5R-sabTIbxmZT1Y9JTIU_pJ_fn2hQwjhF2WHCFMgfAyDiOlpOUHMfSr_Cuu5wKtzi3D56u-ciOflv1FwWSuXZ9aLBL2--FtnmBtqJ9AHQ-ZKRMyKVemaKyVYOVB9pWbbUt1KRci7ikB_kXEaPxKeYxP7op4nd_ebXBPzTAnaH_y6evOqpJI7hp-HZZvMfP6bsfwzCchsrS_t4gxLQNyCLJ5ViA5uuUl3gwykdx9203SR57UGzspoJsq0ghAhNIcwRmoUfvUdLTAh51JTnwVYq6ao6K-SzjLrb391j6Ul1sF3szANGMWiY5PlFXwbACvbnhodUGJ_C7V510RfEdkOR1ptl_-p99bvpzdXo9qwJ0byq4vWdAAWfl2Fq20tnZp7ly4mbWgNJ7HUEujW84RW83yq3OeIQW7L-6gttFHM2cgFKwLyuuTsYPl83tdtqa_jId1LBtwNfroVAES0vUTKdK3EnDTxhDQDLvQDr_eeTEVKQU_h6PSG_hp48sLdHDB9892801q5iqD