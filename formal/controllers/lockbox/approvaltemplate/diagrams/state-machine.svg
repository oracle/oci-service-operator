ica" font-size="14" lengthAdjust="spacing" textLength="283.2129" x="2285.78" y="476.7803">real OCI SDK through the full CRUD lifecycle.</text></g><g class="entity" data-qualified-name="GMN5" data-source-line="88" id="ent0006"><path d="M2967.27,544 L2967.27,558.89 L2507.43,542.26 L2967.27,566.89 L2967.27,594 A8,8 0 0 0 2975.27,602 L3232.4067,602 A8,8 0 0 0 3240.4067,594 L3240.4067,546 L3230.4067,536 L2975.27,536 A8,8 0 0 0 2967.27,544" fill="#FFF7D6" style="stroke:#B45309;stroke-width:0.5;"/><path d="M3230.4067,536 L3230.4067,542 A4,4 0 0 0 3234.4067,546 L3240.4067,546 L3230.4067,536" fill="#FFF7D6" style="stroke:#B45309;stroke-width:0.5;"/><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="136.9717" x="2973.27" y="551.7803">delete policy: required</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="252.1367" x="2973.27" y="565.7803">delete observe: GetApprovalTemplate or</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="135.3994" x="2973.27" y="579.7803">ListApprovalTemplate</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="157.1855" x="2973.27" y="593.7803">delete targets: DELETED</text></g><!--link *start* to observe--><g class="link" data-entity-1="ent0002" data-entity-2="ent0002" data-link-type="dependency" data-source-line="32" id="lnk3"><path d="M26.19,454 C56.71,454 151.61,454 236.96,454" fill="none" id="*start*-to-observe" style="stroke:#0F172A;stroke-width:1;"/><polygon fill="#0F172A" points="242.96,454,233.96,450,237.96,454,233.96,458,242.96,454" style="stroke:#0F172A;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="155.6338" x="57" y="449.7803">CreateApprovalTemplate</text></g><!--link observe to resolve_by_lookup--><g class="link" data-entity-1="ent0002" data-entity-2="ent0007" data-link-type="depend