schemaVersion: 1
surface: repo-authored-semantics
service: lockbox
slug: lockbox
kind: Lockbox
archetype: generated-service-manager
states:
  - provisioning
  - active
  - updating
  - terminating
repoAuthored:
  providerLifecycle:
    createPending: ["CREATING"]
    updatePending: ["UPDATING"]
    deletePending: ["DELETING"]
  listLookup:
    filters: ["compartmentId","lockboxPartner","partnerId","resourceId"]
    matchRule: exact resource identity match; duplicate matches fail
  mutation:
    mutable: ["approvalTemplateId","definedTags","displayName","freeformTags","maxAccessDuration"]
    forceNew: ["accessContextAttributes","compartmentId","lockboxPartner","partnerCompartmentId","partnerId","resourceId"]
  followUp:
    create: read-after-write
    update: read-after-write
    delete: confirm-delete
notes:
  - "The runtime uses its declared lifecycle-state contract for Lockbox reconciliation."
  - "The credential-free mock exercises SDK request serialization, response projection, mutation when supported, and confirmed deletion."
