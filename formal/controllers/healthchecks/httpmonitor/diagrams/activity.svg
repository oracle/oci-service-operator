,867.5852,953" style="stroke:#1D4ED8;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="21.7861" x="997.1682" y="987.7803">yes</text><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="251.166" x="867.5852" y="968.7803">"Force-new or conflicting drift detected?"</text><polygon fill="#E2E8F0" points="882.7405,1135.5,1103.5959,1135.5,1115.5959,1147.5,1103.5959,1159.5,882.7405,1159.5,870.7405,1147.5,882.7405,1135.5" style="stroke:#1D4ED8;stroke-width:0.5;"/><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="220.8555" x="882.7405" y="1151.2803">"Supported mutable drift detected?"</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="21.7861" x="848.9543" y="1144.2803">yes</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="15.5723" x="1115.5959" y="1144.2803">no</text><rect fill="#F8FAFC" height="62" rx="8" ry="8" style="stroke:#0F172A;stroke-width:0.5;" width="317.2471" x="695.4814" y="1169.5"/><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="259.9092" x="705.4814" y="1190.2803">Apply UpdateHttpMonitor only for mutable</text><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="297.2471" x="705.4814" y="1204.2803">fields definedTags, displayName, freeformTags,</text><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="115.5547" x="705.4814" y="1218.2803">headers (+9 more)</text><rect fill="#F8FAFC" height="34" rx="8" ry="8" style="stroke:#0F172A;stroke-width:0.5;" width="199.0059" x="1032.7285" y="1169.5"/><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="179.0059" x="1042.7285" y="1190.2803">Skip the no-op mutation path</text><polygon fill="#E2E8F0" point