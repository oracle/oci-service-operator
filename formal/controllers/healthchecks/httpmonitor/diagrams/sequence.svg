xt><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="276.1309" x="442.1982" y="1038.7803">[force-new or conflicting drift is detected]</text><g class="message" data-entity-1="part4" data-entity-2="part3" id="msg13"><polygon fill="#0F172A" points="437.4565,1058,427.4565,1062,437.4565,1066,433.4565,1062" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;stroke-dasharray:2,2;" x1="431.4565" x2="693.0347" y1="1062" y2="1062"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="164.1855" x="443.4565" y="1056.7803">reject before OCI mutation</text></g><path d="M613.8384,1084 L672.604,1084 L672.604,1090 L662.604,1100 L605.8384,1100 L605.8384,1092 A8,8 0 0 1 613.8384,1084" fill="#F8FAFC" style="stroke:#CBD5E1;stroke-width:1.5;"/><rect fill="none" height="86" rx="8" ry="8" style="stroke:#CBD5E1;stroke-width:1.5;" width="371.9644" x="605.8384" y="1084"/><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="21.7656" x="620.8384" y="1095.7803">opt</text><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="243.4619" x="687.604" y="1096.7803">[supported mutable drift is detected]</text><g class="message" data-entity-1="part4" data-entity-2="part5" id="msg14"><polygon fill="#0F172A" points="936.3579,1158,946.3579,1162,936.3579,1166,940.3579,1162" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="694.0347" x2="942.3579" y1="1162" y2="1162"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="206.2129" x="701.0347" y="1114.7803">Apply UpdateHttpMonitor only for</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="171.2129" x="701.0347" y="1128.7803">mutable fields definedTags,</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="230.3232" x="701.0347" y="1142.7803">displayName, freeformTags, headers</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="61.0723" x="701.0347" y="1156.7803">(+9 more)</text></g><g class="message" data-entity-1="part4" data-entity-2="part5" id="msg15"><polygon fill="#0F172A" points="936.3579,1235,946.3579,1239,936.3579,1243,940.3579,1239" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="694.0347" x2="942.3579" y1="1239" y2="1239"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.2891" x="701.0347" y="1191.7803">run helper hooks</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="219.0508" x="701.0347" y="1205.7803">create=tfresource.CreateResource;</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="226.085" x="701.0347" y="1219.7803">update=tfresource.UpdateResource;</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="212.8438" x="701.0347" y="1233.7803">delete=tfresource.DeleteResource</text></g><g class="message" data-entity-1="part4" data-entity-2="part5" id="msg16"><polygon fill="#0F172A" points="936.3579,1305,946.3579,1309,936.3579,1313,940.3579,1309" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="694.0347" x2="942.3579" y1="1309" y2="1309"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="147.0752" x="701.0347" y="1261.7803">apply follow-up strategy</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="145.8926" x="701.0347" y="1275.7803">create=read-after-write;</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="149.8027" x="701.0347" y="1289.7803">update=read-after-write;</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="135.0234" x="701.0347" y="1303.7803">delete=confirm-delete</text></g><g class="message" data-entity-1="part4" data-entity-2="part3" id="msg17"><polygon fill="#0F172A" points="437.4565,1354,427.4565,1358,437.4565,1362,433.4565,1358" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;stroke-dasharray:2,2;" x1="431.4565" x2="693.0347" y1="1358" y2="1358"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="100.7822" x="443.4565" y="1338.7803">status=required,</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="230.7197" x="443.4565" y="1352.7803">finalizer=retain-until-confirmed-delete</text></g><g class="message" data-entity-1="part3" data-entity-2="part2" id="msg18"><polygon fill="#0F172A" points="269.4712,1389,259.4712,1393,269.4712,1397,265.4712,1393" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;stroke-dasharray:2,2;" x1="263.4712" x2="425.4565" y1="1393" y2="1393"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="143.9854" x="275.4712" y="1387.7803">requeue on terminating</text></g><path d="M699,1414 L699,2150 A8,8 0 0 0 707,2158 L1045,2158 A8,8 0 0 0 1053,2150 L1053,1416 L1043,1406 L707,1406 A8,8 0 0 0 699,1414" fill="#FFF7D6" style="stroke:#B45309;stroke-width:0.5;"/><path d="M1043,1406 L1043,1412 A4,4 0 0 0 1047,1416 L1053,1416 L1043,1406" fill="#FFF7D6" style="stroke:#B45309;stroke-width:0.5;"/><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="101.165" x="705" y="1421.7803">shared diagram:</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="307.3916" x="705" y="1435.7803">shared/diagrams/shared-resolution-sequence.svg</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="143.1992" x="705" y="1449.7803">shared delete diagram:</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="284.833" x="705" y="1463.7803">shared/diagrams/shared-delete-sequence.svg</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="280.9297" x="705" y="1477.7803">Start from the shared resolution sequence for</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="260.7295" x="705" y="1491.7803">OCID binding, datasource pagination, and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="163.4268" x="705" y="1505.7803">create-or-update dispatch.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="301.1982" x="705" y="1519.7803">Layer the shared delete sequence when finalizer</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="269.2471" x="705" y="1533.7803">retention, delete confirmation, work-request</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="199.2334" x="705" y="1547.7803">polling, or Secret cleanup apply.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="281.709" x="705" y="1561.7803">archetype batch: Generated service-manager</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="266.1504" x="705" y="1575.7803">controllers follow the shared resolution and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="259.9297" x="705" y="1589.7803">delete sequences with imported waits and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="134.6064" x="705" y="1603.7803">controller-local policy.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="133.8408" x="705" y="1617.7803">service: healthchecks</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="103.4961" x="705" y="1631.7803">slug: httpmonitor</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="105.8203" x="705" y="1645.7803">kind: HttpMonitor</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="241.2402" x="705" y="1659.7803">archetype: generated-service-manager</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="156.4063" x="705" y="1673.7803">status/finalizer: required /</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="174.3027" x="705" y="1687.7803">retain-until-confirmed-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="128.4131" x="705" y="1701.7803">requeue: terminating</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="263.0674" x="705" y="1715.7803">provider states: create none; update none;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="73.1787" x="705" y="1729.7803">delete none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="209.6992" x="705" y="1743.7803">follow-up: create=read-after-write;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="288.7158" x="705" y="1757.7803">update=read-after-write; delete=confirm-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="266.9229" x="705" y="1771.7803">supported drift: definedTags, displayName,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="206.582" x="705" y="1785.7803">freeformTags, headers (+9 more)</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="230.3301" x="705" y="1799.7803">reject before mutate: force-new fields</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="93.3721" x="705" y="1813.7803">compartmentId</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="144.751" x="705" y="1827.7803">create-only fields: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="277.8262" x="705" y="1841.7803">list lookup: oci_health_checks_http_monitors</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="280.8887" x="705" y="1855.7803">filters compartmentId, displayName, protocol,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="244.3643" x="705" y="1869.7803">id; paginated exact compartmentId plus</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="275.4609" x="705" y="1883.7803">displayName and protocol match; tracked ID</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="206.9922" x="705" y="1897.7803">disambiguates existing resources</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="705" y="1911.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="705" y="1925.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="284.0127" x="705" y="1939.7803">HttpMonitor has no SDK lifecycle field. Create</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="294.2188" x="705" y="1953.7803">and update settle through a readable response,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="285.9404" x="705" y="1967.7803">including correction of OCI's default isEnabled</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="270.7852" x="705" y="1981.7803">value when the desired CR explicitly carries</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="33.4619" x="705" y="1995.7803">false.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="291.0195" x="705" y="2009.7803">All UpdateHttpMonitorDetails fields reconcile in</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="333.8398" x="705" y="2023.7803">place. The separate ChangeHttpMonitorCompartment</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="304.2676" x="705" y="2037.7803">action remains unpublished, so compartmentId is</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="111.2754" x="705" y="2051.7803">replacement-only.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="287.9775" x="705" y="2065.7803">Pre-create reuse is paginated and bounded by</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="270.7988" x="705" y="2079.7803">compartmentId, displayName, protocol, and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="67.6895" x="705" y="2093.7803">tracked ID.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="226.4609" x="705" y="2107.7803">Delete is best-effort, but the retained</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="294.9639" x="705" y="2121.7803">resource-local guard treats an auth-shaped 404</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="305.0674" x="705" y="2135.7803">as ambiguous until a scoped list proves absence.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="203.1025" x="705" y="2149.7803">There are no Secret side effects.</text><?plantuml-src fLXjZzGs4FxkNs7H3mNriiULeuL5L2ftRK50gJZwxIJaJPoDUuwTsiukswh_lSyupjlUBfnQeHERU3oUbsUU6SVVADC89shkAr7OhJ9hNWhj9VF3oahaDsjdMrDSM6qT_whCyQ-OI1Io5AqEFriJVXMrv2-btiYWSd5Ovahz9VdP-MHHE6UtIVl3ykpxRwSxZGtonIqRolBxuhjzAUiAwPB4wlpneuTFzoJe-BJ-wD7vsUF7a_MeFhVEICVFlcD11ItvbVopbIQNFEEL53fKUINp6t_wCeJchJKgMCSgLKXUMXjMzjD4d--t_iqu5paaP_ObF_kbVGVbj_99-H3BK8PGgaQOS7Z_LE0kMYOn67HeLSetoimZ-FHSF5ezmIgfR6PB-QfuBC-6fLlPULAACcV_iEWRVzsk9C8Qf6SJE_W5375MQ-bchry8Bz_Bt9fSxI_TUtVrxlMLT1kLoxV2YBLqzxZmVFvgjkNTnIj6cUTsWxpETP_ixKCDE5bm9xtLRL3MBDEhqqA9DNBgJxldR1J9-ZGl_6RTQoYaXhT7TtVByvtI516XR0mMptwOn6Z9fO5yY_8QiGTRapDibAHzSqUNVFXztz6fFZnWSn7QD0_7SbGEXxmYnwQmZwddRwozmNy2vg-KAHXgX0S7G40QzibFZKOgOXuuwiIWh7PSQ2T5iSEgyi6p-Rba2QIN_1SPfkT9qDAWUb2bFA-Lzo2kOshUu8o97d-_L3f8vvVN9hSrOQM6hbV52I-KRxJO4OUTN9l6sM1pgqzms8FebvEj5ok4WvmX2BGEvGqBa3WG0F1_p8OB-1laBMyEA_nlqJbm-04SD70SMZkCRn38MLwKuJw8qFgeZbpkeCeJQ6IHiduPNnyphLkTMdT447QLojNzAHibzjm2XAxDVWAZORcMmi0Io9JA28sUGjM0jpwcPAKj0UKkCN4o27YUZA00o8Xdl7UxBb5fZV227oXxRbSUckzwG6VMQAWeWS3RMcFOunyTgjMcDuVYZmBqK25raOajUEJQ54wLWSkDqAs8srDoukiABcWgYv7zvgQU43LUjKrZ7HBBswQWatphIf7B9JLiD8JYWrZx4pQj35uwAKlhwhX4RH5zmVFxtpnbjNNo0Nil_v1vu2iIahnkoOCbwWFOpepSTZvuDYi-bdYahqq-Bysv0TFAx3VM8kGLt0N4nHfn9fVa9_IV-JcyqQsV5ZfbclKAEotF1fPvTKcYebwfDIACzXLBaeQalbZzIDos2HCdWKj2DyWlodUf0YuBP3mFTyNDD91KgJ6OFL3eG3_aZvQ8IhvyKYg-7vj6x_ZlCUspaZDuNLBXzIgxXCqG0V1z4HBN1fZW7IRaSMvqhS4E3MRY5NA9RNbao-UXxAEywFZpVNfyTcqwj4v5Ea