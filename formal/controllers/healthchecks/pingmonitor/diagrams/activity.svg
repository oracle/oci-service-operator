I state against the</text><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="195.3369" x="858.9263" y="1078.7803">repo-authored mutation surface</text><rect fill="#F8FAFC" height="48" rx="8" ry="8" style="stroke:#0F172A;stroke-width:0.5;" width="302.4473" x="816.6436" y="1161"/><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="282.4473" x="826.6436" y="1181.7803">Reject drift before OCI mutation for force-new</text><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="129.9443" x="826.6436" y="1195.7803">fields compartmentId</text><ellipse cx="967.8672" cy="1241.5" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="967.8672" cy="1241.5" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#E2E8F0" points="842.2842,1112,1093.4502,1112,1105.4502,1124,1093.4502,1136,842.2842,1136,830.2842,1124,842.2842,1112" style="stroke:#1D4ED8;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="21.7861" x="971.8672" y="1146.7803">yes</text><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="251.166" x="842.2842" y="1127.7803">"Force-new or conflicting drift detected?"</text><polygon fill="#E2E8F0" points="857.4395,1294.5,1078.2949,1294.5,1090.2949,1306.5,1078.2949,1318.5,857.4395,1318.5,845.4395,1306.5,857.4395,1294.5" style="stroke:#1D4ED8;stroke-width:0.5;"/><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="220.8555" x="857.4395" y="1310.2803">"Supported mutable drift detected?"</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="21.7861" x="823.6533" y="1303.2803">yes</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="15.5723" x="1090.2949" y="1303.2803">no</text><rect fill="#F8FAFC" height="76" rx="8" ry="8" style="stroke:#0F172A;stroke-width:0.5;" width="279.916" x="695.4814" y="1328.5"/><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="251.3506" x="705.4814" y="1349.2803">Apply ChangePingMonitorCompartment,</text><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="259.916" x="705.4814" y="1363.2803">UpdatePingMonitor only for mutable fields</text><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="212.4473" x="705.4814" y="1377.2803">targets, vantagePointNames, port,</text><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="177.0303" x="705.4814" y="1391.2803">timeoutInSeconds (+6 more)</text><rect fill="#F8FAFC" height="34" rx="8" ry="8" style="stroke:#0F172A;stroke-width:0.5;" width="199.0059" x="1000.792" y="1328.5"/><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="179.0059" x="1010.792" y="1349.2803">Skip the no-op mutation path</text><polygon fill="#E2E8F0" points="967.8672,1410.5,979.8672,1422.5,967.8672,1434.5,955.8672,1422.5,967.8672,1410.5" style="stroke:#1D4ED8;stroke-width:0.5;"/><rect fill="#F8FAFC" height="104" rx="8" ry="8" style="stroke:#0F172A;stroke-width:0.5;" width="293.5537" x="821.0903" y="1454.5"/><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="164.2061" x="831.0903" y="1475.2803">Run provider helper hooks</text><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="219.0508" x="831.0903" y="1489.2803">create=tfresource.CreateResource;</text><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="226.085" x="831.0903" y="1503.2803">update=tfresource.UpdateResource,</text><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="