<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="2503px" preserveAspectRatio="none" style="width:1270px;height:2503px;background:#FCFCFD;" version="1.1" viewBox="0 0 1270 2503" width="1270px" zoomAndPan="magnify"><title>Activity - aidocument/Project</title><defs/><g><rect fill="#FCFCFD" height="2503" style="stroke:none;stroke-width:1;" width="1270" x="0" y="0"/><g class="title" data-source-line="10"><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="192.9307" x="537.1914" y="30.7803">Activity - aidocument/Project</text></g><ellipse cx="672.2983" cy="55" fill="#1D4ED8" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="none" height="444" rx="8" ry="8" style="stroke:#000000;stroke-width:1.5;" width="673.4668" x="342.7666" y="75"/><path d="M464.835,75 L464.835,82 L454.835,92 L342.7666,92" fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="112.0684" x="345.7666" y="86.7803">Observe and Bind</text><rect fill="#F8FAFC" height="48" rx="8" ry="8" style="stroke:#0F172A;stroke-width:0.5;" width="304.7852" x="519.9058" y="109"/><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="136.9375" x="529.9058" y="129.7803">Start from shared flow</text><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="284.7852" x="529.9058" y="143.7803">shared/diagrams/shared-reconcile-activity.svg</text><rect fill="#F8FAFC" height="48" rx="8" ry="8" style="stroke:#0F172A;stroke-width:0.5;" width="310.2676" x="517.1646" y="177"/><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="290.2676" x="527.1646" y="197.7803">Read desired Project spec, tracked status, and</text><text fill="#0F