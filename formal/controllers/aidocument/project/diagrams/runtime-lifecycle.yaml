schemaVersion: 1
surface: repo-authored-semantics
service: aidocument
slug: project
kind: Project
archetype: generated-service-manager
states:
  - provisioning
  - active
  - updating
  - terminating
repoAuthored:
  mutation:
    mutable:
      - description
      - display_name
    forceNew:
      - compartment_id
      - defined_tags
      - freeform_tags
  hooks:
    create:
      - helper: tfresource.CreateResource
    update:
      - helper: tfresource.UpdateResource
    delete:
      - helper: tfresource.DeleteResource
  followUp:
    create: read-after-write
    update: read-after-write
    delete: confirm-delete
notes:
  - Generated runtime uses read-after-write follow-up for create and update plus
    confirm-delete for delete; `CREATING` maps to provisioning, `ACTIVE` to
    success, `UPDATING` to updating, and `DELETING` keeps reconcile in the
    terminating bucket until `DELETED` or NotFound.
  - Pre-create lookup queries `ListProjects` with `compartmentId`,
    `displayName`, and an optional tracked `id`; delete fallback can re-resolve
    the tracked project through `ListProjects` when `GetProject` returns
    NotFound.
  - Only `displayName` and `description` reconcile in place. Live OCI
    `UpdateProject` accepts tag fields but does not change them, so
    `freeformTags` and `definedTags` join `compartmentId` as replacement-only
    drift. The runtime has no secret side effects.
