lengthAdjust="spacing" textLength="134.6064" x="759" y="1589.7803">controller-local policy.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="128.3789" x="759" y="1603.7803">service: marketplace</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="157.2129" x="759" y="1617.7803">slug: acceptedagreement</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="160.3164" x="759" y="1631.7803">kind: AcceptedAgreement</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="241.2402" x="759" y="1645.7803">archetype: generated-service-manager</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="156.4063" x="759" y="1659.7803">status/finalizer: required /</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="174.3027" x="759" y="1673.7803">retain-until-confirmed-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="128.4131" x="759" y="1687.7803">requeue: terminating</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="263.0674" x="759" y="1701.7803">provider states: create none; update none;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="73.1787" x="759" y="1715.7803">delete none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="209.6992" x="759" y="1729.7803">follow-up: create=read-after-write;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="288.7158" x="759" y="1743.7803">update=read-after-write; delete=confirm-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="266.9229" x="759" y="1757.7803">supported drift: definedTags, displayName,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="83.248" x="759" y="1771.7803">freeformTags</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="230.3301" x="759" y="1785.7803">reject before mutate: force-new fields</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="238.8955" x="759" y="1799.7803">agreementId, compartmentId, listingId,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="165.3613" x="759" y="1813.7803">packageVersion (+1 more)</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="144.751" x="759" y="1827.7803">create-only fields: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="318.2949" x="759" y="1841.7803">list lookup: oci_marketplace_accepted_agreements</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="309.6885" x="759" y="1855.7803">filters agreementId, compartmentId, displayName,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="272.7402" x="759" y="1869.7803">listingId (+1 more); exact agreement identity</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="180.5303" x="759" y="1883.7803">match; duplicate matches fail</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="759" y="1897.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="759" y="1911.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="272.3643" x="759" y="1925.7803">AcceptedAgreement reuses an existing OCI</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="310.4951" x="759" y="1939.7803">agreement before create by exact compartmentId,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="269.2813" x="759" y="1953.7803">listingId, packageVersion, and agreementId</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="284.792" x="759" y="1967.7803">match, with displayName narrowing when set.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="316.75" x="759" y="1981.7803">OCI accepted agreement responses do not expose</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="292.6055" x="759" y="1995.7803">lifecycle state, so successful create and update</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="290.2129" x="759" y="2009.7803">normalize directly to Active from the immediate</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="95.7305" x="759" y="2023.7803">response body.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="276.2539" x="759" y="2037.7803">In-place updates are limited to displayName,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="285.6055" x="759" y="2051.7803">definedTags, and freeformTags; agreementId,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="287.9365" x="759" y="2065.7803">compartmentId, listingId, packageVersion, and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="196.8818" x="759" y="2079.7803">signature are replacement-only.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="231.0957" x="759" y="2093.7803">The controller mirrors the last applied</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="308.9707" x="759" y="2107.7803">signature at status.appliedSignature because OCI</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="291.8535" x="759" y="2121.7803">read models never return the signature needed</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="141.5996" x="759" y="2135.7803">for explicit drift checks.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="191.4336" x="759" y="2149.7803">Delete retains the finalizer until</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="255.2539" x="759" y="2163.7803">DeleteAcceptedAgreement is followed by</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="274.7295" x="759" y="2177.7803">GetAcceptedAgreement returning not found.</text><?plantuml-src lLZRZjms4dtdLn3P5nlRwl74TkBqm04S6xinuiI09xjF0nXigTJDZ4HgIQhRlOlyUqvHrAqlam42B0R6Z7YfwwbJHVjxRHhbL2tzLXLshyr6bgho9FomirRv_SRPrXHlRMMT_5kPuwUOd2YeL6qL_c5D-4NL97-aQaT1v-hycLlzNvBNBoQRoZcxJzAVbTVVVZszQMoW7qviACjlYs-EJrbNa4idrYzUFd_stT49Lf_sdpz_SVtovMG_Yi-jC-JazJSYw52HlAN_j6HoafcibRkdq5GgfwitUKvDeEBDnX7LP8BOwe9aQMrOsoyJeRw__pyXfSg3TJCZaxFzrh6Nz3MzAfzX6y8GJzqe4yxVdnvuZ9H980OPbIxfWpRpC7xtGZrVly8kYsncM_cwU4dNmzP9YbwLgip5xoBw9dzgruJO1l9YOeTy2qEShIfoi-KVbATFb5kJw-EjhpxUVlpfbjnEv_IpCcf3xYkfl9mlpQvyVFjUSFgbtI6vSzcBetie14U5TEHjrGPjpIejNHLQRP1JVzLzP-EHh4_pqkyslOI2AdXxyNQtFRz9feWm5MEmPFRz94OhIGRdMv8d28J5oIKndkVRStTNSlZxYMFTFZmLyoDyQHwKrIWSRddDxfsMG8I1_63jFNufkBBMfX2g2Z8uW0Dt00FwqbH8Iyo9HCqOrDb1gigHAWxOrJvuCTVEzk3qIlwJmgbM0biD2WQ1sijQUmy-koJi0pITIFDFIbq5SdvrXzDfyNsnaBcj6L3fyyuKseC93ant2nIE3z3qlf1F_dujQ-lewTFejwFMgpM2niuo