="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="151.7441" x="827" y="2115.7803">requested compartment.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="827" y="2129.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="827" y="2143.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="356.3506" x="827" y="2157.7803">CREATING and UPDATING requeue, ACTIVE succeeds,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="277.0059" x="827" y="2171.7803">and DELETING retains the finalizer until OCI</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="203.8955" x="827" y="2185.7803">reports the saved search absent.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="311.2471" x="827" y="2199.7803">CompartmentId is replacement-only; name, query,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="274.7158" x="827" y="2213.7803">description, and tag fields reconcile in place.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="308.9092" x="827" y="2227.7803">The runtime projects the OCI saved-search status</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="267.7227" x="827" y="2241.7803">and has no Kubernetes Secret side effects.</text><?plantuml-src fLXRRzis57xdho2wbnQpagPDUd7G0McITK6pfeZJFWKeQ8cokSYaHb9slM7_VHzligJOQzeX3x75mtFzpdUEREw4h9bc2shch50h8MUqP9NXnBGdKvRVpRHgP76gAgNfJsMElw8ZKV2IDPNzLKdxWIqu_OrNIsv5phRBJCHVd1uSTWwPrceLjJyj3ru-wzwKolAtztmeovV5Yw6KqWNNKM9wUFJywUk1X3CVpvy_FpmuEkgSU_Mvqf9hUl22M64hJYVypuRBdDECLcesGtxsBzLimfQyc72cypcPYuBJK