Helvetica" font-size="14" lengthAdjust="spacing" textLength="156.4063" x="796" y="2115.7803">status/finalizer: required /</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="174.3027" x="796" y="2129.7803">retain-until-confirmed-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="272.3984" x="796" y="2143.7803">requeue: provisioning, updating, terminating</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="265.3369" x="796" y="2157.7803">provider states: create CREATING; update</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="192.165" x="796" y="2171.7803">UPDATING; delete DELETING</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="234.9922" x="796" y="2185.7803">follow-up: create=GetWorkRequest -&gt;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="277.792" x="796" y="2199.7803">read-after-write; update=GetWorkRequest -&gt;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="273.1162" x="796" y="2213.7803">read-after-write; delete=GetWorkRequest -&gt;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="88.7031" x="796" y="2227.7803">confirm-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="273.9092" x="796" y="2241.7803">supported drift: emBridgeId, compartmentId,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="168.082" x="796" y="2255.7803">freeformTags, definedTags</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="230.3301" x="796" y="2269.7803">reject before mutate: force-new fields</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="285.5986" x="796" y="2283.7803">operationsInsightsWarehouseId, displayName</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="144.751" x="796" y="2297.7803">create-only fields: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="279.3574" x="796" y="2311.7803">list lookup: unavailable filters compartmentId,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="175.0752" x="796" y="2325.7803">lifecycleState, displayName,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="303.0986" x="796" y="2339.7803">operationsInsightsWarehouseId (+2 more); exact</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="254.4473" x="796" y="2353.7803">declared filters match within the resource</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="179.7646" x="796" y="2367.7803">scope; duplicate matches fail</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="796" y="2381.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="796" y="2395.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="315.1777" x="796" y="2409.7803">The generated service manager uses the reviewed</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="286.3506" x="796" y="2423.7803">CRUD request, response, lifecycle, and status</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="118.2822" x="796" y="2437.7803">projection contract.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="301.1641" x="796" y="2451.7803">Work-request phases are declared per operation</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="261.4678" x="796" y="2465.7803">from the vendored SDK response surface.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="253.7021" x="796" y="2479.7803">Secret side effects are none and finalizer</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="284.0469" x="796" y="2493.7803">ownership is retained until confirmed deletion.</text><?plantuml-src jLXRSzis4tt7hy2qBybyeXtdqgRok3EDxQ_rn6qwTZ9-qGj4BYNK9C02e1Irq__UNH2WG4fgr4ic3n49SB6NisSFR1-bQeGHDRTBKUYrL0jUYie2i_tANEIF2wDRLLpgIXl-PPdZloBPKK0fsihzNoltawY1_m3L2fpCnVuzz_8tu6SlaqLXZ5u7wy_Aiw-VfrygxU3DZWzb-NNnrNYNDWMOi6F-yjMBPz-CTj3nOVt5YvTdhrubwzvyheq2my--Oaww2lWz_Dg2oe5d7EgrCB3KhONJw_eX_cPBMG0ljNPp_J4nP-ENlpFEHUwq6RWNmenBu_ZWERmkd-4o6iDCoaOej__xTCCnLf8Kz3OgMSAjLCC4VlDIl9Y_nbKosGoMyddn2ixwfPtYl2v5cRC_c8-DlstdW5brO5dY1xz4HuokAZ23rs-4XJl8jShbUEcBT_Vltjw3MSaSVXHABC1ymONbmrU3JzvTtZ0gFDShBElGzcJq7RQ0WO8RiBfgdTHg6bwT5b8iiARsj7lEjbkoMEOJkrf42mLK6Et1hxlbuPUW2WzGjaqMpxvDSZJbe71_2pp17leQWc7RdVJTCD0fxty_CNIgTK_PS0jzD4p7T6iS0xAI0ajXxqlFRxL-nFy4kZ-Ngc2YSjmP10JknjB3nwR2KlWwSEmJXLsruQ8o88eDhahhB1kUIvxWxYd_7bnw7Y0hzQPxKzBoMbgBl7N8p2sUaTYnJqfPEJ1sEbEvhWahDTgwAIQ-2_9DNi6z4mucCrL8srHYGvo6Jxe18wZczaPPkLWwsnkzAVYJ_psVgLeRUFhK9y50QyKSSqUH4rvQWro0xcALaIsmMGuvV8d9SP26NcdTyDo_vWqYXLZwykxwk_StFtr_RFRmF9_1_NxziuhiYM4FzZ1j5grsVRN2uWsm81MtcExMUdEKkQuzU00g505fL_xr8TUwrTIx0nlHhrAQEfwoac8K5i9sfiQWwKeGleabkBg-lJw-1DGEEsPZp0WweJ18t5DA9IgSa0OpW6-j1ysyqeJxOz9jm0bCQl2LSWk-FV6zsNGO26i4V_o1YEPwRj7oiGTqRcqT5IKsrAxL3dGHU5JrpXkCnpj3C3pkm8xuralPuxR662s2PwPY8qpuXv-lmg--ClxaIgvY8iWKCfb5vw4gCa4J7VlSoD9nM8cgzGqU4UTVBp5v5V7BTemCVPxGZBblcqORH2jlcu9EigqfHGv8s_KR8ui5SiI4ZGYdD02bDlLxiR0JKaWuWWjwO7Vm2-IEpsaPUDsIyrEa3