schemaVersion: 1
surface: repo-authored-semantics
service: computecloudatcustomer
slug: cccinfrastructure
kind: CccInfrastructure
archetype: generated-service-manager
states:
- provisioning
- active
- updating
- terminating
repoAuthored:
  operations:
    create:
    - CreateCccInfrastructure
    update:
    - UpdateCccInfrastructure
    delete:
    - DeleteCccInfrastructure
  providerLifecycle:
    createPending: []
    updatePending: []
    deletePending:
    - DELETING
  listLookup:
    filters:
    - accessLevel
    - cccInfrastructureId
    - compartmentId
    - compartmentIdInSubtree
    - displayName
    - displayNameContains
    - state
    matchRule: exact declared filters match within the resource scope; duplicate matches
      fail
  mutation:
    mutable:
    - cccUpgradeScheduleId
    - compartmentId
    - connectionDetails
    - connectionState
    - definedTags
    - description
    - displayName
    - freeformTags
    - subnetId
    forceNew: []
  hooks:
    create:
    - helper: tfresource.CreateResource
    update:
    - helper: tfresource.UpdateResource
    - helper: tfresource.WaitForUpdatedState
    delete:
    - helper: tfresource.DeleteResource
  followUp:
    create: read-after-write
    update: read-after-write
    delete: confirm-delete
notes:
- The generated service manager uses the reviewed CRUD request, response, lifecycle,
  and status projection contract.
- CRUD responses use lifecycle/read-after-write convergence without a work-request
  tracker.
- Secret side effects are none and finalizer ownership is retained until confirmed
  deletion.
