<text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="315.1777" x="810" y="2095.7803">The generated service manager uses the reviewed</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="286.3506" x="810" y="2109.7803">CRUD request, response, lifecycle, and status</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="118.2822" x="810" y="2123.7803">projection contract.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="287.875" x="810" y="2137.7803">CRUD responses use lifecycle/read-after-write</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="275.4609" x="810" y="2151.7803">convergence without a work-request tracker.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="253.7021" x="810" y="2165.7803">Secret side effects are none and finalizer</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="284.0469" x="810" y="2179.7803">ownership is retained until confirmed deletion.</text><?plantuml-src fLXRRzis57xdho2sbnIrawP9Ud7G0MlITK6p5aXQxCL0G4j7DXkQr4ZAhZVil-yZHScIBsc6eWWQYOVd-ftl7CNTIrqAA-RSpKHkbb9FUI6K8-RQaud8xgVML3g_CCfO_dEHuL_UaSYf49NolndjFuevyTz9BSZBJEoMkPL_4py-xHmAQyqoQNzM7BzythsfZQUtMpuKnSlynQQKiJdP934vFJjvzdf38fXFvoSdfyTdPvtpg3upLfFbno-ObruHlwM_Aj8PyI7FpBoiF6NALBdmMUMycPCzkiYoArrOuRojCbzPOZEP4o-CyHFphQFVDQh-OPoBp1lRypV5tHnj1apFwLNn3CTGXjJAKcY_-tvNu35QEZbfTIXPqBNK_Oo-FXKdarSu3IhBtb4soS_ek3tQgjQhGXGP-vV5sFY7Qa98ioV7Edxm2pXYZL9aUw_V2aStb1cToSsZdpxTVlfmItOXC_f3Q34b-nCNZlTVzQvykhXY0GdSB53dlkx1nZtqXAMSMt96LLuQFKglZd8ffgYfEwgVXskHOLFcGxUODXfoKeXsx-twk7-JT1uHozR9uiDVEZaQSTAGhuXl8H0Ufv3OMZxSxeSxuktl1pROTlu9wuk4I_saZDRA4PQJ8Rpj5eWmuDV6tEC_WL0cKkTCAC-z1JXm1p2WRwL2MM9DE7f6e-LMN2XB8b_XL3hlMDzwy0VI8_wU_BPL0d6r1bg5ql6vT0xKja_PDInjQNC7XLIUh1kDjSWoSkw