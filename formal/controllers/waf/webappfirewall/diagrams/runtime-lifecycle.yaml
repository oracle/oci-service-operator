schemaVersion: 1
surface: repo-authored-semantics
service: waf
slug: webappfirewall
kind: WebAppFirewall
archetype: generated-service-manager
states:
  - provisioning
  - active
  - updating
  - terminating
repoAuthored:
  providerLifecycle:
    createPending: ["CREATING"]
    updatePending: []
    deletePending: ["DELETING"]
  listLookup:
    filters: ["compartmentId","displayName","id","state","webAppFirewallPolicyId"]
    matchRule: exact resource identity match; duplicate matches fail
  mutation:
    mutable: ["compartmentId","definedTags","displayName","freeformTags","systemTags","webAppFirewallPolicyId"]
    forceNew: ["backendType","loadBalancerId"]
  followUp:
    create: read-after-write
    update: read-after-write
    delete: confirm-delete
notes:
  - "The WebAppFirewall runtime retains package-local lifecycle, identity, mutation, and delete handling."
  - "The credential-free evidence mock verifies the recorded create/update payloads, SDK response decoding, status projection, and delete confirmation."
