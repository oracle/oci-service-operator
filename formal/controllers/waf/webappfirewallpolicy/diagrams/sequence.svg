lvetica" font-size="14" lengthAdjust="spacing" textLength="288.7637" x="782" y="2323.7803">create, update, and delete states requeue until</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="244.3643" x="782" y="2337.7803">the corresponding follow-up converges.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="251.3506" x="782" y="2351.7803">Status projection is required, Secret side</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="260.7021" x="782" y="2365.7803">effects are none, and the finalizer policy is</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="178.1924" x="782" y="2379.7803">retain-until-confirmed-delete.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="278.5918" x="782" y="2393.7803">Delete policy required retains ownership until</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="206.9785" x="782" y="2407.7803">DELETED or confirmed absence.</text><?plantuml-src jLVRRXj74dtlhoXaNnmiALcn7JiKj80ZAOaHRHn8plg5WD2SwI5xFUoUxUuXpLtil-_fsyoG6ihQ184UnEbBNKvLdQgsdwHgkE5hiYjUwgrKIwfuRGMptSw25v-MHhUglDIrDlINgi1VEJXHYegtjVj1A_SBNmlwITGRuMJ1ny_SoNyBEdivsEJ6w6sI_hmwU_tDyARIJdp_m8QgUbr-UtXAcrAOT6BnyjMBvzyTdF3gq_wB5o_FNhqQx0VnXJPA63hxbZdfQa5tub-jK8MWAMrvTVfHBDuspG_IY2slwrzrBOiTMybIKAMrM-ZF0tasN_qF8-A5qsRFlkHdtZfqK7mZtbJFiGrXW58sNBdn-yC3Jv4omA2JKSjAt4YrZ-1tB_cBnHliUf7DtbQnA5-9isxhGNJULBmgs7zPy8r-RXS2i3fXsS0EkeGXHjUrC7lBttChRaMXLI4FjxvwV_V-vpjXDh8GV-UABuNvYhYb_QMzA-yltp4VUT8Rn7LVzkJW7ch0Y9ACiBfkdTHgbfPEIycNYAazZT_J_iWqX_d4RfPPGYbgU7lqTjpUlobK6JAKzM3Hz6y3Z6Oa5CwtWiQISAvCTelrTxo4VPTdrFr-Phn-wxvc-qVyfNrWPjG9XsiMYikv6Ys5a0vqe_Kd_EDmQI5LoNZjo1aa2Q11EeZF3GxB41j2xIYKsevuRGGlTzYLrbcsRu6t2QTdzADmeue5EAlJqScKbjRIMh3QCNatK3OYK0hxh9Ar4yREvagM4ohqsgVL6fBVuREKjgdvpjFTry4_8rhB5m38E-NJep