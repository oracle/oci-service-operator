 font-size="14" lengthAdjust="spacing" textLength="66.1445" x="797" y="2115.7803">list lookup:</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="280.9229" x="797" y="2129.7803">scaffold_marketplacepublisher_listingrevision</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="270.7715" x="797" y="2143.7803">filters displayName, id, listingId, listingType;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="302.7021" x="797" y="2157.7803">exact resource identity match; duplicate matches</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="17.8965" x="797" y="2171.7803">fail</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="797" y="2185.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="797" y="2199.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="305.0059" x="797" y="2213.7803">The runtime selects the concrete SERVICE, OCI,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="328.4053" x="797" y="2227.7803">or LEAD_GENERATION update payload and applies</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="270.8262" x="797" y="2241.7803">only fields supported by that listing subtype.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="256.0264" x="797" y="2255.7803">listingId and listingType define immutable</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="259.1641" x="797" y="2269.7803">identity; subtype-inapplicable fields do not</text><text fill="#334155" font-fam