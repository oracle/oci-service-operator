family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="2252.78" y="476.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="272.3369" x="2252.78" y="490.7803">The runtime uses its declared lifecycle-state</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="243.5371" x="2252.78" y="504.7803">contract for TermVersion reconciliation.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="301.123" x="2252.78" y="518.7803">The credential-free mock exercises SDK request</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="265.3643" x="2252.78" y="532.7803">serialization, response projection, mutation</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="252.9434" x="2252.78" y="546.7803">when supported, and confirmed deletion.</text></g><g class="entity" data-qualified-name="GMN5" data-source-line="93" id="ent0006"><path d="M2934.27,614 L2934.27,629.51 L2474.44,612.32 L2934.27,637.51 L2934.27,664 A8,8 0 0 0 2942.27,672 L3165.9243,672 A8,8 0 0 0 3173.9243,664 L3173.9243,616 L3163.9243,606 L2942.27,606 A8,8 0 0 0 2934.27,614" fill="#FFF7D6" style="stroke:#B45309;stroke-width:0.5;"/><path d="M3163.9243,606 L3163.9243,612 A4,4 0 0 0 3167.9243,616 L3173.9243,616 L3163.9243,606" fill="#FFF7D6" style="stroke:#B45309;stroke-width:0.5;"/><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="136.9717" x="2940.27" y="621.7803">delete policy: required</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="218.6543" x="2940.27" y="635.7803">delete observe: GetTermVersion or</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="101.917" x="2940.27" y="649.7803">ListTermVer