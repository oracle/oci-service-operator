schemaVersion: 1
surface: repo-authored-semantics
service: marketplacepublisher
slug: termversion
kind: TermVersion
archetype: generated-service-manager
states:
  - active
  - terminating
repoAuthored:
  providerLifecycle:
    createPending: []
    updatePending: []
    deletePending: []
  listLookup:
    filters: ["displayName","id","termId"]
    matchRule: exact resource identity match; duplicate matches fail
  mutation:
    mutable: ["contentSecret","contentSecretKey","definedTags","displayName","freeformTags"]
    forceNew: ["termId"]
  followUp:
    create: read-after-write
    update: read-after-write
    delete: confirm-delete
notes:
  - "The runtime uses its declared lifecycle-state contract for TermVersion reconciliation."
  - "The credential-free mock exercises SDK request serialization, response projection, mutation when supported, and confirmed deletion."
