schemaVersion: 1
surface: repo-authored-semantics
service: marketplacepublisher
slug: listingrevisionpackage
kind: ListingRevisionPackage
archetype: generated-service-manager
states:
  - provisioning
  - active
  - updating
  - terminating
repoAuthored:
