="spacing" textLength="234.9922" x="796" y="1987.7803">follow-up: create=GetWorkRequest -&gt;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="252.499" x="796" y="2001.7803">read-after-write; update=read-after-write;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="263.0127" x="796" y="2015.7803">delete=GetWorkRequest -&gt; confirm-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="182.0889" x="796" y="2029.7803">supported drift: displayName,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="308.957" x="796" y="2043.7803">migrationAssetDependsOn, replicationScheduleId</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="230.3301" x="796" y="2057.7803">reject before mutate: force-new fields</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="227.9922" x="796" y="2071.7803">availabilityDomain, inventoryAssetId,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="302.292" x="796" y="2085.7803">migrationId, replicationCompartmentId (+1 more)</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="144.751" x="796" y="2099.7803">create-only fields: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="66.1445" x="796" y="2113.7803">list lookup:</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="282.4678" x="796" y="2127.7803">oci_cloud_migrations_migration_assets filters</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="273.8955" x="796" y="2141.7803">displayName, migrationAssetId, migrationId,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="271.5713" x="796" y="2155.7803">state; exact declared filters match within the</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="238.123" x="796" y="2169.7803">resource scope; duplicate matches fail</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="796" y="2183.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="796" y="2197.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="315.1777" x="796" y="2211.7803">The generated service manager uses the reviewed</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="286.3506" x="796" y="2225.7803">CRUD request, response, lifecycle, and status</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="118.2822" x="796" y="2239.7803">projection contract.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="301.1641" x="796" y="2253.7803">Work-request phases are declared per operation</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="261.4678" x="796" y="2267.7803">from the vendored SDK response surface.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="253.7021" x="796" y="2281.7803">Secret side effects are none and finalizer</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="284.0469" x="796" y="2295.7803">ownership is retained until confirmed deletion.</text><?plantuml-src lLXRZnCt57xthx3e2wYRNPPBWI0gmIvj4Gj8ko1U8Y5dnfEuUEofxKb8g_xtVhxDRHDOMgdYWSdu-5o_yvqpQpyBrJ33QchNhDHReLQqOj9oOhkJ9Ii-hunkLNccfJRqXwh0lt8WKVA