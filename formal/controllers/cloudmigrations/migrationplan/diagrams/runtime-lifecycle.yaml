schemaVersion: 1
surface: repo-authored-semantics
service: cloudmigrations
slug: migrationplan
kind: MigrationPlan
archetype: generated-service-manager
states:
- provisioning
- active
- updating
- terminating
repoAuthored:
  operations:
    create:
    - CreateMigrationPlan
    update:
    - UpdateMigrationPlan
    delete:
    - DeleteMigrationPlan
  providerLifecycle:
    createPending:
    - CREATING
    updatePending: []
    deletePending:
    - DELETING
  listLookup:
    filters:
    - compartmentId
    - displayName
    - migrationId
    - migrationPlanId
    - state
    matchRule: exact declared filters match within the resource scope; duplicate matches
      fail
  mutation:
    mutable:
    - compartmentId
    - definedTags
    - displayName
    - freeformTags
    - strategies.adjustmentMultiplier
    - strategies.metricTimeWindow
    - strategies.metricType
    - strategies.percentile
    - strategies.resourceType
    - strategies.strategyType
    - targetEnvironments.availabilityDomain
    - targetEnvironments.dedicatedVmHost
    - targetEnvironments.faultDomain
    - targetEnvironments.msLicense
    - targetEnvironments.preferredShapeType
    - targetEnvironments.subnet
    - targetEnvironments.targetCompartmentId
    - targetEnvironments.targetEnvironmentType
    - targetEnvironments.vcn
    forceNew:
    - migrationId
    - sourceMigrationPlanId
  hooks:
    create:
    - helper: tfresource.CreateResource
    update:
    - helper: tfresource.UpdateResource
    delete:
    - helper: tfresource.DeleteResource
  followUp:
    create: GetWorkRequest -> read-after-write
    update: GetWorkRequest -> read-after-write
    delete: GetWorkRequest -> confirm-delete
notes:
- The generated service manager uses the reviewed CRUD request, response, lifecycle,
  and status projection contract.
- Work-request phases are declared per operation from the vendored SDK response surface.
- Secret side effects are none and finalizer ownership is retained until confirmed
  deletion.
