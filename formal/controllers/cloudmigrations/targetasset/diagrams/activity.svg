es are declared per operation</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="261.4678" x="691.5833" y="2442.7803">from the vendored SDK response surface.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="253.7021" x="691.5833" y="2456.7803">Secret side effects are none and finalizer</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="284.0469" x="691.5833" y="2470.7803">ownership is retained until confirmed deletion.</text><ellipse cx="654.5833" cy="2166" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="654.5833" cy="2166" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="654.5833" x2="654.5833" y1="157" y2="177"/><polygon fill="#0F172A" points="650.5833,167,654.5833,177,658.5833,167,654.5833,171" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="806.0491" x2="806.0491" y1="341" y2="361"/><polygon fill="#0F172A" points="802.0491,351,806.0491,361,810.0491,351,806.0491,355" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="806.0491" x2="806.0491" y1="409" y2="429"/><polygon fill="#0F172A" points="802.0491,419,806.0491,429,810.0491,419,806.0491,423" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="513.1174" x2="503.1174" y1="257" y2="257"/><line style="stroke:#0F172A;stroke-width:1;" x1="503.1174" x2="503.1174" y1="257" y2="279"/><polygon fill="#0F172A" points="499.1174,269,503.1174,279,507.1174,269,503.1174,273" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="796.0491" x2="806.0491" y1="257" y2="257"/><line style="stroke:#0F172A;stroke-width:1;" x1="806.0491" x2="806.0491" y1="257" y2="279"/><polygon fill="#0F172A" points="802.0491,269,806.0491,279,810.0491,269,8