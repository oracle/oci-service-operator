st="spacing" textLength="258.3711" x="808" y="2093.7803">The production runtime uses the declared</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="279.3506" x="808" y="2107.7803">work-request phases and service-local async</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="51.3721" x="808" y="2121.7803">adapter.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="294.9229" x="808" y="2135.7803">Lifecycle success and pending states mirror the</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="244.3301" x="808" y="2149.7803">production service-manager semantics.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="251.3506" x="808" y="2163.7803">Status projection is required, Secret side</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="260.7021" x="808" y="2177.7803">effects are none, and the finalizer policy is</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="178.1924" x="808" y="2191.7803">retain-until-confirmed-delete.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="271.585" x="808" y="2205.7803">Delete ownership is retained until a terminal</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="226.4404" x="808" y="2219.7803">lifecycle state or confirmed absence.</text><?plantuml-src jLThRnit5ltENq5qloHOouxpQ5C5Bf0wtYIe6nTsqtmHK50pToGs53abELAqY_xtFNpCQ6OakSPsYo2mPdXvd-UUUyTzbheMLgouMuhIRAHUy4eeHynr9tDHV5vOq-ZoqYXZ-J-g0l_AdaH9bMYK_vVH_eDO4Nz7QarU5kAmp9tyD_7pvxr3OQtPPErFglDldlPlQkFf-pqVgkgRykknbB4bsImnV_xYsPDlHnB1V3v_zkpv-OiNlVEelZ1Ma-NdNpCllI9-Hxytf0lY4xumQx9QuC4sYbm1LTQeMWbDPs-xirkSiQKiYLV6-BdvqhFWMcN_OPoBmXixy3X7tXwDGwQ