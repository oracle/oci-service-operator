Helvetica" font-size="14" lengthAdjust="spacing" textLength="314.3848" x="772" y="2283.7803">ChangeFileSystemCompartment and clone-detach</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="263.8467" x="772" y="2297.7803">behavior are outside the published generic</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="276.2334" x="772" y="2311.7803">runtime, so their fields are replacement-only.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="287.1846" x="772" y="2325.7803">areQuotaRulesEnabled is accepted only when</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="234.2471" x="772" y="2339.7803">creating through this runtime because</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="221.8057" x="772" y="2353.7803">ToggleQuotaRules is not published.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="287.1367" x="772" y="2367.7803">Delete retains the finalizer through DELETING</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="308.1436" x="772" y="2381.7803">until DELETED or NotFound. There are no Secret</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="74.7031" x="772" y="2395.7803">side effects.</text><?plantuml-src lLXRRnit5dxdho2wBobM8yTDqgGoKY2rtMnGDydQAVR5G47DdD5mGv5JaYD5M_I_znnUvY9BZRO52ZzuPaYUwtU-SoZtKUfMMB7chX6LsKgzuhLG3fZhLvQY_BYofjFLfL76yd_K9VvLenqLrA9J_dkZ_Lkn1lulK1lmiXI7zzp9_m4_VpfQ5DQQRPB-k3v__jNuf3OUldjWGrq_hxxUtsLi1JRjM3vzzkJnDtixI7rQV_BawVcpPwFr8BuqLeFbvrypBxq2VWU_TA1Bu0MlfGBdZHKhEFiUd-zspiEQDR82NXlZb-RJI9hB1tzbd8iIpqsiIrxcfNttu2juKJ_6PHI6WPIjqFxm-V66KwIC8j3BKBA66wcdyVlcgNYoV86h9BATB9NBwXcSzqiFSlEY5dN9VcF1D_v3jmGCgWV7HdRmIpJ46gN0JZv_9npSGcbqAVUNldXtz-w7Ex0RM