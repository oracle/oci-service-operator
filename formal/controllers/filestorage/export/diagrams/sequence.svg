" font-size="14" lengthAdjust="spacing" textLength="269.2471" x="755" y="1665.7803">retention, delete confirmation, work-request</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="199.2334" x="755" y="1679.7803">polling, or Secret cleanup apply.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="281.709" x="755" y="1693.7803">archetype batch: Generated service-manager</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="266.1504" x="755" y="1707.7803">controllers follow the shared resolution and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="259.9297" x="755" y="1721.7803">delete sequences with imported waits and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="134.6064" x="755" y="1735.7803">controller-local policy.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="116.7168" x="755" y="1749.7803">service: filestorage</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="72.3721" x="755" y="1763.7803">slug: export</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="73.9238" x="755" y="1777.7803">kind: Export</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="241.2402" x="755" y="1791.7803">archetype: generated-service-manager</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="156.4063" x="755" y="1805.7803">status/finalizer: required /</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="174.3027" x="755" y="1819.7803">retain-until-confirmed-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="210.9023" x="755" y="1833.7803">requeue: provisioning, terminating</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="304.2607" x="755" y="1847.7803">provider states: create CREATING; update none;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="112.0479" x="755" y="1861.7803">delete DELETING</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="209.6992" x="755" y="1875.7803">follow-up: create=read-after-write;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="288.7158" x="755" y="1889.7803">update=read-after-write; delete=confirm-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="188.3232" x="755" y="1903.7803">supported drift: exportOptions,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="168.0684" x="755" y="1917.7803">isIdmapGroupsForSysAuth</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="230.3301" x="755" y="1931.7803">reject before mutate: force-new fields</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="190.6543" x="755" y="1945.7803">exportSetId, fileSystemId, path</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="144.751" x="755" y="1959.7803">create-only fields: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="259.1299" x="755" y="1973.7803">list lookup: oci_file_storage_exports filters</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="276.2676" x="755" y="1987.7803">exportSetId, fileSystemId, path; Adopt only a</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="254.4678" x="755" y="2001.7803">unique export matching its export set, file</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="110.5029" x="755" y="2015.7803">system, and path.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="755" y="2029.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="755" y="2043.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="326.0332" x="755" y="2057.7803">CREATING requeues and ACTIVE succeeds; export</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="252.123" x="755" y="2071.7803">updates return ACTIVE without a distinct</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="91.8477" x="755" y="2085.7803">updating state.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="293.3643" x="755" y="2099.7803">OCI materializes omitted client-option booleans</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="278.6055" x="755" y="2113.7803">as explicit false, so one normalization update</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="160.3232" x="755" y="2127.7803">can precede steady state.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="312.0879" x="755" y="2141.7803">Export options and ID-mapping behavior update in</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="240.4473" x="755" y="2155.7803">place; export-set, file-system, and path</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="176.6475" x="755" y="2169.7803">identity require replacement.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="287.1367" x="755" y="2183.7803">Delete retains the finalizer through DELETING</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="284.7988" x="755" y="2197.7803">until DELETED or confirmed absence, with no</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="194.5508" x="755" y="2211.7803">Kubernetes Secret side effects.</text><?plantuml-src hLXRRzis57xdho2sbmsmacPjjyv11sH9rWNBLg3PvIL0GKj75bUPr4ZARZRil-_ZJP8TU_Kko4DiyV1Sl_ET8zjtKdN2Y1MtZQZqHgebhqLhYTdXP27ATqkZUrLTwbOR_d5Tug-QI5HKYxvrtsZbVX0hujzIkoOdIx5Vvax-JlpisUHG6ACtIVkJ-koBpwOtbNRqzICVwlgBwlDTAMqgCabYyUpvqoTVxaXuy-dywTDdPy-VJyw3-b8RHOQVVSwST2tnE_gj9rKIBtWjMx9E6x6aq-ltdJQEDR8YNclj5lhzH9FDb_vWd8iITxOyIn7ceztGw3DwKJ_1CPGXYR8Joks_FnKuHiia-a57AskwbMexTry-4qyNBt3gLNPRH-MYUavdmz6ZkhoeHLsoFrc8ZN_NBmW9TMJPn0z-2KUCRbioMu-_5fRUKAbLANUFFdfzz_gxEp9hMTBtGg46vYCkBDz-j7NbzUKDypNdUesARkkUxTm3-WrLt93LRU-aLlFqwBIIOecQsjFulHX5Ybpc4xjUPWqLjOZsuErul7sJL1MmoSPayUAhIOxcd1JaU-8HTd0pnS568NzbEyOv7pv_Ohn1wpvbsoB-qdOcvgDon6AbZoc1FHIStshz3ly4d5v8LJ7HEkuCO01159pUToqA4BBFqHqARVJ0HMj8L0yubTPPjctIEm7fENz5BfaYCD2WTT0YBLz9Qy5HXpJSGdrKOJz1kpeoTkvTmeCxSZVLx5xvBhvxi8vM-8hcSCsd8GP3lHKBHEqTzqNk3HeO9b4Qj3WGViZe9M9pb3nljUvu6Pxm3fNrX7hvvlhYnviVNXqHDwo4sFTxyu_JkCVfFJ3fa2OeZEXV8-DRjPEAMoTSRuCwdwe8OfumHLL2nbLuVCYhU9eSEo03bsffLjd0Meen683hNatg6pET97Echwvlhu_Aj8VgL5aEhMn9ACI2uregqM9I6GIAfpQ0OT5gZybZich82UGkUUXJIA5hyDmyn2gdirAlEdm0fN2ziD1yh87erkYeg87unreZh3AqV76ZDuWdEEE1Tfp1o4ARHWx8N2562upSguposLY5OA-Lwno-Lm16iN2PsgeG6t3YlQgCh1sdjMXx4TnDS0gF6wIizHq_ClcsfpDFytTzv-i8wFPTvItPtjIYfDpyhpklsCwOj3VLIdIll0NxZJPWWelUDUmD_KgbumkgjI6-whsxSxGzkgvGj8aE0oOJAk6FcOGbSjnBFUom_4guia6GStvHwGxWL2qua_TA8k79w234fRD9CHOD5_rWDYYU1OHvrIVZMF4QnqY0RDzc86ddbSNa0maLC5EwOv4tpPO7GiXOXfetQ8UA-2FFP1