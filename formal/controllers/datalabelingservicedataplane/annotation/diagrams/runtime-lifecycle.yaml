schemaVersion: 1
surface: repo-authored-semantics
service: datalabelingservicedataplane
slug: annotation
kind: Annotation
archetype: generated-service-manager
states:
- provisioning
- active
- updating
- terminating
repoAuthored:
  operations:
    create:
    - CreateAnnotation
    update:
    - UpdateAnnotation
    delete:
    - DeleteAnnotation
  providerLifecycle:
    createPending:
    - CREATING
    updatePending:
    - UPDATING
    deletePending:
    - DELETING
  listLookup:
    filters:
    - compartmentId
    - datasetId
    - lifecycleState
    - id
    - updatedBy
    - recordId
    - timeCreatedGreaterThanOrEqualTo
    - timeCreatedLessThanOrEqualTo
    matchRule: exact declared filters match within the resource scope; duplicate matches
      fail
  mutation:
    mutable:
    - entities
    - freeformTags
    - definedTags
    forceNew:
    - recordId
    - compartmentId
  hooks:
    create:
    - helper: tfresource.CreateResource
    update:
    - helper: tfresource.UpdateResource
    delete:
    - helper: tfresource.DeleteResource
  followUp:
    create: read-after-write
    update: read-after-write
    delete: confirm-delete
notes:
- The generated service manager uses the reviewed CRUD request, response, lifecycle,
  and status projection contract.
- CRUD responses use lifecycle/read-after-write convergence without a work-request
  tracker.
- Secret side effects are none and finalizer ownership is retained until confirmed
  deletion.
