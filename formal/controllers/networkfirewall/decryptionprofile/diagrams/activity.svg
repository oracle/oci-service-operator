<text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="191.4404" x="705.4814" y="1309.2803">isUnsupportedVersionBlocked,</text><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="246.2852" x="705.4814" y="1323.2803">isUnsupportedCipherBlocked (+7 more)</text><rect fill="#F8FAFC" height="34" rx="8" ry="8" style="stroke:#0F172A;stroke-width:0.5;" width="199.0059" x="1029.6318" y="1260.5"/><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="179.0059" x="1039.6318" y="1281.2803">Skip the no-op mutation path</text><polygon fill="#E2E8F0" points="990.8457,1342.5,1002.8457,1354.5,990.8457,1366.5,978.8457,1354.5,990.8457,1342.5" style="stroke:#1D4ED8;stroke-width:0.5;"/><rect fill="#F8FAFC" height="90" rx="8" ry="8" style="stroke:#0F172A;stroke-width:0.5;" width="293.5537" x="844.0688" y="1386.5"/><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="164.2061" x="854.0688" y="1407.2803">Run provider helper hooks</text><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="219.0508" x="854.0688" y="1421.2803">create=tfresource.CreateResource;</text><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="226.085" x="854.0688" y="1435.2803">update=tfresource.UpdateResource;</text><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="273.5537" x="854.0688" y="1449.2803">delete=tfresource.DeleteResource when the</text><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="220.2334" x="854.0688" y="1463.2803">matching field-driven path executes</text><rect fill="#F8FAFC" height="62" rx="8" ry="8" style="stroke:#0F172A;stroke-width:0.5;" width="308.7158" x="836.4878" y="1496.5"/><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="208.5303" x="846.4878" y="1517.2803">Apply explicit follow-up semantics</text><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="145.8926" x="846.4878" y="1531.2803">create=read-after-write;</text><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="288.7158" x="846.4878" y="1545.2803">update=read-after-write; delete=confirm-delete</text><rect fill="#F8FAFC" height="34" rx="8" ry="8" style="stroke:#0F172A;stroke-width:0.5;" width="303.2197" x="839.2358" y="1578.5"/><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="283.2197" x="849.2358" y="1599.2803">Return success for the ACTIVE success state</text><rect fill="#F8FAFC" height="48" rx="8" ry="8" style="stroke:#0F172A;stroke-width:0.5;" width="279.1299" x="851.2808" y="1632.5"/><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="259.1299" x="861.2808" y="1653.2803">Project required status and finalizer policy</text><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="174.3027" x="861.2808" y="1667.2803">retain-until-confirmed-delete</text><rect fill="#F8FAFC" height="34" rx="8" ry="8" style="stroke:#0F172A;stroke-width:0.5;" width="169.4336" x="906.1289" y="1700.5"/><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="149.4336" x="916.1289" y="1721.2803">Requeue on terminating</text><path d="M696.2949,1756.5 L696.2949,2016.5 L676.2949,2020.5 L696.2949,2024.5 L696.2949,2284.5 A0,0 0 0 0 696.2949,2284.5 L1030.8799,2284.5 A0,0 0 0 0 1030.8799,2284.5 L1030.8799,1766.5 L1020.8799,1756.5 L696.2949,1756.5 A0,0 0 0 0 696.2949,1756.5" fill="#FFF7D6" style="stroke:#B45309;stroke-width:0.5;"/><path d="M1020.8799,1756.5 L1020.8799,1766.5 L1030.8799,1766.5 L1020.8799,1756.5" fill="#FFF7D6" style="stroke:#B45309;stroke-width:0.5;"/><text fill="#334155" font-family=