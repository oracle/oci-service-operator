schemaVersion: 1
surface: repo-authored-semantics
service: networkfirewall
slug: servicelist
kind: ServiceList
archetype: generated-service-manager
states:
  - active
  - terminating
repoAuthored:
  providerLifecycle:
    createPending: []
    updatePending: []
    deletePending: ["DELETING"]
  listLookup:
    filters: ["parentResourceId","name"]
    matchRule: exact parent path plus immutable child identity; duplicate matches fail
  mutation:
    mutable: ["services"]
    forceNew: ["networkFirewallPolicyId","name"]
  followUp:
    create: read-after-write
    update: read-after-write
    delete: confirm-delete
notes:
  - "The parent networkFirewallPolicyId and immutable child name address every ServiceList request."
  - "The recorded composite-path mock verifies request bodies, nested paths, status projection, and confirmed deletion."
