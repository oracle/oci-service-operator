vetica" font-size="14" lengthAdjust="spacing" textLength="348.5439" x="803" y="2114.7803">UPDATING; delete DELETE_SCHEDULED, DELETING</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="191.0371" x="803" y="2128.7803">follow-up: create=workrequest;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="270.0537" x="803" y="2142.7803">update=workrequest; delete=confirm-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="182.0889" x="803" y="2156.7803">supported drift: displayName,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="193.0059" x="803" y="2170.7803">backupRetentionPeriodInDays,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="297.6094" x="803" y="2184.7803">policyLockedDateTime, freeformTags (+1 more)</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="230.3301" x="803" y="2198.7803">reject before mutate: force-new fields</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="263.7852" x="803" y="2212.7803">compartmentId, mustEnforceCloudLocality</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="144.751" x="803" y="2226.7803">create-only fields: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="273.1436" x="803" y="2240.7803">list lookup: oci_recovery_protection_policies</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="279.3301" x="803" y="2254.7803">filters compartmentId, displayName, id; exact</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="305.7988" x="803" y="2268.7803">compartmentId, displayName, id match within the</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="238.123" x="803" y="2282.7803">resource scope; duplicate matches fail</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="803" y="2296.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="803" y="2310.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="177.4268" x="803" y="2324.7803">The production runtime uses</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="307.3984" x="803" y="2338.7803">generatedruntime/workrequest async handling for</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="273.1641" x="803" y="2352.7803">create, update, delete work-request phases.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="286.3574" x="803" y="2366.7803">Lifecycle success states are ACTIVE; pending</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="288.7637" x="803" y="2380.7803">create, update, and delete states requeue until</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="244.3643" x="803" y="2394.7803">the corresponding follow-up converges.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="251.3506" x="803" y="2408.7803">Status projection is required, Secret side</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="260.7021" x="803" y="2422.7803">effects are none, and the finalizer policy is</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="178.1924" x="803" y="2436.7803">retain-until-confirmed-delete.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="278.5918" x="803" y="2450.7803">Delete policy required retains ownership until</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="206.9785" x="803" y="2464.7803">DELETED or confirmed absence.</text><?plantuml-src hLZRRXit47tdLmpQbmILxBXncaI62oIMcnfrcy1s-YJ0e7Pd9IOKkIMvKjIY_zxXRRKhoOxT5dc8bfUvdZapjFqiLCqDNu2TyrAlX9f1nQL5PjkTAIy-punkL7ccfJRmRLNGlx9peiIADzBzf9NxZIyGVaQvH2SAll_CjVWJuUYuiycDqQia_LbrzFBxxasb7RxTiQ6gNfO_R9_IfaIJJaoFNpn_zdhhX5UVzfy_FpvwyQAp7yGNsYWqSFG3Sy99X6lyeq5L80p1OA6NQDQ77mn9AfpGweEMebYpkIWHAgtTL7_f2BJvxbyCW1TEcvw1oT6yjUqXVe-lgcUqJS8ebgBcoks_tptm42cT8BGofAZmKgX-25yVy-VJLxJhHTQzhM9Qli2ZTcidFQygNXNiRnPyWr-QAL9S7LhMiGFEo12ZfKJJMtxBBLvHi5KXjhU-UN_z_fThD4jHuAzSyHcQRu1Rw2_rhhm_ks0-zU2JjoLxi7MFYi1WIPcsMZO-mQEqT5WAFgESsiFuFTmS6UOq7zZbB4ieKPAtTzwEs_sRgCe0KRO95Wn_xCHe1AZeV8Em3S00pU0Hsnptb_lUZg3z_SHurTOzPVqZ_b8_9gEDSFBA2k_TJW444C2brf_fFqwEJ8Kg6PSEd25eq1K20NwfwR086G6g64KLjWOk3V9oJRl2EilwohqvT7e4xz3jA4MYgLP-AqzOM0XhYSZkadL9YhQ42RHFAY4T6ZkQg48lF80M9F6Y740fR2tvsZFRWFGy3NuPR2oVKaoyCnuCZQ529-MKGg82geIxr9-Hlmvtl95Qrr24FQW92vw9pwxEtznS_FRkKL4XpI4o-oty3-7Uuz8UYDKKGn8TQsX9cUbbMoYmZhl61d4-aB4K8E4HouIbSLY-oxwuksFY7QV9k4gOHLQr57oYzdX869se_U28sKdtStR6vvVdD-UtrsS_duy_NfwF1nCLbXwNiFkqvXWL4hcYe50HLK9nIVtJKCHerGRCJQNsHV2Gz1Xqd9AGNF6vm52mj6vIIQKzNmNqW-m1FRKa-Q4AebaRGtb5TRKhDI8rezMZ95f3_WHZF7OVfZ2IucekMh0lo4TBO9keN483-FXX77-bD7Kp1stYWZ5IB7Dil7JYF4l-e2o7V4NyFL6b4PK3N7BPyE1B0crOdbCyfUUVJTVfkp7mBUcwgMjj2F3GrANNP1jJyG97FRvXVlXgwYiAdGhGG2DqUQ76V6q7h0u8kWp97vEC6-4fgZA8bJQB6pwpyEIx8xRG1f-oA_n4y8AftqDODDwz4L4LiS9GuIewQDaM-IqQwyvLE7KcTLEICaghMxD4zfareN-FRP5cFhxWhfXJRAYNVQ7Hu2ktud5O2KTtmCsHjJnc2rtZ2PIDxoa-VE6epnCNSjDBTUqwBbBzU2wW6yuNSCmYuQr4NtaFnNStZ1vk8PGPq5wXRLFhjpm5VrrJ8eWtTItNy34WOfSfb5nFV2vQkJ5dFSHCr7sGcQYlOsQY23GGGHDuBm4qyrukf4TtfRjxecaKp55Ixu0v0OLCY9tmr5KvumUnRrwbpucA7ULqMzL4yV1rkh_Fda