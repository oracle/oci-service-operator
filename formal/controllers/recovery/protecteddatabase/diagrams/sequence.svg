A4,4 0 0 0 1180,1985 L1186,1985 L1176,1975" fill="#FFF7D6" style="stroke:#B45309;stroke-width:0.5;"/><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="101.165" x="823" y="1990.7803">shared diagram:</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="307.3916" x="823" y="2004.7803">shared/diagrams/shared-resolution-sequence.svg</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="143.1992" x="823" y="2018.7803">shared delete diagram:</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="284.833" x="823" y="2032.7803">shared/diagrams/shared-delete-sequence.svg</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="280.9297" x="823" y="2046.7803">Start from the shared resolution sequence for</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="260.7295" x="823" y="2060.7803">OCID binding, datasource pagination, and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="163.4268" x="823" y="2074.7803">create-or-update dispatch.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="301.1982" x="823" y="2088.7803">Layer the shared delete sequence when finalizer</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="269.2471" x="823" y="2102.7803">retention, delete confirmation, work-request</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="199.2334" x="823" y="2116.7803">polling, or Secret cleanup apply.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="281.709" x="823" y="2130.7803">archetype batch: Generated service-manager</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="266.1504" x="823" y="2144.7803">controllers follow the shared resolution and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="259.9297" x="823" y="2158.7803">delete sequences with imported waits and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="134.6064" x="823" y="2172.7803">controller-local policy.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="105.8066" x="823" y="2186.7803">service: recovery</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="149.4404" x="823" y="2200.7803">slug: protecteddatabase</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="153.3164" x="823" y="2214.7803">kind: ProtectedDatabase</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="241.2402" x="823" y="2228.7803">archetype: generated-service-manager</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="156.4063" x="823" y="2242.7803">status/finalizer: required /</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="174.3027" x="823" y="2256.7803">retain-until-confirmed-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="272.3984" x="823" y="2270.7803">requeue: provisioning, updating, terminating</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="265.3369" x="823" y="2284.7803">provider states: create CREATING; update</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="348.5439" x="823" y="2298.7803">UPDATING; delete DELETE_SCHEDULED, DELETING</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="234.9922" x="823" y="2312.7803">follow-up: create=GetWorkRequest -&gt;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="325.2949" x="823" y="2326.7803">GetProtectedDatabase; update=GetWorkRequest -&gt;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="285.2227" x="823" y="2340.7803">GetProtectedDatabase; delete=confirm-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="283.2402" x="823" y="2354.7803">supported drift: compartmentId, displayName,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="281.3262" x="823" y="2368.7803">databaseSize, databaseSizeInGBs (+7 more)</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="230.3301" x="823" y="2382.7803">reject before mutate: force-new fields</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="261.5156" x="823" y="2396.7803">dbUniqueName, databaseId, changeRate,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="112.0479" x="823" y="2410.7803">compressionRatio</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="144.751" x="823" y="2424.7803">create-only fields: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="287.9502" x="823" y="2438.7803">list lookup: oci_recovery_protected_databases</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="295.6885" x="823" y="2452.7803">filters compartmentId, dbUniqueName, id; exact</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="322.1572" x="823" y="2466.7803">compartmentId, dbUniqueName, id match within the</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="238.123" x="823" y="2480.7803">resource scope; duplicate matches fail</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="823" y="2494.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="823" y="2508.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="258.3711" x="823" y="2522.7803">The production runtime uses the declared</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="279.3506" x="823" y="2536.7803">work-request phases and service-local async</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="51.3721" x="823" y="2550.7803">adapter.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="294.9229" x="823" y="2564.7803">Lifecycle success and pending states mirror the</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="244.3301" x="823" y="2578.7803">production service-manager semantics.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="251.3506" x="823" y="2592.7803">Status projection is required, Secret side</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="303.4814" x="823" y="2606.7803">effects are controller-owned-password-state, and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="125.2754" x="823" y="2620.7803">the finalizer policy is</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="178.1924" x="823" y="2634.7803">retain-until-confirmed-delete.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="299.6123" x="823" y="2648.7803">The runtime uses DeleteProtectedDatabase; the</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="314.4121" x="823" y="2662.7803">provider-only ScheduleProtectedDatabaseDeletion</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="214.0264" x="823" y="2676.7803">operation is intentionally excluded.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="271.585" x="823" y="2690.7803">Delete ownership is retained until a terminal</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="226.4404" x="823" y="2704.7803">lifecycle state or confirmed absence.</text><?plantuml-src jLZRRXit47tVho3QbmILxBX9cbI62pIMcmHrcy9Aa1S10RNBbLXJv9RSbQ8M_VUUuMMrguljj2Zo44aavthcp8pThTGLjtp9t88NPYtrd9LSEP6vzcJ6yzkvDOqkBeqobdrTvlXNT6uKekIDgdyoklwLBmLx8zHAr3BdX-zCv9-2dJth779hpJfAVrAUlVYs-rARMhpQiw4iNnJVxTuojX0stfWzU_xqoVSxDqXzF7_wzDdPy-UTSoy-DrOBoyw-osfPAy4cuez6w5om8RCYDojXDwU_MKZAQr6CUSrd7C5Qo4AmqfXwPZvt9Bhq-A-CCPxNnlOiZ9wcerqNnRVYPVa4nn26OCgAw_hm--w5XqZfHA6LeMGfhgNkn_3xP_pfx2LEIMJLEyfdnNDnrXxjvUTboSiy-plplh6Vcvb0O6lXieuTx1A6MAEKiBsVNo6cDuYspkNkqLVl9kz-dWYxahduXMi-5_OhnXth_zHxykxoRL_4rXWyowseemJwE86r8YEeC4hsZYc37JKe6YiA8CCPrTJIw57ywRIGV0u8kDFmVRYzCaoeE76hUP9G20LxZhuEn_sNGXSUqbd7dU4FdP2EcD2utmYs1rYFPUzIjhrFh_lkZbZx-P4btQv-dFMlqAD-K4PRuN3BIN9lls8yQjYrCRVuZyELcTH5nbNDQWiiuGrG8pvN2bdpAMGeCOsQt32khE351gVIrIxhQoTxS7l4NejwNwi0ixKAMe7IiQLq3jntJDWrDEr9SuzAgMfXtMYgSxCaY2qXyMqnOCNiWvQ85x7X08eUUy-iQ1oV8Ipa3W6YiU06Q4SQmHuedcFwB-5nBVRzKSPKBFU7h08WYBulRwv-VF_srzTV5XZezi4vRED_2Va1hmu0hK8S8JkKqWhPwQLSQkPgNZVEYwDOXefW4PMYY80Q-v-F6JZ95w9er7uW_JFKvh67iBEKTfcqhYIVwaFU0hHJVHWi8LTHGChL-EhwwltLfydbcwlnX-khyM2g_KzVcBwxr8g3gEgGtIWPPTOQSGydZ9T0jaz2E2M8-nXm7oTAGQu4ruWv2h