tica" font-size="14" lengthAdjust="spacing" textLength="216.7334" x="826.1047" y="1680.7803">delete=tfresource.DeleteResource,</text><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="314.3164" x="826.1047" y="1694.7803">tfresource.WaitForWorkRequestWithErrorHandling</text><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="300.3711" x="826.1047" y="1708.7803">entity=recoveryServiceSubnet action=DELETED</text><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="280.9434" x="826.1047" y="1722.7803">when the matching field-driven path executes</text><rect fill="#F8FAFC" height="62" rx="8" ry="8" style="stroke:#0F172A;stroke-width:0.5;" width="308.7158" x="828.905" y="1756"/><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="208.5303" x="838.905" y="1776.7803">Apply explicit follow-up semantics</text><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="145.8926" x="838.905" y="1790.7803">create=read-after-write;</text><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="288.7158" x="838.905" y="1804.7803">update=read-after-write; delete=confirm-delete</text><rect fill="#F8FAFC" height="34" rx="8" ry="8" style="stroke:#0F172A;stroke-width:0.5;" width="303.2197" x="831.6531" y="1838"/><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="283.2197" x="841.6531" y="1858.7803">Return success for the ACTIVE success state</text><rect fill="#F8FAFC" height="48" rx="8" ry="8" style="stroke:#0F172A;stroke-width:0.5;" width="279.1299" x="843.698" y="1892"/><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="259.1299" x="853.698" y="1912.7803">Project required status and finalizer policy</text><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="174.3027" x="853.698" y="1926.7803">retain-until-confirmed-delete</text><rect fill="#F8FAFC" height="34" rx="8" ry="8" style="stroke:#0F172A;stroke-width:0.5;" width="313.4189" x="826.5535" y="1960"/><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="293.4189" x="836.5535" y="1980.7803">Requeue on provisioning, updating, terminating</text><path d="M692.5035,2016 L692.5035,2332 L672.5035,2336 L692.5035,2340 L692.5035,2656 A0,0 0 0 0 692.5035,2656 L1062.0475,2656 A0,0 0 0 0 1062.0475,2656 L1062.0475,2026 L1052.0475,2016 L692.5035,2016 A0,0 0 0 0 692.5035,2016" fill="#FFF7D6" style="stroke:#B45309;stroke-width:0.5;"/><path d="M1052.0475,2016 L1052.0475,2026 L1062.0475,2026 L1052.0475,2016" fill="#FFF7D6" style="stroke:#B45309;stroke-width:0.5;"/><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="101.165" x="698.5035" y="2031.7803">shared diagram:</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="284.7852" x="698.5035" y="2045.7803">shared/diagrams/shared-reconcile-activity.svg</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="265.3438" x="698.5035" y="2059.7803">Start from the shared reconcile activity and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="273.8955" x="698.5035" y="2073.7803">specialize provider-backed CRUD, wait, and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="182.875" x="698.5035" y="2087.7803">status-projection details here.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="229.5371" x="698.5035" y="2101.7803">Controller-local activity diagrams add</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="238.8955" x="698.5035" y="2115.7803">list-lookup hints, secret policies, delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="200.0332" x="698.5035" y="2129.7803">handling, and open formal gaps.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="281.709" x="698.5035" y="2143.7803">archetype batch: Generated service-manager</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="291.0469" x="698.5035" y="2157.7803">controllers specialize the shared reconcile path</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="189.8477" x="698.5035" y="2171.7803">with formal runtime ownership.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="105.8066" x="698.5035" y="2185.7803">service: recovery</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="173.5234" x="698.5035" y="2199.7803">slug: recoveryservicesubnet</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="183.6475" x="698.5035" y="2213.7803">kind: RecoveryServiceSubnet</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="241.2402" x="698.5035" y="2227.7803">archetype: generated-service-manager</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="156.4063" x="698.5035" y="2241.7803">status/finalizer: required /</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="174.3027" x="698.5035" y="2255.7803">retain-until-confirmed-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="272.3984" x="698.5035" y="2269.7803">requeue: provisioning, updating, terminating</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="265.3369" x="698.5035" y="2283.7803">provider states: create CREATING; update</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="348.5439" x="698.5035" y="2297.7803">UPDATING; delete DELETE_SCHEDULED, DELETING</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="209.6992" x="698.5035" y="2311.7803">follow-up: create=read-after-write;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="288.7158" x="698.5035" y="2325.7803">update=read-after-write; delete=confirm-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="283.2402" x="698.5035" y="2339.7803">supported drift: compartmentId, displayName,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="163.0234" x="698.5035" y="2353.7803">subnets, nsgIds (+2 more)</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="271.5713" x="698.5035" y="2367.7803">reject before mutate: force-new fields vcnId,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="269.6777" x="698.5035" y="2381.7803">subnetId and conflicts subnets -&gt; subnet_id</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="144.751" x="698.5035" y="2395.7803">create-only fields: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="66.1445" x="698.5035" y="2409.7803">list lookup:</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="287.123" x="698.5035" y="2423.7803">oci_recovery_recovery_service_subnets filters</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="295.6816" x="698.5035" y="2437.7803">compartmentId, vcnId, id; exact compartmentId,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="260.6816" x="698.5035" y="2451.7803">vcnId, id match within the resource scope;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="134.627" x="698.5035" y="2465.7803">duplicate matches fail</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="188.7197" x="698.5035" y="2479.7803">conflicts: subnets -&gt; subnet_id</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="698.5035" y="2493.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="177.4268" x="698.5035" y="2507.7803">The production runtime uses</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="307.3984" x="698.5035" y="2521.7803">generatedruntime/workrequest async handling for</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="273.1641" x="698.5035" y="2535.7803">create, update, delete work-request phases.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="286.3574" x="698.5035" y="2549.7803">Lifecycle success states are ACTIVE; pending</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="288.7637" x="698.5035" y="2563.7803">create, update, and delete states requeue until</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="244.3643" x="698.5035" y="2577.7803">the corresponding follow-up converges.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="251.3506" x="698.5035" y="2591.7803">Status projection is required, Secret side</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="260.7021" x="698.5035" y="2605.7803">effects are none, and the finalizer policy is</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="178.1924" x="698.5035" y="2619.7803">retain-until-confirmed-delete.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="278.5918" x="698.5035" y="2633.7803">Delete policy required retains ownership until</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="206.9785" x="698.5035" y="2647.7803">DELETED or confirmed absence.</text><ellipse cx="661.5035" cy="2336" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="661.5035" cy="2336" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="661.5035" x2="661.5035" y1="157" y2="177"/><polygon fill="#0F172A" points="657.5035,167,661.5035,177,665.5035,167,661.5035,171" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="812.9694" x2="812.9694" y1="341" y2="361"/><polygon fill="#0F172A" points="808.9694,351,812.9694,361,816.9694,351,812.9694,355" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="812.9694" x2="812.9694" y1="423" y2="443"/><polygon fill="#0F172A" points="808.9694,433,812.9694,443,816.9694,433,812.9694,437" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="520.0377" x2="510.0377" y1="257" y2="257"/><line style="stroke:#0F172A;stroke-width:1;" x1="510.0377" x2="510.0377" y1="257" y2="279"/><polygon fill="#0F172A" points="506.0377,269,510.0377,279,514.0377,269,510.0377,273" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="802.9694" x2="812.9694" y1="257" y2="257"/><line style="stroke:#0F172A;stroke-width