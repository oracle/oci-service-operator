thAdjust="spacing" textLength="241.2402" x="793" y="2100.7803">archetype: generated-service-manager</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="156.4063" x="793" y="2114.7803">status/finalizer: required /</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="174.3027" x="793" y="2128.7803">retain-until-confirmed-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="272.3984" x="793" y="2142.7803">requeue: provisioning, updating, terminating</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="265.3369" x="793" y="2156.7803">provider states: create CREATING; update</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="348.5439" x="793" y="2170.7803">UPDATING; delete DELETE_SCHEDULED, DELETING</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="209.6992" x="793" y="2184.7803">follow-up: create=read-after-write;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="288.7158" x="793" y="2198.7803">update=read-after-write; delete=confirm-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="283.2402" x="793" y="2212.7803">supported drift: compartmentId, displayName,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="163.0234" x="793" y="2226.7803">subnets, nsgIds (+2 more)</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="271.5713" x="793" y="2240.7803">reject before mutate: force-new fields vcnId,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="269.6777" x="793" y="2254.7803">subnetId and conflicts subnets -&gt; subnet_id</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="144.751" x="793" y="2268.7803">create-only fields: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="66.1445" x="793" y="2282.7803">list lookup:</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="287.123" x="793" y="2296.7803">oci_recovery_recovery_service_subnets filters</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="295.6816" x="793" y="2310.7803">compartmentId, vcnId, id; exact compartmentId,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="260.6816" x="793" y="2324.7803">vcnId, id match within the resource scope;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="134.627" x="793" y="2338.7803">duplicate matches fail</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="188.7197" x="793" y="2352.7803">conflicts: subnets -&gt; subnet_id</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="793" y="2366.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="177.4268" x="793" y="2380.7803">The production runtime uses</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="307.3984" x="793" y="2394.7803">generatedruntime/workrequest async handling for</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="273.1641" x="793" y="2408.7803">create, update, delete work-request phases.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="286.3574" x="793" y="2422.7803">Lifecycle success states are ACTIVE; pending</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="288.7637" x="793" y="2436.7803">create, update, and delete states requeue until</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="244.3643" x="793" y="2450.7803">the corresponding follow-up converges.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="251.3506" x="793" y="2464.7803">Status projection is required, Secret side</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="260.7021" x="793" y="2478.7803">effects are none, and the finalizer policy is</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="178.1924" x="793" y="2492.7803">retain-until-confirmed-delete.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="278.5918" x="793" y="2506.7803">Delete policy required retains ownership until</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="206.9785" x="793" y="2520.7803">DELETED or confirmed absence.</text><?plantuml-src jLZRZjiu4dtdLnHcNXAirPtEPIRZHY-GiRsJnlHE1d6oUJ4Gq5B9vhPCQadAZdUn_xx5coJRShetWq4UMXQfObrEdJgCkHUovfflmAnveNP2hg3abK5csfKbp-zNMZMocAXAQVY-pEbVqTjHOCcRolvDIViRto2ynMgBLkHyUCzS_1lXwcLlaMkjTj7wi_Bgn-VzBwMo-FE93sNvO_73yIwb2zHnn_BbgnVFVZhQuOwFwozUlBnwzQgtxitdIalKSFK3iy9M27FyLuCoHyX0OwwsgFUNx-F37FLMv3XlbX8jMui2eLJABjMNdbMJ3Fo70V3SAdtWPOmsBHs7YS_nTVcCbiaO9LJKNDhXx_iR7cEbbudMHYLAl1FoC8y_lUGlbgzfrPci3vRoPV4AhzgbangzBdcPi_yo7nlysYoHaclHi9uVC257jAegr0UlV-O6NQ9bBewNlditV_ThJFxVkUGhrDy1Dt3uwk2JTvDRvkeFhd17jaT7tr4dQ2oet4PLZHLAZkEhoqBm5TNKN8RVMRSbIsM-CDjLib1WHT6U_Jei7tw9il0uPLso8FjhBqTZG4dx6uH152waJd6nxYDduZ3cCRJFJxHpmDYdx72B--WmCsDeZLDiHb0G2pdS31uGSAVKFVtX5DHIo8BnoeBL11DA3W42lzGL5SXN1wXx9BNS7dYbaHTxMXN66dReWdEATe_X5xJ39oEHLtj8QrGOs0XZYDxE6RoZqmOjcYUbg2ngCrx8N6qSgZPa