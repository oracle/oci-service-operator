mily="Helvetica" font-size="14" lengthAdjust="spacing" textLength="251.3506" x="797" y="2283.7803">Status projection is required, Secret side</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="260.7021" x="797" y="2297.7803">effects are none, and the finalizer policy is</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="178.1924" x="797" y="2311.7803">retain-until-confirmed-delete.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="271.585" x="797" y="2325.7803">Delete ownership is retained until a terminal</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="226.4404" x="797" y="2339.7803">lifecycle state or confirmed absence.</text><?plantuml-src hLTRSzj457xVNt46NjeXJXfweJXJPafIe4DecQGCBtvPIojxgRmhTbTs3SD_vzkRBCbsanOc3x6qPy_rEzyvik-bQhZXAx9BNkgDL0kgU6q5izt9d1Vl5qQtghpKjJRqPLNWh-n9bABYRUr-qCgzuIj1FubwBPmi-66PM_cNeFCdlKDkZDuaxO-gys--xjzKsedlztoegc_APsCfRKfXaiJyoTF7ZxuTINZpwVpnuoVdJv_speFwGXib39q_OqwwMj2j-BCLgX0q8IvBxdXJSrTfipfxAQ_m-6jwP4jP2ggqTdFzeQVKvlj_Co9UE6q6JgPWyz4uIl6rU5uzmZ6K8P-ouSeTljyNk8-MNY8w7RMinBLKmpH--uG_dZ_7gLVP38wAUVbKd7T7UoLwNl6gOF-m41lztCu5Skk4PJq_w1AE65tNmWnUVy-jk165LeKS7ttnzlRjpxV2h6KXVk6ABuJvWhYbuQl1bRUNhvalF-arYZlKVJAwXqOmeYGZhAvR9xMQfbTdfUGBrDIUnUV9JcIIotngrukieHGreZrwEnuFRmfL1fYoNR9eybqlHrCI2lAje27yu6wAX-s4_TLXh5FgVZymth1r3zbGn5yQPcIwKuwOhFInZS0V043NMh_7FuuWvbALZDUEd04iS04041-Q6WK9rI1qYqA7ROdNHl1oYrDfdML3qzuPI4_fH-569WL8gjFUQPEMLj9QqDWnJTSmCrHb7rIoTiBOwKmLUkLniuAwr-K9bTAYtxUUr4vWv648oOZMyZcIuUFm66WD-XkMKJam01hWcErBXEh4A91QwuQAS48D0E0f-FBcrSjthz_y-0dfWDMGaiFUVNQM3mHp05KDiWV5iMdMACYWn5AHTTorDgZpAOpOfmH1KIO0NONNnxoBfoC7ZyZ2jKgQLJQqbdm_k9a2A0_08LOatSmLkNfr_UgJAWB4pzGXxJa7HIsuGj1mefAArnYA1Xd1MnlGDA-rn_Pzqc-4uqXoSjddMeGkn7kpZR18PnxV-07A8Zstq7nV0z6jdQEyGiViQuqup5ZqA8ZU89xWZ4Vc_Gn6bjiiPGVb5MAq0DDCvVOueTz-lKg_kW85oxLSvqHuLU0i2-T5NKxu1kmxKwMHbIEnvdNBW-C9WU7r4