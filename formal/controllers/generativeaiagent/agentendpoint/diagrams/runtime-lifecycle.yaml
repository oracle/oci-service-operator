schemaVersion: 1
surface: repo-authored-semantics
service: generativeaiagent
slug: agentendpoint
kind: AgentEndpoint
archetype: generated-service-manager
states:
  - provisioning
  - active
  - updating
  - terminating
repoAuthored:
  operations:
    update:
      - UpdateAgentEndpoint
  mutation:
    mutable:
      - contentModerationConfig
      - definedTags
      - description
      - displayName
      - freeformTags
      - guardrailConfig
      - humanInputConfig
      - metadata
      - outputConfig
      - provisionedCapacityConfig
      - sessionConfig
      - shouldEnableCitation
      - shouldEnableMultiLanguage
      - shouldEnableTrace
    forceNew:
      - agentId
      - compartmentId
      - shouldEnableSession
notes:
  - The reviewed handwritten runtime reconciles the mutable fields in place and rejects drift for agentId, compartmentId, and shouldEnableSession without invoking ChangeAgentEndpointCompartment.
