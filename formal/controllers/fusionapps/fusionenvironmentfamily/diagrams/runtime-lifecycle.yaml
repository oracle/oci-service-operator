schemaVersion: 1
surface: repo-authored-semantics
service: fusionapps
slug: fusionenvironmentfamily
kind: FusionEnvironmentFamily
archetype: generated-service-manager
states:
- provisioning
- active
- updating
- terminating
repoAuthored:
  operations:
    create:
    - CreateFusionEnvironmentFamily
    update:
    - UpdateFusionEnvironmentFamily
    delete:
    - DeleteFusionEnvironmentFamily
  providerLifecycle:
    createPending:
    - CREATING
    updatePending: []
    deletePending:
    - DELETING
  listLookup:
    filters:
    - compartmentId
    - displayName
    - fusionEnvironmentFamilyId
    - state
    matchRule: exact declared filters match within the resource scope; duplicate matches
      fail
  mutation:
    mutable:
    - compartmentId
    - definedTags
    - displayName
    - familyMaintenancePolicy.concurrentMaintenance
    - familyMaintenancePolicy.isMonthlyPatchingEnabled
    - freeformTags
    - subscriptionIds
    - timeUpdated
    forceNew:
    - familyMaintenancePolicy.quarterlyUpgradeBeginTimes
  hooks:
    create:
    - helper: tfresource.CreateResource
    update:
    - helper: tfresource.UpdateResource
    delete:
    - helper: tfresource.DeleteResource
  followUp:
    create: GetWorkRequest -> read-after-write
    update: GetWorkRequest -> read-after-write
    delete: GetWorkRequest -> confirm-delete
notes:
- The generated service manager uses the reviewed CRUD request, response, lifecycle,
  and status projection contract.
- Work-request phases are declared per operation from the vendored SDK response surface.
- Secret side effects are none and finalizer ownership is retained until confirmed
  deletion.
