schemaVersion: 1
surface: repo-authored-semantics
service: fusionapps
slug: fusionenvironment
kind: FusionEnvironment
archetype: generated-service-manager
states:
- provisioning
- active
- updating
- terminating
repoAuthored:
  operations:
    create:
    - CreateFusionEnvironment
    update:
    - UpdateFusionEnvironment
    delete:
    - DeleteFusionEnvironment
  providerLifecycle:
    createPending:
    - CREATING
    updatePending:
    - UPDATING
    deletePending:
    - DELETING
  listLookup:
    filters:
    - compartmentId
    - fusionEnvironmentFamilyId
    - displayName
    - lifecycleState
    - opc-request-id
    matchRule: exact declared filters match within the resource scope; duplicate matches
      fail
  mutation:
    mutable:
    - displayName
    - maintenancePolicy
    - kmsKeyId
    - additionalLanguagePacks
    - isIPv6DualStackEnabled
    - rules
    - freeformTags
    - definedTags
    forceNew:
    - compartmentId
    - fusionEnvironmentFamilyId
    - fusionEnvironmentType
    - createFusionEnvironmentAdminUserDetails
    - dnsPrefix
  hooks:
    create:
    - helper: tfresource.CreateResource
    - helper: tfresource.WaitForWorkRequestWithErrorHandling
      entityType: FusionEnvironment
      action: CreateFusionEnvironment
    update:
    - helper: tfresource.UpdateResource
    - helper: tfresource.WaitForWorkRequestWithErrorHandling
      entityType: FusionEnvironment
      action: UpdateFusionEnvironment
    delete:
    - helper: tfresource.DeleteResource
    - helper: tfresource.WaitForWorkRequestWithErrorHandling
      entityType: FusionEnvironment
      action: DeleteFusionEnvironment
  followUp:
    create: GetWorkRequest -> read-after-write
    update: GetWorkRequest -> read-after-write
    delete: GetWorkRequest -> confirm-delete
notes:
- The generated service manager uses the reviewed CRUD request, response, lifecycle,
  and status projection contract.
- Work-request phases are declared per operation from the vendored SDK response surface.
- Secret side effects are none and finalizer ownership is retained until confirmed
  deletion.
