elvetica" font-size="14" lengthAdjust="spacing" textLength="127.627" x="822" y="2115.7803">fusionEnvironmentId</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="144.751" x="822" y="2129.7803">create-only fields: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="287.9297" x="822" y="2143.7803">list lookup: scaffold_fusionapps_refreshactivity</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="215.5371" x="822" y="2157.7803">filters sourceFusionEnvironmentId,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="307.3984" x="822" y="2171.7803">timeScheduledStart; exact unique match on fields</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="255.2539" x="822" y="2185.7803">exposed by the scoped OCI list response</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="822" y="2199.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="822" y="2213.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="315.1982" x="822" y="2227.7803">The vendored SDK exposes create, delete through</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="284.0127" x="822" y="2241.7803">service work requests; the runtime polls those</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="277.8125" x="822" y="2255.7803">requests and preserves the tracked resource</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="183.6543" x="822" y="2269.7803">identity before rereading OCI.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="293.3643" x="822" y="2283.7803">Parent identifiers scope composite OCI request</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="319.8398" x="822" y="2297.7803">paths and remain replacement-only unless the SDK</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="231.9092" x="822" y="2311.7803">update details explicitly expose them.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="277.0605" x="822" y="2325.7803">Create, get, list where available, update, and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="267.7227" x="822" y="2339.7803">delete request shapes are exercised by the</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="290.2539" x="822" y="2353.7803">package-local typed OCI mock integration test.</text><?plantuml-src fLTTRzis57tdho2wbmsmagPfkyv11cH9rXPDco3kq1S31IrHDXUQr4ZARZRil-_mIvOLkqitzA6nI5xUZtFFFRHtGZNCi2Mr2rRfjL1pMZDfER7ToeoLTtEZMrMTQwaD_QukyQ_gxQXupLhfVjNAVM1BJjzmkU9Eb6ptdeduazEZvxr5PenU9-jFwwCVd_LFAktuBmzygEiVgvV3NTfKtAGTi-SlZf_-DDZXhq_hnyVFZrwywAq7ywKsYXjwz98uuIId4_v7orN9QK7hrWgjMDFOmrjU6suNPwKJA-7koK9KdDPQkvd-qhDey-6_2AMiTDfiUPWYpKl34Fap_gf-YcKOGp95mvJRVRw_uJ5MUbdeR4XHyokXjdFuqtDsF7k5LM-osLegPzKBVjGjFQZFgvhL9VcRXDZektR6aLZ7BUdvGS_XYD5IShFr-HTc-IqljIh5SEd9zUJwtOIRbIZvUwROd9idb5cw_MdhoFNvM-9hJ_KAbTssFHgSGnSONb4KLylMeTpZzEcm4coEcjh3-BlOR2bocG_iQfujL5mYshsdu_BsIQwgW56oIHOjVkxbQ4ovmlwMqm7-u6yAY6ns-xFRmOvfz_VtnjzitGzaUui_j9sIySOuWhB21pU4Vu00lTBw3lynX34JgY9CEkeCW84JW03_qaYK9DI3eb-KyvupQJYhxh4ghBDa-sxl3NQFwMlkXdToa5HdlZCdB5qAQq5Z-qnTuPw1hUzh8HqtTZnLLhUcvB-6JhzKAs6qMiBqsseqnGLBFYaNl6ebhoOE2FiXn6XuQzaCwV61ULXu4zuJ51EaW9xOvyivOdTy69dKkg5bMA8DGE4v-Upy_FBcu-N5YBxzyFdczlhrxULayYtPWXCXOxkT_UzLs17S3jmro2uinxvQeM1R612AMiTSQuCvdzBO7ZI1b5S9OHVXy