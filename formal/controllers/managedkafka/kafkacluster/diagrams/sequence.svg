3" y="2269.7803">work-request phases and service-local async</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="51.3721" x="783" y="2283.7803">adapter.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="294.9229" x="783" y="2297.7803">Lifecycle success and pending states mirror the</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="244.3301" x="783" y="2311.7803">production service-manager semantics.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="251.3506" x="783" y="2325.7803">Status projection is required, Secret side</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="260.7021" x="783" y="2339.7803">effects are none, and the finalizer policy is</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="178.1924" x="783" y="2353.7803">retain-until-confirmed-delete.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="271.585" x="783" y="2367.7803">Delete ownership is retained until a terminal</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="226.4404" x="783" y="2381.7803">lifecycle state or confirmed absence.</text><?plantuml-src jLTTRnit5dtdho2wBmbMikCcRbCPNg2rlMqGjrdOwUR5G47DS2IkAN9ASgne5_tlUou_HZEobBZTBGp8CqFoVfvxxgM_LwOLJgouNuhQhfLPy4PeBvdlL-QYkbyusvdwmchh-5-Q2d_rO4Sj6z7fy7ThmazY9VaFKZ_8e2gnVy-j-hVa9wy6Yy8vkyxINpGdNtyvF6biaDyzig5flgw_sjrbNIrTtZ5_TVhonJSxEqXzNd_vyjN9wUbWFOglh3FIyPElM511ItuhV-sagIIVyfKmOY7hUz7SY-Etz7kXEn-aOqjLIzvO6-Rsuq2WBsV_mpWNLR1kP61sj2pjUYY_bA-R5rY6CCHIjSA4_UU76vuYPH24NePMZRnMPXp2Rrw9b_FNM2MHxMYfcjUdygHVUfIUrureAlORYxxnjzrS8gv1UZQmWr_046UrHWY7dxyJNjx8offAxIvzyUxstTjRwHvK9N-C-N1VSE7v-DFeoBkBDunIp-q34ZkMFTavXo9mikPEUgkxeAoPvK_7jH8BvDGVf_VfTikqfFd8FooAX5fgU