schemaVersion: 1
surface: repo-authored-semantics
service: managedkafka
slug: kafkaclusterconfig
kind: KafkaClusterConfig
archetype: generated-service-manager
states:
  - provisioning
  - active
  - updating
  - terminating
repoAuthored:
  providerLifecycle:
    createPending: ["CREATING"]
    updatePending: ["UPDATING"]
    deletePending: ["CREATING","UPDATING"]
  listLookup:
    filters: ["compartmentId","displayName","id"]
    matchRule: exact resource identity match; duplicate matches fail
  mutation:
    mutable: ["definedTags","displayName","freeformTags","latestConfig.properties"]
    forceNew: ["compartmentId"]
  followUp:
    create: read-after-write
    update: read-after-write
    delete: confirm-delete
notes:
  - "The runtime uses its declared lifecycle-state contract for KafkaClusterConfig reconciliation."
  - "The credential-free mock exercises SDK request serialization, response projection, mutation when supported, and confirmed deletion."
