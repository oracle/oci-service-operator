schemaVersion: 1
surface: repo-authored-semantics
service: desktops
slug: desktoppool
kind: DesktopPool
archetype: generated-service-manager
states:
- provisioning
- active
- updating
- terminating
repoAuthored:
  operations:
    create:
    - CreateDesktopPool
    update:
    - UpdateDesktopPool
    delete:
    - DeleteDesktopPool
  providerLifecycle:
    createPending:
    - CREATING
    updatePending: []
    deletePending:
    - DELETING
  listLookup:
    filters:
    - availabilityDomain
    - compartmentId
    - displayName
    - id
    - state
    matchRule: exact declared filters match within the resource scope; duplicate matches
      fail
  mutation:
    mutable:
    - areVolumesPreserved
    - availabilityPolicy.startSchedule.cronExpression
    - availabilityPolicy.startSchedule.timezone
    - availabilityPolicy.stopSchedule.cronExpression
    - availabilityPolicy.stopSchedule.timezone
    - bootVolumeSizeInGbs
    - compartmentId
    - contactDetails
    - definedTags
    - description
    - devicePolicy.audioMode
    - devicePolicy.cdmMode
    - devicePolicy.clipboardMode
    - devicePolicy.isDisplayEnabled
    - devicePolicy.isKeyboardEnabled
    - devicePolicy.isPointerEnabled
    - devicePolicy.isPrintingEnabled
    - devicePolicy.isVideoInputEnabled
    - displayName
    - freeformTags
    - image.imageId
    - image.imageName
    - image.operatingSystem
    - maximumSize
    - sessionLifecycleActions.disconnect.action
    - sessionLifecycleActions.disconnect.gracePeriodInMinutes
    - sessionLifecycleActions.inactivity.action
    - sessionLifecycleActions.inactivity.gracePeriodInMinutes
    - standbySize
    - timeStartScheduled
    - timeStopScheduled
    forceNew:
    - arePrivilegedUsers
    - availabilityDomain
    - isStorageEnabled
    - networkConfiguration
    - networkConfiguration.subnetId
    - networkConfiguration.vcnId
    - nsgIds
    - privateAccessDetails
    - privateAccessDetails.nsgIds
    - privateAccessDetails.privateIp
    - privateAccessDetails.subnetId
    - sessionLifecycleActions
    - shapeConfig
    - shapeConfig.baselineOcpuUtilization
    - shapeConfig.memoryInGbs
    - shapeConfig.ocpus
    - shapeName
    - storageBackupPolicyId
    - storageSizeInGbs
    - useDedicatedVmHost
  hooks:
    create:
    - helper: tfresource.CreateResource
    update:
    - helper: tfresource.UpdateResource
    delete:
    - helper: tfresource.DeleteResource
  followUp:
    create: GetWorkRequest -> read-after-write
    update: GetWorkRequest -> read-after-write
    delete: GetWorkRequest -> confirm-delete
notes:
- The generated service manager uses the reviewed CRUD request, response, lifecycle,
  and status projection contract.
- Work-request phases are declared per operation from the vendored SDK response surface.
- Secret side effects are none and finalizer ownership is retained until confirmed
  deletion.
