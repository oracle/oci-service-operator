schemaVersion: 1
surface: repo-authored-semantics
service: dif
slug: stack
kind: Stack
archetype: generated-service-manager
states:
- provisioning
- active
- updating
- terminating
repoAuthored:
  operations:
    create:
    - CreateStack
    update:
    - UpdateStack
    delete:
    - DeleteStack
  providerLifecycle:
    createPending:
    - CREATING
    updatePending:
    - UPDATING
    deletePending:
    - DELETING
  listLookup:
    filters:
    - compartmentId
    - lifecycleState
    - displayName
    - id
    - opc-request-id
    matchRule: exact declared filters match within the resource scope; duplicate matches
      fail
  mutation:
    mutable:
    - stackTemplates
    - services
    - notificationEmail
    - adb
    - ggcs
    - dataflow
    - objectstorage
    - genai
    - freeformTags
    - definedTags
    forceNew:
    - displayName
    - compartmentId
    - aidataplatform
    - omk
    - oke
  hooks:
    create:
    - helper: tfresource.CreateResource
    - helper: tfresource.WaitForWorkRequestWithErrorHandling
      entityType: Stack
      action: CreateStack
    update:
    - helper: tfresource.UpdateResource
    - helper: tfresource.WaitForWorkRequestWithErrorHandling
      entityType: Stack
      action: UpdateStack
    delete:
    - helper: tfresource.DeleteResource
    - helper: tfresource.WaitForWorkRequestWithErrorHandling
      entityType: Stack
      action: DeleteStack
  followUp:
    create: GetWorkRequest -> read-after-write
    update: GetWorkRequest -> read-after-write
    delete: GetWorkRequest -> confirm-delete
notes:
- The generated service manager uses the reviewed CRUD request, response, lifecycle,
  and status projection contract.
- Work-request phases are declared per operation from the vendored SDK response surface.
- Secret side effects are none and finalizer ownership is retained until confirmed
  deletion.
