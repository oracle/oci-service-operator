schemaVersion: 1
surface: repo-authored-semantics
service: goldengate
slug: pipeline
kind: Pipeline
archetype: generated-service-manager
states:
- provisioning
- active
- updating
- terminating
repoAuthored:
  operations:
    create:
    - CreatePipeline
    update:
    - UpdatePipeline
    delete:
    - DeletePipeline
  providerLifecycle:
    createPending:
    - CREATING
    updatePending:
    - UPDATING
    deletePending:
    - DELETING
  listLookup:
    filters:
    - compartmentId
    - lifecycleState
    - lifecycleSubState
    - displayName
    - opc-request-id
    matchRule: exact declared filters match within the resource scope; duplicate matches
      fail
  mutation:
    mutable:
    - description
    - freeformTags
    - definedTags
    - subnetId
    - displayName
    - licenseModel
    - processOptions
    - mappingRules
    forceNew:
    - jsonData
    - locks
    - compartmentId
    - sourceConnectionDetails
    - targetConnectionDetails
    - recipeType
  hooks:
    create:
    - helper: tfresource.CreateResource
    - helper: tfresource.WaitForWorkRequestWithErrorHandling
      entityType: Pipeline
      action: CreatePipeline
    update:
    - helper: tfresource.UpdateResource
    - helper: tfresource.WaitForWorkRequestWithErrorHandling
      entityType: Pipeline
      action: UpdatePipeline
    delete:
    - helper: tfresource.DeleteResource
    - helper: tfresource.WaitForWorkRequestWithErrorHandling
      entityType: Pipeline
      action: DeletePipeline
  followUp:
    create: GetWorkRequest -> read-after-write
    update: GetWorkRequest -> read-after-write
    delete: GetWorkRequest -> confirm-delete
notes:
- The generated service manager uses the reviewed CRUD request, response, lifecycle,
  and status projection contract.
- Work-request phases are declared per operation from the vendored SDK response surface.
- Secret side effects are none and finalizer ownership is retained until confirmed
  deletion.
