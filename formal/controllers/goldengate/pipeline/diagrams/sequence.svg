5" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="174.3027" x="753" y="2129.7803">retain-until-confirmed-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="272.3984" x="753" y="2143.7803">requeue: provisioning, updating, terminating</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="265.3369" x="753" y="2157.7803">provider states: create CREATING; update</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="192.165" x="753" y="2171.7803">UPDATING; delete DELETING</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="234.9922" x="753" y="2185.7803">follow-up: create=GetWorkRequest -&gt;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="277.792" x="753" y="2199.7803">read-after-write; update=GetWorkRequest -&gt;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="273.1162" x="753" y="2213.7803">read-after-write; delete=GetWorkRequest -&gt;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="88.7031" x="753" y="2227.7803">confirm-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="259.8955" x="753" y="2241.7803">supported drift: description, freeformTags,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="203.5059" x="753" y="2255.7803">definedTags, subnetId (+4 more)</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="293.3643" x="753" y="2269.7803">reject before mutate: force-new fields jsonData,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="296.4678" x="753" y="2283.7803">locks, compartmentId, sourceConnectionDetails</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="61.0723" x="753" y="2297.7803">(+2 more)</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="144.751" x="753" y="2311.7803">create-only fields: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="279.3574" x="753" y="2325.7803">list lookup: unavailable filters compartmentId,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="286.3574" x="753" y="2339.7803">lifecycleState, lifecycleSubState, displayName</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="278.9404" x="753" y="2353.7803">(+1 more); exact declared filters match within</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="261.4746" x="753" y="2367.7803">the resource scope; duplicate matches fail</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="753" y="2381.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="753" y="2395.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="315.1777" x="753" y="2409.7803">The generated service manager uses the reviewed</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="286.3506" x="753" y="2423.7803">CRUD request, response, lifecycle, and status</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="118.2822" x="753" y="2437.7803">projection contract.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="301.1641" x="753" y="2451.7803">Work-request phases are declared per operation</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="261.4678" x="753" y="2465.7803">from the vendored SDK response surface.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="253.7021" x="753" y="2479.7803">Secret side effects are none and finalizer</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="284.0469" x="753" y="2493.7803">ownership is retained until confirmed deletion.</text><?plantuml-src jLZRSXit4dt7LtHbN-nQKh9iEN6eKgeIoPkuh8rJabr-uGiuWo5X3u49W27DtTf_tuFRN2WoOP9AvI7YeD7NqwSRjf-bQhZXQx8hNkgjL4kgU6q5izt9WXUVbqQtghpHjJRqZwh0V-L0eXGLRsltBwtSptmjw2THRuIJ1Jyiyo3_8-ZYSd38ZT7RfFrPTV7Dy-5DfPtuuP4FLVLD-VM-b3QbC4bYSVdonRDlzoIy-NJ-uiNbnSkNW_EWlj162KCNNpCdNIteGVpQ2bK8cj9IrwLGI-x4-I-o4RLKWgraAQZIsYtqbu4gcs_zbn7nmcapSYs5c8_sOnFFnQlg6OwX35cK3LVkyFsXm2bQ1k5tEcfPYJl4ChBmxIL_iNY5Kw-o6HqLY_AbkEYE7XNcLSMhWlsFXTZeRRiGoAWJbWtye1iuOdHT2pFw_0EtubuKMXLo_-YhTm_ltZu8iv65-3TNV2dCLyGjZJ-DhhoxUSDyqKblKDAnxidUFS3VY9ACiBfkdTHgbZwTbv8lKLDx7dzFUv5fBlEPtIopXbBKYFRexNWylYbK6S39-cJHzBj1ZcOa5EHRGHbuS3H5mdenVsaSvOowlvyORzAwfsmiuY-DSp7hbICQAtrK7U13qUbEwy_u7uVZ2wbAncj7pW0A44NHnPUcHX521GWTej1BE-Ar4RpSuLHQPzdOg7S3qZFwKRZEc00HTNexFTBIMbeBgZgcumu6iXBxf9Ar4yREvghGQu-FDHIzAIS1-SMkgCM3GrDFvgh_q2xYDogbRMg-2xJsv9yNSxNMHZnz6Y8sehLyWIpvC3qiMeEMXtie9aW1FN7CmHjameakpbhhXehmZHgWmRFmpVthxz-_-Vd7a_84Io5NXptw4ua_uFe1S3L8ArJ6hjcWHgDwIqKMIMnjKESJ5i5F2OcYJ6Yw3P-F-HLFEzUEIC6fIffrDh6HV1WGG3bN8rJ4d2VfdFFRrtUlJyovX_bOOGuIyE4AKK6WaehN67O68UEh3U1OrDhZ-PJy6k4uifYyzCaKeUVmtUnYnTEPHpR-02cHNbXeFjL0TAjtb5VebSTQ8yGop7oPepU89pZZGNUQmSXZsvNiKBf6Z1PecQkC-Gbz-EKs_TNL95YkvIOdmgi2DrauB-foohVWrxagZQmSYGslMnuSJn0BdrT8NkrvevyAOvydVcGyj4sZ3U19RLDwIxOr5I_4pBDXOMJZzKvOPOIej5c_vqixyUiDK5367xPTWCNVb62CInO8WzsBJw9mjF1N1ArR7y8C987-d2gnZK5OzibgTSiT1pa19L0rfYmMEngKhw0DRjnwXDGMXfvJD9IeEPFUle8zpgF7bCVsA6-iTyrTiK8ACPA-OC8Zxg8ESoyPP460jj91YjnAz3Ha2zs8ArQsVZZul0PHNq24q0