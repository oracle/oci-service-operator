ze="14" lengthAdjust="spacing" textLength="168.0957" x="778" y="2101.7803">kind: DatabaseRegistration</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="241.2402" x="778" y="2115.7803">archetype: generated-service-manager</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="156.4063" x="778" y="2129.7803">status/finalizer: required /</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="174.3027" x="778" y="2143.7803">retain-until-confirmed-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="272.3984" x="778" y="2157.7803">requeue: provisioning, updating, terminating</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="265.3369" x="778" y="2171.7803">provider states: create CREATING; update</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="192.165" x="778" y="2185.7803">UPDATING; delete DELETING</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="234.9922" x="778" y="2199.7803">follow-up: create=GetWorkRequest -&gt;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="277.792" x="778" y="2213.7803">read-after-write; update=GetWorkRequest -&gt;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="273.1162" x="778" y="2227.7803">read-after-write; delete=GetWorkRequest -&gt;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="88.7031" x="778" y="2241.7803">confirm-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="287.1504" x="778" y="2255.7803">supported drift: displayName, fqdn, username,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="124.8789" x="778" y="2269.7803">password (+7 more)</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="230.3301" x="778" y="2283.7803">reject before mutate: force-new fields</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="301.957" x="778" y="2297.7803">compartmentId, ipAddress, subnetId, databaseId</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="61.0723" x="778" y="2311.7803">(+3 more)</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="144.751" x="778" y="2325.7803">create-only fields: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="279.3574" x="778" y="2339.7803">list lookup: unavailable filters compartmentId,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="272.3438" x="778" y="2353.7803">lifecycleState, displayName, opc-request-id;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="291.7988" x="778" y="2367.7803">exact declared filters match within the resource</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="179.7646" x="778" y="2381.7803">scope; duplicate matches fail</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="778" y="2395.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="778" y="2409.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="315.1777" x="778" y="2423.7803">The generated service manager uses the reviewed</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="286.3506" x="778" y="2437.7803">CRUD request, response, lifecycle, and status</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="118.2822" x="778" y="2451.7803">projection contract.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="301.1641" x="778" y="2465.7803">Work-request phases are declared per operation</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="261.4678" x="778" y="2479.7803">from the vendored SDK response surface.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="253.7021" x="778" y="2493.7803">Secret side effects are none and finalizer</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="284.0469" x="778" y="2507.7803">ownership is retained until confirmed deletion.</text><?plantuml-src jLXTSzis5dt7hxZJVKcceXtNIPFAuywaTjfcucrsx6RoeXU812NK5C02e1HrP__x7e00FsHguxJRyOD90hYVvvvx8NilLSqDtv1TyqBlf5fHoIihcErMbZo_NndTgE9ALzhGFyeSVyLWHo5AtbJkHwtSBtmZw6THROMJEP_USoV_47JsVB38ZT6xAFrPUVRoc-59fPtuuO4DPVco-FPmbpQ5C777ylcBysVV7UpmwkFw-VdpinSl1kj1VAwD4eRElcLEkahGdVYz4IeNbD5ALuLGA-x4wJLtVCcjk1KhQPtXJch5rh8GL6hjblhJGAnD4lxDY7Zkj1cP6TrDIuT-Yc_4g_8PbY4C4PKrLsxw_733OwGCGj79g6GfRgGQ1_Axv_ny-GghNcGzMigNnGjnrYqzIDAhafSv-myBlj6xPYaGNISi6zX1Lp34wAeIPlJvXn3VNAjS7YvzzVxk_RixOROo5__aYg-4-OgufV6dqP7tLs-P1m3fBT8xbZqxE8TICA8W8wok6f_QUVnqMaY-GaxjQVkUzLkobEOJkrqb2OMeuEtHq-to-AHGHG0gwuD5sVU36Cr9AEnl14s1SA5CSelrPxo4iSjpwfwV6A_VkgTilCKV6WTcJfrmk6ObV5YeoL88SA0RhU_nZyEbfLG5uvKZxCZl4Hh0GNogAwGdv8PGEmeLjoTU6S6BFLOXphAn1Tucx9xJJy9DAXQWhav79rDQsaXhGMx7vDr0n9H0-wIKbHF6pXSgrnkFg0s4lYrceLRoVLw9EmTAc2rK8MrTyRrdm1dfEizYO3DPF0s-6z5OlaJmlCCUEeq1BS0u91p4WRevPjuLOkB4fCULrZNbOPrgeCSp-DNjczU_lltbfo-E7Ym84Posz2-cPiAz2LpM23OEjTMtHHP7w92ABCBTs23E1xKj8egn5aN4tdNuVCp6TdNIp2CdO60fpIQfsqg-K4Sy1RONwYYWseH5CIbXrszktlo9X7