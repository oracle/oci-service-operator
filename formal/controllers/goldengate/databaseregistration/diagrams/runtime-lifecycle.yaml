schemaVersion: 1
surface: repo-authored-semantics
service: goldengate
slug: databaseregistration
kind: DatabaseRegistration
archetype: generated-service-manager
states:
- provisioning
- active
- updating
- terminating
repoAuthored:
  operations:
    create:
    - CreateDatabaseRegistration
    update:
    - UpdateDatabaseRegistration
    delete:
    - DeleteDatabaseRegistration
  providerLifecycle:
    createPending:
    - CREATING
    updatePending:
    - UPDATING
    deletePending:
    - DELETING
  listLookup:
    filters:
    - compartmentId
    - lifecycleState
    - displayName
    - opc-request-id
    matchRule: exact declared filters match within the resource scope; duplicate matches
      fail
  mutation:
    mutable:
    - displayName
    - fqdn
    - username
    - password
    - aliasName
    - description
    - freeformTags
    - definedTags
    - connectionString
    - sessionMode
    - wallet
    forceNew:
    - compartmentId
    - ipAddress
    - subnetId
    - databaseId
    - vaultId
    - keyId
    - secretCompartmentId
  hooks:
    create:
    - helper: tfresource.CreateResource
    - helper: tfresource.WaitForWorkRequestWithErrorHandling
      entityType: DatabaseRegistration
      action: CreateDatabaseRegistration
    update:
    - helper: tfresource.UpdateResource
    - helper: tfresource.WaitForWorkRequestWithErrorHandling
      entityType: DatabaseRegistration
      action: UpdateDatabaseRegistration
    delete:
    - helper: tfresource.DeleteResource
    - helper: tfresource.WaitForWorkRequestWithErrorHandling
      entityType: DatabaseRegistration
      action: DeleteDatabaseRegistration
  followUp:
    create: GetWorkRequest -> read-after-write
    update: GetWorkRequest -> read-after-write
    delete: GetWorkRequest -> confirm-delete
notes:
- The generated service manager uses the reviewed CRUD request, response, lifecycle,
  and status projection contract.
- Work-request phases are declared per operation from the vendored SDK response surface.
- Secret side effects are none and finalizer ownership is retained until confirmed
  deletion.
