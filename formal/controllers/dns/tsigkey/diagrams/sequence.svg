ough DELETING;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="284.0605" x="754" y="2129.7803">an auth-shaped 404 is confirmed by an empty</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="275.4609" x="754" y="2143.7803">compartment/name/id list before completion.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="271.5918" x="754" y="2157.7803">Only tags update in place. Algorithm, name,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="301.1367" x="754" y="2171.7803">compartmentId, and the write-only secret require</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="252.9023" x="754" y="2185.7803">replacement; secret is never projected to</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="41.2412" x="754" y="2199.7803">status.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="270.04" x="754" y="2213.7803">The runtime has no Kubernetes Secret side</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="45.1309" x="754" y="2227.7803">effects.</text><?plantuml-src hLZVRzis47xdNt7eNbh0SfertJe77P0bMHSqMuScsru25BH4sLmaKYCfkzcm_tqVALAM77lrVg0FjKJoU7VVTz-TOk-bQhZXDTabB_HQgWMLlBA2sNvbplFxXT6jAivrfGrzLkRuLmns5ABaRUM-rShzm6j1tubg9PpC-UuzD_9tGSSdWqLkZ5v7wy_Buoy_7vvKsebl7lbGbbyMNsplqgOG9kwOdxnyyVohhHt--hZ-uiN9ySkNW_LWFjT62KF7Np0dNINeHlpM2fKBogXGzkZMoiLRyS2MiX1KQktc-kF0X4sx_s14F7VQZ5oAeQMbxPZ4v-9L-HpBC8RioOOhj_lySCCXLWPXzpOgMOfhgSP9--g4lvY_mgetsOoMyddnKXptIuy0ULNoCcT_iX0RlMtd0fbqmhA17tGEHuokAc56hx_XLhmNkLQvt5vwykxctTiROLOo5zzpnHV2F25kQVngTEJT-HNpO9DU0SgnxSdMET3UY8ACiBfgdTHg5byT5P8lWAazwfwppPOimJorgqMoK8WAqUuztIsFJmfL15AoJR8e-tgGena9XVsjeCWx-1a3OPjT_imuo1drlvyQVwDrpzXuYpyqJiLiOnp1MEc3Id