t><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="229.5371" x="702.2975" y="1912.7803">Controller-local activity diagrams add</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="238.8955" x="702.2975" y="1926.7803">list-lookup hints, secret policies, delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="200.0332" x="702.2975" y="1940.7803">handling, and open formal gaps.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="281.709" x="702.2975" y="1954.7803">archetype batch: Generated service-manager</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="291.0469" x="702.2975" y="1968.7803">controllers specialize the shared reconcile path</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="189.8477" x="702.2975" y="1982.7803">with formal runtime ownership.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="74.6963" x="702.2975" y="1996.7803">service: dns</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="188.3232" x="702.2975" y="2010.7803">slug: steeringpolicyattachment</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="193.7646" x="702.2975" y="2024.7803">kind: SteeringPolicyAttachment</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="241.2402" x="702.2975" y="2038.7803">archetype: generated-service-manager</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="156.4063" x="702.2975" y="2052.7803">status/finalizer: required /</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="174.3027" x="702.2975" y="2066.7803">retain-until-confirmed-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="210.9023" x="702.2975" y="2080.7803">requeue: provisioning, terminating</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="304.2607" x="702.2975" y="2094.7803">provider states: create CREATING; update none;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="112.0479" x="702.2975" y="2108.7803">delete DELETING</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="209.6992" x="702.2975" y="2122.7803">follow-up: create=read-after-write;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="288.7158" x="702.2975" y="2136.7803">update=read-after-write; delete=confirm-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="178.1992" x="702.2975" y="2150.7803">supported drift: displayName</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="230.3301" x="702.2975" y="2164.7803">reject before mutate: force-new fields</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="239.6816" x="702.2975" y="2178.7803">steeringPolicyId, zoneId, domainName</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="144.751" x="702.2975" y="2192.7803">create-only fields: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="303.5088" x="702.2975" y="2206.7803">list lookup: oci_dns_steering_policy_attachments</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="280.9092" x="702.2975" y="2220.7803">filters steeringPolicyId, zoneId, domainName;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="280.9639" x="702.2975" y="2234.7803">Adopt only a unique attachment matching the</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="158.7646" x="702.2975" y="2248.7803">policy, zone, and domain.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="702.2975" y="2262.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="702.2975" y="2276.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="283.2334" x="702.2975" y="2290.7803">CREATING requeues and ACTIVE succeeds;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="279.3711" x="702.2975" y="2304.7803">displayName updates settle without a distinct</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="134.6338" x="702.2975" y="2318.7803">update lifecycle state.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="280.8955" x="702.2975" y="2332.7803">List requests resolve compartmentId from the</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="276.2744" x="702.2975" y="2346.7803">parent steering policy before applying policy,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="175.1025" x="702.2975" y="2360.7803">zone, and domain selectors.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="252.9434" x="702.2975" y="2374.7803">Delete treats an auth-shaped Get 404 as</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="278.5986" x="702.2975" y="2388.7803">ambiguous until the scoped attachment list is</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="295.6816" x="702.2975" y="2402.7803">empty, then synthesizes the DELETED terminal</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="57.5859" x="702.2975" y="2416.7803">outcome.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="284.0332" x="702.2975" y="2430.7803">Attachment identity fields require replacement</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="261.4951" x="702.2975" y="2444.7803">and no Kubernetes Secret side effects are</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="50.5859" x="702.2975" y="2458.7803">present.</text><ellipse cx="665.2975" cy="2147" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="665.2975" cy="2147" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="665.2975" x2="665.2975" y1="157" y2="177"/><polygon fill="#0F172A" points="661.2975,167,665.2975,177,669.2975,167,665.2975,171" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="816.7633" x2="816.7633" y1="341" y2="361"/><polygon fill="#0F172A" points="812.7633,351,816.7633,361,820.7633,351,816.7633,355" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="816.7633" x2="816.7633" y1="423" y2="443"/><polygon fill="#0F172A" points="812.7633,433,816.7633,443,820.7633,433,816.7633,437" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="523.8317" x2="513.8317" y1="257" y2="257"/><line style="stroke:#0F172A;stroke-width:1;" x1="513.8317" x2="513.8317" y1="257" y2="279"/><polygon fill="#0F172A" points="509.8317,269,513.8317,279,517.8