xt fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="252.9434" x="815" y="2155.7803">Delete treats an auth-shaped Get 404 as</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="278.5986" x="815" y="2169.7803">ambiguous until the scoped attachment list is</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="295.6816" x="815" y="2183.7803">empty, then synthesizes the DELETED terminal</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="57.5859" x="815" y="2197.7803">outcome.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="284.0332" x="815" y="2211.7803">Attachment identity fields require replacement</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="261.4951" x="815" y="2225.7803">and no Kubernetes Secret side effects are</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="50.5859" x="815" y="2239.7803">present.</text><?plantuml-src hLXRRzms5dxdho2wBorWsN7ZjEa4MS1rlAqHRrF4tJuD472aenbkDAIMf6OwBVQ_z-DDb_4eDTh23_A8vBb-vpk7iX-bQeKHMsutej9xgTQy5eqbPlkLbIW_hetkL7MZ6stuF-eIVzLeHqMrw1htBwtS3s9B_7jgTkHaAKxlUP2_4h-y6YqAO_G-INzMNtxzvVYaqew-VMH3NNzTVNMyIvkAJDgnkdhn_DatHpky-hJ-_FdLvOiNe_KWljH6aU6NNp4dNKFyWVxNaIg95xnIzkB14Ha4wKVToF9mxPmeDrjIZcraHRpMsgtqBoEPDX__ZN4kIgVDnCRaQruwTfA-f9VrCon36C8fMw7SwVFZ3K-HCef3BwEHDTrBDOtYDrVY-UebLht8Th9KhgeNTDalFShGorhK9Vi_2xxnjzsA45f7betiu3SmnEYc8JDv_Qsmz9vAhKfvlFJPkuTtRn_8x6H9_nPAhCbyneNbqrUJ8-zkxfZFFjSxv7Og--pe7Eh0KCKDMTrqJcgrIAykAYdMoAczYB-BOKkHqtnkT-iieQ86tiwUZilJawIgW58s18iN_np5QC59ONy7NCu0SQbCTeqDvxoKgTiBtl__kV4sMFS5csxnXwR1MV1UEDop4duirMn915ZmUwq_uY7WsaggYed6SMS05eG8iA1VMXoJ8KSSDQHGTWSk6aEYEc1LMcVPr0fl5tOl-7VaPfKJEApNqykLbc-bjJWm9_CU2kU4sizhsJWoTh5KThBdhZhZlsf5U2vLfRT2Aa-4NmHl3NLMh10oxw87JMT02305gGPbe6BcZBb151pD-