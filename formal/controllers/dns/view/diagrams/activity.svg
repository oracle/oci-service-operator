<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="2407px" preserveAspectRatio="none" style="width:1273px;height:2407px;background:#FCFCFD;" version="1.1" viewBox="0 0 1273 2407" width="1273px" zoomAndPan="magnify"><title>Activity - dns/View</title><defs/><g><rect fill="#FCFCFD" height="2407" style="stroke:none;stroke-width:1;" width="1273" x="0" y="0"/><g class="title" data-source-line="10"><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="123.6963" x="573.3672" y="30.7803">Activity - dns/View</text></g><ellipse cx="673.4673" cy="55" fill="#1D4ED8" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="none" height="444" rx="8" ry="8" style="stroke:#000000;stroke-width:1.5;" width="666.4736" x="352.2976" y="75"/><path d="M474.366,75 L474.366,82 L464.366,92 L352.2976,92" fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="112.0684" x="355.2976" y="86.7803">Observe and Bind</text><rect fill="#F8FAFC" height="48" rx="8" ry="8" style="stroke:#0F172A;stroke-width:0.5;" width="304.7852" x="521.0747" y="109"/><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="136.9375" x="531.0747" y="129.7803">Start from shared flow</text><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="284.7852" x="531.0747" y="143.7803">shared/diagrams/shared-reconcile-activity.svg</text><rect fill="#F8FAFC" height="48" rx="8" ry="8" style="stroke:#0F172A;stroke-width:0.5;" width="297.04" x="524.9473" y="177"/><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="277.04" x="534.9473" y="197.7803">Read desired View spec, tracked status, and</text><text fill="#0F172A" font-family="Helvetic