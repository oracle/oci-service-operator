ues and ACTIVE is the steady state.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="287.1367" x="710.4673" y="2331.2803">Delete retains the finalizer through DELETING</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="236.5508" x="710.4673" y="2345.2803">until DELETED or confirmed absence.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="245.1572" x="710.4673" y="2359.2803">Display name and tags update in place;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="280.9092" x="710.4673" y="2373.2803">compartmentId requires replacement, with no</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="194.5508" x="710.4673" y="2387.2803">Kubernetes Secret side effects.</text><ellipse cx="673.4673" cy="2117.5" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="673.4673" cy="2117.5" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="673.4673" x2="673.4673" y1="157" y2="177"/><polygon fill="#0F172A" points="669.4673,167,673.4673,177,677.4673,167,673.4673,171" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="835.0857" x2="835.0857" y1="341" y2="361"/><polygon fill="#0F172A" points="831.0857,351,835.0857,361,839.0857,351,835.0857,355" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="835.0857" x2="835.0857" y1="409" y2="429"/><polygon fill="#0F172A" points="831.0857,419,835.0857,429,839.0857,419,835.0857,423" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="532.0015" x2="511.8489" y1="257" y2="257"/><line style="stroke:#0F172A;stroke-width:1;" x1="511.8489" x2="511.8489" y1="257" y2="279"/><polygon fill="#0F172A" point