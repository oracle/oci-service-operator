" textLength="294.9912" x="735" y="2129.7803">unique zone in the requested scope and private</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="31.8965" x="735" y="2143.7803">view.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="735" y="2157.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="735" y="2171.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="356.3506" x="735" y="2185.7803">CREATING and UPDATING requeue, ACTIVE succeeds,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="306.5986" x="735" y="2199.7803">FAILED is terminal, and delete completes only on</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="206.9785" x="735" y="2213.7803">DELETED or confirmed absence.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="303.4883" x="735" y="2227.7803">Private-zone lookup preserves scope plus viewId</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="245.1709" x="735" y="2241.7803">and does not conflate global zones with</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="164.9648" x="735" y="2255.7803">same-name private zones.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="298.8125" x="735" y="2269.7803">Tags, resolution/DNSSEC settings, and external</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="249.0605" x="735" y="2283.7803">transfer endpoints update in place; zone</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="213.2197" x="735" y="2297.7803">identity fields require replacement.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="270.04" x="735" y="2311.7803">The runtime has no Kubernetes Secret side</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="45.1309" x="735" y="2325.7803">effects.</text><?plantuml-src fLXhR-Cs5ltENq6qNsPGAvdCkmvcWTH9kq7JcM8otGKM0GfQkhAv8vDQah8dBVhVU_YI9STkN2pomRPuUP_dddiL-rcgLXYnudOfAhsHQi5hqLXYjZ-PY_BpmkXELJFTQCE_halyLGE9YchHDUvxhTnxiIB-JshMv6GfzilSoj-8dxqS70fZz2PfVrQVlNa-lAcqe-yU-53NRwhNkrBQL6IInFpbgnVFljsHyERJ-OiNByzUlHgS1_MbDeeCFtlDd7GDyLlwNqUg95xmIjdJ_sX5R2ahuhNMRgw_3ExRBFexuroKJfkHFockVBGR43sdj_Kp74CPKYTReTp--qE1OxGCOkvrDBAc6wd66VlsfNWnVujJhx8T7PNpwXMTzKSFgl6s5dN9_c0XDlvZDoUaqP5b0p_u38uOtJHaHe-_4vO-KgbLANUFllfm--77Mp9hMT9FGea5cQ-ui7pyQ7Jbm-oQ-KfplKOTnxedE_U0UKCLDsHrqpcfrJGzEgsaMA2czZJ-BhOYHIxpYLqlieQA6aHxy7Oy7jyaLGL4icsoUF6FGOwcd1JaE-8UT70oHS6s8lx2EC8fxxy_CTwSTK_PMCHV6kTXkbMEIApq4GMWXsBp6wq_uqF0uRbK5HEDuyu00X13iUbBso3v8VCSdQ7GEFTSD8P4TOzJQPrbOuFU1KXF-G_aWY42u_GwUntIyfMq5fnqwFuDb7i5zaaj6qV6JdcfLnuEA-YuhYPtIe6G9joMkiN7MjBckdeQGZ3KMJ57oDvlNz_Ee7TX4rL1TmFSXwpE49gZu7YZTSlBy9ktAAddpzd7gujFr-z_U3HeM0Y1x_VaRsPmZxjxqD4YHr0N8Rz6iaT5aufR9rndWpgVf8XSdg14LOB4PNXyoATu6jmw8067QcbMMVrQYXm847Md-hB6_2QfdD_Bgvkh8_BhiRbLb0Cg6n8A4U2mbaeq64K6uU6f3SMVDzg3y9XS6d826KlU-SHHQ18yD_UnikdCOn9Vm1vSpoqq7siWkhLrLDG0-KEj4KePJhwaqHl44vpnu3hEO2ISpLBsQ5mXHWjatAcCwmd_vUVBzAslHR3So7LEX5S58h5mdfgg41iGuPsgZAmTfxLeEX4SJt0AZvT8NkERVKlVOvyddjjlkxRL1b3aNLjvIxOpjIXfocj3L6kp-YGMTiAmRs2-LU77WE5_qXLu0AFSKddhFMLFlddELzhGK_QH_akbutElXVYgyyTGgz6DXQ9D3CMoo2XZdXaJ37_opHcBEXDv7g0d7dInqULyPILSkKGwfloYqgtZMZMWLTufYIAntpp2WJwt77Hdz2A0i3LoxQFpEa-smyOhsWQ49l2T2Ffslh5YTG2Q2l0gtR4W7IRDOoOaBgFI6xHzoVoH9xh7BQLUlcXRH3q3D1Q1K6RRz87RVma8YCtkimCNUXEnM7TgX0e-HCMT-WjOe8JFxrIiOI2XXBPCGha5ZYBvmwF4T8elgG4jyoNA3d_ZC7ddwZm8JkAu-PX-dj-fwCfG92OYYo2omTc_XSGAQA985OA3ZiWXGnsHjREEGmwBK90QwuVU542fnTHsjBZ