schemaVersion: 1
surface: repo-authored-semantics
service: announcementsservice
slug: announcementsubscription
kind: AnnouncementSubscription
archetype: generated-service-manager
states:
  - provisioning
  - active
  - updating
  - terminating
repoAuthored:
  providerLifecycle:
    createPending: []
    updatePending: []
    deletePending: ["DELETING"]
  listLookup:
    filters: ["compartmentId","displayName","id","state"]
    matchRule: exact resource identity match; duplicate matches fail
  mutation:
    mutable: ["compartmentId","definedTags","description","displayName","freeformTags","onsTopicId","preferredLanguage","preferredTimeZone"]
    forceNew: ["filterGroups","filterGroups.filters","filterGroups.filters.type","filterGroups.filters.value"]
  followUp:
    create: read-after-write
    update: read-after-write
    delete: confirm-delete
notes:
  - "The AnnouncementSubscription runtime retains package-local lifecycle, identity, mutation, and delete handling."
  - "The credential-free evidence mock verifies the recorded create/update payloads, SDK response decoding, status projection, and delete confirmation."
