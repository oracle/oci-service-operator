" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="2225.78" y="476.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="2225.78" y="490.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="272.3369" x="2225.78" y="504.7803">The runtime uses its declared lifecycle-state</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="203.0889" x="2225.78" y="518.7803">contract for Profile reconciliation.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="301.123" x="2225.78" y="532.7803">The credential-free mock exercises SDK request</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="265.3643" x="2225.78" y="546.7803">serialization, response projection, mutation</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="252.9434" x="2225.78" y="560.7803">when supported, and confirmed deletion.</text></g><g class="entity" data-qualified-name="GMN5" data-source-line="94" id="ent0006"><path d="M2929.33,635 L2929.33,643.03 L2458.44,626.23 L2929.33,651.03 L2929.33,671 A8,8 0 0 0 2937.33,679 L3192.8945,679 A8,8 0 0 0 3200.8945,671 L3200.8945,637 L3190.8945,627 L2937.33,627 A8,8 0 0 0 2929.33,635" fill="#FFF7D6" style="stroke:#B45309;stroke-width:0.5;"/><path d="M3190.8945,627 L3190.8945,633 A4,4 0 0 0 3194.8945,637 L3200.8945,637 L3190.8945,627" fill="#FFF7D6" style="stroke:#B45309;stroke-width:0.5;"/><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="136.9717" x="2935.33" y="642.7803">delete policy: required</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="250.5645" x="2935.33" y="656.7803">delete observe: GetProfile