7" y="2115.7803">supported drift: defined_tags, description,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="180.5371" x="747" y="2129.7803">display_name, freeform_tags</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="230.3301" x="747" y="2143.7803">reject before mutate: force-new fields</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="100.3789" x="747" y="2157.7803">compartment_id</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="144.751" x="747" y="2171.7803">create-only fields: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="266.1572" x="747" y="2185.7803">list lookup: oci_ai_language_projects filters</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="298.833" x="747" y="2199.7803">compartment_id, display_name, id; Adopt only a</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="326.0674" x="747" y="2213.7803">unique paginated non-DELETED ListProjects match;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="302.7158" x="747" y="2227.7803">delete fallback prefers status.compartmentId and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="305.0674" x="747" y="2241.7803">status.displayName before spec values and adds</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="281.6953" x="747" y="2255.7803">the tracked projectId when GetProject returns</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="65.3721" x="747" y="2269.7803">NotFound.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="747" y="2283.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="747" y="2297.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="291.0264" x="747" y="2311.7803">Create and delete persist the in-flight OCI work</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="285.5576" x="747" y="2325.7803">request in `status.async.current`, normalize AI</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="299.6396" x="747" y="2339.7803">Language `OperationStatus*` values into shared</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="267.668" x="747" y="2353.7803">async classes, and normalize work-request</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="263.0332" x="747" y="2367.7803">`OperationType*` values into create/delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="294.9844" x="747" y="2381.7803">phases before deriving conditions and requeue.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="286.7061" x="747" y="2395.7803">Update accepts the live service's synchronous</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="319.0264" x="747" y="2409.7803">HTTP 200 response when no `opc-work-request-id`</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="270.8193" x="747" y="2423.7803">is present, rereads the Project, and keeps a</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="287.957" x="747" y="2437.7803">lifecycle-sourced pending update until mutable</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="295.6953" x="747" y="2451.7803">fields converge. The work-request path remains</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="258.3848" x="747" y="2465.7803">supported when OCI supplies the header.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="307.3369" x="747" y="2479.7803">Create recovers the Project OCID from the create</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="230.3096" x="747" y="2493.7803">response when OCI returns it or from</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="305.8057" x="747" y="2507.7803">work-request resources when the response omits</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="254.4473" x="747" y="2521.7803">it, then polls `GetProject` until the Project</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="308.9775" x="747" y="2535.7803">becomes readable. Update gates completion on a</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="268.4678" x="747" y="2549.7803">readable `GetProject` whose mutable fields</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="295.5313" x="747" y="2563.7803">match. Retryable 409 "currently being modified"</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="270.0264" x="747" y="2577.7803">conflicts project a lifecycle-sourced pending</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="295.6816" x="747" y="2591.7803">update when OCI omits a work-request ID; later</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="276.2129" x="747" y="2605.7803">reconciles reread `GetProject`, clear async if</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="270.8193" x="747" y="2619.7803">mutable drift is already gone, and otherwise</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="291.0605" x="747" y="2633.7803">back off for one normal requeue interval before</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="286.3779" x="747" y="2647.7803">retrying `UpdateProject` instead of hot-looping</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="165.7236" x="747" y="2661.7803">on every `ACTIVE` reread.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="308.998" x="747" y="2675.7803">Pre-create lookup adopts only a unique paginated</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="248.9648" x="747" y="2689.7803">non-`DELETED` `ListProjects` match on</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="272.3301" x="747" y="2703.7803">`compartmentId` and `displayName`. Delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="245.0957" x="747" y="2717.7803">fallback reuses `status.compartmentId`,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="279.3369" x="747" y="2731.7803">`status.displayName`, and tracked `projectId`</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="296.4609" x="747" y="2745.7803">when `GetProject` returns NotFound so finalizer</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="288.7568" x="747" y="2759.7803">release does not depend on stale spec values.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="211.6201" x="747" y="2773.7803">Only `displayName`, `description`,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="288.6816" x="747" y="2787.7803">`freeformTags`, and `definedTags` reconcile in</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="308.9023" x="747" y="2801.7803">place. `compartmentId` remains replacement-only</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="246.6543" x="747" y="2815.7803">drift, so the live runtime never exercises</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="302.6953" x="747" y="2829.7803">provider-only `ChangeProjectCompartment`, and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="236.5645" x="747" y="2843.7803">the runtime has no secret side effects.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="265.3369" x="747" y="2857.7803">Delete is not best-effort. The finalizer stays</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="270.0332" x="747" y="2871.7803">until the delete work request is terminal and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="285.5166" x="747" y="2885.7803">`GetProject` or fallback `ListProjects` confirms</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="276.2539" x="747" y="2899.7803">the Project is gone or exposes lifecycle state</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="77.7861" x="747" y="2913.7803">`DELETED`.</text><?plantuml-src fLbhSzku5VsENu59FtIt8ydEQpUH9vt9skckPzCuOtlRBvun8HAKq5002v1Ir4x_Uy_5Wm_PSjJkv4CK0houZtFFFM3S5wLhOSMQkvKep5Rf9Iz5vIHptSf2v5-MrhIwE3ULiVmFPOu_nM178KlHLirVZ6u-YRNalyXg8nkLYyVttAX_IVxyrM1HM6ksqVff-Vp75yCtjMdaJmzyACiVYn_sTnbRI1jtB5wzVddwTcy77H_NNxvyzVprwy6wDvyRgwNbptzWZMegoM_aFrkfSycdNAXAw6KhblBaipN_a7d3LggGl3IcMPYl0qiklVHlnhd86sD7diK8qz9-QFA5V5EUOXd6a4HL2zqy_lvmmp5M1j5tDYfLoezAZtFtzfLukNY3LJ9PZvRoHV5QFk-M7jJbJIdAdFs7-TZuh-r28g6DT6pW1p-78zPKbRIZnpy99wzbRdIkzfUUNTrS_NeZxKRbygz2emZs6HUEZn-DNhawlsHKSsusgEZOzcJlFQ3Voe9RwKpLDiheUNnqKYYnH4tTIVZtjDyoJMMUkSqoMIXaXMWFlXsMnszANNXiiZvPVFhdGOxcN6hiRoMFk8EVCH3Mxw9tna7EUVVxEqidkkPxDjv2BurJCU-D8nYdAAW4Trzo_j6OB_XBmEs5qWKJLSCR2o1W9qeklzOLIk3ppz4V6esquwAoKXGxh2hNE3O-axp0xZd_MJRfB0aIwinsPfJZQ-KSQEgGYO-m7ssuxqfLDTAw-PtEpPgmiOQTUrLCUA5SNOdTlGPVJM3_Un-6bQqJ2qHElbEbMuikng6e3_eSC3zqx3d2QsHolZAcvhb_n6lKbsZr_Fh3-zlBJpyV4plEyV4_xi__dij7_7u4BJLI1OkX2pP8-wY2IdFNYAPrtXnbAu2PHsZ98kBZmZy-v5POJPuTs0IVIcNNwOID4eDm0B8xFInpI7VScz9zyU7ZX-FIJQ0TcKlnvPKK6W5XlLHQL1XR5j7YgVEWM5I6q7bCQgri118OVQGyIjz0U6vteTPnZO2A7-0NRXOEbeyz8BZLEofAGF-XrG2k132gSF06yNXd26x77HWeQRjI7JxNYD41A7SwWNt2V_jy4Nzr5V4dLsgJ4a6cm3CEpikgc8ejgF9E5rQL3PSRKRN2EnxHvH-laBoAMA0d-B7F4sB_cxQkZGKoULiNT99hRIboEISrWfbNt3TYwIOCF9TRLTCf-ynGMYbBOzT-9xkM7Z0BUYJvkYNtvo06TELKosq8mB4nsR18c8cC-1uNiNqkIY-iHPEl4EISlozC3Ppg2aJAMwsGUeow9MfDmMdC8f_S3nTZ87i3Pma3q7KLQJbUMrd24HRQUJPmvx8WLAQ5w9UNT35aLykSKqamq0c_eYWSRrOzKzVXR1ZQhgHcWou3kbeBU7moq25Wqba_-2YuFebeD-f_39666ZdW0F0i44JU7DiEmq8HEdsn4lxfGDU1WvQ8PBzzKkIEztMDIfm3XCl4PETz4YTt-ZSFjuvVg6vm91rqfmDEnYZaGnG2_a_0qFDTX7JYkzHdnuwNmwFCjfglP8Lfm5S0eiFmz9FitMZ6dTtfuC6xKR1u7E3sxYYY5pwJ9GICsKu1UGSSDNAvwyw4stytzijrc37qNXz8xy80Pe7st4xdAskqQU7-YzFJCxvdYD3f8L0fMVHEFpZkJlUsJuRDHPB23wcewOuTig6ttaNEAoO4XaZPxyAKcBOOkDKqckz4epzWNxtjwSH4oXWUQCIDSi0Im349OA5VTnhfMHDnTEnfrN85a9RySKqS9Upl4yJVjFAOCBvfq560lbbxYdcWqVjx5bg30KyNNf3wW16kY78f4gKdTsAtWAofiTFOGjHgn9Gpzb7iaDN1OMbWfuCyRBg2CHICr94V6sdG-gh5uxR0qZJg8rQZIDutGyCANlGAmxV1Z0cRhsIpgq6tv0yrBIwZdkDTgCrq7OkJTrLtiNqEv8W