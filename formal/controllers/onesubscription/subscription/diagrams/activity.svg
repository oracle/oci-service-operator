ngth="84.0342" x="34.8726" y="587.7803">provider facts</text><rect fill="#F8FAFC" height="48" rx="8" ry="8" style="stroke:#0F172A;stroke-width:0.5;" width="283.0127" x="25.6655" y="636"/><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="263.0127" x="35.6655" y="656.7803">Confirm deletion via ListSubscriptions until</text><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="190.6338" x="35.6655" y="670.7803">OCI reaches LOCAL_DELETE</text><rect fill="#F8FAFC" height="48" rx="8" ry="8" style="stroke:#0F172A;stroke-width:0.5;" width="292.3438" x="21" y="719"/><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="272.3438" x="31" y="739.7803">Allow best-effort completion without finalizer</text><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="54.4824" x="31" y="753.7803">retention</text><ellipse cx="167.1719" cy="825" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="167.1719" cy="825" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><rect fill="none" height="239" rx="8" ry="8" style="stroke:#000000;stroke-width:1.5;" width="345.916" x="348.2144" y="519"/><path d="M499.0483,519 L499.0483,526 L489.0483,536 L348.2144,536" fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="140.834" x="351.2144" y="530.7803">Lifecycle Classification</text><rect fill="#F8FAFC" height="48" rx="8" ry="8" style="stroke:#0F172A;stroke-width:0.5;" width="293.916" x="368.2144" y="602"/><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="273.916" x="378.2144" y="622.7803">Return an unsuccessful reconcile result until</text><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="133.041" x="378.2144" y="636.7803">OCI reaches ACTIVE</text><ellipse cx="515.1724" cy="696" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="515.1724" cy="696" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#E2E8F0" points="394.6514,553,635.6934,553,647.6934,565,635.6934,577,394.6514,577,382.6514,565,394.6514,553" style="stroke:#1D4ED8;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="21.7861" x="519.1724" y="587.7803">yes</text><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="241.042" x="394.6514" y="568.7803">"OCI state is outside success targets?"</text><rect fill="none" height="617" rx="8" ry="8" style="stroke:#000000;stroke-width:1.5;" width="355.6572" x="343.3438" y="785"/><path d="M509.7637,785 L509.7637,792 L499.7637,802 L343.3438,802" fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="156.4199" x="346.3438" y="796.7803">Ready and Drift Handling</text><rect fill="#F8FAFC" height="48" rx="8" ry="8" style="stroke:#0F172A;stroke-width:0.5;" width="296.2402" x="367.0522" y="819"/><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="276.2402" x="377.0522" y="839.7803">Compare live OCI state against the imported</text><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="75.4824" x="377.0522" y="853.7803">field surface</text><rect fill="#F8FAFC" height="104" rx="8" ry="8" style="stroke:#0F172A;stroke-width:0.5;" width="303.6572" x="363.3438" y="936"/><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="282.4473" x="373.3438" y="956.7803">Reject drift before OCI mutation for force-new</text><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="230.3438" x="373.3438" y="970.7803">fields compartment_id, plan_number,</text><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="259.1367" x="373.3438" y="984.7803">subscription_id, buyer_email and conflicts</text><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="283.6572" x="373.3438" y="998.7803">buyer_email -&gt; plan_number, subscription_id,</text><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="283.6572" x="373.3438" y="1012.7803">plan_number -&gt; subscription_id, buyer_email,</text><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="279.7676" x="373.3438" y="1026.7803">subscription_id -&gt; plan_number, buyer_email</text><ellipse cx="515.1724" cy="1071" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="515.1724" cy="1071" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#E2E8F0" points="389.5894,887,640.7554,887,652.7554,899,640.7554,911,389.5894,911,377.5894,899,389.5894,887" style="stroke:#1D4ED8;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="21.7861" x="519.1724" y="921.7803">yes</text><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="251.166" x="389.5894" y="902.7803">"Force-new or conflicting drift detected?"</text><rect fill="#F8FAFC" height="90" rx="8" ry="8" style="stroke:#0F172A;stroke-width:0.5;" width="309.1191" x="360.6128" y="1124"/><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="261.8232" x="370.6128" y="1144.7803">Enforce conflictsWith rules buyer_email -&gt;</text><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="289.1191" x="370.6128" y="1158.7803">plan_number, subscription_id, plan_number -&gt;</text><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="278.5918" x="370.6128" y="1172.7803">subscription_id, buyer_email, subscription_id</text><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="281.3193" x="370.6128" y="1186.7803">-&gt; plan_number, buyer_email before any OCI</text><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="53.6963" x="370.6128" y="1200.7803">mutation</text><rect fill="#F8FAFC" height="34" rx="8" ry="8" style="stroke:#0F172A;stroke-width:0.5;" width="303.2197" x="363.5625" y="1234"/><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="283.2197" x="373.5625" y="1254.7803">Return success for the ACTIVE success state</text><rect fill="#F8FAFC" height="48" rx="8" ry="8" style="stroke:#0F172A;stroke-width:0.5;" width="279.1299" x="375.6074" y="1288"/><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="259.1299" x="385.6074" y="1308.7803">Project required status and finalizer policy</text><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="31.1445" x="385.6074" y="1322.7803">none</text><rect fill="#F8FAFC" height="34" rx="8" ry="8" style="stroke:#0F172A;stroke-width:0.5;" width="236.3848" x="396.98" y="1356"/><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="216.3848" x="406.98" y="1376.7803">Requeue on provisioning, updating</text><path d="M372.1721,1412 L372.1721,1812 L352.1721,1816 L372.1721,1820 L372.1721,2220 A0,0 0 0 0 372.1721,2220 L703.6604,2220 A0,0 0 0 0 703.6604,2220 L703.6604,1422 L693.6604,1412 L372.1721,1412 A0,0 0 0 0 372.1721,1412" fill="#FFF7D6" style="stroke:#B45309;stroke-width:0.5;"/><path d="M693.6604,1412 L693.6604,1422 L703.6604,1422 L693.6604,1412" fill="#FFF7D6" style="stroke:#B45309;stroke-width:0.5;"/><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="101.165" x="378.1721" y="1427.7803">shared diagram:</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="284.7852" x="378.1721" y="1441.7803">shared/diagrams/shared-reconcile-activity.svg</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="265.3438" x="378.1721" y="1455.7803">Start from the shared reconcile activity and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="273.8955" x="378.1721" y="1469.7803">specialize provider-backed CRUD, wait, and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="182.875" x="378.1721" y="1483.7803">status-projection details here.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="229.5371" x="378.1721" y="1497.7803">Controller-local activity diagrams add</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="238.8955" x="378.1721" y="1511.7803">list-lookup hints, secret policies, delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="200.0332" x="378.1721" y="1525.7803">handling, and open formal gaps.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="281.709" x="378.1721" y="1539.7803">archetype batch: Generated service-manager</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="291.0469" x="378.1721" y="1553.7803">controllers specialize the shared reconcile path</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="189.8477" x="378.1721" y="1567.7803">with formal runtime ownership.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="150.1855" x="378.1721" y="1581.7803">service: onesubscription</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="108.165" x="378.1721" y="1595.7803">slug: subscription</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="110.5029" x="378.1721" y="1609.7803">kind: Subscription</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="241.2402" x="378.1721" y="1623.7803">archetype: generated-service-manager</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="191.4404" x="378.1721" y="1637.7803">status/finalizer: required / none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="195.3643" x="378.1721" y="1651.7803">requeue: provisioning, updating</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="263.0674" x="378.1721" y="1665.7803">provider states: create none; update none;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="73.1787" x="378.1721" y="1679.7803">delete none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="128.4199" x="378.1721" y="1693.7803">supported drift: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="230.3301" x="378.1721" y="1707.7803">reject before mutate: force-new fields</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="294.9365" x="378.1721" y="1721.7803">compartment_id, plan_number, subscription_id,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="254.8506" x="378.1721" y="1735.7803">buyer_email and conflicts buyer_email -&gt;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="289.1191" x="378.1721" y="1749.7803">plan_number, subscription_id, plan_number -&gt;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="295.3193" x="378.1721" y="1763.7803">subscription_id, buyer_email, subscription_id -&gt;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="165.7646" x="378.1721" y="1777.7803">plan_number, buyer_email</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="144.751" x="378.1721" y="1791.7803">create-only fields: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="283.2676" x="378.1721" y="1805.7803">list lookup: oci_onesubscription_subscriptions</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="231.1094" x="378.1721" y="1819.7803">filters compartment_id, plan_number,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="177.4268" x="378.1721" y="1833.7803">subscription_id, buyer_email</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="240.8438" x="378.1721" y="1847.7803">conflicts: buyer_email -&gt; plan_number,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="300.7813" x="378.1721" y="1861.7803">subscription_id, plan_number -&gt; subscription_id,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="283.6572" x="378.1721" y="1875.7803">buyer_email, subscription_id -&gt; plan_number,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="76.2617" x="378.1721" y="1889.7803">buyer_email</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="378.1721" y="1903.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="236.5713" x="378.1721" y="1917.7803">The published Subscription contract is</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="308.9434" x="378.1721" y="1931.7803">query-backed and observe-only. Reconcile issues</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="261.4473" x="378.1721" y="1945.7803">ListSubscriptions with compartmentId plus</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="280.9229" x="378.1721" y="1959.7803">exactly one of planNumber, subscriptionId, or</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="280.9434" x="378.1721" y="1973.7803">buyerEmail, paginates every result page, and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="251.3369" x="378.1721" y="1987.7803">accepts only a single returned summary.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="310.4883" x="378.1721" y="2001.7803">SubscriptionSummary exposes no stable top-level</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="269.2334" x="378.1721" y="2015.7803">OCID or reread path. The runtime therefore</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="301.9297" x="378.1721" y="2029.7803">leaves status.status.ocid empty and records only</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="300.3711" x="378.1721" y="2043.7803">the projected subscription summary fields on the</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="24.1104" x="378.1721" y="2057.7803">CR.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="257.5781" x="378.1721" y="2071.7803">The raw subscription status is an untyped</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="287.9092" x="378.1721" y="2085.7803">business-state string, not a typed OCI lifecycle</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="253.6816" x="378.1721" y="2099.7803">enum. The runtime requeues only clearly</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="284.8262" x="378.1721" y="2113.7803">transitional create-like and update-like tokens,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="285.5439" x="378.1721" y="2127.7803">treats FAIL/ERROR values as terminal failure,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="245.9229" x="378.1721" y="2141.7803">and settles all other values as observed</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="54.4619" x="378.1721" y="2155.7803">success.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="280.9092" x="378.1721" y="2169.7803">Delete is CR-local unbind only. The controller</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="280.1504" x="378.1721" y="2183.7803">releases Kubernetes control immediately and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="280.1709" x="378.1721" y="2197.7803">never calls an OCI delete helper because the</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="169.6748" x="378.1721" y="2211.7803">pinned SDK exposes none.</text><ellipse cx="341.1721" cy="1816" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="341.1721" cy="1816" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="341.1721" x2="341.1721" y1="157" y2="177"/><polygon fill="#0F172A" points="337.1721,167,341.1721,177,345.1721,167,341.1721,171" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="498.7112" x2="498.7112" y1="355" y2="375"/><polygon fill="#0F172A" points="494.7112,365,498.7112,375,502.7112,365,498.7112,369" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="199.7063" x2="183.6331" y1="257" y2="257"/><line style="stroke:#0F172A;stroke-width:1;" x1="183.6331" x2="183.6331" y1="257" y2="279"/><polygon fill="#0F172A" points="179.6331,269,183.6331,279,187.6331,269,183.6331,273" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="482.6379" x2="498.7112" y1="257" y2="257"/><line style="stroke:#0F172A;stroke-width:1;" x1="498.7112" x2="498.7112" y1="257" y2="279"/><polygon fill="#0F172A" points="494.7112,269,498.7112,279,502.7112,269,498.7112,273" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="183.6331" x2="183.6331" y1="327" y2="441"/><line style="stroke:#0F172A;stroke-width:1;" x1="183.6331" x2="329.1721" y1="441" y2="441"/><polygon fill="#0F172A" points="319.1721,437,329.1721,441,319.1721,445,323.1721,441" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="498.7112" x2="498.7112" y1="423" y2="441"/><line style="stroke:#0F172A;stroke-width:1;" x1="498.7112" x2="353.1721" y1="441" y2="441"/><polygon fill="#0F172A" points="363.1721,437,353.1721,441,363.1721,445,359.1721,441" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="341.1721" x2="341.1721" y1="225" y2="245"/><polygon fill="#0F172A" points="337.1721,235,341.1721,245,345.1721,235,341.1721,239" style="str