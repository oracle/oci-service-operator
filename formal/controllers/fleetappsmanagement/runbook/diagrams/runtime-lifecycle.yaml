schemaVersion: 1
surface: repo-authored-semantics
service: fleetappsmanagement
slug: runbook
kind: Runbook
archetype: generated-service-manager
states:
- provisioning
- active
- updating
- terminating
repoAuthored:
  operations:
    create:
    - CreateRunbook
    update:
    - UpdateRunbook
    delete:
    - DeleteRunbook
  providerLifecycle:
    createPending:
    - CREATING
    updatePending: []
    deletePending:
    - DELETING
  listLookup:
    filters:
    - compartmentId
    - displayName
    - id
    - operation
    - platform
    - state
    - type
    matchRule: exact declared filters match within the resource scope; duplicate matches
      fail
  mutation:
