etica" font-size="14" lengthAdjust="spacing" textLength="301.1641" x="778" y="2209.7803">Work-request phases are declared per operation</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="261.4678" x="778" y="2223.7803">from the vendored SDK response surface.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="253.7021" x="778" y="2237.7803">Secret side effects are none and finalizer</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="284.0469" x="778" y="2251.7803">ownership is retained until confirmed deletion.</text><?plantuml-src jLXTRnmr57tthx3WfHMPf24jbAsA10cKge5AJH4lAqNU6S-kYSSURCzk5yH_vroFvpExRGH2LTJC-Ff-ddlkdVWxPMhXHCNzHXHsfyoQbq9xoNn_iXBvtThPnXINLbl7Fozp_2j64eKiHQF3ZzQ4NqGb-KzIRsLGkJWiSwF-bFpywUXGE6TtIVkJylphByStZGto-ti-bENNnLTpAUiAwPB4wkcpYoVVp2J8V3g_k7Xw_kpPw3ogpwqpql7phrXGGKj-8_zefCabptYffGoYhdqbZ5ZBIffmzbxuktSIbmgsKONafRLXPJ-CjFfEmL-CSv47woPUfcYxetcOyalvl7o2OoX3GbKjJ3XyVopm42sZJFGwj2hbjJBJF7xpL5oidkEKLDQJetnLF9Fd_T6z6ZqlHPcplrcCZRzfLXB93TApaH_y4euugxLqazVV2oyfioPNywFFtjwyVNCZtLRbykTO2_SP5vvFNqsklBrypQZ-t6vHtQdkazazT8AJ1NVIMzq4PSqYlJehb5YZflwiVSu6aQmhywdVhZiDXTI8zkZjzdXwKveYufGDoUBPjwCSBRWqa6ya7w07LrCiR12aQzCu5xp__P4ZepuyPbCHkZJDnc9GZdYyehX6e8-5vzVMtk4_0UTNoXHCwC230nmWZCBB3xL68M8LEBh4eBNsN6WdHR77gVB1iwbPSWJI2_vAXf4v2MRgDVUQbEULyXxSTKpBDKmCQloZKkaWdLyiJMuhmWary-lYX1VArrhiYSLEOE1aQMmjdQ0IyqTVNF3AElduSGpGoSQB5T92KH4I6eSkXo-e7tW0RN3Ccqi47kGyhCFw_bMM3fW-W0O4vg6q1VeM2PsKHndkWmYDZ-eeu1QlF457TiM_Yg-FUTQUZfmx8WUtIkMgpiXMYMbGmD7IpCh8jBLrTwE6cpIzhdwu_k7zwrzUFIXLXCwvqYxSN4jX41z4IcM4nj1o21vlVIppIbk2uKCoxJ0taC_aAQLLncR1UxTlgv_E28xuXU1cLnwQ7sgWTMjmL9G0-7sjCRhuGqQfuAqtY2SwGm1ycC6MX7ORrIEsGemUk5cQlWRHYbRRBcYw1WhnS5Jg8XCx4E7I54wLWSkjq4tij0vOyVK6YTBKsWDzJ_qx8Mw_QUhQEe2IDtL1bdpZIf7B1UqTc6Z5Ux7s9mmCbZjLan5wG5MqFvKVP1v9_2gzo4KGsgx11n-HiLL59GGfF66H5TWx-RlC0r_94e-yQYZY1PW0RPmPkMjZzcp2E2nHPqT8VCf7RCv7_00TTJeg4V8DCeKHyG4J5v7dEiwXf9n50