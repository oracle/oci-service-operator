schemaVersion: 1
surface: repo-authored-semantics
service: fleetappsmanagement
slug: compliancepolicyrule
kind: CompliancePolicyRule
archetype: generated-service-manager
states:
- provisioning
- active
- updating
- terminating
repoAuthored:
  operations:
    create:
    - CreateCompliancePolicyRule
    update:
    - UpdateCompliancePolicyRule
    delete:
    - DeleteCompliancePolicyRule
  providerLifecycle:
    createPending:
    - CREATING
    updatePending: []
    deletePending:
    - DELETING
  listLookup:
    filters:
    - compartmentId
    - compliancePolicyId
    - displayName
    - id
    - patchName
    - state
    matchRule: exact declared filters match within the resource scope; duplicate matches
      fail
  mutation:
    mutable:
    - definedTags
    - freeformTags
    - gracePeriod
    - patchSelection.daysSinceRelease
    - patchSelection.patchLevel
    - patchSelection.patchName
    - patchSelection.selectionType
    - patchTypeId
    - productVersion.isApplicableForAllHigherVersions
    - productVersion.version
    - severity
    forceNew:
    - compliancePolicyId
    - displayName
  hooks:
    create:
    - helper: tfresource.CreateResource
    update:
    - helper: tfresource.UpdateResource
    delete:
    - helper: tfresource.DeleteResource
  followUp:
    create: GetWorkRequest -> read-after-write
    update: GetWorkRequest -> read-after-write
    delete: GetWorkRequest -> confirm-delete
notes:
- The generated service manager uses the reviewed CRUD request, response, lifecycle,
  and status projection contract.
- Work-request phases are declared per operation from the vendored SDK response surface.
- Secret side effects are none and finalizer ownership is retained until confirmed
  deletion.
