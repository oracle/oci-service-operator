text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="288.7158" x="849" y="2101.7803">update=read-after-write; delete=confirm-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="243.5713" x="849" y="2115.7803">supported drift: comment, definedTags,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="328.002" x="849" y="2129.7803">freeformTags, isAutoApproveDuringMaintenance (+8</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="36.5586" x="849" y="2143.7803">more)</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="230.3301" x="849" y="2157.7803">reject before mutate: force-new fields</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="213.9922" x="849" y="2171.7803">compartmentId, operatorControlId,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="289.8369" x="849" y="2185.7803">resourceCompartmentId, resourceId (+2 more)</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="144.751" x="849" y="2199.7803">create-only fields: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="66.1445" x="849" y="2213.7803">list lookup:</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="375.1084" x="849" y="2227.7803">oci_operator_access_control_operator_control_assignments</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="251.3301" x="849" y="2241.7803">filters compartmentId, operatorControlId,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="271.9404" x="849" y="2255.7803">resourceId, resourceName (+1 more); exact</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="287.1367" x="849" y="2269.7803">resource identity match; duplicate matches fail</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="849" y="2283.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="849" y="2297.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="272.3369" x="849" y="2311.7803">The runtime uses its declared lifecycle-state</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="247.4404" x="849" y="2325.7803">contract for OperatorControlAssignment</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="85.5996" x="849" y="2339.7803">reconciliation.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="301.123" x="849" y="2353.7803">The credential-free mock exercises SDK request</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="265.3643" x="849" y="2367.7803">serialization, response projection, mutation</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="252.9434" x="849" y="2381.7803">when supported, and confirmed deletion.</text><?plantuml-src lLXPRnit47xdho3QbmJLsd6E9fMH0gwTfa7Sf8XJz4L0GEtEIgmfSajohRX5_tjdUEmXQsqZBOeyHCjZpc--6TfTIjq8ApRShKLbjbAlU2sK0-QwdQKeBrVMjBewDSfO_dLTuhzgSAA2MhJA_sYqVoSsm7y2TGLUbcB_cGlv9_2ZfuDDOQtP9kcFwgFdZuStjV7mmmqRwlfvzUtkAMChiEd4ykcp9u--spb1wjF-aoTFZvuz6-m7yQMn6Ym_-fPvwHNm2_YZ1Lq2BxXfm0flh2XBSAv4ITQem_TfzJH-dpWdLte3shErh83NnlYb-JnGuxB4lnZdeiIh8xEJ-tbhrszu32_gHxYDmZ32iX7Qxxy_F70VAOFGT3AKhE5Swd5WltigdYnVu2w9R4PRvR9w1aVTresalQX5NRA_MV2DlssNWD7suDZ03fuYgS2E