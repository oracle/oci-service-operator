 fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="174.3027" x="801" y="2115.7803">retain-until-confirmed-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="272.3984" x="801" y="2129.7803">requeue: provisioning, updating, terminating</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="327.5439" x="801" y="2143.7803">provider states: create CREATING, IN_PROGRESS;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="238.875" x="801" y="2157.7803">update UPDATING; delete DELETING</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="234.9922" x="801" y="2171.7803">follow-up: create=GetWorkRequest -&gt;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="281.6885" x="801" y="2185.7803">GetAssessment; update=GetWorkRequest -&gt;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="277.0127" x="801" y="2199.7803">GetAssessment; delete=GetWorkRequest -&gt;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="300.3301" x="801" y="2213.7803">GetAssessment/ListAssessments confirm-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="231.123" x="801" y="2227.7803">supported drift: acceptableDowntime,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="302.7432" x="801" y="2241.7803">creationType, databaseDataSize, ddlExpectation</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="61.0723" x="801" y="2255.7803">(+7 more)</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="230.3301" x="801" y="2269.7803">reject before mutate: force-new fields</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="255.2471" x="801" y="2283.7803">bulkIncludeExcludeData, compartmentId,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="304.6641" x="801" y="2297.7803">databaseCombination, excludeObjects (+1 more)</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="144.751" x="801" y="2311.7803">create-only fields: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="308.1709" x="801" y="2325.7803">list lookup: oci_database_migration_assessments</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="260.6543" x="801" y="2339.7803">filters compartmentId, displayName; exact</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="329.9502" x="801" y="2353.7803">compartmentId, displayName, databaseCombination,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="244.3506" x="801" y="2367.7803">connection identity, network, downtime,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="254.4541" x="801" y="2381.7803">data-size, DDL, and creation-type match;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="134.627" x="801" y="2395.7803">duplicate matches fail</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="801" y="2409.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="801" y="2423.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="315.916" x="801" y="2437.7803">The reviewed runtime selects the concrete MYSQL</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="326.833" x="801" y="2451.7803">or ORACLE request type from databaseCombination</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="282.502" x="801" y="2465.7803">before calling OCI; unsupported object-helper</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="234.2334" x="801" y="2479.7803">fields are rejected rather than partially</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="63.8271" x="801" y="2493.7803">published.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="278.5576" x="801" y="2507.7803">CREATING and IN_PROGRESS requeue as</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="297.2676" x="801" y="2521.7803">provisioning, UPDATING requeues as updating,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="292.5576" x="801" y="2535.7803">ACTIVE and SUCCEEDED settle success, and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="305.7783" x="801" y="2549.7803">DELETING retains the finalizer until DELETED or</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="122.1787" x="801" y="2563.7803">confirmed absence.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="287.1982" x="801" y="2577.7803">Create, update, and delete persist and poll the</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="283.2471" x="801" y="2591.7803">Database Migration work request, recover the</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="289.4883" x="801" y="2605.7803">Assessment identifier, and reread the concrete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="282.4814" x="801" y="2619.7803">Assessment subtype before projecting status.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="276.2744" x="801" y="2633.7803">Pre-create reuse is bounded to the complete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="228.0195" x="801" y="2647.7803">reviewed identity. Only the published</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="233.4746" x="801" y="2661.7803">update-detail fields reconcile in place;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="284.792" x="801" y="2675.7803">compartment, discriminator, and object-helper</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="155.627" x="801" y="2689.7803">drift require replacement.</text><?plantuml-src nLXRRnkv5Nxdho2sBrbKOyURP9ELuG9UISqQwyIfbJGe822WPZWIQmuv9JcItQB_lUVmCXTT4hN5Ok47sxoSwtU-SpZsGQYQ6LPHksQ5tWgreYMJbXFRxYnP_h0okb75H4jjw1_A77wAtec2bwoHxizQkVUiulGNBZVSYPmTFZCN_-JqucLlancZjr7wy_BYzG_zcqex_lEU3MNvklXnzvGs1JVnnFBbgnVFVzevWUhZ_eiNBozUlUhjU_6vDeeRUl4ZSS99JkVy7mrNEQSPBPXZIsPv9LQ6EQ7L-RMrtDgAAqVMek2qrDejzMDFfatN_qKePRdJPc1Zz3LjxJh9V-1lokUm3S8WdA9coXs-tpzmYfHU75ePKfJyLgXX57zwoLuity0kYgm7M_coUCKlsgsz3BqfMPcJVnFl6_srMN88hUEMzEoW4p34Q2cv6Ip_376-vxbMkTZT-kvkVlVhd9kDoFaxfjYAc-yeitIuDBXoDxaXc7sgDv3ReUpHpZse0yCBQhZLii4iZ-FIUI4O9Bwov-7_h3kIfJIVsSqgIIYu16-FtWxRmvjS5Hwbf0iMpVxKYz6OSWNd6quxw86fqHVI7SHhGp_7jFtxcK6brdrFXaVmqZ0Ququu-6C5-_i6HKYWceTSPS1vMhKVEKch4xocHDjmnY6Uq5CFAVPN1kdaAsOzxY6Fu0wY8wgK5oQSg26PrXh8IAcDVQe1RWXmcF5W3_dXZ482dAGpijLsB5h4L-6W1Dmjri1n6zDE7QLXUg3PBtWufDYaiA1ZOoO8hN1OPsmB7BbHXHEaetp3