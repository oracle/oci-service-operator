textLength="329.9502" x="704.6277" y="2427.2803">compartmentId, displayName, databaseCombination,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="244.3506" x="704.6277" y="2441.2803">connection identity, network, downtime,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="254.4541" x="704.6277" y="2455.2803">data-size, DDL, and creation-type match;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="134.627" x="704.6277" y="2469.2803">duplicate matches fail</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="704.6277" y="2483.2803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="704.6277" y="2497.2803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="315.916" x="704.6277" y="2511.2803">The reviewed runtime selects the concrete MYSQL</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="326.833" x="704.6277" y="2525.2803">or ORACLE request type from databaseCombination</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="282.502" x="704.6277" y="2539.2803">before calling OCI; unsupported object-helper</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="234.2334" x="704.6277" y="2553.2803">fields are rejected rather than partially</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="63.8271" x="704.6277" y="2567.2803">published.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="278.5576" x="704.6277" y="2581.2803">CREATING and IN_PROGRESS requeue as</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="297.2676" x="704.6277" y="2595.2803">provisioning, UPDATING requeues as updating,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="292.5576" x="704.6277" y="2609.2803">ACTIVE and SUCCEEDED settle success, and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="305.7783" x="704.6277" y="2623.2803">DELETING retains the finalizer until DELETED or</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="122.1787" x="704.6277" y="2637.2803">confirmed absence.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="287.1982" x="704.6277" y="2651.2803">Create, update, and delete persist and poll the</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="283.2471" x="704.6277" y="2665.2803">Database Migration work request, recover the</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="289.4883" x="704.6277" y="2679.2803">Assessment identifier, and reread the concrete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="282.4814" x="704.6277" y="2693.2803">Assessment subtype before projecting status.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="276.2744" x="704.6277" y="2707.2803">Pre-create reuse is bounded to the complete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="228.0195" x="704.6277" y="2721.2803">reviewed identity. Only the published</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="233.4746" x="704.6277" y="2735.2803">update-detail fields reconcile in place;</text><text fill="#334155" font-family="Helv