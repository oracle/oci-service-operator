xt fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="241.9717" x="752" y="2129.7803">DNS records. The runtime must not fail</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="287.1367" x="752" y="2143.7803">reconciliation while that external DNS action is</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="53.7168" x="752" y="2157.7803">pending.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="344.6475" x="752" y="2171.7803">`CREATING` and `UPDATING` requeue; `ACTIVE` and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="328.3164" x="752" y="2185.7803">`NEEDS_ATTENTION` are successful steady states;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="294.1367" x="752" y="2199.7803">delete retains the finalizer through `DELETING`</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="303.4609" x="752" y="2213.7803">until OCI reports `DELETED` or an unambiguous</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="56.8203" x="752" y="2227.7803">absence.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="298.0605" x="752" y="2241.7803">The runtime projects the generated selector and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="274.6475" x="752" y="2255.7803">DNS CNAME/TXT values into status without</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="180.5439" x="752" y="2269.7803">creating Kubernetes Secrets.</text><?plantuml-src fLZRRYCt4dtdLn3PbmImx75c9fd8y0AEhSqQux63aHBiWm6BwcPBNBV83icMnXlat_SKoRx9KkpTm80jDQlhUkfKqUvHwKfOiUPk9NApLNh92r4wo