-size="14" lengthAdjust="spacing" textLength="267.292" x="711" y="2115.7803">description, digitalTwinAdapterId (+5 more)</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="230.3301" x="711" y="2129.7803">reject before mutate: force-new fields</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="74.7031" x="711" y="2143.7803">iotDomainId</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="144.751" x="711" y="2157.7803">create-only fields: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="262.2607" x="711" y="2171.7803">list lookup: scaffold_iot_digitaltwininstance</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="214.7783" x="711" y="2185.7803">filters authId, digitalTwinAdapterId,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="302.2988" x="711" y="2199.7803">digitalTwinModelId, digitalTwinModelSpecUri (+4</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="290.2402" x="711" y="2213.7803">more); exact resource identity match; duplicate</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="74.6963" x="711" y="2227.7803">matches fail</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="711" y="2241.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="711" y="2255.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="272.3369" x="711" y="2269.7803">The runtime uses its declared lifecycle-state</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthA