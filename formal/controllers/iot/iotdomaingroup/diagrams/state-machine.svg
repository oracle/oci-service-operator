size="14" lengthAdjust="spacing" textLength="283.2129" x="2274.78" y="476.7803">real OCI SDK through the full CRUD lifecycle.</text></g><g class="entity" data-qualified-name="GMN5" data-source-line="88" id="ent0006"><path d="M2956.27,544 L2956.27,559.09 L2496.27,542.28 L2956.27,567.09 L2956.27,594 A8,8 0 0 0 2964.27,602 L3210.5102,602 A8,8 0 0 0 3218.5102,594 L3218.5102,546 L3208.5102,536 L2964.27,536 A8,8 0 0 0 2956.27,544" fill="#FFF7D6" style="stroke:#B45309;stroke-width:0.5;"/><path d="M3208.5102,536 L3208.5102,542 A4,4 0 0 0 3212.5102,546 L3218.5102,546 L3208.5102,536" fill="#FFF7D6" style="stroke:#B45309;stroke-width:0.5;"/><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="136.9717" x="2962.27" y="551.7803">delete policy: required</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="241.2402" x="2962.27" y="565.7803">delete observe: GetIotDomainGroup or</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="124.5029" x="2962.27" y="579.7803">ListIotDomainGroup</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="157.1855" x="2962.27" y="593.7803">delete targets: DELETED</text></g><!--link *start* to observe--><g class="link" data-entity-1="ent0002" data-entity-2="ent0002" data-link-type="dependency" data-source-line="32" id="lnk3"><path d="M26.26,454 C55.72,454 144.14,454 225.56,454" fill="none" id="*start*-to-observe" style="stroke:#0F172A;stroke-width:1;"/><polygon fill="#0F172A" points="231.56,454,222.56,450,226.56,454,222.56,458,231.56,454" style="stroke:#0F172A;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="144.7373" x="57" y="449.7803">CreateIotDomainGroup</text></g><!--link observe to resolve_by_lookup--><g class="link" data-entity-1="ent0002" data-entity-2="ent0007" data-link-type="dependency" data-sourc