ing" textLength="208.5303" x="850.5894" y="1557.2803">Apply explicit follow-up semantics</text><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="145.8926" x="850.5894" y="1571.2803">create=read-after-write;</text><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="288.7158" x="850.5894" y="1585.2803">update=read-after-write; delete=confirm-delete</text><rect fill="#F8FAFC" height="34" rx="8" ry="8" style="stroke:#0F172A;stroke-width:0.5;" width="303.2197" x="843.3374" y="1618.5"/><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="283.2197" x="853.3374" y="1639.2803">Return success for the ACTIVE success state</text><rect fill="#F8FAFC" height="48" rx="8" ry="8" style="stroke:#0F172A;stroke-width:0.5;" width="279.1299" x="855.3823" y="1672.5"/><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="259.1299" x="865.3823" y="1693.2803">Project required status and finalizer policy</text><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="174.3027" x="865.3823" y="1707.2803">retain-until-confirmed-delete</text><rect fill="#F8FAFC" height="34" rx="8" ry="8" style="stroke:#0F172A;stroke-width:0.5;" width="313.4189" x="838.2378" y="1740.5"/><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="293.4189" x="848.2378" y="1761.2803">Requeue on provisioning, updating, terminating</text><path d="M698.3457,1796.5 L698.3457,2098.5 L678.3457,2102.5 L698.3457,2106.5 L698.3457,2408.5 A0,0 0 0 0 698.3457,2408.5 L1026.7441,2408.5 A0,0 0 0 0 1026.7441,2408.5 L1026.7441,1806.5 L1016.7441,1796.5 L698.3457,1796.5 A0,0 0 0 0 698.3457,1796.5" fill="#FFF7D6" style="stroke:#B45309;stroke-width:0.5;"/><path d="M1016.7441,1796.5 L1016.7441,1806.5 L1026.7441,1806.5 L1016.7441,1796.5" fill="#FFF7D6" style="stroke:#B45309;stroke-width:0.5;"/><text