schemaVersion: 1
surface: repo-authored-semantics
service: networkloadbalancer
slug: backend
kind: Backend
archetype: generated-service-manager
states:
    - provisioning
    - active
    - updating
    - terminating
repoAuthored:
    providerLifecycle: {}
    listLookup:
        filters:
            - name
        matchRule: exact name match within the resource scope; duplicate matches fail
    mutation:
        mutable:
            - weight
            - isBackup
            - isDrain
            - isOffline
        forceNew:
            - backendSetName
            - ipAddress
            - name
            - networkLoadBalancerId
            - port
            - targetId
    hooks:
        create:
            - helper: tfresource.CreateResource
              entityType: Backend
              action: CreateBackend
        update:
            - helper: tfresource.UpdateResource
              entityType: Backend
              action: UpdateBackend
        delete:
            - helper: tfresource.DeleteResource
              entityType: Backend
              action: DeleteBackend
    followUp:
        create: GetWorkRequest -> read-after-write
        update: GetWorkRequest -> read-after-write
        delete: GetWorkRequest -> confirm-delete
notes:
    - The production runtime uses generatedruntime/workrequest async handling for create, update, delete work-request phases.
    - Lifecycle success states are ; pending create, update, and delete states requeue until the corresponding follow-up converges.
    - Status projection is required, Secret side effects are none, and the finalizer policy is retain-until-confirmed-delete.
    - Delete policy required retains ownership until DELETED or confirmed absence.
