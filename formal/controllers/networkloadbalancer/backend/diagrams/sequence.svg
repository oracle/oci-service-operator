y="Helvetica" font-size="14" lengthAdjust="spacing" textLength="281.709" x="757" y="1705.7803">archetype batch: Generated service-manager</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="266.1504" x="757" y="1719.7803">controllers follow the shared resolution and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="259.9297" x="757" y="1733.7803">delete sequences with imported waits and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="134.6064" x="757" y="1747.7803">controller-local policy.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="181.3164" x="757" y="1761.7803">service: networkloadbalancer</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="86.3926" x="757" y="1775.7803">slug: backend</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="87.9443" x="757" y="1789.7803">kind: Backend</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="241.2402" x="757" y="1803.7803">archetype: generated-service-manager</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="156.4063" x="757" y="1817.7803">status/finalizer: required /</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="174.3027" x="757" y="1831.7803">retain-until-confirmed-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="272.3984" x="757" y="1845.7803">requeue: provisioning, updating, terminating</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="263.0674" x="757" y="1859.7803">provider states: create none; update none;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="112.0479" x="757" y="1873.7803">delete DELETING</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="234.9922" x="757" y="1887.7803">follow-up: create=GetWorkRequest -&gt;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="277.792" x="757" y="1901.7803">read-after-write; update=GetWorkRequest -&gt;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="273.1162" x="757" y="1915.7803">read-after-write; delete=GetWorkRequest -&gt;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="88.7031" x="757" y="1929.7803">confirm-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="257.5645" x="757" y="1943.7803">supported drift: weight, isBackup, isDrain,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="50.5723" x="757" y="1957.7803">isOffline</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="230.3301" x="757" y="1971.7803">reject before mutate: force-new fields</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="228.0127" x="757" y="1985.7803">backendSetName, ipAddress, name,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="212.0576" x="757" y="1999.7803">networkLoadBalancerId (+2 more)</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="144.751" x="757" y="2013.7803">create-only fields: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="308.1982" x="757" y="2027.7803">list lookup: oci_network_load_balancer_backends</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="257.5576" x="757" y="2041.7803">filters name; exact name match within the</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="238.123" x="757" y="2055.7803">resource scope; duplicate matches fail</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="757" y="2069.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="757" y="2083.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="177.4268" x="757" y="2097.7803">The production runtime uses</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="307.3984" x="757" y="2111.7803">generatedruntime/workrequest async handling for</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="273.1641" x="757" y="2125.7803">create, update, delete work-request phases.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="282.4814" x="757" y="2139.7803">Lifecycle success states are ; pending create,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="265.4258" x="757" y="2153.7803">update, and delete states requeue until the</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="221.0127" x="757" y="2167.7803">corresponding follow-up converges.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="251.3506" x="757" y="2181.7803">Status projection is required, Secret side</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="260.7021" x="757" y="2195.7803">effects are none, and the finalizer policy is</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="178.1924" x="757" y="2209.7803">retain-until-confirmed-delete.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="278.5918" x="757" y="2223.7803">Delete policy required retains ownership until</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="206.9785" x="757" y="2237.7803">DELETED or confirmed absence.</text><?plantuml-src lLVRRXit47tdLn3jIu9gxJYsSv7X0ecTfa7S6B1Iz4M0GUro9TOhSajofQX5_xs7jxt8aksYG967MEHmhcVEp9ex8MkcsPAQ1IlKMiWvBLbbE37jpOpbTtEj6bbSg4ff-dsPur_HaoXuoPhA_gIa_SAMdFxCgnMt8cUxPIRYJqwFJdgNJ6krZjfVb4UlN_PVIcNv-ti-bENhujMsbD85rr5YTd9w_EBjbeGp7--FZq-EJazxzrvzhhJacXwz8bROYjC9_wFXCkSqevBRjT9tbMB5Z5KCX_hG-SLbGHQYuBHKoixKjvvAarx_HIXbkLLwu68CDLrjnyXVyZVb2rn36R8fQYRjxlTzWQTewQMXrL69aby9EKpYsnDsF7k3MwUo7bpbi-AK7xLNzmhqfcHbJlucFZRwkPbnPDPoGtf-q0iuebLLSJquViyCl-6vahdOllhkUdBzUSBrIkJy5oRPdEllA3DqU3HuSdtnYRZYKxL2QOUwHrllq0QQ5rHpewh62YN7yUYm46oEcfh3y3lhHB9KvWEpcYSD1QyGxTxNuNhu4a3o82LTicZsOoz7Oyebv1jE8-xWPmo4T5BkpJ38CMt_VgQTHMEVaw68UpHCnRXJZc2CS44bkFkIqokbxl0VWnypWLDMMMgr4oaeIiw_rHLAuFDFqHyI7RMXhDAS5HlS2cCD6TfqNa1wJ3zocsnni56hjbKZ35qAOy1N-rHSGN_KOPwLeh9Scp6LuAVdtbFD6yDc2CwvvuhPQ3GgzA84Q6KWUP_c2qGGAAdrRxUoVn_h3gCxgbaZ56WCA5qXBOCC2qcDPROnNfqBDO2DnjBpLBzBVxpFhN2RFDiZ19zAePV9magmNZW0mLJsoq0gfUeaM-F4ZPlB3rSVldxwyl7nz3XG3TIb-FAACuc0S5yAoIhC5ureSMfyHMULSkXvIcerjmm9Z3wwF78FS9phJQXrlClLiiOVw7-gPWQQdseWkDKvoaf0yxvMaW3XZReA1syGZtV6mUrf1WDbh1UYnUSICHe0PIhRx7ihbLYbeDqpzBo1exmgChO6RKrbeKLfAL-ngc7UoOWaVxn0eYhNaHtP3lqREIQUD7MjD518cxfmbaoZIvRpCLrpCL_O4H76LRYfHuZrKiDLzyTrMK8t9pVyTvvREkEbqfmk6-Vi6FsAViiaNmTt3Pa5Z4outqYWe7vN50Z7Z3m5Z4YSvbUOvk_ZDFzKq6S_lAHBA7vE8haDY2CTBfdD5mWKVFmDuytVXKEw5XOtn2vuHmCcLpK_eqNZ-D15x4Kn2KicgexrLMrxSG3Bhhdmmhek2Ob7xGkW9BTFnLe_LwxqFby9NCwWQQlXhXo3FMufDkQxkgusz5TVnBP39OvWBMcRob2FL5jwlxPJsHNt0QRHZQGBNe7ww09LC5EPUne-jsLAz44WvfluSoe38Pudvr0gX7u-eE-pgGmmxEi9CJscPn0vz8GExki95FgOdYSHBVF9BZ7WrJe310