" font-size="14" lengthAdjust="spacing" textLength="301.1982" x="788" y="1776.7803">Layer the shared delete sequence when finalizer</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="269.2471" x="788" y="1790.7803">retention, delete confirmation, work-request</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="199.2334" x="788" y="1804.7803">polling, or Secret cleanup apply.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="281.709" x="788" y="1818.7803">archetype batch: Generated service-manager</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="266.1504" x="788" y="1832.7803">controllers follow the shared resolution and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="259.9297" x="788" y="1846.7803">delete sequences with imported waits and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="134.6064" x="788" y="1860.7803">controller-local policy.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="181.3164" x="788" y="1874.7803">service: networkloadbalancer</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="78.5928" x="788" y="1888.7803">slug: listener</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="83.2686" x="788" y="1902.7803">kind: Listener</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="241.2402" x="788" y="1916.7803">archetype: generated-service-manager</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="156.4063" x="788" y="1930.7803">status/finalizer: required /</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="174.3027" x="788" y="1944.7803">retain-until-confirmed-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="272.3984" x="788" y="1958.7803">requeue: provisioning, updating, terminating</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="331.4404" x="788" y="1972.7803">provider states: create ACCEPTED, IN_PROGRESS,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="325.2129" x="788" y="1986.7803">CANCELING; update ACCEPTED, IN_PROGRESS,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="289.4131" x="788" y="2000.7803">CANCELING; delete DELETING, ACCEPTED,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="190.5996" x="788" y="2014.7803">IN_PROGRESS, CANCELING</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="191.0371" x="788" y="2028.7803">follow-up: create=workrequest;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="270.0537" x="788" y="2042.7803">update=workrequest; delete=confirm-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="256.04" x="788" y="2056.7803">supported drift: defaultBackendSetName,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="287.5537" x="788" y="2070.7803">ipVersion, isPpv2Enabled, l3IpIdleTimeout (+4</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="36.5586" x="788" y="2084.7803">more)</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="273.1299" x="788" y="2098.7803">reject before mutate: force-new fields name,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="147.0957" x="788" y="2112.7803">networkLoadBalancerId</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="144.751" x="788" y="2126.7803">create-only fields: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="300.3984" x="788" y="2140.7803">list lookup: oci_network_load_balancer_listeners</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="257.5576" x="788" y="2154.7803">filters name; exact name match within the</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="238.123" x="788" y="2168.7803">resource scope; duplicate matches fail</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="788" y="2182.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="788" y="2196.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="177.4268" x="788" y="2210.7803">The production runtime uses</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="307.3984" x="788" y="2224.7803">generatedruntime/workrequest async handling for</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="273.1641" x="788" y="2238.7803">create, update, delete work-request phases.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="328.3232" x="788" y="2252.7803">Lifecycle success states are SUCCEEDED, ACTIVE;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="257.6396" x="788" y="2266.7803">pending create, update, and delete states</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="256.833" x="788" y="2280.7803">requeue until the corresponding follow-up</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="68.4824" x="788" y="2294.7803">converges.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="251.3506" x="788" y="2308.7803">Status projection is required, Secret side</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="260.7021" x="788" y="2322.7803">effects are none, and the finalizer policy is</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="178.1924" x="788" y="2336.7803">retain-until-confirmed-delete.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="278.5918" x="788" y="2350.7803">Delete policy required retains ownership until</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="302.6611" x="788" y="2364.7803">DELETED, SUCCEEDED or confirmed absence.</text><?plantuml-src hLTTRnit5dtdhxZelgHOoOvZfqrbP854zcQDUfF0SljamA1cE18t53abELAqHV_x7dxCQ4QHQcDtaOTOvENzFFVSE-wBr3MtV4LkoKkpaNf15LTECDVTp7dnPM5DeykfKSRINwe2_ygUH2agtYZ_TwFzHxuIz0-XriBBWX-McSb_2pgxw5roQyqcQtzPdVtuglzI6o_UV-D3LVrO_h0lPMmfR9QONxm-V_dJdaGmd-_Fpo_ENh_ktKVrXR5QM3hxWNdfbQ2P-AqHkX0q9YtynjWlol1opXN7eJszbSuBF61BMGggZF5pyxMdqxNFVsT4lF363dpCiRPN-q6AL-9DzHBNK8PqoffhV_XzN-0vMdfvw7GeMObRgOTP_Ec2dy_Vu3Qeh0TNnRnyBSwwgsygzARYLS7-O34s-hcP2wJM2yTwVj0KZbYZ55BOFtxFdRWJXT65tB_wxjFiqyypOTUo4F_acY-4_Owue-7HuCcdwGqBrIUpHcs7kaTxxz07LfHaXJEgyTBeIJuwBILVeARkDFqUxqJ6RPbFt7hHQYY5GhH7NwVhuKkXouXIjaiMZV_Moz64X8Py8wW57XpDaR2TM7WqZ792tTylR33f_FTiA18U3NCnsIb7D4w6g3h0nwBJhJ5Vy1-7utEfIyQL9sy11OYYwE9hhL24M052XsWqrPQuieANMzn2cMD3ey4DI4_eW_2TCG56wlHsUgIZbNGEd7LCHr3GAd4lAgay_f-G1abz7tsred5yZlY2Ww6WZKMpGZ7AW7O6ce-fdY86BpeFbJ4r5V6CQjGn