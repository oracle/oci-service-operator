rite; update=GetWorkRequest -&gt;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="273.1162" x="781" y="2115.7803">read-after-write; delete=GetWorkRequest -&gt;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="88.7031" x="781" y="2129.7803">confirm-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="268.502" x="781" y="2143.7803">supported drift: assignedIpv6, definedTags,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="236.9131" x="781" y="2157.7803">displayName, freeformTags (+7 more)</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="230.3301" x="781" y="2171.7803">reject before mutate: force-new fields</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="319.8398" x="781" y="2185.7803">assignedPrivateIpv4, backendSets, compartmentId,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="118.6445" x="781" y="2199.7803">isPrivate (+3 more)</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="144.751" x="781" y="2213.7803">create-only fields: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="66.1445" x="781" y="2227.7803">list lookup:</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="329.998" x="781" y="2241.7803">oci_network_load_balancer_network_load_balancers</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="260.6543" x="781" y="2255.7803">filters displayName, compartmentId; exact</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="287.123" x="781" y="2269.7803">displayName, compartmentId match within the</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="238.123" x="781" y="2283.7803">resource scope; duplicate matches fail</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="781" y="2297.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="781" y="2311.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="177.4268" x="781" y="2325.7803">The production runtime uses</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="307.3984" x="781" y="2339.7803">generatedruntime/workrequest async handling for</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="273.1641" x="781" y="2353.7803">create, update, delete work-request phases.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="286.3574" x="781" y="2367.7803">Lifecycle success states are ACTIVE; pending</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="288.7637" x="781" y="2381.7803">create, update, and delete states requeue until</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="244.3643" x="781" y="2395.7803">the corresponding follow-up converges.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="251.3506" x="781" y="2409.7803">Status projection is required, Secret side</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="260.7021" x="781" y="2423.7803">effects are none, and the finalizer policy is</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="178.1924" x="781" y="2437.7803">retain-until-confirmed-delete.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="278.5918" x="781" y="2451.7803">Delete policy required retains ownership until</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="206.9785" x="781" y="2465.7803">DELETED or confirmed absence.</text><?plantuml-src hLVRRXit47tdLn3jIu9ATbmxbyf8WSHsKoDkKbXf-o8We7Qv4XkAt99SAMhHV-_XRRKhhrptWZn4NWxdUkRCq7uIgcQ6hQXTib9lX5hGYadBYMrFvgpuj32wKUM5bjhGBwi2_ygEHCahraZtdLRk7Ljn-ZsNQ-v4mOPbfk9tJa_EEeVC6Br9sfzK9y-_xjvKsl7NTtoegkVbitqfRKfkaiJyxEdfas_s9BpvT7vwUdRoz6ddFAWlj57Sq9Ddn0adEPtotngk2ax7L76tqUQJrAoSCydmqHo_YzzkyErr-aQMekIqqjhDzUUEUfir_K4ePONJfkTk2ZiVxSVBl-OlgYSuXZ9aLjHCkU7xNO67QEcafDKXHSLlXEedz9ipTZf_WLElikuT5VFoAJzfZ-uKwqN5geByIK9iz6qpvyYouvPq_A0NSCHeAP72xkVNpF9RNcXLYFsZBzvFtx-TShCM1V-1ARRWvWlABEr_wbrvVt5DF12eNgFCVTsZlNje2SDBQhZLid52gqdwT5mAja1DxN7yUxmJ6USo7zdr8ciekKIq1s_7u_vDhie0MB9B5Xr_sydHX785-ORJ0GpEbCbHaTqLhw0VyOIslnyPRzwwnwGluY_rypAXhN94PWL2cAcXHWXWe3TQVy9_307DXIe9auuw0uWWCG03_rnB52TKXg9p5FfkIvaqd9LRd0hhBEaxu5s2z8I-uMx8BWT_jIPQbSBIbR0M37T8tGri3UYpZoeX7VwVp5GfR2tPrhFSY1PwvQ6rWe7hyd48pF36iZaIuwFng6WCEXwcKKjm0bhYaF4B1EpuK3XIwveMuPZMm8Ndw8lRgrSVhj-z-QUPWVsGdM4__rlM1s8R05oDH49xxAer2jIhkr3KEkOQ6zJvZCRce0cTl4oekWoV3xaOJuUyF701_bN2hBArjM0pDHmdC3jJXv0IQvMKv5fTNjrS_VDQtMydPwUGd2ca0urK2SKa9gj1hl3L1jZDfVPTy9326EuOqf-SzrNWeMdntMmZQjAPnpr-WEsedbjeVgY1wDREKLQXhUvgZJ3DKFNuYDuWdk2C1-x334Q2t2n5Y_GLOhI0sKpb5XhHdtwyJB_QKWNBKgnp8hmg49s5yroMOxO1SOCDZAWSvMic6nOSJzWCdvT8dlHiinitVPz7VXPDcxhM1hYcJLrwIxOn5Ilu17FCYeNYvNMzVZOYM9ymZyiFR657jCT2bU6yqcRbZyYZhvxJbJRyCRdbl_B2qRa_utJL-30ce23q-LZnJGp4acpbHoFMa82nir7O-93_ANTsH7eiDq8HaYXzzDLfifKeFjDapx_-_IowOgvO8ZcOOf-n5Dnp8uhIZN2Gfsx9MxeYjj0rFwTbuoU8zoY8-Y8n8NSJLDUk4pSwnJSxRZZVdB64G5O931RkeKZkvjO3A-GtGzSRj6rT_P5dsh-tbFZWLLtBBVqfm66G69JSpXHCjwfZBVk80JeFGGQNEvYXEym4zaeupEoLc-FVJ9h3qyuqYYwvn32WIo32pbGSS2zTbSjx52VYRVhpVAQYPrsHcAGiW