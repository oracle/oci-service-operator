schemaVersion: 1
surface: repo-authored-semantics
service: stackmonitoring
slug: baselineablemetric
kind: BaselineableMetric
archetype: generated-service-manager
states:
  - active
  - terminating
repoAuthored:
  providerLifecycle:
    createPending: []
    updatePending: []
    deletePending: []
  listLookup:
    filters: ["id"]
    matchRule: exact resource identity match; duplicate matches fail
  mutation:
    mutable: ["column","compartmentId","definedTags","freeformTags","name","namespace","resourceGroup","resourceType"]
    forceNew: ["id","lifecycleState","systemTags","tenancyId"]
  followUp:
    create: read-after-write
    update: read-after-write
    delete: confirm-delete
notes:
  - "The runtime uses its declared lifecycle-state contract for BaselineableMetric reconciliation."
  - "The credential-free mock exercises SDK request serialization, response projection, mutation when supported, and confirmed deletion."
