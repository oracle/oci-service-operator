schemaVersion: 1
surface: repo-authored-semantics
service: stackmonitoring
slug: monitoredresourcetype
kind: MonitoredResourceType
archetype: generated-service-manager
states: [provisioning, active, updating, terminating]
repoAuthored:
  providerLifecycle:
    createPending: [CREATING]
    updatePending: [UPDATING]
    deletePending: [DELETING]
  listLookup:
    filters: [compartmentId, name]
    matchRule: exact tenancy-unique name and compartment match
  mutation:
    mutable: [definedTags, description, displayName, freeformTags, metadata, metricNamespace, resourceCategory, sourceType]
    forceNew: [compartmentId, name]
  hooks:
    create: [{helper: tfresource.CreateResource}]
    update: [{helper: tfresource.UpdateResource}]
    delete: [{helper: tfresource.DeleteResource}]
  followUp: {create: read-after-write, update: read-after-write, delete: confirm-delete}
notes:
  - ACTIVE is success and DELETED confirms deletion; ambiguous authorization-shaped 404s are not accepted as deletion.
  - Optional polymorphic metadata is normalized before create and update comparison.
