schemaVersion: 1
surface: repo-authored-semantics
service: stackmonitoring
slug: processset
kind: ProcessSet
archetype: generated-service-manager
states: [provisioning, active, updating, terminating]
repoAuthored:
  providerLifecycle:
    createPending: [CREATING]
    updatePending: [UPDATING]
    deletePending: [DELETING]
  listLookup:
    filters: [compartmentId, displayName, id]
    matchRule: exact compartment and displayName match; duplicate matches fail
  mutation:
    mutable: [displayName, specification, freeformTags, definedTags]
    forceNew: [compartmentId]
  hooks:
    create: [{helper: tfresource.CreateResource}]
    update: [{helper: tfresource.UpdateResource}]
    delete: [{helper: tfresource.DeleteResource}]
  followUp: {create: read-after-write, update: read-after-write, delete: confirm-delete}
notes:
  - ACTIVE is success and DELETED confirms deletion through lifecycle polling.
  - The specification item list is compared structurally and reconciles in place.
