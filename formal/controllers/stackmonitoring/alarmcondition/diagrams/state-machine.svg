ure match; tracked ID is preferred</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="161.875" x="2273.78" y="476.7803">and duplicate matches fail</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="2273.78" y="490.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="2273.78" y="504.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="302.7227" x="2273.78" y="518.7803">monitoringTemplateId is supplied by the required</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="308.9912" x="2273.78" y="532.7803">metadata annotation because the generated CRD</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="227.2607" x="2273.78" y="546.7803">has no spec field for the parent path.</text></g><g class="entity" data-qualified-name="GMN5" data-source-line="93" id="ent0006"><path d="M2955.27,614 L2955.27,629.22 L2495.26,612.29 L2955.27,637.22 L2955.27,664 A8,8 0 0 0 2963.27,672 L3202.5034,672 A8,8 0 0 0 3210.5034,664 L3210.5034,616 L3200.5034,606 L2963.27,606 A8,8 0 0 0 2955.27,614" fill="#FFF7D6" style="stroke:#B45309;stroke-width:0.5;"/><path d="M3200.5034,606 L3200.5034,612 A4,4 0 0 0 3204.5034,616 L3210.5034,616 L3200.5034,606" fill="#FFF7D6" style="stroke:#B45309;stroke-width:0.5;"/><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="136.9717" x="2961.27" y="621.7803">delete policy: required</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="234.2334" x="2961.27" y="635.7803">delete observe: GetAlarmCondition or</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="117.4961" x="2961.