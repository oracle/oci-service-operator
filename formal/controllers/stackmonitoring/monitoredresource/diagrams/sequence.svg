" lengthAdjust="spacing" textLength="89.4961" x="825" y="2323.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="825" y="2337.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="315.1777" x="825" y="2351.7803">The generated service manager uses the reviewed</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="286.3506" x="825" y="2365.7803">CRUD request, response, lifecycle, and status</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="118.2822" x="825" y="2379.7803">projection contract.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="301.1641" x="825" y="2393.7803">Work-request phases are declared per operation</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="261.4678" x="825" y="2407.7803">from the vendored SDK response surface.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="253.7021" x="825" y="2421.7803">Secret side effects are none and finalizer</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="284.0469" x="825" y="2435.7803">ownership is retained until confirmed deletion.</text><?plantuml-src pLXTZzis5dtdho2wBmdMycGwIPiwo0BfJBODCcs0cHPvCH3G4cLpGv5QahBZNUn_tyClIRRbp1G55ei-r2DUtizppxsC_InKomnhgDsmIk-4MjEQISk9xKzMhFoyDhfJrRMMsj2_r2N-gqOI5QzP9ztVjNA_ieRJdxdSSYTADYrpB_x5wUNpqI4pHk-IzcVrvVVVZcygxVYF9pxKzVVLTyTIsbJS98dLynTNptuual3cq_dLrVFB5oz6vq5zgOtYXbv-HvnmajDx_i-EgvBJWbe79ngjXDC6URhu9VxarHstkZCb9njHSLfhxLRwoqYnpJh-JIXb9UuSE9e2paV7aV9l-Slw6OwX33aLBLDk-lvOu35QHideTKXHyrkX3bFvmtDsjNg9Kw-oFJWgLzKBVjaVdPJfPStgalo7XDZe-sx5aL_7BHdvGQ_XYD5ISdFm-KTc-HqljIh5yT4t7-u_lB_dPYjA_WjJRCtDDvHPUlZfuCg7wtV4Gu3gBGfyg7jsT0_DWBfIWy