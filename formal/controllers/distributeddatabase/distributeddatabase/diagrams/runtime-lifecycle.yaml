schemaVersion: 1
surface: repo-authored-semantics
service: distributeddatabase
slug: distributeddatabase
kind: DistributedDatabase
archetype: generated-service-manager
states:
  - provisioning
  - active
  - updating
  - terminating
repoAuthored:
  providerLifecycle:
    createPending:
      - CREATING
    updatePending:
      - UPDATING
    deletePending:
      - DELETING
  listLookup:
    filters:
      - compartmentId
      - displayName
      - dbDeploymentType
      - lifecycleState
    matchRule: "exact compartmentId plus displayName list filters preserve dbDeploymentType and lifecycleState when already known, then narrow summary candidates in memory to a unique exact prefix plus dbDeploymentType match"
  mutation:
    mutable:
      - definedTags
      - displayName
      - freeformTags
    forceNew:
      - compartmentId
    createOnly:
      - catalogDetails.adminPassword
      - catalogDetails.shardSpace
      - shardDetails.adminPassword
      - shardDetails.peerVmClusterIds
  hooks:
    create:
      - helper: tfresource.CreateResource
    update:
      - helper: tfresource.UpdateResource
    delete:
      - helper: tfresource.DeleteResource
  followUp:
    create: read-after-write
    update: read-after-write
    delete: confirm-delete
notes:
  - "Create-body normalization keeps shard and catalog `source` inputs compatible with the OCI SDK: CRD `EXISTING_CLUSTER` values serialize as the SDK's `EXADB_XS`, scaffold-only `jsonData` is dropped, and explicit false booleans in nested vm-cluster and backup-config payloads are preserved."
  - "Reviewed lifecycle mapping treats CREATING as provisioning, UPDATING as updating, ACTIVE and INACTIVE as success, NEEDS_ATTENTION and FAILED as terminal non-success, and DELETING as terminating."
  - "ListDistributedDatabases returns DistributedDatabaseSummary items that omit fields such as scanListenerPort, latestGsmImageDetails, shardDetails, catalogDetails, gsmDetails, dbBackupConfig, and gsmSshPublicKey, so every successful bind or write path rereads GetDistributedDatabase before projecting steady-state status."
  - "The provider resource exposes broader patch, state-transition, and trigger update families, but the current CRD does not publish those controls; the package-local runtime only performs in-place updates through UpdateDistributedDatabaseDetails for displayName, freeformTags, and definedTags."
  - "Write-only shard and catalog passwords plus peer VM cluster IDs are accepted during create but omitted or projected through different OCI read shapes; update parity ignores only those unobservable inputs and still rejects drift in observable shard or catalog fields."
  - "Delete keeps the finalizer until GetDistributedDatabase or list fallback confirms DELETED or NOT_FOUND."
