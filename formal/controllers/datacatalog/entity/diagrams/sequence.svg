334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="738" y="2115.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="299.585" x="738" y="2129.7803">The runtime projects the vendored SDK lifecycle</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="322.1367" x="738" y="2143.7803">states and treats ACTIVE, INACTIVE as converged.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="293.3643" x="738" y="2157.7803">Parent identifiers scope composite OCI request</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="319.8398" x="738" y="2171.7803">paths and remain replacement-only unless the SDK</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="231.9092" x="738" y="2185.7803">update details explicitly expose them.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="277.0605" x="738" y="2199.7803">Create, get, list where available, update, and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="267.7227" x="738" y="2213.7803">delete request shapes are exercised by the</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="290.2539" x="738" y="2227.7803">package-local typed OCI mock integration test.</text><?plantuml-src fLXTRnit5dsVNq6qBobMikCcQH85NY2rjQqHDmdij7aHK50pToIkEUIKv4ZMBlhVU_Wr6YbIgiN2C2pD9U_dkUVUiNqGgkM6DymkUQNNGYrOpQMbmlQIEIyV5aPtghhIKXlsRLtYfngSgAZcdNJ_qigzvmsndqcko8cI7pvpB_v3xEBvGCYDqUka_MbzyVBxuKsb7VtuXGzr_RBwOV-KDXMPT6B-_CMpfw_tJdZpIVxisVEB5oy6yg2-r4QHOHS_54uuIUoU_kX8bSJ6hEAEb_YLUd4-LH1lYgMeYDLQkxb-76Yo-T9_2yPuwRJPyIn5c4NxeT7tzAf-2Z6K8OcYvSeTlZyyS8gMGVIz3YbgkXLgDtUld_DdyrUGUfNjZgYSLo_eeXTzKPTNDQ_BuiyYnCRUTND2GXtPO