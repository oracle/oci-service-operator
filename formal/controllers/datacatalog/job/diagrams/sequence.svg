just="spacing" textLength="89.4961" x="726" y="2115.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="726" y="2129.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="299.585" x="726" y="2143.7803">The runtime projects the vendored SDK lifecycle</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="322.1367" x="726" y="2157.7803">states and treats ACTIVE, INACTIVE as converged.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="293.3643" x="726" y="2171.7803">Parent identifiers scope composite OCI request</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="319.8398" x="726" y="2185.7803">paths and remain replacement-only unless the SDK</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="231.9092" x="726" y="2199.7803">update details explicitly expose them.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="277.0605" x="726" y="2213.7803">Create, get, list where available, update, and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="267.7227" x="726" y="2227.7803">delete request shapes are exercised by the</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="290.2539" x="726" y="2241.7803">package-local typed OCI mock integration test.</text><?plantuml-src fLXhRnit5ltENq5qlwHOZHtdqQOAl41YUrjltAImqyqN0GKrSqTYpI5dIOvaxQB_lOUF6OqKAV6YC0pF3CdxElUUUsbtBtKhh6YuMuhAhALUy5eeHymDAtDHtY-iwNHrOPIn_6zrYPzgjAEYMdJA_zDe_ruqn7yYjI8lIt5upvtyB_6p5wD5OQrPP-bFwxFldurFQkFfxMSsrFNtrNVxkuojoEOTynSldp_zOMz7K9_Ndpz_SVRovMWzYY-DrMJvsNVCIw-8tz5_Ej8byO9NmeiIlyeiJlzbvcmfA-ArCNvk7aPYN7_YVunpKNfZTypAxlLB