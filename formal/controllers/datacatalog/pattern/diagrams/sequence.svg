t-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="299.585" x="748" y="2115.7803">The runtime projects the vendored SDK lifecycle</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="322.1367" x="748" y="2129.7803">states and treats ACTIVE, INACTIVE as converged.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="293.3643" x="748" y="2143.7803">Parent identifiers scope composite OCI request</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="319.8398" x="748" y="2157.7803">paths and remain replacement-only unless the SDK</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="231.9092" x="748" y="2171.7803">update details explicitly expose them.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="277.0605" x="748" y="2185.7803">Create, get, list where available, update, and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="267.7227" x="748" y="2199.7803">delete request shapes are exercised by the</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="290.2539" x="748" y="2213.7803">package-local typed OCI mock integration test.</text><?plantuml-src fLXTRnkt4dtVNq7qlgIuMZjkd3PLu0AfxTiQSPF0JczU31JKxgp4cajkIQvajUX_x-7NQgL8jxeeWa3IaXpEcJbpPjRsKQYE6zuok-2rNWarPmsNbWexhCnuzJWtkbVrfPRQi7yr5VxLenqrDRoNxZzQkNUy9VOZoIKvKV7zU-x5xyJEpaUBt1YzIjQVDsVVV3K-gRIZxp_peMc-gR_UtQLDJIRjc9s_VF7ysvqT_lgq_kB5-TdBbwFrOBxIHf5XPryNJZX9x9v-wqbLn4fMSySh_9TwVlg1EqT65GjH4skqTZFzD39bywa_2iPuvRJPSYr1p4kxsEWhUjKynpAC8OgYuyhjFp_US8oL4Vp1XXGDtGgr7Rnlp_cBsIkiUfFTrb8rgr_IsR3qMM9UDRofYZ-BW8szxMU84pconSWFTWb7Z9QIpDRZxxcbEwgqgiJkqXVlxz-_lIUp51Nzn1MVa_c2SSks7sqTUNzvK_YaCxr4IhTjJtREWVw6QcR8QjaxeTKqFJgj1PyZf_Oq_YutMygSvXExd6SBDKcWFNWwBc-V95K7SXQROB7okr6CfemKz