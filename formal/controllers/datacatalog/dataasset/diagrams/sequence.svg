8" y="2115.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="768" y="2129.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="299.585" x="768" y="2143.7803">The runtime projects the vendored SDK lifecycle</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="322.1367" x="768" y="2157.7803">states and treats ACTIVE, INACTIVE as converged.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="293.3643" x="768" y="2171.7803">Parent identifiers scope composite OCI request</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="319.8398" x="768" y="2185.7803">paths and remain replacement-only unless the SDK</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="231.9092" x="768" y="2199.7803">update details explicitly expose them.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="277.0605" x="768" y="2213.7803">Create, get, list where available, update, and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="267.7227" x="768" y="2227.7803">delete request shapes are exercised by the</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="290.2539" x="768" y="2241.7803">package-local typed OCI mock integration test.</text><?plantuml-src fLXhRnit5ltENq5qlxI0newRf4raU87KzZP6d0VifFbYeA1cxaXSpv1JaYD5NUn_tyF7l1If4RO80abytEUvvrxQFahL22DgRbUYq1kfbhmKbILc-vs5o1-NHhUgkDILDlmVPOv_nUX4GQLeA_SlhTmxKHD_JTMQdCp5_ZFtya_YPyz6cy8OlKdIdvHdF_yulgcqer--ig4iVov-sZsbJK4cdLWyU_xqoSkT4rvzsd_wzDdPy-UZ_I0-rqQHuMS_CITTHVoU_cX9vSGpNWWdSlolzFBq2f-lh2N7Lh8WNchj5lhBI9Zjxls7SIvofyt4kEHajxNh7Vr8Byeds8Omn54sGhdzzyS7Zf4o2a0lev8bt