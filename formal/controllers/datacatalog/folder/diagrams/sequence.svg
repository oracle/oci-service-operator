 font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="743" y="2115.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="299.585" x="743" y="2129.7803">The runtime projects the vendored SDK lifecycle</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="322.1367" x="743" y="2143.7803">states and treats ACTIVE, INACTIVE as converged.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="293.3643" x="743" y="2157.7803">Parent identifiers scope composite OCI request</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="319.8398" x="743" y="2171.7803">paths and remain replacement-only unless the SDK</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="231.9092" x="743" y="2185.7803">update details explicitly expose them.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="277.0605" x="743" y="2199.7803">Create, get, list where available, update, and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="267.7227" x="743" y="2213.7803">delete request shapes are exercised by the</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="290.2539" x="743" y="2227.7803">package-local typed OCI mock integration test.</text><?plantuml-src fLXTRnj557tVNp62boBifA4D55T1AaaeKKEBaa9VBA7nxbrxoEpCCZDhno3-EsU-rclNBaOeYcBldRcVvvvxD_P1g9ORtZ2xu9LU2JLdDPUM2jjBPhnyc1lTgUfIIstOvtM9dsfmegAQTzBze9LxonjYFv9SaXCbtt_cNln9xEpvGCYDqQka_MbzzirNmvjAE_h-8n_g-flgwzrJsbHaqedPy_DdJx_TEU7D9_cpPy_Fpiy7yg2-r4QHOMTV5quuIUoU_kX8bSJ6hEAEb_YLUdxwWvQmL2n4HQpMsitquq2JpPV-AXZZfTDcoxCKOHRjXaPVqOlwASHGXYIAbYkt__xmm35Q1j7tEgIewLQexTnz-vm_cxs0rAjijqJbh3gdirxqKLrUrBmkYx-B41jxqyq82NLaYu4Vx1AE62qb