><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="322.1367" x="778" y="2115.7803">states and treats ACTIVE, INACTIVE as converged.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="293.3643" x="778" y="2129.7803">Parent identifiers scope composite OCI request</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="319.8398" x="778" y="2143.7803">paths and remain replacement-only unless the SDK</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="231.9092" x="778" y="2157.7803">update details explicitly expose them.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="277.0605" x="778" y="2171.7803">Create, get, list where available, update, and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="267.7227" x="778" y="2185.7803">delete request shapes are exercised by the</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="290.2539" x="778" y="2199.7803">package-local typed OCI mock integration test.</text><?plantuml-src fLZRRXit47tVho3IbmRGsd5kJMMuG6AxZH4tAUoqUJ4GKBkp4ckAt99SAMhHV-_XPM-or0eD3CCIBtCxCsU6jlT2rTpm9RCBNkgrK7DMSMafiztEZ1VtSwCRLPvhgGtxfYhmKmvEb5JnHheVjNBl-PBOMv8hSgBWky_SYZ-9dJmVR79Zz3f9VrATVFTqU5DfHsyUs51LtvKljqzfKv999sRFNpnxyltM2Qy-xJzxzlpanOl1VX1VQAF8i9ENcHDE4hkbFnfI1R6SbTpn0hzIpu-zcxRc1MKBKHAhj7Op_MKWpBRt_ieOuuNJPcHSShBTslQEdjAhwWcs8Gnn53LNRlVzuO53f0m2qCcGeg9heSRX-_uvVpPxXLqliXvj5RFo1PrqMm-WULNngiZ-pe9lx5qp8yJKaSq6Th1p66Aqb6H6os-ufHigj2h4zjQZ3xSVtjsIMOc2VkQApyayOjooyTBeoeVpgyp3plGAe8vbJxRkeG0CbSoGrR9nGgjfMZek1Py3KtiSl-VzaRo5-SYkvgs4aYIytNixRezlaYf3UcPzi5Z-mo16KqOAvnjYNUR1qkHArf_pjyPkJbdt-LlZTLhtE1iVyPV6mPZsmk6E5TwjFkK3xEnQwtlyuJ1z9bIPSUcOCqW6d0NizAMMW25Wm50Z2lMqOLmQukK6ky8wcusrUZjmUif-8jTh8x1H9xWJ92nR2cl1L_k4N4D39-NRIaX7navP