747" y="2115.7803">list lookup: oci_ocvp_clusters filters</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="276.2266" x="747" y="2129.7803">compartmentId, displayName, lifecycleState,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="288.6953" x="747" y="2143.7803">sddcId; exact SDDC and display-name identity</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="180.5303" x="747" y="2157.7803">match; duplicate matches fail</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="747" y="2171.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="747" y="2185.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="273.1367" x="747" y="2199.7803">Create or bind only attempts list reuse when</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="274.6816" x="747" y="2213.7803">spec.displayName is set; otherwise the local</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="302.6885" x="747" y="2227.7803">runtime wrapper rejects untracked create-or-bind</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="277.8125" x="747" y="2241.7803">so the controller never guesses from a broad</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="119.0342" x="747" y="2255.7803">ListClusters match.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="178.9854" x="747" y="2269.7803">Create and delete still record</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="322.9023" x="747" y="2283.7803">opc-work-request-id breadcrumbs when OCI returns</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="287.1162" x="747" y="2297.7803">them, but GetCluster and ListClusters lifecycle</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="278.5918" x="747" y="2311.7803">rereads remain the authoritative async signal</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="243.5713" x="747" y="2325.7803">for reconcile state and finalizer release.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="239.6475" x="747" y="2339.7803">Mutable drift is limited to displayName,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="295.6885" x="747" y="2353.7803">networkConfiguration, vmwareSoftwareVersion,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="281.709" x="747" y="2367.7803">esxiSoftwareVersion, and tags; the remaining</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="263.7988" x="747" y="2381.7803">published spec fields stay create-only drift.</text><?plantuml-src nLXPZnit4dxdhoXaNsoiUiRZ8tOqS017uqsCZErW9idJ007LpPOOiyaEoPQiBFQ_RnMFFdJ42lPXCG-IcjLrVlLLSTmdgLjkUGDkpIkpbNe5DLTECDUVB7dvQMLDfwk5KSR2F-eI_wgHH2LgtYd_BwFz1zu8-46eZV2ovCTbxkMV0gwUZmwvjMQRj3-fhru-7R-fZHVV7VXGro-hh_UbZAs4JHBBvo-UFVbcJuBCf_DdpvvVlNWnEW_gIsEri73rDVFIAm7tuezEw5900QRSj9SBrJalB5lBIa1jZ5-QpoCTBel_cm7mqXixyId5be_sWn9FnQlw2HwZCaoVRBdsnzyV2voZPHHthqF9MjnAFStQDy_vi-KhF2MLxUIeN5Oln5L_T52HLpMlI_OV5cA37xkbm5HwuTZ83rYW8zOeXIaSF_wEEt4dIgDBkN_qrSVxZp_U2xkHfNZFDLy9-nLm1zD7arS-BjungZQO3TPogdksznxYteeAh716TLuQFK-FBYl9LrXJTnb_5uD8aSjyuJQhhA4I2gCz-NOydhufT1LGoOPaGV7jA4Tp41hbEm49T-Xd2eGDKlJEDCWvzDyVMRBe_6Cs5Q6NfgcO3yen62Sfg0ptK7AuDUOJVd1qUobrnRZou2q