schemaVersion: 1
surface: repo-authored-semantics
service: ocvp
slug: esxihost
kind: EsxiHost
archetype: generated-service-manager
states:
  - provisioning
  - active
  - updating
  - terminating
repoAuthored:
  providerLifecycle:
    createPending: ["CREATING"]
    updatePending: ["UPDATING"]
    deletePending: ["DELETING"]
  listLookup:
    filters: ["clusterId","displayName"]
    matchRule: exact clusterId plus displayName match; duplicate matches fail
  mutation:
    mutable: ["billingDonorHostId","definedTags","displayName","freeformTags","nextCommitment"]
    forceNew: ["capacityReservationId","clusterId","computeAvailabilityDomain","currentCommitment","esxiSoftwareVersion","hostOcpuCount","hostShapeName"]
  followUp:
    create: read-after-write
    update: read-after-write
    delete: confirm-delete
notes:
  - "The runtime updates billingDonorHostId only with a compatible nextCommitment and rejects create-only drift before mutation."
  - "Create and update settle only after GetEsxiHost reaches ACTIVE; delete retains the finalizer until absence is confirmed."
