ength="144.751" x="758" y="2115.7803">create-only fields: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="252.123" x="758" y="2129.7803">list lookup: scaffold_ocvp_esxihost filters</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="269.2266" x="758" y="2143.7803">clusterId, displayName; exact clusterId plus</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="265.3438" x="758" y="2157.7803">displayName match; duplicate matches fail</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="758" y="2171.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="758" y="2185.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="305.0469" x="758" y="2199.7803">The runtime updates billingDonorHostId only with</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="261.4473" x="758" y="2213.7803">a compatible nextCommitment and rejects</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="201.5439" x="758" y="2227.7803">create-only drift before mutation.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="296.4951" x="758" y="2241.7803">Create and update settle only after GetEsxiHost</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="271.5781" x="758" y="2255.7803">reaches ACTIVE; delete retains the finalizer</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="165.751" x="758" y="2269.7803">until absence is confirmed.</text><?plantuml-src jLXTRzis57tNho2wbnQpacPfjzP11dH9jXRBsY7frfS01IrH