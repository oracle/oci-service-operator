34155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="93.3721" x="792" y="2115.7803">compartmentId</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="144.751" x="792" y="2129.7803">create-only fields: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="271.6055" x="792" y="2143.7803">list lookup: oci_data_safe_masking_policies</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="224.0957" x="792" y="2157.7803">filters columnSource.columnSource,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="231.1162" x="792" y="2171.7803">columnSource.sensitiveDataModelId,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="310.8574" x="792" y="2185.7803">columnSource.targetId, compartmentId (+2 more);</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="302.7021" x="792" y="2199.7803">exact resource identity match; duplicate matches</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="17.8965" x="792" y="2213.7803">fail</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="792" y="2227.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="792" y="2241.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="272.3369" x="792" y="2255.7803">The runtime uses its declared lifecycle-state</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="252.8818" x="792" y="2269.7803">contract for MaskingPolicy reconciliation.</text><text fill="#334155" font-family="Helvetica" f