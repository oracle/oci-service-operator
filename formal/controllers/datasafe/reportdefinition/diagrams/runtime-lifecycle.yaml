schemaVersion: 1
surface: repo-authored-semantics
service: datasafe
slug: reportdefinition
kind: ReportDefinition
archetype: generated-service-manager
states:
  - provisioning
  - active
  - updating
  - terminating
repoAuthored:
  providerLifecycle:
    createPending: ["CREATING"]
    updatePending: ["UPDATING"]
    deletePending: ["DELETING"]
  listLookup:
    filters: ["compartmentId","displayName","id","parentId"]
    matchRule: exact resource identity match; duplicate matches fail
  mutation:
    mutable: ["columnFilters","columnInfo","columnSortings","definedTags","description","displayName","freeformTags","summary"]
    forceNew: ["compartmentId","parentId"]
  followUp:
    create: read-after-write
    update: read-after-write
    delete: confirm-delete
notes:
  - "The runtime uses its declared lifecycle-state contract for ReportDefinition reconciliation."
  - "The credential-free mock exercises SDK request serialization, response projection, mutation when supported, and confirmed deletion."
