te states requeue until</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="244.3643" x="778" y="2297.7803">the corresponding follow-up converges.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="251.3506" x="778" y="2311.7803">Status projection is required, Secret side</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="260.7021" x="778" y="2325.7803">effects are none, and the finalizer policy is</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="178.1924" x="778" y="2339.7803">retain-until-confirmed-delete.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="278.5918" x="778" y="2353.7803">Delete policy required retains ownership until</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="206.9785" x="778" y="2367.7803">DELETED or confirmed absence.</text><?plantuml-src fLVRRXit47tdLn3jIm98SPnxPBX0OZkf4JSfRATz4M1Gkro93KLkIQuKjUY_z_2ssfMrYPCW3v5toBcUEJEqduIgcM5BQXUir6kXvhHYqd9YMycC5P_cHZUgFD5I6_fpLU1VsJbHyeerqhtHohrdIqv_vNB5dIZO_ZDNuXzE3vzqXCmOlKxQ7rQ7pnzrRohj-EjRFbJLy_BPxYbjIcxIYTcJfuyVljmvuSqd-UF7JmwVFkt8W_f26yKDFNn6d72Iqol-TyDLmUcObimnoof-SCML5Kwi-FMcvlRiSwsD8mjHSbffxMRwSqUfpVV_9PIomcdJSp85cqMxKV97_4Nr468eGpv5pPJRVxzxu2vQEebeTKXHyGkX-cby-OGzdhs0rAkiUw9YLZxbXwteLebULAmgo7yan4RVDJEEt3fkISSFUW97Z9QIczxdrypoIrveLOXTqKyVhZwyk-9c9Gh-6rDipirFb5dQ_zIxyk7adFZoKxr2SVkwHpltq0Y6bzHmgsNZX5QJzEcW56oEcjg3-FTuUsISo_p0hkPPGyabeXsy7SNzcroL0QPacomw_gMJemdb2kSR3ypR89mgayCYspjUGp_a2Mr_tpFUldNtIV-8lzHFp8IsoX6Q5OXXglQsGe03lT3w4_vZ26acL4cOTDGPW0If0HpuvrgYFA4s5BsZq6yRogJXhDn0AgopfE-1zmcd9_GjTtiDSn1NQwFLAInT2cj1RKFwBc1idq9xhnBISMCdKrNefKVK4ahFon4jXQqbstYwknz2CxonR8RS-7WyCXg3heTjr1EyWBOOidw2a1tV6v3KkgP5aDCQuF3qV79vzkhw_FtRRquEF0W9sk_f3sP-JtXxO5SZbr0Vcsk58lMABnIrZhd61dK-gR57QC8eBnEqJiFd8H-ZTA-R0pVWO