schemaVersion: 1
surface: repo-authored-semantics
service: datasafe
slug: sensitivetypegroup
kind: SensitiveTypeGroup
archetype: generated-service-manager
states:
- provisioning
- active
- updating
- terminating
repoAuthored:
  operations:
    update:
    - UpdateSensitiveTypeGroup
  providerLifecycle:
    createPending:
    - CREATING
    updatePending:
    - UPDATING
    deletePending:
    - DELETING
  listLookup:
    filters:
    - compartmentId
    - displayName
    - id
    matchRule: exact compartmentId, displayName, id match within the resource scope;
      duplicate matches fail
  mutation:
    mutable:
    - displayName
    - description
    - freeformTags
    - definedTags
    forceNew:
    - compartmentId
  hooks:
    create:
    - helper: generatedruntime.Create
      entityType: SensitiveTypeGroup
      action: CreateSensitiveTypeGroup
    update:
    - helper: generatedruntime.Update
      entityType: SensitiveTypeGroup
      action: UpdateSensitiveTypeGroup
    delete:
    - helper: generatedruntime.Delete
      entityType: SensitiveTypeGroup
      action: DeleteSensitiveTypeGroup
  followUp:
    create: GetWorkRequest -> GetSensitiveTypeGroup
    update: GetWorkRequest -> GetSensitiveTypeGroup
    delete: confirm-delete
notes:
- The production runtime uses the declared work-request phases and service-local async
  adapter.
- Lifecycle success and pending states mirror the production service-manager semantics.
- Status projection is required, Secret side effects are none, and the finalizer policy
  is retain-until-confirmed-delete.
- Delete ownership is retained until a terminal lifecycle state or confirmed absence.
