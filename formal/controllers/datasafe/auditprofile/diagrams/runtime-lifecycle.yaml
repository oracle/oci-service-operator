schemaVersion: 1
surface: repo-authored-semantics
service: datasafe
slug: auditprofile
kind: AuditProfile
archetype: generated-service-manager
states:
  - provisioning
  - active
  - updating
  - terminating
repoAuthored:
  providerLifecycle:
    createPending: ["CREATING"]
    updatePending: ["UPDATING"]
    deletePending: ["DELETING"]
  listLookup:
    filters: ["compartmentId","id","targetId","targetType"]
    matchRule: exact resource identity match; duplicate matches fail
  mutation:
    mutable: ["definedTags","description","displayName","freeformTags","isOverrideGlobalPaidUsage","isPaidUsageEnabled"]
    forceNew: ["compartmentId","offlineMonths","onlineMonths","targetId","targetType"]
  followUp:
    create: read-after-write
    update: read-after-write
    delete: confirm-delete
notes:
  - "The runtime uses its declared lifecycle-state contract for AuditProfile reconciliation."
  - "The credential-free mock exercises SDK request serialization, response projection, mutation when supported, and confirmed deletion."
