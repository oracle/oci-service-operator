hAdjust="spacing" textLength="287.9229" x="2266.78" y="140.7803">controllers map provider states into the shared</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="261.4609" x="2266.78" y="154.7803">controller phases with explicit finalizer and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="105.8477" x="2266.78" y="168.7803">requeue policies.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="105.834" x="2266.78" y="182.7803">service: datasafe</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="119.834" x="2266.78" y="196.7803">slug: alertpolicyrule</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="128.3857" x="2266.78" y="210.7803">kind: AlertPolicyRule</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="241.2402" x="2266.78" y="224.7803">archetype: generated-service-manager</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="156.4063" x="2266.78" y="238.7803">status/finalizer: required /</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="174.3027" x="2266.78" y="252.7803">retain-until-confirmed-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="272.3984" x="2266.78" y="266.7803">requeue: provisioning, updating, terminating</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="265.3369" x="2266.78" y="280.7803">provider states: create CREATING; update</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="192.165" x="2266.78" y="294.7803">UPDATING; delete DELETING</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="275.0645" x="2266.78" y="308.7803">follow-up: create=work-request-or-response;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="185.5957" x="2266.78" y="322.7803">update=work-request-or-read;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="237.7129" x="2266.78" y="336.7803">delete=work-request-or-confirm-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="244.3506" x="2266.78" y="350.7803">supported drift: expression, description,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="80.9238" x="2266.78" y="364.7803">displayName</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="230.3301" x="2266.78" y="378.7803">reject before mutate: force-new fields</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="76.2549" x="2266.78" y="392.7803">alertPolicyId</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="144.751" x="2266.78" y="406.7803">create-only fields: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="273.9365" x="2266.78" y="420.7803">list lookup: scaffold_datasafe_alertpolicyrule</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="281.668" x="2266.78" y="434.7803">filters alertPolicyId, expression, displayName;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="292.6123" x="2266.78" y="448.7803">exact parent policy plus expression and display</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="219.4404" x="2266.78" y="462.7803">name match; duplicate matches fail</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="2266.78" y="476.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="150.2129" x="2266.78" y="490.7803">open gaps: seed-corpus</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="291.0127" x="2266.78" y="504.7803">Write responses may include a Data Safe work</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="301.9297" x="2266.78" y="518.7803">request. The runtime resumes that request when</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="261.4746" x="2266.78" y="532.7803">present and otherwise converges from the</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="186.7646" x="2266.78" y="546.7803">response or a confirmed read.</text></g><g class="entity" data-qualified-name="GMN5" data-source-line="93" id="ent0006"><path d="M2948.27,614 L2948.27,629.24 L2488.23,612.29 L2948.27,637.24 L2948.27,664 A8,8 0 0 0 2956.27,672 L3194.7173,672 A8,8 0 0 0 3202.7173,664 L3202.7173,616 L3192.7173,606 L2956.27,606 A8,8 0 0 0 2948.27,614" fill="#FFF7D6" style="stroke:#B45309;stroke-width:0.5;"/><path d="M3192.7173,606 L3192.7173,612 A4,4 0 0 0 3196.7173,616 L3202.7173,616 L3192.7173,606" fill="#FFF7D6" style="stroke:#B45309;stroke-width:0.5;"/><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="136.9717" x="2954.27" y="621.7803">delete policy: required</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="233.4473" x="2954.27" y="635.7803">delete observe: GetAlertPolicyRule or</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="116.71" x="2954.27" y="649.7803">ListAlertPolicyRule<