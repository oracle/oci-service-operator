34155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="273.9365" x="798" y="2115.7803">list lookup: scaffold_datasafe_alertpolicyrule</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="281.668" x="798" y="2129.7803">filters alertPolicyId, expression, displayName;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="292.6123" x="798" y="2143.7803">exact parent policy plus expression and display</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="219.4404" x="798" y="2157.7803">name match; duplicate matches fail</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="798" y="2171.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="150.2129" x="798" y="2185.7803">open gaps: seed-corpus</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="291.0127" x="798" y="2199.7803">Write responses may include a Data Safe work</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="301.9297" x="798" y="2213.7803">request. The runtime resumes that request when</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="261.4746" x="798" y="2227.7803">present and otherwise converges from the</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="186.7646" x="798" y="2241.7803">response or a confirmed read.</text><?plantuml-src fLTjRnCv4FxkNp6w-m9Iqr9AUKdLaw3j0Q87g0NrIoNax7eJNnrxp_Ocv4xtts_6BvlTJGA54nz8T-nvVUQPiRkJkkQMpy7DU6cMKa-Xuie9vbh9X1TtKsiQNPuPPIpyMXNuh-oSA4N56-L_Dzg_vtC1RuHQ22yBlltCjVnRmE6JZf1RQvP9-wFgyDdZxarjl7YruKDLFIkV3ayPMmgRJaoU71yzUZ4uGUQJ_EZeoU7nSKSUr1V6Qc7Xy2dpqYi1r-AlHkX2m0XAxhdZbJXugOJr7usInUggKOB