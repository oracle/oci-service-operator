tive_types</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="295.668" x="791" y="2115.7803">filters compartmentId, entityType, displayName,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="282.4746" x="791" y="2129.7803">shortName; exact unique compartmentId plus</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="298.7988" x="791" y="2143.7803">entityType, displayName, and shortName match</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="791" y="2157.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="791" y="2171.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="272.3574" x="791" y="2185.7803">Create and update work-request IDs remain</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="307.3916" x="791" y="2199.7803">observable breadcrumbs, while generatedruntime</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="284.0332" x="791" y="2213.7803">converges through GetSensitiveType lifecycle</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="38.9102" x="791" y="2227.7803">reads.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="281.6953" x="791" y="2241.7803">The retained resource-local builders preserve</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="308.1025" x="791" y="2255.7803">SENSITIVE_TYPE and SENSITIVE_CATEGORY</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="175.0957" x="791" y="2269.7803">polymorphic request bodies.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="209.3301" x="791" y="2283.7803">Mutable fields follow the reviewed</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="246.6885" x="791" y="2297.7803">UpdateSensitiveType subtype surfaces.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="340.0605" x="791" y="2311.7803">ChangeSensitiveTypeCompartment and cross-subtype</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="291.0537" x="791" y="2325.7803">mutation remain outside the published runtime.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="287.1367" x="791" y="2339.7803">Delete retains the finalizer through DELETING</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="308.1436" x="791" y="2353.7803">until DELETED or NotFound. There are no Secret</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="74.7031" x="791" y="2367.7803">side effects.</text><?plantuml-src hLXPRzms47xdhnYaBmcwikCSJR912YIsanfr3dYT0WKC69H4hTXeIPMaThCj-jyxmqChxT6w1_AGbKWEv_Zccq-sNwHgkU4Bi3KlzKggELIyiOBPVYNdnPUvqPqgJtMZ3NnJ5VYl7EmeHSMxnhtLodtW2m4_Y6Ofd2pu_Zqp-Pk0aoU3HMwCNaNh3wkJPu-69vLsuisE3rNrhFnkUvSsfJ1nH_xawUE7BxPsqFLn_V7Z9oTFdmxMlVb26oKCd7p7d7IDW9dujHEg4911oHstl1B7Cw6iT78fhjUjOBKi1LHQkrn_7LYpwU3l380NJfkHTp7AjBGTddWadbSFSHcDOI9bovNRVtwuuIvM1XdeRJIo4fTIZVFtuWb_d3_7LJBPZfQAl7mgJlgbdTeyhtXLi3-OZmr-x7A1INN2ie4VS8gE6DqqmenUl-5MN8b2gq9kBztxEFluuqoOfIp4UwxuN9Xxm2sCNusEV3ozO5Htq4kiwjZsPEiSTe0H9HXXTTCvgTKqlZek9PzZJUrnUCusMx9KvYExd2SBfMWmseEdm_Buf52bnoVR90koxmSvce9GkByZH0xGXzx6SDXcBvqSXpg5_lTzG_TQzu2Djz2XSKAc6-COafKKsXZwllnmgVKN_8zZ2BbK9UED0sSG5BWVoo--jWsMmzS2i5SKDjOQU6C4BzUuAgspR7mp-OAxf_1EkF6D0gcfDzuRanOMqbeahqE6Bl6MaILxlvAD4yPERrIX