schemaVersion: 1
surface: repo-authored-semantics
service: datasafe
slug: securitypolicyconfig
kind: SecurityPolicyConfig
archetype: generated-service-manager
states:
    - provisioning
    - active
    - updating
    - terminating
repoAuthored:
    operations:
        update:
            - UpdateSecurityPolicyConfig
    providerLifecycle:
        createPending:
            - CREATING
        updatePending:
            - UPDATING
        deletePending:
            - DELETING
    listLookup:
        filters:
            - compartmentId
            - securityPolicyId
            - id
        matchRule: exact compartmentId, securityPolicyId, id match within the resource scope; duplicate matches fail
    mutation:
        mutable:
            - compartmentId
            - displayName
            - description
            - firewallConfig
            - unifiedAuditPolicyConfig
            - freeformTags
            - definedTags
        forceNew:
            - securityPolicyId
    hooks:
        create: []
        update:
            - helper: ChangeSecurityPolicyConfigCompartment
        delete: []
    followUp:
        create: read-after-write
        update: read-after-write
        delete: confirm-delete
notes:
    - The production runtime uses generatedruntime/workrequest async handling for create, update, delete work-request phases.
    - Lifecycle success states are ACTIVE; pending create, update, and delete states requeue until the corresponding follow-up converges.
    - Status projection is required, Secret side effects are none, and the finalizer policy is retain-until-confirmed-delete.
    - Delete policy required retains ownership until DELETED or confirmed absence.
