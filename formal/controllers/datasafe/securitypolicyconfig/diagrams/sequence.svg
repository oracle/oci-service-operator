lookup:</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="276.2607" x="771" y="2115.7803">oci_data_safe_security_policy_configs filters</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="258.3232" x="771" y="2129.7803">compartmentId, securityPolicyId, id; exact</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="298.7783" x="771" y="2143.7803">compartmentId, securityPolicyId, id match within</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="261.4746" x="771" y="2157.7803">the resource scope; duplicate matches fail</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="771" y="2171.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="771" y="2185.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="177.4268" x="771" y="2199.7803">The production runtime uses</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="307.3984" x="771" y="2213.7803">generatedruntime/workrequest async handling for</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="273.1641" x="771" y="2227.7803">create, update, delete work-request phases.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="286.3574" x="771" y="2241.7803">Lifecycle success states are ACTIVE; pending</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="288.7637" x="771" y="2255.7803">create, update, and delete states requeue until</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="244.3643" x="771" y="2269.7803">the corresponding follow-up converges.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="251.3506" x="771" y="2283.7803">Status projection is required, Secret side</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="260.7021" x="771" y="2297.7803">effects are none, and the finalizer policy is</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="178.1924" x="771" y="2311.7803">retain-until-confirmed-delete.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="278.5918" x="771" y="2325.7803">Delete policy required retains ownership until</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="206.9785" x="771" y="2339.7803">DELETED or confirmed absence.</text><?plantuml-src fLVRRXit47tdLmpQbmJrsd6TMsMuG6gxQH0tAUAaJm8CQdTMOaEHMv8hHItwxntULhloAb5Jv27oaXpEvPmpG_jHg8ORlWIxu9LU2pM7cakBp7OhCrv-d1lTgkfIIstWsxgaVrLlHuKrRwNxMIltXYyHVa6vGYTAFhxdLlo5SFgujyYDqUja_L5z-kpx_acb7VvqpuUwVbOztTsbJOKcxPWzVdBsw8UT7Vxwj7vszlZqoPFUUZ1VQgFGmEbJveIJ2BVuPukgH2YWuevRNkF9BPQj4MxpcvQYt5ngLOivMuWAeTRQpVIddb6Rp__D07Zfj1aucOBDIxjHulVul7v4osICyYaQhjpu-Vw6Gwpq4j7PaAB66w66QVpXCJ-RFQTLRx8PB9MpwWcUTaltIlIyvdN9_c4XDdZTpf1owz2odXz0wND6IubcyFadRl4TbbgLOdVfcxUtRr_Vebc94d_bYi_HV0FSml3JuCZRorVCbn_qYeexj7sqSuw8OB02WrRBrWcj9kdJIINud6fgJ-BVnNPBaSjyR5VpRA52IT7kFHsNXoTHLG6cR9iiA7xivMW2g6X_wu5v7uHJPN9OR7l6MnY6F87kzmFZxxVk8HjkyOU6YPb0Pvn2iu9YcAfHAWGum8tM7-a_JY7DXAeObmwS8P1GQWWE-AcX8oBK1eWxYlYs0IuDycf3gy8wouOUU9zezmHUeXkz64cukZiwcyB2KbXBqhRFtWrTDcRGFgY5T6ZiPAfAlVI8MfBHLzKHyRg_tNyHrSCGey7MyXaboGVc8T8QeZyvGOKbWI1-x7FZac9tE1gPrBg1Cgn3GoZnEdtvxlh5-rTlNlxdB9478LFZdlxF4eo4DuA_Xf9AvYFBLbIj0Gg40kkuQsqmvvCQoG89h5WbZ5s5p_jyZAkZRkuvKVfLiypNhGIVgZsH4eQdQYzmOi6IcLomg-kRwwyes1TkoYag9N95EI5krK9nIKtMKCBegmtmcqdjUN58TGmwJZL8xljIOE0nVJURY9sqvbb1FqW2GSyiMJxqWkZMrb5U4y_kM