font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="272.3369" x="2288.78" y="476.7803">The runtime uses its declared lifecycle-state</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="280.123" x="2288.78" y="490.7803">contract for OnPremConnector reconciliation.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="301.123" x="2288.78" y="504.7803">The credential-free mock exercises SDK request</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="265.3643" x="2288.78" y="518.7803">serialization, response projection, mutation</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="252.9434" x="2288.78" y="532.7803">when supported, and confirmed deletion.</text></g><g class="entity" data-qualified-name="GMN5" data-source-line="92" id="ent0006"><path d="M2970.27,600 L2970.27,614.84 L2510.28,598.25 L2970.27,622.84 L2970.27,650 A8,8 0 0 0 2978.27,658 L3238.5102,658 A8,8 0 0 0 3246.5102,650 L3246.5102,602 L3236.5102,592 L2978.27,592 A8,8 0 0 0 2970.27,600" fill="#FFF7D6" style="stroke:#B45309;stroke-width:0.5;"/><path d="M3236.5102,592 L3236.5102,598 A4,4 0 0 0 3240.5102,602 L3246.5102,602 L3236.5102,592" fill="#FFF7D6" style="stroke:#B45309;stroke-width:0.5;"/><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="136.9717" x="2976.27" y="607.7803">delete policy: required</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="255.2402" x="2976.27" y="621.7803">delete observe: GetOnPremConnector or</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="145.5029" x="2976.27" y="635.7803">ListOnPremConnectors</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="157.1855" x="2976.27" y="649