h="279.3301" x="820" y="2115.7803">filters compartmentId, displayName, id; exact</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="287.1367" x="820" y="2129.7803">resource identity match; duplicate matches fail</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="820" y="2143.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="820" y="2157.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="272.3369" x="820" y="2171.7803">The runtime uses its declared lifecycle-state</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="280.123" x="820" y="2185.7803">contract for OnPremConnector reconciliation.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="301.123" x="820" y="2199.7803">The credential-free mock exercises SDK request</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="265.3643" x="820" y="2213.7803">serialization, response projection, mutation</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="252.9434" x="820" y="2227.7803">when supported, and confirmed deletion.</text><?plantuml-src fLXjRzis4FxENq5iNreWIfgcwOk33cYJhYkQDKNIObyC1BHqihbGf4PIThrX_trt52bBijsc7VgXidYyr-UUEyNTILqBAohk5g8mAwddl1JA0NFToKpaTtDh6bsS6sKi_xdCyL_HaoYW58tolnhjFuWA-6-Wbk1bBdRBtCY_WHy_wHqAQyqgQdzK7ZzxtB-fZOVNMpwKvRFYwLZAs09ib9WzEJrvz68aGURZ-Sd9a-FJqzvvK9yRgy7ouwVCIw-0ty1V3UWSUCOBuOKJ9HnTwOyMgdEZDUJUMBQG1V3I63ypNthwNBhw3-DSaEJ0lnXdEXe728_XUVa8Zr4PfbBMGllTz_i2zz7Ioq6dGyaIBgKUPl354t4oUuwdfB8U7EMpuXIEkwEjwZmlHPcpVrc8ZRzlPe1fzU1Opm-E6VJMA0LsyFgrS70DkT6v71_zT7LpzVu6x5BcyBlGOWxs9ouS7xuQNBawVyUeyjmiiQv3tGUZUzW35WfkmHdLU6dq9BuwAgIOOqtTKVixsuXagSo7RZ