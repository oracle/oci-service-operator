/text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="251.3506" x="701.4182" y="2556.7803">Status projection is required, Secret side</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="260.7021" x="701.4182" y="2570.7803">effects are none, and the finalizer policy is</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="178.1924" x="701.4182" y="2584.7803">retain-until-confirmed-delete.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="271.585" x="701.4182" y="2598.7803">Delete ownership is retained until a terminal</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="226.4404" x="701.4182" y="2612.7803">lifecycle state or confirmed absence.</text><ellipse cx="664.4182" cy="2294" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="664.4182" cy="2294" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="664.4182" x2="664.4182" y1="157" y2="177"/><polygon fill="#0F172A" points="660.4182,167,664.4182,177,668.4182,167,664.4182,171" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="815.884" x2="815.884" y1="341" y2="361"/><polygon fill="#0F172A" points="811.884,351,815.884,361,819.884,351,815.884,355" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="815.884" x2="815.884" y1="423" y2="443"/><polygon fill="#0F172A" points="811.884,433,815.884,443,819.884,433,815.884,437" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="522.9524" x2="512.9524" y1="257" y2="257"/><line style="stroke:#0F172A;stroke-width:1;" x1="512.9524" x2="512.9524" y1="257" y2="279"/><polygon fill="#0F172A" points="508.9524,269,512.9524,279,516.9524,269,512.