schemaVersion: 1
surface: repo-authored-semantics
service: datasafe
slug: targetalertpolicyassociation
kind: TargetAlertPolicyAssociation
archetype: generated-service-manager
states:
- provisioning
- active
- updating
- terminating
repoAuthored:
  operations:
    update:
    - UpdateTargetAlertPolicyAssociation
  providerLifecycle:
    createPending:
    - CREATING
    updatePending:
    - UPDATING
    deletePending:
    - DELETING
  listLookup:
    filters:
    - compartmentId
    - policyId
    - targetId
    - id
    matchRule: exact compartmentId, policyId, targetId, id match within the resource
      scope; duplicate matches fail
  mutation:
    mutable:
    - isEnabled
    - displayName
    - description
    - freeformTags
    - definedTags
    forceNew:
    - compartmentId
    - policyId
    - targetId
  hooks:
    create:
    - helper: generatedruntime.Create
      entityType: TargetAlertPolicyAssociation
      action: CreateTargetAlertPolicyAssociation
    update:
    - helper: generatedruntime.Update
      entityType: TargetAlertPolicyAssociation
      action: UpdateTargetAlertPolicyAssociation
    delete:
    - helper: generatedruntime.Delete
      entityType: TargetAlertPolicyAssociation
      action: DeleteTargetAlertPolicyAssociation
  followUp:
    create: GetWorkRequest -> GetTargetAlertPolicyAssociation
    update: GetWorkRequest -> GetTargetAlertPolicyAssociation
    delete: confirm-delete
notes:
- The production runtime uses the declared work-request phases and service-local async
  adapter.
- Lifecycle success and pending states mirror the production service-manager semantics.
- Status projection is required, Secret side effects are none, and the finalizer policy
  is retain-until-confirmed-delete.
- Delete ownership is retained until a terminal lifecycle state or confirmed absence.
