schemaVersion: 1
surface: repo-authored-semantics
service: datasafe
slug: sqlcollection
kind: SqlCollection
archetype: generated-service-manager
states:
  - provisioning
  - active
  - updating
  - terminating
repoAuthored:
  providerLifecycle:
    createPending: ["CREATING"]
    updatePending: ["UPDATING"]
    deletePending: ["DELETING"]
  listLookup:
    filters: ["compartmentId","dbUserName","displayName","targetId"]
    matchRule: exact resource identity match; duplicate matches fail
  mutation:
    mutable: ["definedTags","description","displayName","freeformTags","sqlLevel","status"]
    forceNew: ["compartmentId","dbUserName","targetId"]
  followUp:
    create: read-after-write
    update: read-after-write
    delete: confirm-delete
notes:
  - "The runtime uses its declared lifecycle-state contract for SqlCollection reconciliation."
  - "The credential-free mock exercises SDK request serialization, response projection, mutation when supported, and confirmed deletion."
