mily="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="785" y="2115.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="785" y="2129.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="272.3369" x="785" y="2143.7803">The runtime uses its declared lifecycle-state</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="245.1162" x="785" y="2157.7803">contract for SqlCollection reconciliation.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="301.123" x="785" y="2171.7803">The credential-free mock exercises SDK request</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="265.3643" x="785" y="2185.7803">serialization, response projection, mutation</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="252.9434" x="785" y="2199.7803">when supported, and confirmed deletion.</text><?plantuml-src hLXTRzis57tdho2wbnQpagP9-k4W0zgawufcxP2qRmO2MhgosL2aIb9slM7_VVTIf2mvTkjkGnzgYUJzFFSSAkvEwbfOKN4t5uLPIZtZfL0EcEjMfYA_crdJwEB2A6FvJsME_uhUZW9AqIZ_gz7-lQY0_mPg0LxcOlkU6_adyAEJtgAmrYoZzSVbqRCd_PFQU7XrBuQoV5OytTnbR04sxfYUd1u_Vh6nWzp7zUFZawFJqzvwC9yRgy7oewVCIw-0ty2N1dGEFEE5yCA94WvllYYqeI3tqcWsbmNmqXW_DLzxrbmw-1VZNEJUs45qCSkqj9aUF87dvMDSHcDOI5aBxRUVxs_Onqgl0fqD9KkuadfOlnSdudZw75V9P3rOogV5AHnrI_TwyxmKPSx-PY4t_gwP0XRLWsEzEFW51cAfZ7Rm-fLmS0svqRdSN7hmuUR3knkm2vd3xqAB6TW7N3W-V3Kuyk7YBQE-SxF0hWvjZpREuGHOABW5PrH3hHt7LuU553FigJjidxFrbYor-S0jPib20GgptNcwNHwU15q4VB9riNZsIwz6OmuQzpU8o3xwCDgO3bllfPF3LCUy-_tGab_d7x7X5ZeqBCXuRHnJSf9I6q8_j9zV6NE7_mbCOIfrmOJot5i41Ux7ziFNMc4xGYyupeh6mLfneIo8OeMhqdd7Xfuf5jmzvc_03pq2KbDdl3Cc7Q-aSqXUkmnTePU19VUmbCg3TUE9par5cAdGsjjYn8lf9mUMY6mqqOLqjHAhyCIzi3F0FOz2ZXOQ9wPO74gC8D5O77UC1Hk9X83pi2kQ2ypTmp0pPKpDyx30QuG