ng" textLength="271.5713" x="828.9644" y="1502.2803">update=GetWorkRequest -&gt; GetAlertPolicy;</text><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="263.0127" x="828.9644" y="1516.2803">delete=GetWorkRequest -&gt; confirm-delete</text><rect fill="#F8FAFC" height="34" rx="8" ry="8" style="stroke:#0F172A;stroke-width:0.5;" width="303.2197" x="813.1401" y="1549.5"/><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="283.2197" x="823.1401" y="1570.2803">Return success for the ACTIVE success state</text><rect fill="#F8FAFC" height="48" rx="8" ry="8" style="stroke:#0F172A;stroke-width:0.5;" width="279.1299" x="825.1851" y="1603.5"/><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="259.1299" x="835.1851" y="1624.2803">Project required status and finalizer policy</text><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="174.3027" x="835.1851" y="1638.2803">retain-until-confirmed-delete</text><rect fill="#F8FAFC" height="34" rx="8" ry="8" style="stroke:#0F172A;stroke-width:0.5;" width="313.4189" x="808.0405" y="1671.5"/><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="293.4189" x="818.0405" y="1692.2803">Requeue on provisioning, updating, terminating</text><path d="M683.2471,1727.5 L683.2471,2057.5 L663.2471,2061.5 L683.2471,2065.5 L683.2471,2395.5 A0,0 0 0 0 683.2471,2395.5 L1011.6455,2395.5 A0,0 0 0 0 1011.6455,2395.5 L1011.6455,1737.5 L1001.6455,1727.5 L683.2471,1727.5 A0,0 0 0 0 683.2471,1727.5" fill="#FFF7D6" style="stroke:#B45309;stroke-width:0.5;"/><path d="M1001.6455,1727.5 L1001.6455,1737.5 L1011.6455,1737.5 L1001.6455,1727.5" fill="#FFF7D6" style="stroke:#B45309;stroke-width:0.5;"/><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="101.165" x="689.2471" y="1743.2803">shared diagram:</text><text fill=