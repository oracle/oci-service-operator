schemaVersion: 1
surface: repo-authored-semantics
service: datasafe
slug: alertpolicy
kind: AlertPolicy
archetype: generated-service-manager
states:
    - provisioning
    - active
    - updating
    - terminating
repoAuthored:
    operations:
        update:
            - UpdateAlertPolicy
    providerLifecycle:
        createPending:
            - CREATING
        updatePending:
            - UPDATING
        deletePending:
            - DELETING
    listLookup:
        filters:
            - compartmentId
            - displayName
        matchRule: exact compartmentId, displayName match within the resource scope; duplicate matches fail
    mutation:
        mutable:
            - displayName
            - description
            - severity
            - freeformTags
            - definedTags
        forceNew:
            - alertPolicyType
            - compartmentId
            - alertPolicyRuleDetails
    hooks:
        create: []
        update: []
        delete: []
    followUp:
        create: GetWorkRequest -> GetAlertPolicy
        update: GetWorkRequest -> GetAlertPolicy
        delete: GetWorkRequest -> confirm-delete
notes:
    - The production runtime uses generatedruntime/workrequest async handling for create, update, delete work-request phases.
    - Lifecycle success states are ACTIVE; pending create, update, and delete states requeue until the corresponding follow-up converges.
    - Status projection is required, Secret side effects are none, and the finalizer policy is retain-until-confirmed-delete.
    - Delete policy required retains ownership until DELETED or confirmed absence.
