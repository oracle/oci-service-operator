.5713" x="769" y="1961.7803">GetAlertPolicy; update=GetWorkRequest -&gt;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="266.8955" x="769" y="1975.7803">GetAlertPolicy; delete=GetWorkRequest -&gt;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="88.7031" x="769" y="1989.7803">confirm-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="257.5713" x="769" y="2003.7803">supported drift: displayName, description,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="204.2236" x="769" y="2017.7803">severity, freeformTags (+1 more)</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="230.3301" x="769" y="2031.7803">reject before mutate: force-new fields</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="200.7441" x="769" y="2045.7803">alertPolicyType, compartmentId,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="136.165" x="769" y="2059.7803">alertPolicyRuleDetails</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="144.751" x="769" y="2073.7803">create-only fields: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="246.709" x="769" y="2087.7803">list lookup: oci_data_safe_alert_policies</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="260.6543" x="769" y="2101.7803">filters compartmentId, displayName; exact</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="287.123" x="769" y="2115.7803">compartmentId, displayName match within the</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="238.123" x="769" y="2129.7803">resource scope; duplicate matches fail</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="769" y="2143.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="769" y="2157.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="177.4268" x="769" y="2171.7803">The production runtime uses</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="307.3984" x="769" y="2185.7803">generatedruntime/workrequest async handling for</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="273.1641" x="769" y="2199.7803">create, update, delete work-request phases.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="286.3574" x="769" y="2213.7803">Lifecycle success states are ACTIVE; pending</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="288.7637" x="769" y="2227.7803">create, update, and delete states requeue until</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="244.3643" x="769" y="2241.7803">the corresponding follow-up converges.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="251.3506" x="769" y="2255.7803">Status projection is required, Secret side</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="260.7021" x="769" y="2269.7803">effects are none, and the finalizer policy is</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="178.1924" x="769" y="2283.7803">retain-until-confirmed-delete.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="278.5918" x="769" y="2297.7803">Delete policy required retains ownership until</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="206.9785" x="769" y="2311.7803">DELETED or confirmed absence.</text><?plantuml-src jLXTSnir57tNhxW3BsMmauQsq3fJPa8Ie4DeEqaABvd9oBjQMtGjBPBMhc7uxnnzhNVjk3KmJ1_ghgxkvxddNjM-bwhXXY_8pdcfLrBDgEAr5Sns9rDUl9yPtQhoNDVQqETLWJzbJw8K5MzhzxrMxZLV2FfHr4lXPC4VbhcHVmWwUTexvCReLTB-k3hvvgl-JQMT-6x7XwhwflnwMqgRKfWaCNtwxCdZ5riItdmwV_BawScpPxtpeBxGHWb39ryp9rqjw4RytWfL21fJoHstl1B7PxKmxgskPR5cSraAghHsK_sXfylcQtyo8buuRGQ-fHZpqNPmuYlnl7gCOoX36cN3bNluVb_W42sz-3iTjQp4bLJ3xBruofzCd-FKgsm6HyMqV2PEkgEToZolU5MmlrY8ZNvgfm8fTSAodXzq3aUChf79mUVlk1NNej2gaDj7dxsvUVFJZJ1BMOYVkU8pOJuZRcduQN3bpVahvgjEUecQ3dMFjku1_qQKP8JLTUkaLfFqwRYKV8QQskFux_56P9pBV6INiwoX53MYtNix7Wzl2bK6TB9DicZyRIz74n8AygsW7lRWQmg6RIJzlM6W4-f-FpBUgdLViA68lpHCnsIZ705PwGFhmpwKdgwqVe-_EDoVIbKoNZjo1e20D4elFZGGbg4EX3vHQAaryTe8NgvnAgspR6ZNUmBf2VqWND-U02LrgZjLqj92MWlIsgVc2ZOsUgImZofPEs7iv4uLUk71ie2oL-M8IccRcgyzWNqH8Z6YjNoA17ZtVT5RWuQ6JPGABG_4xxDwZWYTwFjVQzrG4JvJWt9xdZs_lZoxVVNwXqDJ07iX3G_xzU_I-a0C3m2eGSAWDJR74XKO55GgiewxrWPrFdCHuvJG9ie4bulmUPzhyRJltHv1-5L9iyXMbf9lXGNitQcToiSQf4kv1XUNLvU7ry23UbTlZhge1LS84qALLBp6b3F80RxQ09jfhJry3qcu4OuZhSbPdrqHkWpVJMg6TEP1Z1yW8z9J2ys76eXkRHpb5TfYLsk4NOQUhtlq1l44PpmG3pCO-Mirbnro5uZH0ZvtAhV2YDwzlKY_kj84oxLSvaHuLI0a2-T5NOxv2hnwfqeZAqTYoUkM1ySJviBdEP9NUvhOJ8EXpoC_AcxQfj46UAMsARqbsvgA5sBIvuOH0nyMHZRUo0Y37ihG1IEgZ12LDejRFhFqwCiJjj06J78jVXE5ewa_4xHeVGWJq0TwTgp4AWPX0Q0EPRVhHeneo4xzy-ks5XSU8BLbYO4pgMtVwlcTHHVS5NEa0YFb0oRqHsv4KLf91tboSz6H3RE5RiGfbQqdU9-f8EfB0gysuqmthXSf-iAtBcuuttgnOC1H2SGLxb3SzhFfOHGoce7g3TgkYlx8y-IdBQLkFskQUatlGl47RQ_mkVAiabN6gWrm0GX-6XXt2iYWY8p0HmbfcOyo_F_9JDW_XtY8fy9Ye5TZrDvYWZenMsFsXL7q4kf-rURzTIHgtBjJGmkdTofwU91eP8-7H1Ddf-tdqBaJnyhBrF0bKjpnrSj8aUCMCwWU9_NTUXKCREyuMnjLPYGmPsFqKbgK3IKOnPBuNtSAJRM0HTTHXv6pkIDTqSFROrhs_jlg-4aj3wsGDmvD3AZfHUZKdMrsyo8151dGSH5MjX1mUDZ4BQBXin2lHp