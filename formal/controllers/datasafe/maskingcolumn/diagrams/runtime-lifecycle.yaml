schemaVersion: 1
surface: repo-authored-semantics
service: datasafe
slug: maskingcolumn
kind: MaskingColumn
archetype: generated-service-manager
states:
- provisioning
- active
- updating
- terminating
repoAuthored:
  operations:
    update:
    - UpdateMaskingColumn
  providerLifecycle:
    createPending:
    - CREATING
    updatePending:
    - UPDATING
    deletePending:
    - DELETING
  listLookup:
    filters:
    - maskingPolicyId
    - schemaName
    - objectName
    - columnName
    matchRule: exact maskingPolicyId, schemaName, objectName, columnName match within
      the resource scope; duplicate matches fail
  mutation:
    mutable:
    - objectType
    - maskingColumnGroup
    - sensitiveTypeId
    - isMaskingEnabled
    - maskingFormats
    forceNew:
    - maskingPolicyId
    - schemaName
    - objectName
    - columnName
  hooks:
    create:
    - helper: tfresource.CreateResource
      entityType: MaskingColumn
      action: CreateMaskingColumn
    update:
    - helper: tfresource.UpdateResource
      entityType: MaskingColumn
      action: UpdateMaskingColumn
    delete:
    - helper: tfresource.DeleteResource
      entityType: MaskingColumn
      action: DeleteMaskingColumn
  followUp:
    create: read-after-write
    update: read-after-write
    delete: confirm-delete
notes:
- The production runtime uses the declared work-request phases and service-local async
  adapter.
- Lifecycle success and pending states mirror the production service-manager semantics.
- Status projection is required, Secret side effects are none, and the finalizer policy
  is retain-until-confirmed-delete.
- Delete ownership is retained until a terminal lifecycle state or confirmed absence.
