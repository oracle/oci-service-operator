 delete DELETING</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="209.6992" x="808" y="2115.7803">follow-up: create=read-after-write;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="288.7158" x="808" y="2129.7803">update=read-after-write; delete=confirm-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="204.668" x="808" y="2143.7803">supported drift: dataType, status,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="289.0713" x="808" y="2157.7803">sensitiveTypeId, parentColumnKeys (+3 more)</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="230.3301" x="808" y="2171.7803">reject before mutate: force-new fields</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="314.3643" x="808" y="2185.7803">sensitiveDataModelId, schemaName, objectName,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="147.4375" x="808" y="2199.7803">columnName (+2 more)</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="144.751" x="808" y="2213.7803">create-only fields: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="178.2061" x="808" y="2227.7803">list lookup: unavailable filters</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="314.3643" x="808" y="2241.7803">sensitiveDataModelId, schemaName, objectName,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="265.3438" x="808" y="2255.7803">columnName; exact sensitiveDataModelId,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="340.7988" x="808" y="2269.7803">schemaName, objectName, columnName match within</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="261.4746" x="808" y="2283.7803">the resource scope; duplicate matches fail</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="808" y="2297.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="808" y="2311.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="258.3711" x="808" y="2325.7803">The production runtime uses the declared</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="279.3506" x="808" y="2339.7803">work-request phases and service-local async</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="51.3721" x="808" y="2353.7803">adapter.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="294.9229" x="808" y="2367.7803">Lifecycle success and pending states mirror the</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="244.3301" x="808" y="2381.7803">production service-manager semantics.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="251.3506" x="808" y="2395.7803">Status projection is required, Secret side</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="260.7021" x="808" y="2409.7803">effects are none, and the finalizer policy is</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="178.1924" x="808" y="2423.7803">retain-until-confirmed-delete.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="271.585" x="808" y="2437.7803">Delete ownership is retained until a terminal</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="226.4404" x="808" y="2451.7803">lifecycle state or confirmed absence.</text><?plantuml-src hLTRSzis5dx7hpZJlgHJqOxZf4tbSMTQE-rcuZOxSVgc5uW49MmeW0k0KhGx-z_xuKPHbDGesOuVJE5ohj_vpe7z85NB3L-HNV9ARwHQKCqRAvZjT-Qy_B0mkbFLdMwqeQ_h4d_Lu4GbQjurxXUjtEzy9UWVebaB9qj-_CoZ_8-Wg-U3JMwCtYJfJ-khxvyDRohjnCy7DjJrzzLturFQLCAa4_FdBwwV_Z0wuTMd_UlhvrSlNWpsW_XI6oKCNNt7d7IDe4VnxqweKb115NVSybfSFWfbfPDh0KdTIh6bh0JLMhkv_ZYGP_FL_p8YNZfjzknBVkQjiOFYcNXPFyKsX26KikNA7Ry_F72Eb44CUXcDhCM3LFiH_E4vlvw_nAuNsUvjbVFgXRZgjmwoyxBcTSd-nu9lzAQR2uJL2Si6Tj0T336wQOJPM_wPM_5Eb5gLShprrTl7jsyUXLdBKlp65Ly8ynLnI_jBUrVUthrcFlEaryZhlkp9w1vgm8YAZB18h9DQJTFIPINv0Zcrb_5tiJjIv3HVsFKYIwX40szFtexR-pU5gW92sIvOLFmuYD6KXCBvpcDo3t-mDpd4TgVztNrdfzH_Fp5UitNViFqZ_j9-IAOxuN3AIk_S6Fu10lIWzGVyut1ZBbN5UEF86G03Dm01yR5ja9AG3qAzA9JNbdXZ1A-ss9NMMRQlsrk3qrFwLRYnJW6AwiNtugIbbRGM97PAr0FqZ6JP9xLid31sEbCsRzsZrd_JoDFhQaAsN8eLzymscIaz_vSe0yrDg0m2_FStmLyZEild29LtqaEaCoX_M8N4WY1G7wVikaCSd1XxsMZTKXcsg0L0F3lVlNlrq_lNl__wES62tX2mu_PzUHAE-7C4TYrY2ycnhDR8rnu4f2BhkEji4EUZ6Ak34aP5bG1s7vPFcHTtnnQUE0pRQcbMMTDQyfawz0-mdQbZW8bvIPTpNkvVFRpwlBoSbfyZKJQ2AxYE-gcbuWtwfa5Si6e3hEQDzWLmJXACS1oXJaRxY8jGgrWtsuYEj5VgLOiFK1lfkONaSnL4itQ6yXfLTIWrmZ53qcCXMWD_WZ4UeESfZ6ouMSeUqIluQ06fcSfbCg4__dcVlleK1SqD0fvKUr6WDWlZHLCLV0EMdgdAoDgHMFEcuy7mXCEml4Jm6ayqkzwoR_F4Dvx7hcsr0OQfQokloNQcvgMOXc7Y_ROL4nRH3vR9AF3Be1tVnKJerC346x6rzEJRQrff0x9v9pm9qLpK-4chpdin1SEWd0ibDj4Fopv9P-mucq7JiwGfqNgcI3egaWr4qd6HMT2AktA9kA6RVSHmyEKc1a6qaGxIo2q5w_dCbheLDrHrlkFue8UZFhjSDhi-gritY1XApBC2RZXVpJ7tW6G5y9Rkt18OPiKZCcGcOzuhj3qW_9QduazhIWJoKzisM_eZuEY0IHIsQiydMMn4m0vcYMGdWnwNS4PZdCtK3cY1wH9sCzFbWlhS3dIw-vbEqL8qQ1Iq14nWGMnwjwxEMRs87V9T-ZbJiNtSZZJD5425WDyURQWtCnLz6GgE4JrRyD44G73akQ7Ws9BE5lnP7Om7CDGOzVIcG5bPp49EBBPzv7nBBm835niZdTYvVcGdsPxQOXfFpstl4LYtYKCh8Anl0RUnwnGTF6-A9BwVVuE2yG0w6dapoQCPjKQlfKMaWC59nAJ_cYbuie96rxEnaOkb8rtJyV4