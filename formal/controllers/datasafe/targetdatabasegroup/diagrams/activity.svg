yName; exact compartmentId,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="289.4678" x="694.4225" y="2233.2803">displayName match within the resource scope;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="134.627" x="694.4225" y="2247.2803">duplicate matches fail</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="694.4225" y="2261.2803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="694.4225" y="2275.2803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="177.4268" x="694.4225" y="2289.2803">The production runtime uses</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="307.3984" x="694.4225" y="2303.2803">generatedruntime/workrequest async handling for</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="273.1641" x="694.4225" y="2317.2803">create, update, delete work-request phases.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="286.3574" x="694.4225" y="2331.2803">Lifecycle success states are ACTIVE; pending</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="288.7637" x="694.4225" y="2345.2803">create, update, and delete states requeue until</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="244.3643" x="694.4225" y="2359.2803">the corresponding follow-up converges.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="251.3506" x="694.4225" y="2373.2803">Status projection is required, Secret side</text><text fill="#334155" font-family="Helvetica" font-size=