ting</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="265.3369" x="782" y="1961.7803">provider states: create CREATING; update</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="192.165" x="782" y="1975.7803">UPDATING; delete DELETING</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="234.9922" x="782" y="1989.7803">follow-up: create=GetWorkRequest -&gt;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="344.7432" x="782" y="2003.7803">GetTargetDatabaseGroup; update=GetWorkRequest -&gt;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="340.0674" x="782" y="2017.7803">GetTargetDatabaseGroup; delete=GetWorkRequest -&gt;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="88.7031" x="782" y="2031.7803">confirm-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="257.5713" x="782" y="2045.7803">supported drift: displayName, description,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="257.9131" x="782" y="2059.7803">matchingCriteria, freeformTags (+1 more)</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="230.3301" x="782" y="2073.7803">reject before mutate: force-new fields</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="93.3721" x="782" y="2087.7803">compartmentId</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="144.751" x="782" y="2101.7803">create-only fields: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="66.1445" x="782" y="2115.7803">list lookup:</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="284.0879" x="782" y="2129.7803">oci_data_safe_target_database_groups filters</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="324.4678" x="782" y="2143.7803">compartmentId, displayName; exact compartmentId,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="289.4678" x="782" y="2157.7803">displayName match within the resource scope;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="134.627" x="782" y="2171.7803">duplicate matches fail</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="782" y="2185.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="782" y="2199.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="177.4268" x="782" y="2213.7803">The production runtime uses</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="307.3984" x="782" y="2227.7803">generatedruntime/workrequest async handling for</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="273.1641" x="782" y="2241.7803">create, update, delete work-request phases.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="286.3574" x="782" y="2255.7803">Lifecycle success states are ACTIVE; pending</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="288.7637" x="782" y="2269.7803">create, update, and delete states requeue until</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="244.3643" x="782" y="2283.7803">the corresponding follow-up converges.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="251.3506" x="782" y="2297.7803">Status projection is required, Secret side</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="260.7021" x="782" y="2311.7803">effects are none, and the finalizer policy is</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="178.1924" x="782" y="2325.7803">retain-until-confirmed-delete.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="278.5918" x="782" y="2339.7803">Delete policy required retains ownership until</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="206.9785" x="782" y="2353.7803">DELETED or confirmed absence.</text><?plantuml-src fLTRRzis57xdhpZONbhCJfeswSL11xH9rWNDsY59jnS30IqTsLnaKYCfkzwm_xx3comvKfgsw4CTaUV-dUyScbiXAwxv4io2vsejv1mANXfafZcPyUnshbKjynDLAWq_5XdzoritSYnuNTfVbBGV-1BXLonNQ4N6--zSYNyG3WvRXrnhjOxQdnG7Bvws9QMo-FQE3qNn8d--Uqlf77MyCJiyUlRarSuDPpwUFtjsU71qr3htwZEb9MeuUCwii2N25VvTeymGnf1pomqlSF-QwpdQK_fpnWs-8xcABKIEK2XbP-fpIwT9ulyo09vPfJi-nbZJqMwG-1HV5a_ec9HHEaN5fUsNRrzuY9PM7XeTfIZmGiXk5byTycUpbtJgL5QTesoM7-51StIdGYyBNcJiF-PZW_Vr32cr5Wrh-G4dv8XMPOcwy_aj9VOICoKpiNlqmyUhZ--lKAz4XhznoUUeVm1keFkf8_Bnv9ovweDQKMsxkaSxSjG76dFGQ5HPMw7a97xQpmMVKqtDVlXxlBqoJcNUCwjvqf1ZIT4EIeVZhYJAtAEKRPC5uvzREPe0IhfV8_HWS2frYefjHPo2RiGJQ7u_qiwyiOzPzueJwkPb0eroYim82c4g-nh1Wm4kbBgb_pW5D1CoPxoqO3L1X193OC3FLKd5yPK1wXn9pRO1Ncha-OPEXR66THrmBj7j2Rn3ssSNYRGQ4urAOM0fZ25Q6r9tGRPwz9b7XIWjQZEPoamj7PgMfFCy7q4kJ5NoZMEwnpumZRNXCqgCYyQXejRKyMIQQacSG2qnPFo40hRO5qwfL0MPFuQASE68-UJoxCtr-OTtNviPik-pq-_dzsMz9xOUm5MKID8Ukcf51UhKNKWmbjlQU7Kkew4v8A8JyuYgK_zvoCLmskVbW03vLmYzJDPMWazbVvo4sQaSGageLLIIQdLwTd7szRMwtqxAJbOYb_uo54BoaiQffbpHL-DXDokLwuA754QZvPJ-wBoh0lgcfUzw4r0JprmJq0zYEr0pGveVQY2ujNMK5zHMTxK6c2QeEdm4RoWUxum3xiCC1e9SBqI3z2N5Q0XcK