schemaVersion: 1
surface: repo-authored-semantics
service: datasafe
slug: securityassessment
kind: SecurityAssessment
archetype: generated-service-manager
states:
- provisioning
- active
- updating
- terminating
repoAuthored:
  operations:
    create:
    - CreateSecurityAssessment
    update:
    - UpdateSecurityAssessment
    delete:
    - DeleteSecurityAssessment
  providerLifecycle:
    createPending:
    - CREATING
    updatePending: []
    deletePending:
    - DELETING
  listLookup:
    filters:
    - accessLevel
    - compartmentId
    - compartmentIdInSubtree
    - displayName
    - isBaseline
    - isScheduleAssessment
    - scheduleAssessmentId
    - state
    - targetDatabaseGroupId
    - targetId
    - targetType
    - templateAssessmentId
    - timeCreatedGreaterThanOrEqualTo
    - timeCreatedLessThan
    - triggeredBy
    - type
    matchRule: exact declared filters match within the resource scope; duplicate matches
      fail
  mutation:
    mutable:
    - applyTemplateTrigger
    - compareToTemplateBaselineTrigger
    - compartmentId
    - definedTags
    - description
    - displayName
    - freeformTags
    - isAssessmentScheduled
    - removeTemplateTrigger
    - schedule
    forceNew:
    - baseSecurityAssessmentId
    - targetId
    - targetType
    - templateAssessmentId
    - type
  hooks:
    delete:
    - helper: tfresource.DeleteResource
  followUp:
    create: GetWorkRequest -> read-after-write
    update: GetWorkRequest -> read-after-write
    delete: GetWorkRequest -> confirm-delete
notes:
- The generated service manager uses the reviewed CRUD request, response, lifecycle,
  and status projection contract.
- Work-request phases are declared per operation from the vendored SDK response surface.
- Secret side effects are none and finalizer ownership is retained until confirmed
  deletion.
