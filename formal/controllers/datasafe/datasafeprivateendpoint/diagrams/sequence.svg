t><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="174.3027" x="800" y="2115.7803">retain-until-confirmed-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="272.3984" x="800" y="2129.7803">requeue: provisioning, updating, terminating</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="265.3369" x="800" y="2143.7803">provider states: create CREATING; update</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="192.165" x="800" y="2157.7803">UPDATING; delete DELETING</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="234.9922" x="800" y="2171.7803">follow-up: create=GetWorkRequest -&gt;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="183.668" x="800" y="2185.7803">GetDataSafePrivateEndpoint;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="175.0957" x="800" y="2199.7803">update=GetWorkRequest -&gt;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="183.668" x="800" y="2213.7803">GetDataSafePrivateEndpoint;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="135.0234" x="800" y="2227.7803">delete=confirm-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="257.5713" x="800" y="2241.7803">supported drift: displayName, description,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="197.2373" x="800" y="2255.7803">nsgIds, freeformTags (+1 more)</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="230.3301" x="800" y="2269.7803">reject before mutate: force-new fields</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="199.9922" x="800" y="2283.7803">compartmentId, vcnId, subnetId,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="108.9648" x="800" y="2297.7803">privateEndpointIp</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="144.751" x="800" y="2311.7803">create-only fields: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="266.9092" x="800" y="2325.7803">list lookup: unavailable filters displayName,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="237.3438" x="800" y="2339.7803">compartmentId, vcnId, subnetId; exact</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="284.8057" x="800" y="2353.7803">displayName, compartmentId, vcnId, subnetId</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="264.585" x="800" y="2367.7803">match within the resource scope; duplicate</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="74.6963" x="800" y="2381.7803">matches fail</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="800" y="2395.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="800" y="2409.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="258.3711" x="800" y="2423.7803">The production runtime uses the declared</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="279.3506" x="800" y="2437.7803">work-request phases and service-local async</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="51.3721" x="800" y="2451.7803">adapter.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="294.9229" x="800" y="2465.7803">Lifecycle success and pending states mirror the</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="244.3301" x="800" y="2479.7803">production service-manager semantics.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="251.3506" x="800" y="2493.7803">Status projection is required, Secret side</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="260.7021" x="800" y="2507.7803">effects are none, and the finalizer policy is</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="178.1924" x="800" y="2521.7803">retain-until-confirmed-delete.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="271.585" x="800" y="2535.7803">Delete ownership is retained until a terminal</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="226.4404" x="800" y="2549.7803">lifecycle state or confirmed absence.</text><?plantuml-src jLXRRnit5dxdhpXeNnAiPCTDqgOol41hUrEZRXBOQViYO47DS2IkH-IKv4ZHBlhV-_4oDrbZEoaMVj3Ca3pNxtpdqFPEgeeRlYQxuhdUIhMaWfTMCDkkB7XsjpIwLlcvBhMXhuiCVtblHouANfVkNrgvTtmjw2THReIJ6J-yvrR-Lz39gzuYDqPla_GNnSbtt_HFAkt4Z_TiA8hlyc_tTscJ2vDsB5wzVldY-xqTNdrQV_dorSdhrxtr83xJHWb39zyo9rqfw5RyKGkL2PfIpXstl1375tYunSC78pVSYKkLLregnrOo5rHexHRwKq-kRKJyZn7np6api3FvsopjEog-4M-A5rY6C8HKLbovm-Vx6vuYfHUBLaOf2t4jrJ2Itx_YBnTliEf5LeEbR96_5YVjqhqilIbuaR4_MV2DVguN0k5rmhAU7NGEGumkIs46dt_aLjo8JAjCxYzzzVxs_S-tmcna9dxXYY-5-OgufU6dmP7tvrVC8u3q1laTofxidKCj696J4LQNjPDQpTAdurpo9N9gZ-FxjDioRT9yP3VBHa8kIdWxUZek3qyAbGUaiYvODFrdBqOp4WhxQq4ZE9mhqtZ6kcDUoD3h6RNFpumtmRhdRBZ57nh6PaQjS7Xd9ToOgx622A2WQwtlyCFXs