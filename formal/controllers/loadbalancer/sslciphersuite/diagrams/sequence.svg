15.7803">Live Load Balancer work requests report</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="291.0332" x="820" y="2129.7803">`CreateCipherSuite`, `UpdateCipherSuite`, and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="291.0332" x="820" y="2143.7803">`DeleteCipherSuite`; the runtime accepts those</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="296.8301" x="820" y="2157.7803">observed operation names as well as the SDK's</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="161.8682" x="820" y="2171.7803">SSLCipherSuite spellings.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="331.4473" x="820" y="2185.7803">`ACCEPTED` and `IN_PROGRESS` remain pending,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="317.4678" x="820" y="2199.7803">`SUCCEEDED` transitions to a child readback, and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="271.5918" x="820" y="2213.7803">failed work requests retain actionable async</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="41.2412" x="820" y="2227.7803">status.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="311.2744" x="820" y="2241.7803">The child has no independent OCI OCID. Runtime</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="265.4053" x="820" y="2255.7803">identity is the annotated load balancer plus</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="280.875" x="820" y="2269.7803">immutable cipher-suite `name`; only `ciphers`</text><text fill="#334155" font-family="