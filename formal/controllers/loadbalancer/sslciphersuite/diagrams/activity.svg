Helvetica" font-size="14" lengthAdjust="spacing" textLength="291.0469" x="699.675" y="1952.7803">controllers specialize the shared reconcile path</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="189.8477" x="699.675" y="1966.7803">with formal runtime ownership.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="132.2959" x="699.675" y="1980.7803">service: loadbalancer</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="118.2754" x="699.675" y="1994.7803">slug: sslciphersuite</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="133.0752" x="699.675" y="2008.7803">kind: SSLCipherSuite</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="241.2402" x="699.675" y="2022.7803">archetype: generated-service-manager</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="156.4063" x="699.675" y="2036.7803">status/finalizer: required /</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="174.3027" x="699.675" y="2050.7803">retain-until-confirmed-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="272.3984" x="699.675" y="2064.7803">requeue: provisioning, updating, terminating</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="295.6816" x="699.675" y="2078.7803">provider states: create PROVISIONING; update</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="192.165" x="699.675" y="2092.7803">UPDATING; delete DELETING</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="234.9922" x="699.675" y="2106.7803">follow-up: create=GetWorkRequest -&gt;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="305.0537" x="699.675" y="2120.7803">GetSSLCipherSuite; update=GetWorkRequest -&gt;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="300.3779" x="699.675" y="2134.7803">GetSSLCipherSuite; delete=GetWorkRequest -&gt;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="88.7031" x="699.675" y="2148.7803">confirm-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="142.4063" x="699.675" y="2162.7803">supported drift: ciphers</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="269.2402" x="699.675" y="2176.7803">reject before mutate: force-new fields name</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="144.751" x="699.675" y="2190.7803">create-only fields: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="66.1445" x="699.675" y="2204.7803">list lookup:</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="266.1436" x="699.675" y="2218.7803">scaffold_loadbalancer_sslciphersuite filters</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="268.4814" x="699.675" y="2232.7803">name; Resolve the named cipher suite only</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="231.9707" x="699.675" y="2246.7803">beneath the annotated load balancer.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="699.675" y="2260.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="699.675" y="2274.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="251.3574" x="699.675" y="2288.7803">Live Load Balancer work requests report</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="291.0332" x="699.675" y="2302.7803">`CreateCipherSuite`, `UpdateCipherSuite`, and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="291.0332" x="699.675" y="2316.7803">`DeleteCipherSuite`; the runtime accepts those</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="296.8301" x="699.675" y="2330.7803">observed operation names as well as the SDK's</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="161.8682" x="699.675" y="2344.7803">SSLCipherSuite spellings.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="331.4473" x="699.675" y="2358.7803">`ACCEPTED` and `IN_PROGRESS` remain pending,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="317.4678" x="699.675" y="2372.7803">`SUCCEEDED` transitions to a child readback, and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="271.5918" x="699.675" y="2386.7803">failed work requests retain actionable async</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="41.2412" x="699.675" y="2400.7803">status.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="311.2744" x="699.675" y="2414.7803">The child has no independent OCI OCID. Runtime</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="265.4053" x="699.675" y="2428.7803">identity is the annotated load balancer plus</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="280.875" x="699.675" y="2442.7803">immutable cipher-suite `name`; only `ciphers`</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="46.71" x="699.675" y="2456.7803">update.</text><ellipse cx="662.675" cy="2138" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="662.675" cy="2138" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="662.675" x2="662.675" y1="157" y2="177"/><polygon fill="#0F172A" points="658.675,167,662.675,177,666.675,167,662.675,171" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="814.1409" x2="814.1409" y1="327" y2="347"/><polygon fill="#0F172A" points="810.1409,337,814.1409,347,818.1409,337,814.1409,341" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="814.1409" x2="814.1409" y1="409" y2="429"/><polygon fill="#0F172A" points="810.1409,419,814.1409,429,818.1409,419,814.1409,423" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="521.2092" x2="511.2092" y1="257" y2="257"/><line style="stroke:#0F172A;stroke-width:1;" x1="511.2092" x2="511.2092" y1="257" y2="279"/><polygon fill="#0F172A" points="507.2092,269,511.2092,279,515.2092,269,511.2092,273" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="804.1409" x2="814.1409" y1="257" y2="257"/><line style="stroke:#0F172A;stroke-width:1;" x1="814.1409" x2="814.1409" y1="257" y2="279"/><polygon fill="#0F172A" points="810.1409,269,814.1409,279,818.1409,269,814.1409,273" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="511.2092" x2="511.2092" y1="327" y2="495"/><line style="stroke:#0F172A;stroke-width:1;" x1="511.2092" x2="650.675" y1="495" y2="495"/><polygon fill="#0F172A" points="640.675,491,650.675,495,640.675