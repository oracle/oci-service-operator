utation surface</text><rect fill="#F8FAFC" height="48" rx="8" ry="8" style="stroke:#0F172A;stroke-width:0.5;" width="302.4473" x="826.2151" y="1147.5"/><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="282.4473" x="836.2151" y="1168.2803">Reject drift before OCI mutation for force-new</text><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="158.7715" x="836.2151" y="1182.2803">fields odaInstanceId, type</text><ellipse cx="977.4387" cy="1228" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="977.4387" cy="1228" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#E2E8F0" points="851.8557,1098.5,1103.0217,1098.5,1115.0217,1110.5,1103.0217,1122.5,851.8557,1122.5,839.8557,1110.5,851.8557,1098.5" style="stroke:#1D4ED8;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="21.7861" x="981.4387" y="1133.2803">yes</text><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="251.166" x="851.8557" y="1114.2803">"Force-new or conflicting drift detected?"</text><polygon fill="#E2E8F0" points="867.011,1281,1087.8665,1281,1099.8665,1293,1087.8665,1305,867.011,1305,855.011,1293,867.011,1281" style="stroke:#1D4ED8;stroke-width:0.5;"/><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="220.8555" x="867.011" y="1296.7803">"Supported mutable drift detected?"</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="21.7861" x="833.2249" y="1289.7803">yes</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="15.5723" x="1099.8665" y="1289.7803">no</text><rect fill="#F8FAFC" height="76" rx="8" ry="8" style="stroke:#0F172A;stroke-width:0.5;" width="296.2744" x="695.4814" y="1315"/><text fill="#0F172A" font-fam