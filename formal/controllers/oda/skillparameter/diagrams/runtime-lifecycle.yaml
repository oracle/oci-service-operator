schemaVersion: 1
surface: repo-authored-semantics
service: oda
slug: skillparameter
kind: SkillParameter
archetype: generated-service-manager
states:
  - provisioning
  - active
  - updating
  - terminating
repoAuthored:
  providerLifecycle: {createPending: ["CREATING"], updatePending: ["UPDATING"], deletePending: ["DELETING"]}
  listLookup:
    filters: ["odaInstanceId","skillId","name"]
    matchRule: exact parent skill and parameter name match; duplicate matches fail
  mutation:
    mutable: ["description","displayName","value"]
    forceNew: ["name","type"]
  followUp: {create: read-after-write, update: read-after-write, delete: confirm-delete}
notes:
  - "Parameter name is the nested item identity; parent ODA instance and skill IDs are retained outside the OCI response for all follow-up calls."
