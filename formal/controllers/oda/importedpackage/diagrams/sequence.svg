ust="spacing" textLength="144.751" x="813" y="2115.7803">create-only fields: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="264.6123" x="813" y="2129.7803">list lookup: scaffold_oda_importedpackage</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="284.0469" x="813" y="2143.7803">filters odaInstanceId, currentPackageId; exact</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="265.3779" x="813" y="2157.7803">parent and current package identity match;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="134.627" x="813" y="2171.7803">duplicate matches fail</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="813" y="2185.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="813" y="2199.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="263.833" x="813" y="2213.7803">The package ID is both the nested request</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="270.8193" x="813" y="2227.7803">identity and a mutable version target; status</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="274.6885" x="813" y="2241.7803">records the currently imported package after</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="44.3584" x="813" y="2255.7803">reread.</text><?plantuml-src hLTRRzis57xdho2wbnQmagP9Ud6G0MsIjK6pf4YozSL0G4kKpKKcDPAocmtxx_juaQoBtMPTqOV6EkIvVkSxX-PUo99fjg1cpZAr4d96SrOOJamZcRBqVgPL9RCJLIXDVyfJ_CjQ9pAUiwgmloXfBzc2qm-yM78hKhRvp8tuYzEzWvQGQQrMKVlpVE_LY_PDgIn_D_0XprzbB_kdbCwuZYUc1uVxpz_qJZZpKRw_Vx1tUDYIU_M