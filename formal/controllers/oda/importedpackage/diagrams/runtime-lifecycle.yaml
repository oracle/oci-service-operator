schemaVersion: 1
surface: repo-authored-semantics
service: oda
slug: importedpackage
kind: ImportedPackage
archetype: generated-service-manager
states:
  - provisioning
  - active
  - updating
  - terminating
repoAuthored:
  providerLifecycle: {createPending: ["OPERATION_PENDING"], updatePending: ["OPERATION_PENDING"], deletePending: ["OPERATION_PENDING"]}
  listLookup:
    filters: ["odaInstanceId","currentPackageId"]
    matchRule: exact parent and current package identity match; duplicate matches fail
  mutation:
    mutable: ["currentPackageId","parameterValues","freeformTags","definedTags"]
    forceNew: []
  followUp: {create: read-after-write, update: read-after-write, delete: confirm-delete}
notes:
  - "The package ID is both the nested request identity and a mutable version target; status records the currently imported package after reread."
