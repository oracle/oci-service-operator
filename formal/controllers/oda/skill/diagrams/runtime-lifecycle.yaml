schemaVersion: 1
surface: repo-authored-semantics
service: oda
slug: skill
kind: Skill
archetype: generated-service-manager
states:
  - provisioning
  - active
  - updating
  - terminating
repoAuthored:
  providerLifecycle: {createPending: ["CREATING"], updatePending: ["UPDATING"], deletePending: ["DELETING"]}
  listLookup:
    filters: ["odaInstanceId","name","version"]
    matchRule: exact parent, name, and version match; version creation never binds an unrelated skill
  mutation:
    mutable: ["category","description","freeformTags","definedTags"]
    forceNew: ["kind","id","name","displayName","version","platformVersion","dialogVersion","multilingualMode","primaryLanguageTag","nativeLanguageTags"]
  followUp: {create: work-request-then-read, update: read-after-write, delete: confirm-delete}
notes:
  - "Create records and polls the ODA work request before binding its resource ID; update and delete use lifecycle reads."
