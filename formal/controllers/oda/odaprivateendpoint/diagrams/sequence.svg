-only fields: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="276.3086" x="828" y="2115.7803">list lookup: scaffold_oda_odaprivateendpoint</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="260.6543" x="828" y="2129.7803">filters displayName, compartmentId; exact</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="313.5918" x="828" y="2143.7803">compartmentId plus displayName match; duplicate</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="74.6963" x="828" y="2157.7803">matches fail</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="828" y="2171.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="828" y="2185.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="281.7158" x="828" y="2199.7803">The ODA update operation reconciles display</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="318.2744" x="828" y="2213.7803">metadata, NSGs, and tags in place; compartmentId</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="213.2471" x="828" y="2227.7803">and subnetId require replacement.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="278.6465" x="828" y="2241.7803">Create, update, and delete converge through</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="244.3506" x="828" y="2255.7803">GetOdaPrivateEndpoint lifecycle reads.</text><?plantuml-src fLXTRzis57tdho2sbnQpacPjjzP11dH9rWRDcY9fqPS00orHDbUQr4ZAhZVil-_mIvOSkKrNz26oU7a_ppttglQZK0qpR4djWbLwBTISranQJ