schemaVersion: 1
surface: repo-authored-semantics
service: securityattribute
slug: securityattribute
kind: SecurityAttribute
archetype: generated-service-manager
states:
  - provisioning
  - active
  - updating
  - terminating
repoAuthored:
  listLookup:
    filters: ["securityAttributeNamespaceId","name"]
    matchRule: exact parent namespace and attribute name match
  mutation:
    mutable: ["description","isRetired","validator"]
    forceNew: ["name","securityAttributeNamespaceId"]
  followUp: {create: read-after-write, update: read-after-write, delete: confirm-delete}
notes:
  - "The namespace OCID and attribute name form the immutable request path; ACTIVE and INACTIVE are both steady states."
