 resolution sequence for</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="260.7295" x="770" y="1525.7803">OCID binding, datasource pagination, and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="163.4268" x="770" y="1539.7803">create-or-update dispatch.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="301.1982" x="770" y="1553.7803">Layer the shared delete sequence when finalizer</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="269.2471" x="770" y="1567.7803">retention, delete confirmation, work-request</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="199.2334" x="770" y="1581.7803">polling, or Secret cleanup apply.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="281.709" x="770" y="1595.7803">archetype batch: Generated service-manager</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="266.1504" x="770" y="1609.7803">controllers follow the shared resolution and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="259.9297" x="770" y="1623.7803">delete sequences with imported waits and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="134.6064" x="770" y="1637.7803">controller-local policy.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="97.2686" x="770" y="1651.7803">service: devops</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="94.9307" x="770" y="1665.7803">slug: repository</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="100.3789" x="770" y="1679.7803">kind: Repository</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="241.2402" x="770" y="1693.7803">archetype: generated-service-manager</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="156.4063" x="770" y="1707.7803">status/finalizer: required /</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="174.3027" x="770" y="1721.7803">retain-until-confirmed-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="272.3984" x="770" y="1735.7803">requeue: provisioning, updating, terminating</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="304.2607" x="770" y="1749.7803">provider states: create CREATING; update none;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="112.0479" x="770" y="1763.7803">delete DELETING</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="209.6992" x="770" y="1777.7803">follow-up: create=read-after-write;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="288.7158" x="770" y="1791.7803">update=read-after-write; delete=confirm-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="211.668" x="770" y="1805.7803">supported drift: name, description,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="251.7266" x="770" y="1819.7803">defaultBranch, repositoryType (+3 more)</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="230.3301" x="770" y="1833.7803">reject before mutate: force-new fields</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="179.7646" x="770" y="1847.7803">projectId, parentRepositoryId</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="144.751" x="770" y="1861.7803">create-only fields: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="101.1787" x="770" y="1875.7803">list lookup: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="770" y="1889.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="770" y="1903.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="177.4268" x="770" y="1917.7803">The production runtime uses</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="307.3984" x="770" y="1931.7803">generatedruntime/workrequest async handling for</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="273.1641" x="770" y="1945.7803">create, update, delete work-request phases.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="286.3574" x="770" y="1959.7803">Lifecycle success states are ACTIVE; pending</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="288.7637" x="770" y="1973.7803">create, update, and delete states requeue until</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="244.3643" x="770" y="1987.7803">the corresponding follow-up converges.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="251.3506" x="770" y="2001.7803">Status projection is required, Secret side</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="260.7021" x="770" y="2015.7803">effects are none, and the finalizer policy is</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="178.1924" x="770" y="2029.7803">retain-until-confirmed-delete.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="278.5918" x="770" y="2043.7803">Delete policy required retains ownership until</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="206.9785" x="770" y="2057.7803">DELETED or confirmed absence.</text><?plantuml-src hLTPRzj647xVNp58Nn9KjEFOpa4Z1HBRJOsu2M2vVVBBYXnAMrExxEvIYbhqltVsuY5BYNiWW2DoP-VyvfkXkHUouPelmInugTP2pg7YjK5ckfCPB-xdMhMoF5Urql1TLT2_SY1HOiNRslwefFt4bmW_ORr2Amg-MsOg_a0uEXaSSgtLEcf_NXszUZ6yAPN5zmzygAfNvSjjAQLBr55YTd9w_FpDbeGp7y-FZq-EJay7vrvzeRH43KSlcHMsHfZYxotA0Y6Z25QgCOSts2WZhD8RjX0bGgMKdQal0qKctVcJ0V22H4UEnG3JqNPa-09VLy_fc9HH3aN3fTrzVoZm62s3u3iTjQZmMiXnwjwSyEFPQpfrAflHKJ4hJ_6eEtfGbjSLhmhs5_EnmSTsXfHFYuOD_81pSaIhkaOzUlsU6xp1Gib2R1yz-Jpz_76AUYKA_9bBFaVz1BY1yQlHbS_dLyoL7DIA2ZhMFTcwH-3NM896e-hM2YNp-Egm57nEDJM7uJdhHR9KvWEpcYSD9TOKxTxRuNXy4sNfeSdwP47smo17EQ0a-HQXXnwv6cDXlQ2xDeupX-xtK-sC6lkCZKNSfN4sybuvnME4Ysi0Ubzuk5RgdlxZvFnCo9BnseBL10SIfiBZbwQcGlWg07M9f6xQ0Ayryd93fy9OmyPcdICadSC7j0DpI6JKQUuq2GDBOGpHbRUiiJLyHluwSwv4hQRs8o5AB3KeuNEViNFooEB0NgrK0uL_2mtLnZ7Y-StbkzkhJnyUwJ5PyrxlzkfV9M5703kAtQ0sf3JWU4Nv6cLVI32MszPuTIvj0OuGaO5bhEs5VxtFit0wS6wF7BbL2RrCHbQ2RmNbCnrFKwOlBgyl_rccNHn5ZLoIumIyIaXUqtpH51MzDHu5irev-3mcXHejfqH5jro-q8EStYSmnhD2BHlwGKm0QcP8ysCD1BTwHtbbwUy3hG572Kkkai4RYiSxuv3rE8E1FDOBqK5nIJ4Q0iITJD2UzAdtzcgnIk4x1KG2Xbp6kipucgZiJfPQL1PmnUkMUtSZTlph1QMiTitP4_3OqubZvsdRD4eJxg1jIcV9jBhY1UOWQOkOC2AVGel6QP-a_U6zvh9OJ9ZkK72xQH2UVdyCIwNn6Rl1tx2mCCEA7c7PkX1ouW1glKpYEWH1uqWh9tTLJjo4f0xfONLLzfoi6ZkuI_Xog2Pcimwi8GLKZv8gLzZ7rd_edok7zp4Lt1aqNLxSaIEGRrkA_V6kQUeD_EBJEPWMIj9RCdWdayQGXf1e62QQAZlAD3pCD6dngSRzjAfR2GkiYP1WGPF2tCb0gMzjbOZm855lU3oxam45Gv4KI2SIkcGeakWeFExpX_kyL3GcrJeZc1gQA1RdcyulnycPxyHihOKTkBFZ97eH6IvEzSUITE