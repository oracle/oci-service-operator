155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="136.1719" x="747" y="2115.7803">compartmentId, name</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="144.751" x="747" y="2129.7803">create-only fields: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="235.0059" x="747" y="2143.7803">list lookup: oci_devops_projects filters</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="297.2402" x="747" y="2157.7803">compartmentId, name, id; exact compartmentId,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="262.2402" x="747" y="2171.7803">name, id match within the resource scope;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="134.627" x="747" y="2185.7803">duplicate matches fail</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="747" y="2199.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="747" y="2213.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="177.4268" x="747" y="2227.7803">The production runtime uses</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="307.3984" x="747" y="2241.7803">generatedruntime/workrequest async handling for</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="273.1641" x="747" y="2255.7803">create, update, delete work-request phases.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="286.3574" x="747" y="2269.7803">Lifecycle success states are ACTIVE; pending</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="288.7637" x="747" y="2283.7803">create, update, and delete states requeue until</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="244.3643" x="747" y="2297.7803">the corresponding follow-up converges.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="251.3506" x="747" y="2311.7803">Status projection is required, Secret side</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="260.7021" x="747" y="2325.7803">effects are none, and the finalizer policy is</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="178.1924" x="747" y="2339.7803">retain-until-confirmed-delete.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="278.5918" x="747" y="2353.7803">Delete policy required retains ownership until</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="206.9785" x="747" y="2367.7803">DELETED or confirmed absence.</text><?plantuml-src hLVRRXit47tdLn3jImf8TfnBcyfmWSHsco1k4jXkys8We7Pd9JOhSajofQX5_xs7jzMkRCLAMkGXrd8urpDdXlQZL8qmOi7jN9Hw9TMCLwAsn6ntCXN5nvdHhIfFTQqD_xOgyA_iIPHKYRPsFslbteW5yPTKByd9GjmjSoN_8dxqf7SeZD6hfFrXTVJ3e_vDfHszkEL3LVrGVhyjfKr99abCdpnz_F37BGblFfq_VlpawEdJtdbGNsYZoF2ZxvcJhYP-HN-sf0hYOqImr8qzV6Vq7rGuDfSbyKfhDzMVUbfill0turmKJfk1LocwVBGT5ZsYPzL374CP4YWReTpTz_i2-sZfHTxfg6L55r8Dy_RZ4_5u-WodNcKpE2gcvLCwwevkrUHP9Qg2_SD2RFnrEoKaqv5bFJ_uAHmnkgx933w_49OkgT2gaDj7txozUllwYinI5lIhK696vXikB1z-6bnvU_gA-NfplKGrXxf7M_U0V4CbDsHrtJgfrIHzEYobcA6czZ3-7cz4nhdC1tOvonfAgX7jpjlnU7YJL1bmoJR9ukEVUZcQS5AGRuadtC7F50ZRIFaxmo0dlFlxWV4MhVkE3KNyfM4g9Xlb2CPA7rI6UoWvlz3w8_uJS7igLSb4xRWp008aKNBwrDGeGSW_HtyeDD6QYzgGADSubTPPDhJflO3qXFz2BjiY452djbCZBLz8Qq5HkrHSG7_IOHzKidPax8GNUk6XiO2QL-NeHYbGr0XglmlU6sgjc29Wxx8lS6lGlB25ig2zWUvTrauHbQFiSwrrmul