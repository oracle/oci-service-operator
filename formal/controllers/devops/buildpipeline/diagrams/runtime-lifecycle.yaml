schemaVersion: 1
surface: repo-authored-semantics
service: devops
slug: buildpipeline
kind: BuildPipeline
archetype: generated-service-manager
states:
    - provisioning
    - active
    - updating
    - terminating
repoAuthored:
    providerLifecycle:
        createPending:
            - CREATING
        updatePending:
            - UPDATING
        deletePending:
            - DELETING
    listLookup:
        filters:
            - projectId
            - displayName
            - id
        matchRule: exact projectId, displayName, id match within the resource scope; duplicate matches fail
    mutation:
        mutable:
            - description
            - displayName
            - buildPipelineParameters
            - freeformTags
            - definedTags
        forceNew:
            - projectId
    hooks:
        create:
            - helper: tfresource.CreateResource
        update:
            - helper: tfresource.UpdateResource
        delete:
            - helper: tfresource.DeleteResource
    followUp:
        create: read-after-write
        update: read-after-write
        delete: confirm-delete
notes:
    - The production runtime uses generatedruntime/workrequest async handling for create, update, delete work-request phases.
    - Lifecycle success states are ACTIVE, INACTIVE; pending create, update, and delete states requeue until the corresponding follow-up converges.
    - Status projection is required, Secret side effects are none, and the finalizer policy is retain-until-confirmed-delete.
    - Delete policy required retains ownership until DELETED or confirmed absence.
