engthAdjust="spacing" textLength="200.0332" x="692.9504" y="1952.7803">handling, and open formal gaps.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="281.709" x="692.9504" y="1966.7803">archetype batch: Generated service-manager</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="291.0469" x="692.9504" y="1980.7803">controllers specialize the shared reconcile path</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="189.8477" x="692.9504" y="1994.7803">with formal runtime ownership.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="97.2686" x="692.9504" y="2008.7803">service: devops</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="111.3027" x="692.9504" y="2022.7803">slug: buildpipeline</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="114.4063" x="692.9504" y="2036.7803">kind: BuildPipeline</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="241.2402" x="692.9504" y="2050.7803">archetype: generated-service-manager</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="156.4063" x="692.9504" y="2064.7803">status/finalizer: required /</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="174.3027" x="692.9504" y="2078.7803">retain-until-confirmed-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="272.3984" x="692.9504" y="2092.7803">requeue: provisioning, updating, terminating</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="265.3369" x="692.9504" y="2106.7803">provider states: create CREATING; update</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="192.165" x="692.9504" y="2120.7803">UPDATING; delete DELETING</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="209.6992" x="692.9504" y="2134.7803">follow-up: create=read-after-write;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="288.7158" x="692.9504" y="2148.7803">update=read-after-write; delete=confirm-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="257.5713" x="692.9504" y="2162.7803">supported drift: description, displayName,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="307.7402" x="692.9504" y="2176.7803">buildPipelineParameters, freeformTags (+1 more)</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="287.916" x="692.9504" y="2190.7803">reject before mutate: force-new fields projectId</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="144.751" x="692.9504" y="2204.7803">create-only fields: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="278.6123" x="692.9504" y="2218.7803">list lookup: oci_devops_build_pipelines filters</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="263.792" x="692.9504" y="2232.7803">projectId, displayName, id; exact projectId,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="308.1436" x="692.9504" y="2246.7803">displayName, id match within the resource scope;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="134.627" x="692.9504" y="2260.7803">duplicate matches fail</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="692.9504" y="2274.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="692.9504" y="2288.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="177.4268" x="692.9504" y="2302.7803">The production runtime uses</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="307.3984" x="692.9504" y="2316.7803">generatedruntime/workrequest async handling for</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="273.1641" x="692.9504" y="2330.7803">create, update, delete work-request phases.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="304.9854" x="692.9504" y="2344.7803">Lifecycle success states are ACTIVE, INACTIVE;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="257.6396" x="692.9504" y="2358.7803">pending create, update, and delete states</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="256.833" x="692.9504" y="2372.7803">requeue until the corresponding follow-up</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="68.4824" x="692.9504" y="2386.7803">converges.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="251.3506" x="692.9504" y="2400.7803">Status projection is required, Secret side</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="260.7021" x="692.9504" y="2414.7803">effects are none, and the finalizer policy is</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="178.1924" x="692.9504" y="2428.7803">retain-until-confirmed-delete.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="278.5918" x="692.9504" y="2442.7803">Delete policy required retains ownership until</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="206.9785" x="692.9504" y="2456.7803">DELETED or confirmed absence.</text><ellipse cx="655.9504" cy="2152" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="655.9504" cy="2152" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="655.9504" x2="655.9504" y1="157" y2="177"/><polygon fill="#0F172A" points="651.9504,167,655.9504,177,659.9504,167,655.9504,171" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="807.4163" x2="807.4163" y1="341" y2="361"/><polygon fill="#0F172A" points="803.4163,351,807.4163,361,811.4163,351,807.4163,355" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="807.4163" x2="807.4163" y1="423" y2="443"/><polygon fill="#0F172A" points="803.4163,433,807.4163,443,811.4163,433,807.4163,437" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="514.4846" x2="504.4846" y1="257" y2="257"/><line style="stroke:#0F172A;stroke-width:1;" x1="504.4846" x2="504.4846" y1="257" y2="279"/><polygon fill="#0F172A" points="500.4846,269,504.4846,279,508.4846,269,504.4846,273" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="797.4163" x2="807.4163" y1="257" y2="257"/><line style="stroke:#0F172A;stroke-width:1;" x1="807.4163" x2="807.4163" y1="257" y2="279"/><polygon fill="#0F172A" points="803.4163,269,807.4163,279,811.4163,269,807.4163,273" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="504.4846" x2="504.4846" y1="327" y2="509"/><line style="stroke:#0F172A;stroke-width:1;" x1="504.4846" x2="643.9504" y1="5