in the resource scope;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="134.627" x="784" y="2115.7803">duplicate matches fail</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="784" y="2129.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="784" y="2143.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="177.4268" x="784" y="2157.7803">The production runtime uses</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="307.3984" x="784" y="2171.7803">generatedruntime/workrequest async handling for</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="273.1641" x="784" y="2185.7803">create, update, delete work-request phases.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="304.9854" x="784" y="2199.7803">Lifecycle success states are ACTIVE, INACTIVE;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="257.6396" x="784" y="2213.7803">pending create, update, and delete states</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="256.833" x="784" y="2227.7803">requeue until the corresponding follow-up</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="68.4824" x="784" y="2241.7803">converges.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="251.3506" x="784" y="2255.7803">Status projection is required, Secret side</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="260.7021" x="784" y="2269.7803">effects are none, and the finalizer policy is</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="178.1924" x="784" y="2283.7803">retain-until-confirmed-delete.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="278.5918" x="784" y="2297.7803">Delete policy required retains ownership until</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="206.9785" x="784" y="2311.7803">DELETED or confirmed absence.</text><?plantuml-src fLTjRzis4FxENt7OlhIObJHDqXS77T0cMHSqQuiatIS31IsTR2uogP6KNM_OVz_nJPOSgtKtz4CTyNYlpprtDFT2rbpp1PWvBzHAo1cKl3B8J7iovVdzJAj65kUgKXf-B7FwLtGa2YnvKzbVbBJl-GBXLwoMQ4NETylSYhyGZauwXrnhjOhQdvH7pvzsRqfbySq37yhoUV5iMqhf0dMKc9wS7ZzvkINXpCVpu-EJezFJphbNdoijKSFHCsQ5hH1kySy6POwGKGHBLPl3DuseYe-Ynaf8P7DH89HAsQdwqj5bqhM_6G3FhT8ztsACwMWxE7oAByedT4pAA8sYvjBkljyLs4TB9_vMHoLAlAPOUXPUdl3ZwGiwTIhhtb4-BKxng3rwK9aN9IzpzW_piS6xPegKKek6TVo0St94gwf2tVlyXXkymLp9N6mV_V3XziExMzHBaUDlNF8PwX-06-X_wbtvS7x5NDL1BQccVTsZhNk4Vuq5Q3IgQgnGSXm_7HQ2pwYcvZ3ydMr4ibJc0xES9Gq5LXJjuErmtB-9il3eP9jaGVPp9qTZG4do3K8FVUHj38TjPDtDVgXZQ7y_qiwkiOzPNyHTwYTal55E8HdXGkj3tvSVhfMwf_yuXJ0Lic2yic0rWOBagVpufQwe7BuMGBqYgQtMm2kDl5ZJgJ3MiBvbvmj9Z-4jshv5969gbRVAX865C8QeQqZHDLdfQJAFIb5Pr6OyaRLMVs1khueH5CBK5Lyx3XkH_iS-68sDuLFAWel0rRxHrDTab2f6dK_07p9xJa4IAVL2g9Ig8VS7K5FT7U6Utro-lhjw_tR_F91DdulTlltNxEw8P0UMQaeRwGsTigH2z2eh91ZBRMEyEfU_07Y8mCCYukR2VnvoBfps_HiG9SzAeHV9pbBm1w5D927n8GX2CUAzL8oBo-lBxoa6WNmYT-XEuUSLSadnaWUbaBoYsQSf6VJLU1HDA-NWl4_cDLfE-OqEkpIZxplwhjS14F4iLukQVX15WPeQqholWU3Mnb5UKfSyr1eGc53e012yeNYyCmwJ-naChBQQYnR42uhH48ucClN523vzl8Y_sl9uovLOfaGuLKHIXfp7giZuYjXs8WijIWkuv5N3lUCHVFxpd99NEThOp8Y-poCtG6wRkbQQW0jDNJXBfj4bpt7iQ37NedPwHwp77TCk5ZwwZG0TsunOgH5BfHTtV6RWqKz7i50Q7xCRT1G4KtU6i6XSH6CY5-hcJE8gn4G3D54LYwoRM0m6I8o9LdJ1RJwdO6cKVA79tBd1jcWlYC9AM987EqVMCel9LOrdK3IEr5qklAXBEXVLPeofsdQS9-Ix7gKRrZLOA0aXfQ2Sv7PVP7OJv83YavIWw0oQjaxko97Yjot5ddvTrzKQFldoRZMtf8FIjNXI6ahHgpt1h9F1YHog_aGEbD_pK4HNug44-Uy