" lengthAdjust="spacing" textLength="156.4063" x="796" y="1947.7803">status/finalizer: required /</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="174.3027" x="796" y="1961.7803">retain-until-confirmed-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="272.3984" x="796" y="1975.7803">requeue: provisioning, updating, terminating</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="265.3369" x="796" y="1989.7803">provider states: create CREATING; update</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="192.165" x="796" y="2003.7803">UPDATING; delete DELETING</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="234.9922" x="796" y="2017.7803">follow-up: create=GetWorkRequest -&gt;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="298.833" x="796" y="2031.7803">GetDeployPipeline; update=GetWorkRequest -&gt;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="258.7607" x="796" y="2045.7803">GetDeployPipeline; delete=confirm-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="257.5713" x="796" y="2059.7803">supported drift: description, displayName,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="319.416" x="796" y="2073.7803">deployPipelineParameters, freeformTags (+1 more)</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="287.916" x="796" y="2087.7803">reject before mutate: force-new fields projectId</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="144.751" x="796" y="2101.7803">create-only fields: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="290.2881" x="796" y="2115.7803">list lookup: oci_devops_deploy_pipelines filters</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="263.792" x="796" y="2129.7803">projectId, displayName, id; exact projectId,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="308.1436" x="796" y="2143.7803">displayName, id match within the resource scope;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="134.627" x="796" y="2157.7803">duplicate matches fail</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="796" y="2171.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="796" y="2185.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="177.4268" x="796" y="2199.7803">The production runtime uses</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="307.3984" x="796" y="2213.7803">generatedruntime/workrequest async handling for</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="273.1641" x="796" y="2227.7803">create, update, delete work-request phases.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="304.9854" x="796" y="2241.7803">Lifecycle success states are ACTIVE, INACTIVE;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="257.6396" x="796" y="2255.7803">pending create, update, and delete states</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="256.833" x="796" y="2269.7803">requeue until the corresponding follow-up</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="68.4824" x="796" y="2283.7803">converges.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="251.3506" x="796" y="2297.7803">Status projection is required, Secret side</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="260.7021" x="796" y="2311.7803">effects are none, and the finalizer policy is</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="178.1924" x="796" y="2325.7803">retain-until-confirmed-delete.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="278.5918" x="796" y="2339.7803">Delete policy required retains ownership until</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="206.9785" x="796" y="2353.7803">DELETED or confirmed absence.</text><?plantuml-src fLVRRjj647tVhnYaBmagsN5ivo8Z1HBRJOsuIM0xxOk0O4KEfQsfNNPtAKKj-k-TlL4aBIPs2p-OuixEzSoPeRaLikAQBy4iUAxMGiwXuAL1PfgJ6SzkvrhLCZzLfTBmGv7HNzwIoB7WTMb_Lj9-u4k4Nx1SeHKPtorpBVv2E3Xg7NAjrJfgVreSl7ZMlYcLnRTtV2YA5_dplfJIEUeeCJiwFdpwgYVXpCVpmyEZW-FZrhbNdoajKSF1SsQ5BH6kySyQPOOmfWXMgZBxPrYLQlD9L5WAYMmXSeH2AJjJNrlAJBhtDmFWcLMwurmCCXtreyDd-B9uIiUaZF8eAYxjxljjWVjeQIMWqL6A0Yyfbew5LqVySFQIJftAgdEKpV9ZF6YExfJcPS6BZFt3V6pmlfuXvTIYOIq_u9GSqQeiKNTUl-K6hp1JCXFzeqSVhp--lqQz4Xd-oYMVetu4t43tLUVAnzCBvieEQaL5xUeUzUvH0sZCGQDHPMs5afFuQZyNV4urDVlXztWhCavbtZEhUTAGOqdH3juEnzsRA7CFJxPD5en_QkLe0YX9laReme_SZV6mhR2xserr0itpO-qC6_k4TKNSfMv69blb59CHBhOU-3q0u5AfM_h7AOYPa3dZfGMh2HPqWG20NwkI2kAh0TGjaZfh0xpKoFCDdGfZ3UkQTiwGz0JUeUsPH2AdHdkZJHXO2cE8leOqNPAPhYhpk12bHMqcKrbfzGTczY8VGIvCLVAD8x8H6NZYmz5O6pwZHBWONFrhJRrDLgbgrFq4_Y6xfnIcnLuGfL8LPFu4AYg-eztJg_CtDnSVtZqW5MJLfsEtT_yvmpk2sO6eYZ97YaF3hAWOdV8A2SPoMnklpgKmu1uY_32Fu3dphuUy2wSz1mTaoRL2w6Koj1ByRd1JIO3S0OLGaNWpLUJi_FByGHKXj4