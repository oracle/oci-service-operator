ngthAdjust="spacing" textLength="251.3506" x="747" y="2209.7803">Status projection is required, Secret side</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="260.7021" x="747" y="2223.7803">effects are none, and the finalizer policy is</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="178.1924" x="747" y="2237.7803">retain-until-confirmed-delete.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="278.5918" x="747" y="2251.7803">Delete policy required retains ownership until</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="206.9785" x="747" y="2265.7803">DELETED or confirmed absence.</text><?plantuml-src fLVPRXit57tdLroaBmuYsN7iR39S8B7Jr8YR0B7R9mC1DSEH68_8AScHeXRzznukiybIx20m34bSxdhkkPVsLggA6xuWE-UvNaareuANLZ3RxanvTZipkbRvcIwreL-A37zvxqGk2bwNxZUjt4U-4FIxA9V2oOnlFtCb_n5qUDpRvCReLPB-j3Xy-Qn_KsadtjwneIXUvYysJscJ2vDEJ8-V7przlN72gq_xHqV7Xy-Vz_Q3-4mR9GmTlc1EkbBGbVYx5YeJD8O7IrtPWsiZPpDXs5pcWWgjtLH_wqcnpOL_6H7Fd3O3gv9tpTQcM-APU5KynJQ48O2ouifjlzy_y10fFSzR6QKinALKmxYzFkP7qrVOzIAhmLOspP-BmtRhJavU5Rp8s7yi-4OVwgb0C9smh6S7dS4GeyiI8Umll-LMV1QPLfdSt7hqwUhJXojXbZ8JVt354Vr7n2qDbmPNFfrTC9zlqajaSoXxj74Fo3SY9oEiBcidjPgafODSyXboQW_Yxt5tPDoaUTykPus4N9JmTkVjk3syALGUSCcwOD7urrwC9YGKpjU24kvWPtA4TQVydQ6J4sg_xnclqRh7R7Z4Nng6Oj89XpDMUgSQk8UKqwNMj_ZWC7igLSvuwSWP004daNBnhIgHWX1_Gdqe5D6QU6a4pzVObTPPDjJfhS3f2RqNhj4bG42js5QCjBIGreAYTecuXFmam-uLidJud51bz5UHkOjyTADoQQkIhprBZQ0X7BtIjSa4Dk6wma6azoAdlIU7jD16F7uSd3IYjdoAk7ZFF0xy7MyIiWSMG17iCkeCpZinS6sxi1yFqnQbMu1G8GgG606-H4G7oP6AhEEkja6STpNYb19gH9vIVnwMTvaLTnlBTXo2JOKqYqR3KlAUEy3FZUfda9LQLytP2jRvvdJ-xlBTzSN7z_U7n-Dn8AxnBoi5Lt08-uLKl4GtybM5LHioEYsr1zv3Gck4umXWij77KOJQmBfPnrodlKmlAdm1jaXFBIG_L44qgpEK5q3rNQd1k_3lbVeCHslWJp36m-rX2YFRhEQonUS2Fbe0vKQrqGzQIhbidFRNG1SMXeeo7_CL60_LPcJXI2nvMVDWP49IM9uZKAKlvewdX_QDF8bVrLMb3L18TPLxJROs1S_4XBvQhSwvuoCsA6hmLcPavTMDg3125