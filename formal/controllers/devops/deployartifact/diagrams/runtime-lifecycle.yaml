schemaVersion: 1
surface: repo-authored-semantics
service: devops
slug: deployartifact
kind: DeployArtifact
archetype: generated-service-manager
states:
    - provisioning
    - active
    - updating
    - terminating
repoAuthored:
    providerLifecycle:
        createPending:
            - CREATING
        updatePending:
            - UPDATING
        deletePending:
            - DELETING
    listLookup:
        filters:
            - projectId
            - displayName
            - deployArtifactType
            - argumentSubstitutionMode
            - deployArtifactSource.deployArtifactSourceType
            - deployArtifactSource.repositoryId
            - deployArtifactSource.deployArtifactPath
            - deployArtifactSource.deployArtifactVersion
            - deployArtifactSource.chartUrl
            - deployArtifactSource.imageUri
            - deployArtifactSource.imageDigest
            - deployArtifactSource.base64EncodedContent
            - deployArtifactSource.helmArtifactSourceType
            - deployArtifactSource.helmVerificationKeySource.verificationKeySourceType
            - deployArtifactSource.helmVerificationKeySource.currentPublicKey
            - deployArtifactSource.helmVerificationKeySource.previousPublicKey
            - deployArtifactSource.helmVerificationKeySource.vaultSecretId
        matchRule: exact projectId, displayName, deployArtifactType, argumentSubstitutionMode, deployArtifactSource.deployArtifactSourceType, deployArtifactSource.repositoryId, deployArtifactSource.deployArtifactPath, deployArtifactSource.deployArtifactVersion, deployArtifactSource.chartUrl, deployArtifactSource.imageUri, deployArtifactSource.imageDigest, deployArtifactSource.base64EncodedContent, deployArtifactSource.helmArtifactSourceType, deployArtifactSource.helmVerificationKeySource.verificationKeySourceType, deployArtifactSource.helmVerificationKeySource.currentPublicKey, deployArtifactSource.helmVerificationKeySource.previousPublicKey, deployArtifactSource.helmVerificationKeySource.vaultSecretId match within the resource scope; duplicate matches fail
    mutation:
        mutable:
            - deployArtifactType
            - deployArtifactSource
            - argumentSubstitutionMode
            - description
            - displayName
            - freeformTags
            - definedTags
        forceNew:
            - projectId
    hooks:
        create:
            - helper: tfresource.CreateResource
        update:
            - helper: tfresource.UpdateResource
        delete:
            - helper: tfresource.DeleteResource
    followUp:
        create: GetWorkRequest -> GetDeployArtifact
        update: GetWorkRequest -> GetDeployArtifact
        delete: confirm-delete
notes:
    - The production runtime uses generatedruntime/workrequest async handling for create, update, delete work-request phases.
    - Lifecycle success states are ACTIVE; pending create, update, and delete states requeue until the corresponding follow-up converges.
    - Status projection is required, Secret side effects are none, and the finalizer policy is retain-until-confirmed-delete.
    - Delete policy required retains ownership until DELETED or confirmed absence.
