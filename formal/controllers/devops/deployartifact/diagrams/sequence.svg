" textLength="475.4531" x="790" y="2605.7803">deployArtifactSource.helmVerificationKeySource.verificationKeySourceType,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="414.7568" x="790" y="2619.7803">deployArtifactSource.helmVerificationKeySource.currentPublicKey,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="424.1016" x="790" y="2633.7803">deployArtifactSource.helmVerificationKeySource.previousPublicKey,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="386.75" x="790" y="2647.7803">deployArtifactSource.helmVerificationKeySource.vaultSecretId</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="264.585" x="790" y="2661.7803">match within the resource scope; duplicate</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="74.6963" x="790" y="2675.7803">matches fail</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="790" y="2689.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="790" y="2703.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="177.4268" x="790" y="2717.7803">The production runtime uses</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="307.3984" x="790" y="2731.7803">generatedruntime/workrequest async handling for</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="273.1641" x="790" y="2745.7803">create, update, delete work-request phases.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="286.3574" x="790" y="2759.7803">Lifecycle success states are ACTIVE; pending</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="288.7637" x="790" y="2773.7803">create, update, and delete states requeue until</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="244.3643" x="790" y="2787.7803">the corresponding follow-up converges.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="251.3506" x="790" y="2801.7803">Status projection is required, Secret side</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="260.7021" x="790" y="2815.7803">effects are none, and the finalizer policy is</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="178.1924" x="790" y="2829.7803">retain-until-confirmed-delete.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="278.5918" x="790" y="2843.7803">Delete policy required retains ownership until</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="206.9785" x="790" y="2857.7803">DELETED or confirmed absence.</text><?plantuml-src xLXTRnkv5NsVNt6nVKcmbXsldMnMHWfaRNSRnBi9h6Jx8Y2WPZWIwn4v9JbIrAB_lOTVev4qayXf7_gmy8CbylBoVfvxAFCWPCqqMv9Pi4AjXPnJoIh3CzFkp5Z-CDUgaSMrgfIcFvKv_egEHC5BrbJsBqhQtzYIqrzvjU9MvAnVPYB-oUdyihF9j5RhgFrPUVxZ3zsJKbd-yu4DPVbZyM9VIkc2woWnktn-yUodFGbtVTo_kBWyV_wyi-_LvqfBhkdyHMQ5hJXD-3yQBdDE8tYmKhKvk-5rfJQljHKbosss40MdKYaxKvyxoamwzw-C279AxnWNdKnR-zxn7_ZByXcseGnn53MJjlzyL-0OBPq0j3egKV8x8NV3zzCbkvYznAvJMUzivRFYEJzljmvIyx9aPPxzE_E-qTjcnX5JoqtMiOEkOOXMLSNrplBFpF1xdYkPY_sjxzvDthsTSBqIEV-LIJRd-ZjYXdQNTewyktwJkRIJMY6fkxfFziwX0JGlI7EZgiOA9STnwQmGR8wSchFmVRGL6QKqdvhLF6aeU0Ll1q-7xTsJN1Q-FBDji6ZqvqwCniGbv1jEk-K7SwC_sLRO7TtrTKpjvoVQNMpiqsnNn1tQZSXugnm-6U5ysoj-Nm1qfzG3_Z4uCHEoo5XboMgK1GwW0FZdka92V3O8tIBHMHjYbUQis61N66kotQkTCP0Uqo_Sxbt90KwjzbQRCBGKnW2-XZJTuPfTL