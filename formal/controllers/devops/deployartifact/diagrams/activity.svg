4" x="694.9993" y="2582.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="177.4268" x="694.9993" y="2596.7803">The production runtime uses</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="307.3984" x="694.9993" y="2610.7803">generatedruntime/workrequest async handling for</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="273.1641" x="694.9993" y="2624.7803">create, update, delete work-request phases.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="286.3574" x="694.9993" y="2638.7803">Lifecycle success states are ACTIVE; pending</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="288.7637" x="694.9993" y="2652.7803">create, update, and delete states requeue until</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="244.3643" x="694.9993" y="2666.7803">the corresponding follow-up converges.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="251.3506" x="694.9993" y="2680.7803">Status projection is required, Secret side</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="260.7021" x="694.9993" y="2694.7803">effects are none, and the finalizer policy is</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="178.1924" x="694.9993" y="2708.7803">retain-until-confirmed-delete.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="278.5918" x="694.9993" y="2722.7803">Delete policy required retains ownership until</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="206.9785" x="694.9993" y="2736.7803">DELETED or confirmed absence.</text><ellipse cx="657.9993" cy="2313" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="657.9993" cy="2313" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="657.9993" x2="657.9993" y1="157" y2="177"/><polygon fill="#0F172A" points="653.9993,167,657.9993,177,661.9993,167,657.9993,171" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="809.4651" x2="809.4651" y1="355" y2="375"/><polygon fill="#0F172A" points="805.4651,365,809.4651,375,813.4651,365,809.4651,369" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="809.4651" x2="809.4651" y1="437" y2="457"/><polygon fill="#0F172A" points="805.4651,447,809.4651,457,813.4651,447,809.4651,451" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="516.5334" x2="506.5334" y1="257" y2="257"/><line style="stroke:#0F172A;stroke-width:1;" x1="506.5334" x2="506.5334" y1="257" y2="279"/><polygon fill="#0F172A" points="502.5334,269,506.5334,279,510.5334,269,506.5334,273" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="799.4651" x2="809.4651" y1="257" y2="257"/><line style="stroke:#0F172A;stroke-width:1;" x1="809.4651" x2="809.4651" y1="257" y2="279"/><polygon fill="#0F172A" points="805.4651,269,809.4651,279,813.4651,269,809.4651,273" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="506.5334" x2="506.5334" y1="327" y2="523"/><line style="stroke:#0F172A;stroke-width:1;" x1="506.5334" x2="645.9993" y1="523" y2="523"/><polygon fill="#0F172A" points="635.9993,519,645.9993,523,635.9993,527,639.9993,523" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="809.4651" x2="809.4651" y1="505" y2="523"/><line style="stroke:#0F172A;stroke-width:1;" x1="809.4651" x2="669.9993" y1="523" y2="523"/><polygon fill="#