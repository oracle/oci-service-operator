schemaVersion: 1
surface: repo-authored-semantics
service: limits
slug: quota
kind: Quota
archetype: generated-service-manager
states:
  - active
  - terminating
repoAuthored:
  providerLifecycle:
    createPending: []
    updatePending: []
    deletePending: []
  listLookup:
    filters: ["compartmentId","name"]
    matchRule: exact resource identity match; duplicate matches fail
  mutation:
    mutable: ["definedTags","description","freeformTags","statements"]
    forceNew: ["compartmentId","name"]
  followUp:
    create: read-after-write
    update: read-after-write
    delete: confirm-delete
notes:
  - "The runtime uses its declared lifecycle-state contract for Quota reconciliation."
  - "The credential-free mock exercises SDK request serialization, response projection, mutation when supported, and confirmed deletion."
