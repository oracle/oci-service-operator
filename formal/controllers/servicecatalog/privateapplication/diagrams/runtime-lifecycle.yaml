schemaVersion: 1
surface: repo-authored-semantics
service: servicecatalog
slug: privateapplication
kind: PrivateApplication
archetype: generated-service-manager
states:
  - provisioning
  - active
  - updating
  - terminating
repoAuthored:
  providerLifecycle:
    createPending: ["CREATING"]
    updatePending: ["UPDATING"]
    deletePending: ["DELETING"]
  listLookup:
    filters: ["compartmentId","displayName","id"]
    matchRule: exact resource identity match; duplicate matches fail
  mutation:
    mutable: ["definedTags","displayName","freeformTags","logoFileBase64Encoded","longDescription","shortDescription"]
    forceNew: ["compartmentId","packageDetails"]
  followUp:
    create: read-after-write
    update: read-after-write
    delete: confirm-delete
notes:
  - "The runtime uses its declared lifecycle-state contract for PrivateApplication reconciliation."
  - "The credential-free mock exercises SDK request serialization, response projection, mutation when supported, and confirmed deletion."
