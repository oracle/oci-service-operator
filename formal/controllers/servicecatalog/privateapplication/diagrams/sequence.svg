spacing" textLength="66.1445" x="815" y="2101.7803">list lookup:</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="291.8262" x="815" y="2115.7803">oci_service_catalog_private_applications filters</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="300.3506" x="815" y="2129.7803">compartmentId, displayName, id; exact resource</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="228.7783" x="815" y="2143.7803">identity match; duplicate matches fail</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="815" y="2157.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="815" y="2171.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="272.3369" x="815" y="2185.7803">The runtime uses its declared lifecycle-state</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="275.4678" x="815" y="2199.7803">contract for PrivateApplication reconciliation.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="301.123" x="815" y="2213.7803">The credential-free mock exercises SDK request</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="265.3643" x="815" y="2227.7803">serialization, response projection, mutation</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="252.9434" x="815" y="2241.7803">when supported, and confirmed deletion.</text><?plantuml-src hLXPRnit47xdho3QbmJLsd7YN39IeB6JD8YR177w9Y2WTcSbrXIv9RbIrAB_lJCyLhlood4Fv25Q7dD-yytGxbhgHbYnucufAhEHUi5heHmmr-tCHNcziARLrRbHnlBlwnB_LRqJ5TIYLVwrqVwzM07_6TGQl2p5-9ah-GVmazFUfh3MR9Bq1_N9quVzczfuU