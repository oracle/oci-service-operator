etica" font-size="14" lengthAdjust="spacing" textLength="263.0127" x="788" y="2115.7803">delete=GetWorkRequest -&gt; confirm-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="273.1162" x="788" y="2129.7803">supported drift: displayName, freeformTags,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="77.0547" x="788" y="2143.7803">definedTags</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="230.3301" x="788" y="2157.7803">reject before mutate: force-new fields</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="141.6201" x="788" y="2171.7803">compartmentId, details</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="144.751" x="788" y="2185.7803">create-only fields: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="279.3574" x="788" y="2199.7803">list lookup: unavailable filters compartmentId,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="272.3438" x="788" y="2213.7803">lifecycleState, displayName, opc-request-id;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="291.7988" x="788" y="2227.7803">exact declared filters match within the resource</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="179.7646" x="788" y="2241.7803">scope; duplicate matches fail</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="788" y="2255.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="788" y="2269.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="315.1777" x="788" y="2283.7803">The generated service manager uses the reviewed</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="286.3506" x="788" y="2297.7803">CRUD request, response, lifecycle, and status</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="118.2822" x="788" y="2311.7803">projection contract.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="301.1641" x="788" y="2325.7803">Work-request phases are declared per operation</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="261.4678" x="788" y="2339.7803">from the vendored SDK response surface.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="253.7021" x="788" y="2353.7803">Secret side effects are none and finalizer</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="284.0469" x="788" y="2367.7803">ownership is retained until confirmed deletion.</text><?plantuml-src jLXTSnir57tNhz302ynuauQsq3eJPjgaBPq6oYJjzCKlykvTMtGjBPBMhc7uxnnzhNSTcwOm30_4gwlxUUwvLxKVfMg54IjkbwBI6waMl1QD9MRxaxaeFowCxbHrgHjj-DTrYV-gWKH5jUWQzr8hzujO4V-9cZKvMOh3ChVo3-9dZmQ7mXYzITeVr6S_V3UygRIZvtTygEiVgk_tfRIfo2I9-QF73nyytPFmvjFvmuUFpXu_7fm7zQKsYWm_-vuvwHhYj_HxHweaNl2w8N9MrsuZ37Lj9HoTlhJTbRIbNfFPigMiYDTQkxd-DD1hiue_6UUYTDgC_4pnvgFzGEaxUb8_m36K8QMo5SeTlZyKk8-MGIvw7OsiwLggSIQVFX8FvqzmwbMsewDoNZsci_xeJfMUrA8ksLyinCRVT7D2UXrPDl23Ny8Hevk6pEZpSs7fXagjIhb_zDNRsxTlRiciPKa_2oKMPBxYmlBnfz6LjvUlcKS0zxNQqptPkuTUC5HnGrOtdPDQJTEdqqgA1MfgJ-FlOYTIv3AVsFKYQwYeGRH7RyVZyKrILK0gsoMB5pyESZJbf23V4H-23ywcQDXEr5ySHphb_T_V66_Mkc_PMCHV6kTZkbEEYApqaOs07uhFhxN-YFy9132NgcAYSTmPG0BYA3vzQXiK8rI2erCK6cpBHMD8L5kSIkii6nlsha1wob-H6naaC5IlkzSbBLz9Qy5Xn_HSmyX0aIJxJIqRHyPEPwhKAm-O5RIzhYQX5SfjsT2jGwTFPggIjct4rZFSXEksB5822rbz6u85ArWnHv9yX1uP