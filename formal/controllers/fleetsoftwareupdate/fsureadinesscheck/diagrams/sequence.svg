DATING; delete DELETING</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="234.9922" x="832" y="2115.7803">follow-up: create=GetWorkRequest -&gt;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="252.499" x="832" y="2129.7803">read-after-write; update=read-after-write;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="263.0127" x="832" y="2143.7803">delete=GetWorkRequest -&gt; confirm-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="273.1162" x="832" y="2157.7803">supported drift: displayName, freeformTags,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="77.0547" x="832" y="2171.7803">definedTags</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="293.3643" x="832" y="2185.7803">reject before mutate: force-new fields jsonData,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="178.1924" x="832" y="2199.7803">compartmentId, type, targets</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="144.751" x="832" y="2213.7803">create-only fields: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="279.3574" x="832" y="2227.7803">list lookup: unavailable filters compartmentId,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="269.623" x="832" y="2241.7803">resourceId, lifecycleState, displayName (+2</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="277.7783" x="832" y="2255.7803">more); exact declared filters match within the</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="238.123" x="832" y="2269.7803">resource scope; duplicate matches fail</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="832" y="2283.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="150.2129" x="832" y="2297.7803">open gaps: seed-corpus</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="315.1777" x="832" y="2311.7803">The generated service manager uses the reviewed</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="286.3506" x="832" y="2325.7803">CRUD request, response, lifecycle, and status</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="118.2822" x="832" y="2339.7803">projection contract.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="301.1641" x="832" y="2353.7803">Work-request phases are declared per operation</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="261.4678" x="832" y="2367.7803">from the vendored SDK response surface.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="253.7021" x="832" y="2381.7803">Secret side effects are none and finalizer</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="284.0469" x="832" y="2395.7803">ownership is retained until confirmed deletion.</text><?plantuml-src jLZRSXit4dt7LtHbN-nQKh9yIHogj5M9v2GkQ-EKP9TV-0BEz928Xi0iW27DtTf_tuFB38StHqvgomycYKPVJvzko3qetKWhb-GMiZHhfUTKoTgnSFt9J1OFSsjQNLwRsbZwMrNWNpcGABcIRUr_Cjh_AfTClt2zOgyAULpcNlsRwUBbu51QQzPP-xFguhldmvlQUFxnm8Ug-gxyTb_As99jbfYzVFNYsVTx4i5yFd_nukN5grU3ywY-C5QpfOjlXLU-PhhdVxMi2wOnLJMpTwRoQscvRKhf-VmdrzwnB9LcvwuNN3o8XIgPAcFyp7mUA7UTdly88bbuOtUSpK5tH_lHydD-NJt3CPGXhwgHsX-_FnHuZ9P1Gd