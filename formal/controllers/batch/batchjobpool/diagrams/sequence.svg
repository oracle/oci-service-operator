="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="195.3232" x="789" y="2115.7803">compartmentId, batchContextId</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="144.751" x="789" y="2129.7803">create-only fields: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="279.3574" x="789" y="2143.7803">list lookup: unavailable filters compartmentId,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="296.0645" x="789" y="2157.7803">lifecycleState, displayName, id (+2 more); exact</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="254.4473" x="789" y="2171.7803">declared filters match within the resource</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="179.7646" x="789" y="2185.7803">scope; duplicate matches fail</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="789" y="2199.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="150.2129" x="789" y="2213.7803">open gaps: seed-corpus</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="315.1777" x="789" y="2227.7803">The generated service manager uses the reviewed</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="286.3506" x="789" y="2241.7803">CRUD request, response, lifecycle, and status</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="118.2822" x="789" y="2255.7803">projection contract.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="301.1641" x="789" y="2269.7803">Work-request phases are declared per operation</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="261.4678" x="789" y="2283.7803">from the vendored SDK response surface.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="253.7021" x="789" y="2297.7803">Secret side effects are none and finalizer</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="284.0469" x="789" y="2311.7803">ownership is retained until confirmed deletion.</text><?plantuml-src hLXRSzD657xVNt6cVO6fbH0kBJYJpa12AIKjJ0B3IrxMqihU8k-gkoiRjzF_tczlikJORKexp82iFNkkt_dE4VQJL2qtV4bsmIkzbcfEDM-iOBO_cV7oqzpeJbNdkj66lgvB_Aa64fMeUTUu7xHol_2be1z5in9Ebdo_pBNyNT39uy4XDqQla_O7zSbt3uStbNRYnIqVwlgxwjjTAMqgOPB4xF6JHm-UxKXuy-dyqQF79q-U3Cw3-b8R9GoTVCkST8sWQ_5R9rGfg40UNBauVk7__adFtcdTi8Mi1DLQkvd-FD1aywK_614ldJOZprA4-MWtDF5GFAqVu1ZAa4JPSkNstnyAt4NB8FfUHoDhSIdLE7VF7lD7iwSuzIhRqL4vgvw8a_xeLbsUrhmksPyin4Plkfb0GfsmRE07dSCHevj6cD7h5zoAAr5gLShTew_UNhzzSotCIfRYPwxuN9YlY5iQlnfTUNl-clcQarwXecFTavrxGByH5HbXTTCvgTKqlJgk99-ZflOu_Yws8aKkyv5TpRE6IZI8zk3jU3o-ALGLiCcsoQBY-q6EfYGKv3j1G_31sHGDsuhwY-D8fzG_tpFUh7NtsLZ4NnhdOxfLZeYiz96DW1-AJvTQVy8_707CfAeORnmv0qX07CKNdzi6nGYL87IAGajjY3T6y6g3KscTPMF3tXL8J-cLS2E30fpKw-vrIKjBQIrOwv2UInWPAhBtQjauOUpqHfLwwV6oXBBNrIHqGhaf6t7jk1EJ6rL9spPyuobj0fjqxvk7jDH6tByV8ZMYito63FdmF2mwWvQ7IoWcI04zSSYfSsJ0SzeWlaRhbihmdbeWmXFn-TNBv-zV__BgpZc2nP2d_PvzOUBtXB47P2rI2hMnWrQeqQZcKf55KZiRrFdanKQWX4XH9KHTXDU7V8kd8_SEICAnMffbDhEIV3Um6mM4ta97h4EwbUjmyVBovR-e0-rLd0C7lhX2f12gfU8DPg516l3M1l3C6kqnVfUS6-4uCfkyzGaMeHVntcmY4jAPHpeUG5gaPnQQxseWkhLrbDVedTjQ8_Go_7pfepU89pZZmNWtWv7drWlPetU962qGTADoFqpemxkBzDJN9bXkv2edmgi2RrauBvggu6lmBrhQoDgHMF6cuy7n1BlmUe7aDPvBjbDZxFF4ZvJhhcsr0MIfQojloNQcvgMOqf0l66YpDBBrHYPK6o5gRPRl-TnE_2g4WLlv7-nA_2fAHpD_B6ZPUT-dO0yqRA74EdflsGvLXLN4ixxuZDyiyN1cDXfBinrYepsynWAlPKLBhnw9mE3vZ3aEXyicJBTaWGK1Mai7AN8BiIKPM-fMdBAgyzJlinD4VHcuRBQZJhTk42HwmJSiRZZVRx58m4u5b9NkhbWT9j939oGpWzCRj7tb_97dnt-sb5hyUTis6_eG2ZxkTONtC