="Helvetica" font-size="14" lengthAdjust="spacing" textLength="283.2129" x="2277.78" y="476.7803">real OCI SDK through the full CRUD lifecycle.</text></g><g class="entity" data-qualified-name="GMN5" data-source-line="88" id="ent0006"><path d="M2959.27,544 L2959.27,559.04 L2499.39,542.28 L2959.27,567.04 L2959.27,594 A8,8 0 0 0 2967.27,602 L3216.6138,602 A8,8 0 0 0 3224.6138,594 L3224.6138,546 L3214.6138,536 L2967.27,536 A8,8 0 0 0 2959.27,544" fill="#FFF7D6" style="stroke:#B45309;stroke-width:0.5;"/><path d="M3214.6138,536 L3214.6138,542 A4,4 0 0 0 3218.6138,546 L3224.6138,546 L3214.6138,536" fill="#FFF7D6" style="stroke:#B45309;stroke-width:0.5;"/><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="136.9717" x="2965.27" y="551.7803">delete policy: required</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="244.3438" x="2965.27" y="565.7803">delete observe: GetBatchTaskProfile or</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="127.6064" x="2965.27" y="579.7803">ListBatchTaskProfile</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="157.1855" x="2965.27" y="593.7803">delete targets: DELETED</text></g><!--link *start* to observe--><g class="link" data-entity-1="ent0002" data-entity-2="ent0002" data-link-type="dependency" data-source-line="32" id="lnk3"><path d="M26.34,454 C56.22,454 146.34,454 228.76,454" fill="none" id="*start*-to-observe" style="stroke:#0F172A;stroke-width:1;"/><polygon fill="#0F172A" points="234.76,454,225.76,450,229.76,454,225.76,458,234.76,454" style="stroke:#0F172A;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="147.8408" x="57" y="449.7803">CreateBatchTaskProfile</text></g><!--link observe to resolve_by_lookup--><g class="link" data-entity-1="ent0002" data-entity-2="ent0007" data-link-type