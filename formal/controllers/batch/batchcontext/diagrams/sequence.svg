"Helvetica" font-size="14" lengthAdjust="spacing" textLength="174.3027" x="787" y="2115.7803">retain-until-confirmed-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="272.3984" x="787" y="2129.7803">requeue: provisioning, updating, terminating</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="265.3369" x="787" y="2143.7803">provider states: create CREATING; update</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="192.165" x="787" y="2157.7803">UPDATING; delete DELETING</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="234.9922" x="787" y="2171.7803">follow-up: create=GetWorkRequest -&gt;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="277.792" x="787" y="2185.7803">read-after-write; update=GetWorkRequest -&gt;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="273.1162" x="787" y="2199.7803">read-after-write; delete=GetWorkRequest -&gt;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="88.7031" x="787" y="2213.7803">confirm-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="257.5713" x="787" y="2227.7803">supported drift: displayName, description,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="233.0439" x="787" y="2241.7803">freeformTags, definedTags (+2 more)</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="230.3301" x="787" y="2255.7803">reject before mutate: force-new fields</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="195.3027" x="787" y="2269.7803">compartmentId, network, fleets,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="128.4268" x="787" y="2283.7803">loggingConfiguration</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="144.751" x="787" y="2297.7803">create-only fields: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="279.3574" x="787" y="2311.7803">list lookup: unavailable filters compartmentId,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="296.0645" x="787" y="2325.7803">lifecycleState, displayName, id (+1 more); exact</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="254.4473" x="787" y="2339.7803">declared filters match within the resource</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="179.7646" x="787" y="2353.7803">scope; duplicate matches fail</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="787" y="2367.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="150.2129" x="787" y="2381.7803">open gaps: seed-corpus</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="315.1777" x="787" y="2395.7803">The generated service manager uses the reviewed</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="286.3506" x="787" y="2409.7803">CRUD request, response, lifecycle, and status</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="118.2822" x="787" y="2423.7803">projection contract.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="301.1641" x="787" y="2437.7803">Work-request phases are declared per operation</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="261.4678" x="787" y="2451.7803">from the vendored SDK response surface.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="253.7021" x="787" y="2465.7803">Secret side effects are none and finalizer</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="284.0469" x="787" y="2479.7803">ownership is retained until confirmed deletion.</text><?plantuml-src jLXRZzD657wVNp5gNq34kontijfAi4i1iOLg5yJBlapiusIwpemxCqv8g_xtVdEnO-TI0XL20iTpVAxV-SuPxArKjJ1YpkrC57efrPINehB4R7So4VdjrEX65UUwqeR_NERuK_Ga2Yf5KxbVjNBlnPpu6weMv6GkTijSox-8dppg7GfZz39flr-UF7tG_r9fHo-tV2ZBfyMJJIbj2Z99OlBeySFxppSalFbq_l3XevF7ZtldGNskZIB3Jvum9rr5_9h-R4Zbn3FamUMpuvV-xtEeeI-EpMH1lDJQJVINdYRRVlGturpaJfk1Pod2zcWpD7f0pyhxE8Oo957MGhdTt_S53j7IYxxJKScIBgKQvkxv8_5myWodNcKzECednMCwwOwswlAi56NE_c4XDlwkcH0IwiYodX_Svy_egY8pUFrIMBgYNAjSRXxzzE7wmxjhCWkPqsz2YIcPdxYmVFXgyCc7yxVCrvph1Iewr3tQ-0xeDrHmGrPNZPDQZTEhuqAAAMfgZ-FlR2sIjMK-iejfgw6W2j7k_JeU3xyaLGHiidMoUFPBBqTZJWho3V4--E1iYeQjHVs7mqZ7l7k-OxnPw-woeOZ_Q9YFyLev8hBIHpO0VYW-lzJw5ly8132Hgc2YSjmPG0BYA3vzgIiK8rI2erCKMch5HML852kSIkii6nhsha1wp5-J6nWaS5AdkzCbBPzBQy5Q-_HSmaXVaRrJoigHiUCRbUkvnyiSojuMez09-IglwDe9HwCRLKXRLsBbAMq4c_pElHC-ruRktWsH6cgic213FZmFYyQWvU4IYWbIG4_iS-eS6V2SreklqhhcUNZFQo324_7vrQiN7z--VtrmZc0nv6ctPz-P-1rXx01PZPH2RUoW1MeqgBbKt2AfZGtgVF9Y8_24I2eIeYx2wts-nTE1UtiauLWfpRmriv1YCx0R1OHkeIFM8NtLrk7YrUMhRwW3twcu3Hpu4WgHGgYKIbIOXGPfm5iRm3EfjCVu8Jatv0Gocxpr2QRGYtXlLX49wSmZ7GyWBQud5feFDH3TMZigIlJEjjO8lHP-llJH6yGJdF5WFCnWvBdbJ7RedID62mJTgBOVHlpJxnVfgQjDi5p9HPi8hmgyPU4yLKKcbk1VjBIHfUEq45KZWkC9Tk7r3CchF9UifyRGvv4VATTDNMi3oFAcBhmbsvXIv3JcVRvWeCtSoDeR6V7I49NQp3-AgHtvLGW3j_0_s9rx3oAdi2lwWtB79rwG-BpnKOp18sZTJD4onc7P1cbXN2orkOM9YiZP4G0ydIA6Szy0qyR4A1DHjzJ7XqhO1lFn7SJ7efD9qTn36rOmcRvWq2EYl0hZBrbWGO0lfOCKTpDQiv3DTKsdh6ZyRF3f2wA-Ja9MwrceQzUB7StYEnfVED-GiOe0Lm4OvkvGCFVpwx4LSjoYrnkqNMdzaIVGhr