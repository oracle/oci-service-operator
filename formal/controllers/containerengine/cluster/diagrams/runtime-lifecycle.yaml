schemaVersion: 1
surface: repo-authored-semantics
service: containerengine
slug: cluster
kind: Cluster
archetype: generated-service-manager
states:
  - provisioning
  - active
  - updating
  - terminating
notes:
  - Ready state maps to OCI ACTIVE. Requeue continues while OCI reports CREATING or UPDATING.
  - Create, update, and delete retain OCI work-request identifiers as status breadcrumbs while lifecycle reads drive convergence.
  - Delete completes only after GetCluster reports DELETED or no longer finds the tracked cluster.
