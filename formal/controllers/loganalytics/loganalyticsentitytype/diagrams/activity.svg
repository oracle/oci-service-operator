ame, namespace, properties (+2 more)</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="144.751" x="638.2021" y="1933.2803">create-only fields: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="101.1787" x="638.2021" y="1947.2803">list lookup: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="638.2021" y="1961.2803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="638.2021" y="1975.2803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="299.585" x="638.2021" y="1989.2803">The OCI namespace or parent identifier remains</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="277.8057" x="638.2021" y="2003.2803">part of every LogAnalyticsEntityType request</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="31.1377" x="638.2021" y="2017.2803">path.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="268.4473" x="638.2021" y="2031.2803">The recorded composite-path mock verifies</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="293.4053" x="638.2021" y="2045.2803">request bodies, nested paths, status projection,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="145.5371" x="638.2021" y="2059.2803">and confirmed deletion.</text><ellipse cx="601.2021" cy="1817.5" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="601.2021" cy="1817.5" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="601.2021" x2="601.2021" y1="157" y2="