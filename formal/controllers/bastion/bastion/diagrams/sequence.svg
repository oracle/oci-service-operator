stionType, compartmentId, targetSubnetId, name</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="61.0723" x="750" y="2129.7803">(+2 more)</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="144.751" x="750" y="2143.7803">create-only fields: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="238.1299" x="750" y="2157.7803">list lookup: oci_bastion_bastions filters</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="239.6885" x="750" y="2171.7803">compartmentId, name, targetSubnetId,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="261.4609" x="750" y="2185.7803">bastionType; exact compartmentId, name,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="280.9434" x="750" y="2199.7803">targetSubnetId, bastionType match within the</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="238.123" x="750" y="2213.7803">resource scope; duplicate matches fail</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="750" y="2227.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="750" y="2241.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="177.4268" x="750" y="2255.7803">The production runtime uses</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="307.3984" x="750" y="2269.7803">generatedruntime/workrequest async handling for</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="273.1641" x="750" y="2283.7803">create, update, delete work-request phases.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="286.3574" x="750" y="2297.7803">Lifecycle success states are ACTIVE; pending</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="288.7637" x="750" y="2311.7803">create, update, and delete states requeue until</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="244.3643" x="750" y="2325.7803">the corresponding follow-up converges.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="251.3506" x="750" y="2339.7803">Status projection is required, Secret side</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="260.7021" x="750" y="2353.7803">effects are none, and the finalizer policy is</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="178.1924" x="750" y="2367.7803">retain-until-confirmed-delete.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="278.5918" x="750" y="2381.7803">Delete policy required retains ownership until</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="206.9785" x="750" y="2395.7803">DELETED or confirmed absence.</text><?plantuml-src jLVRRYCt4dtdLnIoBnEisXxFFJ8cWCVsJhnnCekHiqy20ggRBJ739ZiaMnfja7zF5I_TBLdAQ144Uf34IrrFdIgwJrAttF86t8fNPYFr4cgkd62ktrdmyjFIcavNrqOP2_-eI_nKenELg7cd_B-CzZ_oHi1tGgs5boK_V6Oc_oVWuiLearjhDadwq_hYzRFnJMsyUFV8Xhf-NRtQFsLi9MmwiNZnyldJR_PEaFgq__pvYukNBqVxGNnfh1OMBbunBxqIC1E_TaAN0WgCW_FIwFDtyPkjP2MWDiOlpEUH69Tl_CO0UEcDtJ4hkPUtzlqIpyIR-Ybkep2Ce6ovzeVlZm-S8cNaUYz3oLhSIxqRk6zUyEUBDxXB8jkThN9HlHGN_TQZfBofULsotrdm3Rxl5WAZwOLZ8plW6WsnHYbXTvOnhEAZA8qkvVxMLnzc7xwV2RkMfVY1QxuKzYlW3dQNTgvykBvZb70mQqpdhkp9tZs4lXKLME6CwYYrqxHqNac-n9owy_Y_68uKESrdRhtC4YgXqDkZj-FsxasXgm1CDWGBY