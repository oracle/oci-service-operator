engthAdjust="spacing" textLength="136.1787" x="726.7515" y="1128.7803">only for mutable fields</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="216.3574" x="726.7515" y="1142.7803">coolDownInSeconds, definedTags,</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="236.9131" x="726.7515" y="1156.7803">displayName, freeformTags (+1 more)</text></g><g class="message" data-entity-1="part4" data-entity-2="part5" id="msg15"><polygon fill="#0F172A" points="973.7983,1235,983.7983,1239,973.7983,1243,977.7983,1239" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="719.7515" x2="979.7983" y1="1239" y2="1239"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.2891" x="726.7515" y="1191.7803">run helper hooks</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="219.0508" x="726.7515" y="1205.7803">create=tfresource.CreateResource;</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="226.085" x="726.7515" y="1219.7803">update=tfresource.UpdateResource;</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="212.8438" x="726.7515" y="1233.7803">delete=tfresource.DeleteResource</text></g><g class="message" data-entity-1="part4" data-entity-2="part5" id="msg16"><polygon fill="#0F172A" points="973.7983,1305,983.7983,1309,973.7983,1313,977.7983,1309" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="719.7515" x2="979.7983" y1="1309" y2="1309"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="147.0752" x="726.7515" y="1261.7803">apply follow-up strategy</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="145.8926" x="726.7515" y="1275.7803">create=read-after-write;</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="149.8027" x="726.7515" y="1289.7803">update=read-after-write;</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="135.0234" x="726.7515" y="1303.7803">delete=confirm-delete</text></g><g class="message" data-entity-1="part4" data-entity-2="part3" id="msg17"><polygon fill="#0F172A" points="463.1733,1354,453.1733,1358,463.1733,1362,459.1733,1358" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;stroke-dasharray:2,2;" x1="457.1733" x2="718.7515" y1="1358" y2="1358"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="100.7822" x="469.1733" y="1338.7803">status=required,</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="230.7197" x="469.1733" y="1352.7803">finalizer=retain-until-confirmed-delete</text></g><g class="message" data-entity-1="part3" data-entity-2="part2" id="msg18"><polygon fill="#0F172A" points="295.188,1389,285.188,1393,295.188,1397,291.188,1393" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;stroke-dasharray:2,2;" x1="289.188" x2="451.1733" y1="1393" y2="1393"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="143.9854" x="301.188" y="1387.7803">requeue on terminating</text></g><path d="M724,1414 L724,2164 A8,8 0 0 0 732,2172 L1050,2172 A8,8 0 0 0 1058,2164 L1058,1416 L1048,1406 L732,1406 A8,8 0 0 0 724,1414" fill="#FFF7D6" style="stroke:#B45309;stroke-width:0.5;"/><path d="M1048,1406 L1048,1412 A4,4 0 0 0 1052,1416 L1058,1416 L1048,1406" fill="#FFF7D6" style="stroke:#B45309;stroke-width:0.5;"/><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="101.165" x="730" y="1421.7803">shared diagram:</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="307.3916" x="730" y="1435.7803">shared/diagrams/shared-resolution-sequence.svg</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="143.1992" x="730" y="1449.7803">shared delete diagram:</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="284.833" x="730" y="1463.7803">shared/diagrams/shared-delete-sequence.svg</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="280.9297" x="730" y="1477.7803">Start from the shared resolution sequence for</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="260.7295" x="730" y="1491.7803">OCID binding, datasource pagination, and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="163.4268" x="730" y="1505.7803">create-or-update dispatch.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="301.1982" x="730" y="1519.7803">Layer the shared delete sequence when finalizer</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="269.2471" x="730" y="1533.7803">retention, delete confirmation, work-request</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="199.2334" x="730" y="1547.7803">polling, or Secret cleanup apply.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="281.709" x="730" y="1561.7803">archetype batch: Generated service-manager</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="266.1504" x="730" y="1575.7803">controllers follow the shared resolution and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="259.9297" x="730" y="1589.7803">delete sequences with imported waits and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="134.6064" x="730" y="1603.7803">controller-local policy.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="122.9512" x="730" y="1617.7803">service: autoscaling</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="184.4541" x="730" y="1631.7803">slug: autoscalingconfiguration</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="191.4541" x="730" y="1645.7803">kind: AutoScalingConfiguration</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="241.2402" x="730" y="1659.7803">archetype: generated-service-manager</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="156.4063" x="730" y="1673.7803">status/finalizer: required /</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="174.3027" x="730" y="1687.7803">retain-until-confirmed-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="128.4131" x="730" y="1701.7803">requeue: terminating</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="263.0674" x="730" y="1715.7803">provider states: create none; update none;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="73.1787" x="730" y="1729.7803">delete none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="209.6992" x="730" y="1743.7803">follow-up: create=read-after-write;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="288.7158" x="730" y="1757.7803">update=read-after-write; delete=confirm-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="313.6328" x="730" y="1771.7803">supported drift: coolDownInSeconds, definedTags,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="236.9131" x="730" y="1785.7803">displayName, freeformTags (+1 more)</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="230.3301" x="730" y="1799.7803">reject before mutate: force-new fields</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="210.0889" x="730" y="1813.7803">compartmentId, policies, resource</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="144.751" x="730" y="1827.7803">create-only fields: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="66.1445" x="730" y="1841.7803">list lookup:</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="277.8604" x="730" y="1855.7803">oci_autoscaling_auto_scaling_configurations</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="306.585" x="730" y="1869.7803">filters compartmentId, displayName; exact unique</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="249.7715" x="730" y="1883.7803">compartmentId plus displayName match</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="730" y="1897.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="730" y="1911.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="281.6816" x="730" y="1925.7803">The OCI SDK response has no lifecycle-state</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="265.3711" x="730" y="1939.7803">field or work-request handle, so create and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="266.1846" x="730" y="1953.7803">update are synchronous and settle through</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="98.8066" x="730" y="1967.7803">read-after-write.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="280.9229" x="730" y="1981.7803">Pre-create reuse is limited to an exact unique</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="253.6611" x="730" y="1995.7803">compartmentId plus displayName match.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="298.8672" x="730" y="2009.7803">Cooldown, display name, enabled state, and tag</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="299.626" x="730" y="2023.7803">maps reconcile in place. Every non-noop update</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="304.2949" x="730" y="2037.7803">also carries the desired isEnabled value because</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="275.4746" x="730" y="2051.7803">the live Autoscaling API rejects an otherwise</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="279.3848" x="730" y="2065.7803">valid partial update when that field is omitted.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="312.0332" x="730" y="2079.7803">Compartment movement uses a separate provider</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="304.2949" x="730" y="2093.7803">action that the published OSOK runtime does not</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="283.2607" x="730" y="2107.7803">invoke, and resource/policy definitions remain</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="111.2754" x="730" y="2121.7803">replacement-only.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="186.7715" x="730" y="2135.7803">Delete keeps the finalizer until</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="297.2813" x="730" y="2149.7803">GetAutoScalingConfiguration returns NotFound.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="243.5645" x="730" y="2163.7803">The runtime has no Secret side effects.</text><?plantuml-src hLXhZzis5ltENq5qlwJOaIVJ96tg80kacJw2f4qHTxyDKD3IbSqTcTIIb1rdiV-zvvAKB7diwVI1O1199E_pt7ClxM-rQPLJ6-dNgh8xRLQoLeqduOULfIflLyvsfdfj6-laF-eI_whHZefgrJNXEsl2Jsf3yWTgjXHqgKxlMUXF9A-UZXQLStQNfJ-khxxwOdpIs43VtB6Xhh-glZpUPLr5BkzOFdtsvF7NHpjOVLv_ykJfrRDde_KelhJEa9DNNugWGqDoGV_jo9Ga2wcwO7sf6iJeyXMU5-dvjJMrNdLE1MsDMEkAP6rjMDgF8zc-5_C_8QKgWtKJMxFF_TAni_G5FQyVOnd245RTAXDEdnzlU8YKKJm66OskwPqsqsX-_LGzMJx7Aeji9qlbidf6LyFIdKmzhrLTYl-Bw9jysoq98GxanSWEYIW6Pvk6tEJpDyhJ1ogjAVNnqcVl5-_VBiXjTKa_AgDMv3wJoilffycHzw_V24Q1j5laU2hxukWSwi5H9HrvstISsdd-T5bfjK9E_MLwBmvRYZxDCxzTzH8gQk3jsTDfUNgIJ1NHAWx1aiM_HZ6QIpBOtv4y1yGRuthNnE4SIvcwFPV3yoF7DlZmkPXkuKFJuCpb81pkUGq_RipPaeYmaE-ilSL_2gujjQc4Qe8C3c11Y00B-jWsI5FCaKGD6PJVNgh6aQhsMDK-U36rWkt2xhdydi9PvGGk6_GCShMN6-qzTf-J-GuApmdrZshT179-VcDAks64RI3uJNKXA-tRHksP1J-FBZhgl5eYJkmN8wLpO07eHtx14oYJSnQyXkk1xdVijFI_8Medp3e1dHOnW8fK95i4U98yRQGFAdG-YkDW9ApBZ3EgCZIku-TpTgRLiwQUELNo9hVfLMwrkZ7tU0m8tfXxSnuTA1jI1XO3iBKssFK9AXrK832Sr6LZ6MWFYPsZe12XR1y7Yc9nuBlRf-pcDOOO7gALIm_93rMGp3eOgcg0zgxKc9xunqeRlUtDuJoXjZr4