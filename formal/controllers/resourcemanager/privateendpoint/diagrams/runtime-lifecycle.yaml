schemaVersion: 1
surface: repo-authored-semantics
service: resourcemanager
slug: privateendpoint
kind: PrivateEndpoint
archetype: generated-service-manager
states:
  - provisioning
  - active
  - updating
  - terminating
repoAuthored:
  providerLifecycle:
    createPending: ["CREATING"]
    updatePending: []
    deletePending: ["DELETING"]
  listLookup:
    filters: ["compartmentId","displayName","privateEndpointId","vcnId"]
    matchRule: exact resource identity match; duplicate matches fail
  mutation:
    mutable: ["compartmentId","definedTags","description","displayName","dnsZones","freeformTags","isUsedWithConfigurationSourceProvider","nsgIdList","securityAttributes","subnetId","vcnId"]
    forceNew: []
  followUp:
    create: read-after-write
    update: read-after-write
    delete: confirm-delete
notes:
  - "The PrivateEndpoint runtime retains package-local lifecycle, identity, mutation, and delete handling."
  - "The credential-free evidence mock verifies the recorded create/update payloads, SDK response decoding, status projection, and delete confirmation."
