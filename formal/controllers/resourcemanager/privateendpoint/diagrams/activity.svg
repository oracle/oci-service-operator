ngth="208.5303" x="838.9153" y="1445.2803">Apply explicit follow-up semantics</text><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="145.8926" x="838.9153" y="1459.2803">create=read-after-write;</text><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="288.7158" x="838.9153" y="1473.2803">update=read-after-write; delete=confirm-delete</text><rect fill="#F8FAFC" height="34" rx="8" ry="8" style="stroke:#0F172A;stroke-width:0.5;" width="303.2197" x="831.6633" y="1506.5"/><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="283.2197" x="841.6633" y="1527.2803">Return success for the ACTIVE success state</text><rect fill="#F8FAFC" height="48" rx="8" ry="8" style="stroke:#0F172A;stroke-width:0.5;" width="279.1299" x="843.7083" y="1560.5"/><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="259.1299" x="853.7083" y="1581.2803">Project required status and finalizer policy</text><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="174.3027" x="853.7083" y="1595.2803">retain-until-confirmed-delete</text><rect fill="#F8FAFC" height="34" rx="8" ry="8" style="stroke:#0F172A;stroke-width:0.5;" width="313.4189" x="826.5637" y="1628.5"/><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="293.4189" x="836.5637" y="1649.2803">Requeue on provisioning, updating, terminating</text><path d="M692.5087,1684.5 L692.5087,1965.5 L672.5087,1969.5 L692.5087,1973.5 L692.5087,2254.5 A0,0 0 0 0 692.5087,2254.5 L1017.7694,2254.5 A0,0 0 0 0 1017.7694,2254.5 L1017.7694,1694.5 L1007.7694,1684.5 L692.5087,1684.5 A0,0 0 0 0 692.5087,1684.5" fill="#FFF7D6" style="stroke:#B45309;stroke-width:0.5;"/><path d="M1007.7694,1684.5 L1007.7694,1694.5 L1017.7694,1694.5 L1007.7694,1684.5" fill="#FFF7D6" style="stroke:#B45309;stroke-width:0.5;"/><text fill="#334