ngthAdjust="spacing" textLength="283.2129" x="2207.78" y="476.7803">real OCI SDK through the full CRUD lifecycle.</text></g><g class="entity" data-qualified-name="GMN5" data-source-line="88" id="ent0006"><path d="M2889.27,551 L2889.27,559.22 L2429.26,542.29 L2889.27,567.22 L2889.27,587 A8,8 0 0 0 2897.27,595 L3136.4966,595 A8,8 0 0 0 3144.4966,587 L3144.4966,553 L3134.4966,543 L2897.27,543 A8,8 0 0 0 2889.27,551" fill="#FFF7D6" style="stroke:#B45309;stroke-width:0.5;"/><path d="M3134.4966,543 L3134.4966,549 A4,4 0 0 0 3138.4966,553 L3144.4966,553 L3134.4966,543" fill="#FFF7D6" style="stroke:#B45309;stroke-width:0.5;"/><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="136.9717" x="2895.27" y="558.7803">delete policy: required</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="234.2266" x="2895.27" y="572.7803">delete observe: GetStack or ListStack</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="157.1855" x="2895.27" y="586.7803">delete targets: DELETED</text></g><!--link *start* to observe--><g class="link" data-entity-1="ent0002" data-entity-2="ent0002" data-link-type="dependency" data-source-line="32" id="lnk3"><path d="M26.29,454 C48.57,454 101.45,454 158.56,454" fill="none" id="*start*-to-observe" style="stroke:#0F172A;stroke-width:1;"/><polygon fill="#0F172A" points="164.56,454,155.56,450,159.56,454,155.56,458,164.56,454" style="stroke:#0F172A;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="77.0342" x="57" y="449.7803">CreateStack</text></g><!--link observe to resolve_by_lookup--><g class="link" data-entity-1="ent0002" data-entity-2="ent0007" data-link-type="dependency" data-source-line="33" id="lnk4"><path d="M429.64,438.05 C520.55,427.01 631.3337,413.5731 701.1837,405.0931" fill="none" id="observe-to-resolve_by_lookup" style="stroke:#0F172A;stroke-wid