schemaVersion: 1
surface: repo-authored-semantics
service: resourcemanager
slug: configurationsourceprovider
kind: ConfigurationSourceProvider
archetype: generated-service-manager
states:
- provisioning
- active
- updating
- terminating
repoAuthored:
  operations:
    create:
    - CreateConfigurationSourceProvider
    update:
    - UpdateConfigurationSourceProvider
    delete:
    - DeleteConfigurationSourceProvider
  providerLifecycle:
    createPending:
    - CREATING
    updatePending:
    - UPDATING
    deletePending:
    - DELETING
  listLookup:
    filters:
    - opc-request-id
    - compartmentId
    - configurationSourceProviderId
    - displayName
    - configSourceProviderType
    matchRule: exact declared filters match within the resource scope; duplicate matches
      fail
  mutation:
    mutable:
    - displayName
    - description
    - privateServerConfigDetails
    - freeformTags
    - definedTags
    - apiEndpoint
    - username
    - secretId
    forceNew:
    - jsonData
    - compartmentId
    - configSourceProviderType
    - accessToken
  hooks:
    create:
    - helper: tfresource.CreateResource
    update:
    - helper: tfresource.UpdateResource
    delete:
    - helper: tfresource.DeleteResource
  followUp:
    create: read-after-write
    update: read-after-write
    delete: confirm-delete
notes:
- The generated service manager uses the reviewed CRUD request, response, lifecycle,
  and status projection contract.
- CRUD responses use lifecycle/read-after-write convergence without a work-request
  tracker.
- Secret side effects are none and finalizer ownership is retained until confirmed
  deletion.
