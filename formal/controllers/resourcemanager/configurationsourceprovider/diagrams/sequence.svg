 font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="192.165" x="823" y="2101.7803">UPDATING; delete DELETING</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="209.6992" x="823" y="2115.7803">follow-up: create=read-after-write;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="288.7158" x="823" y="2129.7803">update=read-after-write; delete=confirm-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="257.5713" x="823" y="2143.7803">supported drift: displayName, description,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="282.0576" x="823" y="2157.7803">privateServerConfigDetails, freeformTags (+4</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="36.5586" x="823" y="2171.7803">more)</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="293.3643" x="823" y="2185.7803">reject before mutate: force-new fields jsonData,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="270.0127" x="823" y="2199.7803">compartmentId, configSourceProviderType,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="82.4824" x="823" y="2213.7803">accessToken</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="144.751" x="823" y="2227.7803">create-only fields: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="275.4746" x="823" y="2241.7803">list lookup: unavailable filters opc-request-id,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="293.3711" x="823" y="2255.7803">compartmentId, configurationSourceProviderId,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="282.0576" x="823" y="2269.7803">displayName (+1 more); exact declared filters</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="264.585" x="823" y="2283.7803">match within the resource scope; duplicate</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="74.6963" x="823" y="2297.7803">matches fail</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="823" y="2311.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="823" y="2325.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="315.1777" x="823" y="2339.7803">The generated service manager uses the reviewed</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="286.3506" x="823" y="2353.7803">CRUD request, response, lifecycle, and status</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="118.2822" x="823" y="2367.7803">projection contract.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="287.875" x="823" y="2381.7803">CRUD responses use lifecycle/read-after-write</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="275.4609" x="823" y="2395.7803">convergence without a work-request tracker.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="253.7021" x="823" y="2409.7803">Secret side effects are none and finalizer</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="284.0469" x="823" y="2423.7803">ownership is retained until confirmed deletion.</text><?plantuml-src hLZRRXit47tdLmpIbmJLsd7Yt6IaG6gdQH0t2MpdJI_KBbTYJP5RaYj5BVhldU5bjIjBYf4K1gpLafphcJD3kLkf6sxv0joSLsObzGnghfnWhbkPyl9sPashgtEZZ8MVwXB_gjwEIjIyLVute_r7lX3mkr1BuMN9T--vbdyBE3djBN9hpIf9VroVl7ZIFwcD5x_UiQ6kNrJFjtSPMmcRTanFdprz_6fh1wbFwq-VdfuyUzPR3-9BOxMmSFASUUcLW6lnLojqAQ00AvnfRIaMNFEPiCVdHjTorbhkfT7NOUcpDKk99h0v_eVQ63yrNtigN9Rs3mFWfJTsO79oFIzj-ooUY9VrOrn6OHXTsN3jTv_lRxYFb5vOEXbArk9Iwc5GNvtofzENk4eYcy5IEQsUYPDkwKx2NjQyBjc_BFW67zgfm4XxuLZF3i2OUckKmX3sN__AdRWIfT6bt5vwyEdwquThOPUo57_4p3m0xc3uQd3aq_bxHc00iyHK3sMFjivXMLXHXTohbX8zJg-EAybdc5Dt7ByNcor5JlEHMywoX4eez7RlwRWyF2bq5K3BDi62ufTUZCOWDEvl1Hp0uaJRx1tR72L1Gy_7q3q_j6I6yu_OS0iT6iPd39rmzD19T6MY3nL600TS6dEB7nmTd4fTCQuyU8kGmK0XECJNHc6oGgO0ZscinJLmPGMlrhWgdNTiQ0YPXhl7y4xuG_e5SbkdgXCj7IoaSyX--yHUeiu3Sjt3MYgFd-E9DarPf00MiXf1QHQ4lWNgUb-D9hhSBoQiLz8rYgy3apxy-GGMnef7ZqACh6WTdsAiAJ2PZyXwX0dI3LRRFllFCNPU78gCCgQ1Cco31g57hU3ywksRc_SVttrliD6U4F3TTly_2TtXymviDvWRr18BUOcv7q1BQd2U-zO5SHJfM8-GyYYg1DoBy7gVgN7raBLx3WP8s4NMkfHyeW_xZMKoqTy2PSnf4ffpUl7sykttv_H-UdCKIoMunh1XJTTISuMDts9CyQqBi9qgGuLudmHQuJccAJb3sHA1F_2zNKUKfJMgDtn0iy1C7Kg-hu9eriPGNcD5tvKQOPsXJJYArg0_mHW2-lqKHkvUpMLN6GlqqI4SaKHJwOtWo-UBzDIbBcXMSfa3GQAGUnqQBrHLy1Ns52GIAsiFOibL6xAKCHnUpp5uYWXlqmc7De-eJLwtJMCiuX_QfY9DhhKrByKOUYmrOaZzfPKDAHb1O-KIjv8q6Wu89XUKFEL6hBP2rCOkRlZC8RcTHd9ZL-9FKNgOqfg0HKjEZP7G45I55glebcD_EgClkEVRdCeYfGvHUBDkn0WdgL8uTsDkXMQfwsIcXYsYPZk5xkDfjfEciuu5z-KSeuiT-YiEF0YYKeKn82bdOGEifCTTuETYmugkD8quOrLBFP127hPIRZ64cvd0DBuN82mmCXTFUAhnc7a4P8NGBVrz2w2V1C9ZI4H6F2bq7HneYGZzsveIhRnf6hMUw2y1HWV75QFLcbphTCJi3n27uEv1Rg8FO6wYzu0ka6E2TIR7N6i_ql3sDs7RQfWBXRq8veWJXxD0wBUlVPtJVnGRzLNwUZRHqSB-bXZ3tfP8KVqjiHFbBVliuPGJ3BLIPbKWQXqEHbxCrfrTr9-BG8F5oahVCsV7Ih8YzR8qqTwtFyVs-peH6Or17G-_ZjHVjDYhLP74ToDpKB0zfcvDoPbfiICqb2g7cSDiZsBswMcYqPC5QlGT9LevctimDUo-4QG1_iUk0z-KikjQSEsHfA2sPX68uyuDPNFBHD0pJFH56BA3m-WkJppJy5dmboWRUm6BAI-CBL9DKBqHzHonIxx6gFQKvIwS5QtcGcyQ9yE4qM15ahlk6RAMrAsClStConfCKh3DK0T2ApPZGy3d4UCM-SyZdSEKxA4gn3iw9nfoCJT5kfCJPwUikuJhFJ4YZxUyS86EGIuInQsuz2w6ff