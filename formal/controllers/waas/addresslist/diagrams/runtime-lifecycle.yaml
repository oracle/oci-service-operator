schemaVersion: 1
surface: repo-authored-semantics
service: waas
slug: addresslist
kind: AddressList
archetype: generated-service-manager
states:
  - provisioning
  - active
  - updating
  - terminating
repoAuthored:
  providerLifecycle:
    createPending: ["S_CREATING"]
    updatePending: []
    deletePending: ["DELETING"]
  listLookup:
    filters: ["compartmentId","ids","names","states","timeCreatedGreaterThanOrEqualTo","timeCreatedLessThan"]
    matchRule: exact resource identity match; duplicate matches fail
  mutation:
    mutable: ["addresses","compartmentId","definedTags","displayName","freeformTags"]
    forceNew: []
  followUp:
    create: read-after-write
    update: read-after-write
    delete: confirm-delete
notes:
  - "The AddressList runtime retains package-local lifecycle, identity, mutation, and delete handling."
  - "The credential-free evidence mock verifies the recorded create/update payloads, SDK response decoding, status projection, and delete confirmation."
