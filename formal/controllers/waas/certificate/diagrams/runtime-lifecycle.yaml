schemaVersion: 1
surface: repo-authored-semantics
service: waas
slug: certificate
kind: Certificate
archetype: generated-service-manager
states:
  - provisioning
  - active
  - updating
  - terminating
repoAuthored:
  providerLifecycle:
    createPending: ["CREATING"]
    updatePending: []
    deletePending: ["DELETING"]
  listLookup:
    filters: ["compartmentId","displayNames","ids","states","timeCreatedGreaterThanOrEqualTo","timeCreatedLessThan"]
    matchRule: exact resource identity match; duplicate matches fail
  mutation:
    mutable: ["compartmentId","definedTags","displayName","freeformTags"]
    forceNew: ["certificateData","isTrustVerificationDisabled","privateKeyData"]
  followUp:
    create: read-after-write
    update: read-after-write
    delete: confirm-delete
notes:
  - "The Certificate runtime retains package-local lifecycle, identity, mutation, and delete handling."
  - "The credential-free evidence mock verifies the recorded create/update payloads, SDK response decoding, status projection, and delete confirmation."
