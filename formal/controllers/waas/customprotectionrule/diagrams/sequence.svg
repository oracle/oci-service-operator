elvetica" font-size="14" lengthAdjust="spacing" textLength="174.3027" x="783" y="1873.7803">retain-until-confirmed-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="272.3984" x="783" y="1887.7803">requeue: provisioning, updating, terminating</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="321.3848" x="783" y="1901.7803">provider states: create S_CREATING; update none;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="112.0479" x="783" y="1915.7803">delete DELETING</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="209.6992" x="783" y="1929.7803">follow-up: create=read-after-write;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="288.7158" x="783" y="1943.7803">update=read-after-write; delete=confirm-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="279.3711" x="783" y="1957.7803">supported drift: compartmentId, definedTags,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="221.3682" x="783" y="1971.7803">description, displayName (+2 more)</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="163.4336" x="783" y="1985.7803">reject before mutate: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="144.751" x="783" y="1999.7803">create-only fields: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="288.709" x="783" y="2013.7803">list lookup: oci_waas_custom_protection_rules</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="297.2197" x="783" y="2027.7803">filters compartmentId, displayNames, ids, states</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="254.8232" x="783" y="2041.7803">(+2 more); exact resource identity match;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="134.627" x="783" y="2055.7803">duplicate matches fail</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="783" y="2069.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="783" y="2083.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="264.5576" x="783" y="2097.7803">The CustomProtectionRule runtime retains</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="284.8193" x="783" y="2111.7803">package-local lifecycle, identity, mutation, and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="98.8613" x="783" y="2125.7803">delete handling.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="286.3574" x="783" y="2139.7803">The credential-free evidence mock verifies the</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="302.7432" x="783" y="2153.7803">recorded create/update payloads, SDK response</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="239.7227" x="783" y="2167.7803">decoding, status projection, and delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="80.1445" x="783" y="2181.7803">confirmation.</text><?plantuml-src fLXTRzis57tNho2sbnQpagPD-k6W0zgawufcxH1ts8k1W9Oecmr5QYHbrnlsttT8aVfmf3LRiOV58dbvxxddddjPSyjbHJKjYTdGNEsuN9E22iCIqwwiQ7QxrggM-OKIIfFlYmp_vRqTEIjeBUnFIjeFj6JaPoQspFACZk