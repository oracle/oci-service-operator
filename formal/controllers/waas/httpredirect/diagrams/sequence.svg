y="Helvetica" font-size="14" lengthAdjust="spacing" textLength="156.4063" x="781" y="1947.7803">status/finalizer: required /</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="174.3027" x="781" y="1961.7803">retain-until-confirmed-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="272.3984" x="781" y="1975.7803">requeue: provisioning, updating, terminating</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="265.3369" x="781" y="1989.7803">provider states: create CREATING; update</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="192.165" x="781" y="2003.7803">UPDATING; delete DELETING</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="209.6992" x="781" y="2017.7803">follow-up: create=read-after-write;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="288.7158" x="781" y="2031.7803">update=read-after-write; delete=confirm-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="225.668" x="781" y="2045.7803">supported drift: displayName, target,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="247.0508" x="781" y="2059.7803">responseCode, freeformTags (+1 more)</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="230.3301" x="781" y="2073.7803">reject before mutate: force-new fields</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="147.0684" x="781" y="2087.7803">compartmentId, domain</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="144.751" x="781" y="2101.7803">create-only fields: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="258.3438" x="781" y="2115.7803">list lookup: oci_waas_http_redirects filters</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="289.4609" x="781" y="2129.7803">compartmentId, domain; exact compartmentId,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="254.4609" x="781" y="2143.7803">domain match within the resource scope;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="134.627" x="781" y="2157.7803">duplicate matches fail</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="781" y="2171.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="781" y="2185.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="177.4268" x="781" y="2199.7803">The production runtime uses</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="307.3984" x="781" y="2213.7803">generatedruntime/workrequest async handling for</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="273.1641" x="781" y="2227.7803">create, update, delete work-request phases.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="286.3574" x="781" y="2241.7803">Lifecycle success states are ACTIVE; pending</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="288.7637" x="781" y="2255.7803">create, update, and delete states requeue until</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="244.3643" x="781" y="2269.7803">the corresponding follow-up converges.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="251.3506" x="781" y="2283.7803">Status projection is required, Secret side</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="260.7021" x="781" y="2297.7803">effects are none, and the finalizer policy is</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="178.1924" x="781" y="2311.7803">retain-until-confirmed-delete.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="278.5918" x="781" y="2325.7803">Delete policy required retains ownership until</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="206.9785" x="781" y="2339.7803">DELETED or confirmed absence.</text><?plantuml-src jLVRRXit47tdLmpQbmJLsd5YvoB31HBRJOouIM4xVH8GKBkp4kiLkIMvKjIY_zxXRRMhYwCqAF8GUJcSwvapGtClPCqrdu6Pya8jX9n0oIk3pBGdOvxVJxHgP76kAgNXnpAdVqL7ei2IDvNzHKdxWSyGtc4rHojolbtcLlo5S7JSEUHQgqNK_gGyUl6qUrCgYsysV2ZB5yNpTIcb2zHHOdnyykp9gpK9PpwUFtjsV7HoqZdtwdEb9MeuUiwii1N2BVxPeCmHCbXmRWxVMLlVO24qvfPDHO5GAcN7waj7aKbt_cO0FBTAznoB0QQZzSZmARuidz0nAQCSYffBk_r-Ls0VBPtWMnsLAF5Qo7xgNXtpP-ENTEfKrhsZV5oSu55xj56MboKlS_OFyx71-sQCb4-BXdNyW7DoHAkgGjtx_8ORlC5SoLoi7_tmyVRZ-rlKSv7Zhrpo2UeVW1leV-fT-NX-nLp9GSsfe7tTWxLx17wD1MWqgcgiK78OFnqMWa-efkOm_9sjHB9KvWCpdoGD1LOKxSxRuRX_4sNXeSbMoOBivqwEXe2Iv1lggmxuoDaO3Lk9kelzI8VG_dwadLbZ7xE-YBlKpyTmfPmYCi95rWE-BpvSAtLF_t4AO2namNXbmMg218bJyV5BNL4nV2M0EaLIHos1LnfviQHJOQnXVSFE5P8UmbkqFOD8bDJgRdK90pDX397MBZtNPAIho3mgHMLHc-58vchcy38ZPLV500eruq8-zb5eR0mVK_JETLVoHbCxapag53KyuNsNmNEApcBFzqgf6dB_7MggjkFOyvlBrtTN7zxk7JzPz3dOxjb_JEgMCBO0gAPqaThG7NFAVw-UGeAnt3R6gtF92o27Y3Oi8bek_ETTleNJddix9CcnKkXPCZCNV3smaIJqRLG-r27UIdMukBo-_8Owm5R5AV2yGYufKX8gXUGLZJbDQQ2lneDdN2c7ttrohj4I69EtBi7e-uo-wsL0GZnpAAOVH4YWneOqxsiWkBLob9VK5vjQ0_GI_5pfWpSKZtV6WN4_Wu735bFHejSrd244ZMJgXm5y-kqY_cfhuorNOfuIuLHHwWqvZrMHyGLnwqWMMfGMSCwhXdl7