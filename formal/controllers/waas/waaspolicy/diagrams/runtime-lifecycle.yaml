schemaVersion: 1
surface: repo-authored-semantics
service: waas
slug: waaspolicy
kind: WaasPolicy
archetype: generated-service-manager
states:
    - provisioning
    - active
    - updating
    - terminating
repoAuthored:
    operations:
        update:
            - UpdateWaasPolicy
    providerLifecycle:
        createPending:
            - CREATING
        updatePending:
            - UPDATING
        deletePending:
            - DELETING
    listLookup:
        filters:
            - compartmentId
            - domain
            - id
        matchRule: exact compartmentId, domain, id match within the resource scope; duplicate matches fail
    mutation:
        mutable:
            - compartmentId
            - displayName
            - additionalDomains
            - origins
            - originGroups
            - policyConfig
            - wafConfig
            - freeformTags
            - definedTags
        forceNew:
            - domain
    hooks:
        create:
            - helper: tfresource.CreateResource
              entityType: WaasPolicy
              action: CreateWaasPolicy
            - helper: tfresource.WaitForWorkRequestWithErrorHandling
              entityType: WorkRequest
              action: GetWorkRequest
        update:
            - helper: tfresource.UpdateResource
              entityType: WaasPolicy
              action: UpdateWaasPolicy
            - helper: ChangeWaasPolicyCompartment
            - helper: tfresource.WaitForWorkRequestWithErrorHandling
              entityType: WorkRequest
              action: GetWorkRequest
        delete:
            - helper: tfresource.DeleteResource
              entityType: WaasPolicy
              action: DeleteWaasPolicy
    followUp:
        create: workrequest
        update: workrequest
        delete: confirm-delete
notes:
    - The production runtime uses generatedruntime/workrequest async handling for create, update, delete work-request phases.
    - Lifecycle success states are ACTIVE; pending create, update, and delete states requeue until the corresponding follow-up converges.
    - Status projection is required, Secret side effects are none, and the finalizer policy is retain-until-confirmed-delete.
    - Delete policy required retains ownership until DELETED or confirmed absence.
