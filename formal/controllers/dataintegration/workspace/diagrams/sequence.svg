9.7646" x="773" y="2155.7803">scope; duplicate matches fail</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="773" y="2169.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="773" y="2183.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="315.1777" x="773" y="2197.7803">The generated service manager uses the reviewed</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="286.3506" x="773" y="2211.7803">CRUD request, response, lifecycle, and status</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="118.2822" x="773" y="2225.7803">projection contract.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="301.1641" x="773" y="2239.7803">Work-request phases are declared per operation</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="261.4678" x="773" y="2253.7803">from the vendored SDK response surface.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="253.7021" x="773" y="2267.7803">Secret side effects are none and finalizer</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="284.0469" x="773" y="2281.7803">ownership is retained until confirmed deletion.</text><?plantuml-src lLXjRnGt4FxkNp6YNuAuJGWa42wY4YIKHgGW9K58LIJas_NUkTcpjxRtZclL_zuPl-pBlPHJArLyu7OzdjTddfcDVP2gveRFmSvuePTIJQ7abHNCjYSJdZzCZMvKSQ4hRU27CiT_HK-Y42LlAlUJLkuZdmluMLGBuMJEjylSoZy479_q3hanUXcrFosFNpxhtrJQYRSRFfJbo-B5kfGsXJ1HOd9o-lpfgpK9CX_Fdpy_EJuzxPrxzRasIXWuVi6ST9M0M_5x8rGk88E2EowL4rF3dTJgw8is3xRckM0pMGWejNOJ_QsdqAQxVp80dZjj1Wx6GDFHUeJYcJWhd-8nAiDSofehj_r-Ns0VBRqaj3egMOfhgOOfV7N2dq_Ey9HKreEZV5ASYkFsQA