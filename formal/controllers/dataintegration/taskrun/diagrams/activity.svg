="14" lengthAdjust="spacing" textLength="255.2539" x="704.4739" y="2301.7803">exposed by the scoped OCI list response</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="704.4739" y="2315.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="704.4739" y="2329.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="299.585" x="704.4739" y="2343.7803">The runtime projects the vendored SDK lifecycle</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="280.875" x="704.4739" y="2357.7803">states and treats SUCCESS, SUCCESSFUL,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="182.834" x="704.4739" y="2371.7803">TERMINATED as converged.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="293.3643" x="704.4739" y="2385.7803">Parent identifiers scope composite OCI request</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="319.8398" x="704.4739" y="2399.7803">paths and remain replacement-only unless the SDK</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="231.9092" x="704.4739" y="2413.7803">update details explicitly expose them.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="277.0605" x="704.4739" y="2427.7803">Create, get, list where available, update, and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="267.7227" x="704.4739" y="2441.7803">delete request shapes are exercised by the</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="290.2539" x="704.4739" y="2455.7803"