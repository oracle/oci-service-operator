engthAdjust="spacing" textLength="108.9512" x="394.3516" y="835.7803">release succeeds</text><polygon fill="#E2E8F0" points="339.7441,855,351.7441,867,339.7441,879,327.7441,867,339.7441,855" style="stroke:#1D4ED8;stroke-width:0.5;"/><ellipse cx="339.7441" cy="936.5" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="339.7441" cy="936.5" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><rect fill="none" height="427.5" rx="8" ry="8" style="stroke:#000000;stroke-width:1.5;" width="345.916" x="815.7153" y="559"/><path d="M966.5493,559 L966.5493,566 L956.5493,576 L815.7153,576" fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="140.834" x="818.7153" y="570.7803">Lifecycle Classification</text><rect fill="#F8FAFC" height="48" rx="8" ry="8" style="stroke:#0F172A;stroke-width:0.5;" width="280.5928" x="842.377" y="642"/><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="240.4541" x="852.377" y="662.7803">Request requeue while OCI remains in</text><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="260.5928" x="852.377" y="676.7803">PROVISIONING, UPDATING, DELETING</text><ellipse cx="982.6733" cy="736" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="982.6733" cy="736" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#E2E8F0" points="896.3901,593,1068.9565,593,1080.9565,605,1068.9565,617,896.3901,617,884.3901,605,896.3901,593" style="stroke:#1D4ED8;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="21.7861" x="986.6733" y="627.7803">yes</text><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="172.5664" x="896.3901" y="608.7803">"OCI state in retryable set?"</text><rect fill