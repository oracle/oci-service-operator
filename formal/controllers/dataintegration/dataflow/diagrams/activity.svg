<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="2435px" preserveAspectRatio="none" style="width:1240px;height:2435px;background:#FCFCFD;" version="1.1" viewBox="0 0 1240 2435" width="1240px" zoomAndPan="magnify"><title>Activity - dataintegration/DataFlow</title><defs/><g><rect fill="#FCFCFD" height="2435" style="stroke:none;stroke-width:1;" width="1240" x="0" y="0"/><g class="title" data-source-line="10"><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="230.248" x="503.7466" y="30.7803">Activity - dataintegration/DataFlow</text></g><ellipse cx="661.2087" cy="55" fill="#1D4ED8" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="none" height="430" rx="8" ry="8" style="stroke:#000000;stroke-width:1.5;" width="667.2256" x="325.458" y="75"/><path d="M447.5264,75 L447.5264,82 L437.5264,92 L325.458,92" fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="112.0684" x="328.458" y="86.7803">Observe and Bind</text><rect fill="#F8FAFC" height="48" rx="8" ry="8" style="stroke:#0F172A;stroke-width:0.5;" width="304.7852" x="508.8162" y="109"/><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="136.9375" x="518.8162" y="129.7803">Start from shared flow</text><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="284.7852" x="518.8162" y="143.7803">shared/diagrams/shared-reconcile-activity.svg</text><rect fill="#F8FAFC" height="48" rx="8" ry="8" style="stroke:#0F172A;stroke-width:0.5;" width="298.5781" x="511.9197" y="177"/><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="278.5781" x="521.9197" y="197.7803">Read desired DataFlow spec, tracked status,</text><text f