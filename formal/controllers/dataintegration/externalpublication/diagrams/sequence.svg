st="spacing" textLength="288.7158" x="785" y="2100.7803">update=read-after-write; delete=confirm-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="264.585" x="785" y="2114.7803">supported drift: applicationCompartmentId,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="267.3125" x="785" y="2128.7803">displayName, applicationId, description (+2</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="36.5586" x="785" y="2142.7803">more)</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="230.3301" x="785" y="2156.7803">reject before mutate: force-new fields</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="136.1719" x="785" y="2170.7803">workspaceId, taskKey</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="144.751" x="785" y="2184.7803">create-only fields: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="66.1445" x="785" y="2198.7803">list lookup:</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="273.1914" x="785" y="2212.7803">scaffold_dataintegration_externalpublication</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="266.9092" x="785" y="2226.7803">filters displayName; exact unique match on</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="291.8262" x="785" y="2240.7803">fields exposed by the scoped OCI list response</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="785" y="2254.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="785" y="2268.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="299.585" x="785" y="2282.7803">The runtime projects the vendored SDK lifecycle</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="280.875" x="785" y="2296.7803">states and treats SUCCESS, SUCCESSFUL,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="182.834" x="785" y="2310.7803">TERMINATED as converged.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="293.3643" x="785" y="2324.7803">Parent identifiers scope composite OCI request</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="319.8398" x="785" y="2338.7803">paths and remain replacement-only unless the SDK</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="231.9092" x="785" y="2352.7803">update details explicitly expose them.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="277.0605" x="785" y="2366.7803">Create, get, list where available, update, and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="267.7227" x="785" y="2380.7803">delete request shapes are exercised by the</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="290.2539" x="785" y="2394.7803">package-local typed OCI mock integration test.</text><?plantuml-src fLXRRziu5dxdho1cNpeOAsdQTARZ80kqYQSDcacoTeA-62XeYRAvaKWjITdnBlQ_xyUBPCcLsymMUOZDoxb-vpk7Dez2LaopafeLozH6o2NDMM4uCUtEWgMFIwrgcLseGcdwjpp5NzOvaV6SrONzGqbxmqfEF_9YpQr8sV2PcVWtfoUddKscjTf4wI_pazzUTMzAPVdxhsp8yz-oN_TFAPrn7KyiJj-yVldxtWcdFkw_VdrwykPDPz-BJvMMNDEJNuaLjk1qnlzLSvbocj2CMIQavKlDh53oUF9akPQikAiN1NnrQsGbCavpfUn2FNL4cqRAVmYbBBLAzqoDBZTR-xxoL_nj