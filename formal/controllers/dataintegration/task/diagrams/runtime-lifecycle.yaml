schemaVersion: 1
surface: repo-authored-semantics
service: dataintegration
slug: task
kind: Task
archetype: generated-service-manager
states:
  - active
  - terminating
repoAuthored:
  listLookup:
    filters:
      - "name"
    matchRule: exact unique match on fields exposed by the scoped OCI list response
  mutation:
    mutable:
      - "jsonData"
      - "key"
      - "modelVersion"
      - "parentRef"
      - "description"
      - "objectStatus"
      - "inputPorts"
      - "outputPorts"
      - "parameters"
      - "opConfigValues"
      - "configProviderDelegate"
      - "isConcurrentAllowed"
      - "name"
      - "identifier"
      - "registryMetadata"
      - "dataFlow"
      - "conditionalCompositeFieldMap"
      - "isSingleLoad"
      - "parallelLoadLimit"
      - "pipeline"
      - "dataflowApplication"
      - "driverShapeDetails"
      - "executorShapeDetails"
      - "script"
      - "operation"
      - "sqlScriptType"
      - "authDetails"
      - "authConfig"
      - "endpoint"
      - "headers"
      - "cancelEndpoint"
      - "executeRestCallConfig"
      - "cancelRestCallConfig"
      - "pollRestCallConfig"
      - "typedExpressions"
      - "methodType"
      - "apiCallMode"
      - "cancelMethodType"
      - "objectVersion"
      - "additionalProperties"
    forceNew:
      - "modelType"
      - "workspaceId"
  followUp:
    create: "read-after-write"
    update: "read-after-write"
    delete: "confirm-delete"
notes:
  - "The vendored SDK response has no lifecycle state or required work-request flow; successful writes settle from the response and configured follow-up."
  - "Parent identifiers scope composite OCI request paths and remain replacement-only unless the SDK update details explicitly expose them."
  - "Create, get, list where available, update, and delete request shapes are exercised by the package-local typed OCI mock integration test."
