tLength="257.5918" x="750" y="2115.7803">those requests and preserves the tracked</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="242.0127" x="750" y="2129.7803">resource identity before rereading OCI.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="293.3643" x="750" y="2143.7803">Parent identifiers scope composite OCI request</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="319.8398" x="750" y="2157.7803">paths and remain replacement-only unless the SDK</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="231.9092" x="750" y="2171.7803">update details explicitly expose them.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="277.0605" x="750" y="2185.7803">Create, get, list where available, update, and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="267.7227" x="750" y="2199.7803">delete request shapes are exercised by the</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="290.2539" x="750" y="2213.7803">package-local typed OCI mock integration test.</text><?plantuml-src hLTTRnj557sVNp625v3ifA4j55T1Aac0gA69aa9V8g7nxbrxo7XccPcrQn3_dJDVwxLhjq6WgeftvyxzFFVSk-v1wbPOiU1kBcgpadh66w4SCTUVJ4NrCBEcq_MPKSRopviA_-g1H4sDw9J_mMZ_HYo8_qHgILvMOh_CdVoJ-CcpmQ6mrgoozYVDoJTV3Mzgu-dx3tnecc_ghtUbZAt9Pedfi-TFdtox8n7Cv_EdJv-TF7y-E8_gAsCrMNxoDVFIA-9tz4T7kY8-vbDbgeTgBgG-lY6oR2vhueqnVchU3zIuSkClnhcelB5RRkNmoj5kNFGLlMYUu1ZAa47P2ktttnyAF4RB8FHUXv8DNKczdRXlducdqnSu3IhRhQDgMZ-da_xeWwAyQ4HJiRzPZ8s_xgQ4R7foRE07FuCZrYY550vVVoyStL9bT2LtZpwxlhj-VKTsAIlwMMWn8_iP5uvllzgwSdrsoKB1kLcYdDkwHplt07rBDRVaZEgyD7gINntNKinGKtUSdiSRaN4fyv5Rpeg6cXIYFNWx7M_V95r7OB9DilZukq6E9fmqv3lY0NHmCaV1DYBXmdQ44zx__i86Syv_oRP5mgNjF4msoX69ao6Y2FHOR7vbp0F-23WybRfcGddkBI00CHIRth