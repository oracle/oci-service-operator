Length="242.0127" x="746" y="2115.7803">resource identity before rereading OCI.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="293.3643" x="746" y="2129.7803">Parent identifiers scope composite OCI request</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="319.8398" x="746" y="2143.7803">paths and remain replacement-only unless the SDK</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="231.9092" x="746" y="2157.7803">update details explicitly expose them.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="277.0605" x="746" y="2171.7803">Create, get, list where available, update, and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="267.7227" x="746" y="2185.7803">delete request shapes are exercised by the</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="290.2539" x="746" y="2199.7803">package-local typed OCI mock integration test.</text><?plantuml-src fLTTRnit5dtdho2wBoqWsN6JjAa2Bv3QRcl46mTskdanK50pToJM779ASgIeY_tlU_Wr6YbIuqNX1sk6b_Vpt7Flk4UfEs55ozrIr6OjzO8tGZbYRZYPY-fnOKslwmkZZEN_Q2hyrIE9cXhHA_-JqVwTQ8d_Gcf5NbRYiCoz_9FusOlHeR3MhBFsPytPzz-ERshZwSVFV6YQx-llzgMChSbcYVcBby-V_R0d4Spdy-VFNvozV3awZ-ehOpLPVlOTyz8hulVqHq-w8ZxbSsMgnseff3wzTPejPKsyCSRFpQUH5bSk_8TnBYflx8vNERfoj1yMVKklccSuXZ8aK7P2-yFtnm9FqJAAVD2XP4CtKk_cxOSNuldy5Kw3ocxdg9hNB-biEFgi9gyQqLJilop6nj_sSq8oFJasyeDVm15hb2Axy_f7uUYEAgChkN_qrUtzxTjxiYjPqR-45WkoNt7X-EwhdIkt5zSir9kR5QgvgtkoTm_8jrHpIywetakZP_dLQIt50ZLrf-bvkXMPbZAVkDMYQAX98TgZjzFnxatITSGbsoQBJ_yvoj6CauPyJnoOWuyv2BQL2FAx0SxuyFjh6wmv_mtR5GcNTjCmsof784w6W0BCOwdvZJ6F-2VWxbpgcWdbkRS00AHGQlhKAQG-vfsZBpIQPyE5iYJg3KwbyuxjsWiUG7h6VoOVx118Pr0vg92Ejz8vqDAnwpVGZVjVDr9vicx6HVrDTCzIxyGSqGIVGkLwYww4GkGRVGlO7bDv0RSz1QUKCHsluYFlKAj0Z-_lRlzzVNzz--xwtSzVYWasObo7VVd_ydF0tmELx