EATING; update</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="192.165" x="812" y="2101.7803">UPDATING; delete DELETING</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="209.6992" x="812" y="2115.7803">follow-up: create=read-after-write;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="288.7158" x="812" y="2129.7803">update=read-after-write; delete=confirm-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="257.5713" x="812" y="2143.7803">supported drift: displayName, description,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="168.082" x="812" y="2157.7803">freeformTags, definedTags</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="230.3301" x="812" y="2171.7803">reject before mutate: force-new fields</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="293.3643" x="812" y="2185.7803">compartmentId, adwAdminPassword, subnetId,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="192.5684" x="812" y="2199.7803">isMutualTlsRequired (+2 more)</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="144.751" x="812" y="2213.7803">create-only fields: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="66.1445" x="812" y="2227.7803">list lookup:</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="333.8467" x="812" y="2241.7803">oci_resource_analytics_resource_analytics_instances</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="260.6543" x="812" y="2255.7803">filters compartmentId, displayName; exact</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="287.123" x="812" y="2269.7803">compartmentId, displayName match within the</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="238.123" x="812" y="2283.7803">resource scope; duplicate matches fail</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="812" y="2297.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="812" y="2311.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="258.3711" x="812" y="2325.7803">The production runtime uses the declared</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="279.3506" x="812" y="2339.7803">work-request phases and service-local async</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="51.3721" x="812" y="2353.7803">adapter.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="294.9229" x="812" y="2367.7803">Lifecycle success and pending states mirror the</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="244.3301" x="812" y="2381.7803">production service-manager semantics.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="251.3506" x="812" y="2395.7803">Status projection is required, Secret side</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="260.7021" x="812" y="2409.7803">effects are none, and the finalizer policy is</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="178.1924" x="812" y="2423.7803">retain-until-confirmed-delete.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="271.585" x="812" y="2437.7803">Delete ownership is retained until a terminal</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="226.4404" x="812" y="2451.7803">lifecycle state or confirmed absence.</text><?plantuml-src hLXRRnit5dxdho2wBmbMikDSsbI65qYTR1lKRGexVHDGK3CSYMkAd2KvKjIY_ts_mo57Cx96SRD57gBXvLo_yvr3-tjbQk74clkLAErMcIMlXFQI-Mvd8OhxfREDAQ-jjex_eohmh-oTA6Kb6Xt-RKtuMQmb_q7gZGog4CVFtAdV9RzusTiKpjbjalwiklZcUV-ciK5-zy26glgc_Fhmb7MbTEd4ukMh5y--FJX1wjF-YnSlBrwzwkr7yOLrHZf-yJKBAcZ9x-H_6saAoQVSIMyRLqXXXDx1Etz-crRUv9NtnWU1qsobIiahQyF2Vkgfy5dQ7unpKGJh1YOdr_FMeS_okNnTFSCsX46RgeK9n-_t3pn6IYyidGojAdcZp32etxuKBnQliKiYwy5MiIXVoOjkwq72NbUYAjYVBFh6VsmM4f4EqhEU7VmQXZYhjNI3vU-4bxUoiAPGXrjVVRZxyEETT1jLo9-GcgLqNt7X-N1fSEN3zNj6OE1sWrGFPKyExg4id2nZxdKJb3Mpj7HUAh54Jlrv-ptT7vdcD9_vpJ9BAAM6jwEts-tXJMdA25gs3nQV_giNencN1kSRoKUHE3Sk-yRs5qdCqEyPxtu_SMI43q_Py0XT6aPdnZlXyCyhE38tuqKHWS5lhBt7VmBEBPGfcT211mUu84W0XlnKQoGgPecZYWpgSCU5TbAKE-mg7pmRca66uVICVo_3k7O9LkiKTOALvslbFNXlJEWDD8vAzKygfODqVZOtXLqJojQG_BwSy5BvMeiT4UBJwAIJZHSBX8eyosH21Y37u0gKofW9rt0-o77NjBKrB-8XNWCrnEBNj-_UV7p_y_TV5YlO4kDrtEQ_8nj7l3q2oXgXXOws_ZP8t00Lod282usFuYZ6RHdnX61P9iozZSjZXhQxuxQEN8ELbNBhh7EZnDoSyXdedflJQ6epcGJcJBvzT_FkIpFv69qvTeL6QqEmK8ILmZ5qQOT8OjL7c2wqfTfvJDgS30B9IOvGZcGiUAoxNOkij4T5WnzWJMuN7f8Vgw0rQs-eg5263wMsKCvm9lIqri2VQ0o1-t4AMwBThbHN3Mluw072kSd5Dk6__l8s_UhI5ZLhjSc1856WIW_ZfIwdOei6C3UbKrNWSYDq8wBX2RbnUONWQUAeVTiQsZoXddRNrBLrG3rlwf8q-SPLef2pFXTD69YwSAec9HDUEIahwzOVnT9FQ4X3no_fWztA_yWYy0LjIxvkoFOPU0eWcXgvRQttx83rHBbzKwwL-KLulyLuC66-MQ1rqPxoFpMX4VgZzhTj34h-v9_F-HeAdhBK5pAVyg5WrdCX7rsBKAmG5RJ1JvWgJjneZ_Aj2ZZFmqfsNCPyOMjvoSk6sWu5BHwbx0YbzotOrg7dEqg4gXyt0bLecpj0gWJuYl1O2FVZIuYACSwO9OM-IoXj4Gr_NbCYXJTrhNTpysi4mWbwC7GA5dGQshGE40DmZaA6zlQOYVILm9VfArV4bpUYySRe6iDNKgDBy1KmuT64OnUy2bLEyDcmUSvDspkkJanCm18SlVfCrxsSczRJlh9XlF-2iiyawfBYJDJMLpRiMtz1sH