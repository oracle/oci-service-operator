elvetica" font-size="14" lengthAdjust="spacing" textLength="144.751" x="835" y="2115.7803">create-only fields: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="66.1445" x="835" y="2129.7803">list lookup:</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="316.7432" x="835" y="2143.7803">oci_capacity_management_occ_capacity_requests</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="254.4473" x="835" y="2157.7803">filters compartment_id, display_name, id,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="137.3408" x="835" y="2171.7803">namespace (+2 more)</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="835" y="2185.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="835" y="2199.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="207.7783" x="835" y="2213.7803">The runtime intentionally disables</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="279.3711" x="835" y="2227.7803">list-before-create because a capacity request</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="281.7158" x="835" y="2241.7803">cannot be safely reused from a broad search.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="272.3506" x="835" y="2255.7803">requestState supports the SUBMITTED and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="339.2881" x="835" y="2269.7803">CANCELLED update values exposed by the OCI SDK;</text><text fill="#334155" font-family="Helvetica" font-