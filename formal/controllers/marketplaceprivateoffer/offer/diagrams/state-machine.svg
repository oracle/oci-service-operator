nt-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="180.5303" x="2203.78" y="476.7803">match; duplicate matches fail</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="2203.78" y="490.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="2203.78" y="504.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="272.3369" x="2203.78" y="518.7803">The runtime uses its declared lifecycle-state</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="194.5234" x="2203.78" y="532.7803">contract for Offer reconciliation.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="301.123" x="2203.78" y="546.7803">The credential-free mock exercises SDK request</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="265.3643" x="2203.78" y="560.7803">serialization, response projection, mutation</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="252.9434" x="2203.78" y="574.7803">when supported, and confirmed deletion.</text></g><g class="entity" data-qualified-name="GMN5" data-source-line="95" id="ent0006"><path d="M2885.27,649 L2885.27,657.36 L2425.22,640.3 L2885.27,665.36 L2885.27,685 A8,8 0 0 0 2893.27,693 L3124.7036,693 A8,8 0 0 0 3132.7036,685 L3132.7036,651 L3122.7036,641 L2893.27,641 A8,8 0 0 0 2885.27,649" fill="#FFF7D6" style="stroke:#B45309;stroke-width:0.5;"/><path d="M3122.7036,641 L3122.7036,647 A4,4 0 0 0 3126.7036,651 L3132.7036,651 L3122.7036,641" fill="#FFF7D6" style="stroke:#B45309;stroke-width:0.5;"/><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="136.9717" x="2891.27" y="656.7803">delete policy: required</te