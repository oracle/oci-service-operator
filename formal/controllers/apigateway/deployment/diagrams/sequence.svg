t><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="145.5029" x="793" y="2115.7803">create-only fields: locks</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="291.0469" x="793" y="2129.7803">list lookup: oci_apigateway_deployments filters</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="257.5645" x="793" y="2143.7803">compartmentId, gatewayId, displayName,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="296.4746" x="793" y="2157.7803">lifecycleState; exact gatewayId, compartmentId,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="308.1709" x="793" y="2171.7803">and displayName identify a reusable Deployment;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="295.7158" x="793" y="2185.7803">lifecycleState narrows candidates when present</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="793" y="2199.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="793" y="2213.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="307.4053" x="793" y="2227.7803">The generated runtime tracks create, update, and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="293.3916" x="793" y="2241.7803">delete through API Gateway work requests and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="253.7021" x="793" y="2255.7803">rereads the Deployment before declaring</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="84.0547" x="793" y="2269.7803">convergence.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="286.3779" x="793" y="2283.7803">Existing Deployments are reused only through</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="297.2607" x="793" y="2297.7803">exact gateway, compartment, and display-name</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="242.0264" x="793" y="2311.7803">lookup or an explicitly supplied spec.id.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="261.4609" x="793" y="2325.7803">The compatibility spec.routes shorthand is</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="263.7988" x="793" y="2339.7803">normalized to the SDK specification.routes</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="314.3984" x="793" y="2353.7803">request and observed status remains the complete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="113.6064" x="793" y="2367.7803">SDK specification.</text><?plantuml-src hLTPRnit47xdho3IbmJrsd5Yvv2H0exjfaRS9B2JDm41jJihiQR8BScLh1RzxvtXiTgLfSGzu0UlUCpvpJT3Tojr8woOSpSJbLbAFUMrK0wOwtOcehoTMjFgwimeO_aFTOb_LUz41RLebV_PQFz1p87_0ce1NfPY-vaR-GVmmwFUfh3MB9Fqf_NXosVzczfuU7lFXhf-MRtOF6Li1JQTc1mTFt_wUkC4gK_xpvyV7HuVz_Q3-D9O3POVlc1UUWNy1dvlGPV02ouQEHKUbc9rSDh8T_7p71fbLdFGdira1Rmsna_CNK-ionB-P9oBqXixC3EvcxSs_OHdyAf-Yjie32Cg6w7zzllz0m-HqWj59qF96gwa7WRozP5uFdc5koIo6MoLa-eO3hkjUqbwLOkwP7-nu1j_tqu0e-l1iPuT_0mDiKOfi8FbjyB1DPH6bt9pwz77cu_lRy0kP0c_2YscO1znuVXmQN3buzab8m1miy3q3cNlRTp3Kh1GSGlEgDPBeqTfwQ2IOeevTGVnTx4-KkGqxxl5D4keGA6tEs_7xU5Dq5K0Abi7YnS_zM8qug3nV0jy6mZ7scQtsFeEIHYwFEBTzsDB-fr_meP7wD8mC2FU2KVNd4GVndfhAGGuy2jZRl6VG9ScKbTCAC-zHP1WQ10ESDSeJ4_83SVQqLXnAowK1L6jS5SwxzZG0h89Ju_uE_0zTO24rKdk94d7vz8vfBHTKgvGnLgCU