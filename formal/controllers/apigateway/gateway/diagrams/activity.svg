ovisioning, updating, terminating</text><path d="M705.0295,1993 L705.0295,2337 L685.0295,2341 L705.0295,2345 L705.0295,2689 A0,0 0 0 0 705.0295,2689 L1041.9592,2689 A0,0 0 0 0 1041.9592,2689 L1041.9592,2003 L1031.9592,1993 L705.0295,1993 A0,0 0 0 0 705.0295,1993" fill="#FFF7D6" style="stroke:#B45309;stroke-width:0.5;"/><path d="M1031.9592,1993 L1031.9592,2003 L1041.9592,2003 L1031.9592,1993" fill="#FFF7D6" style="stroke:#B45309;stroke-width:0.5;"/><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="101.165" x="711.0295" y="2008.7803">shared diagram:</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="284.7852" x="711.0295" y="2022.7803">shared/diagrams/shared-reconcile-activity.svg</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="265.3438" x="711.0295" y="2036.7803">Start from the shared reconcile activity and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="273.8955" x="711.0295" y="2050.7803">specialize provider-backed CRUD, wait, and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="182.875" x="711.0295" y="2064.7803">status-projection details here.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="229.5371" x="711.0295" y="2078.7803">Controller-local activity diagrams add</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="238.8955" x="711.0295" y="2092.7803">list-lookup hints, secret policies, delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="200.0332" x="711.0295" y="2106.7803">handling, and open formal gaps.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="281.709" x="711.0295" y="2120.7803">archetype batch: Generated service-manager</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="291.0469" x="711.0295" y="2134.7803">controllers specialize the shared reconcile path</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="189.8477" x="711.0295" y="2148.7803">with formal runtime ownership.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="122.9512" x="711.0295" y="2162.7803">service: apigateway</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="85.6064" x="711.0295" y="2176.7803">slug: gateway</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="108.9443" x="711.0295" y="2190.7803">kind: ApiGateway</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="241.2402" x="711.0295" y="2204.7803">archetype: generated-service-manager</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="156.4063" x="711.0295" y="2218.7803">status/finalizer: required /</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="174.3027" x="711.0295" y="2232.7803">retain-until-confirmed-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="272.3984" x="711.0295" y="2246.7803">requeue: provisioning, updating, terminating</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="265.3369" x="711.0295" y="2260.7803">provider states: create CREATING; update</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="192.165" x="711.0295" y="2274.7803">UPDATING; delete DELETING</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="209.6992" x="711.0295" y="2288.7803">follow-up: create=read-after-write;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="288.7158" x="711.0295" y="2302.7803">update=read-after-write; delete=confirm-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="245.9092" x="711.0295" y="2316.7803">supported drift: caBundles, certificateId,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="230.7197" x="711.0295" y="2330.7803">definedTags, displayName (+3 more)</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="230.3301" x="711.0295" y="2344.7803">reject before mutate: force-new fields</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="243.5781" x="711.0295" y="2358.7803">compartmentId, endpointType, ipMode,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="225.2783" x="711.0295" y="2372.7803">ipv4AddressConfiguration (+2 more)</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="145.5029" x="711.0295" y="2386.7803">create-only fields: locks</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="270.8125" x="711.0295" y="2400.7803">list lookup: oci_apigateway_gateways filters</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="265.3301" x="711.0295" y="2414.7803">compartmentId, displayName, certificateId,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="248.2334" x="711.0295" y="2428.7803">lifecycleState; exact compartmentId and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="261.4678" x="711.0295" y="2442.7803">displayName identify a reusable Gateway;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="284.8193" x="711.0295" y="2456.7803">optional certificateId and lifecycleState narrow</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="155.6611" x="711.0295" y="2470.7803">candidates when present</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="711.0295" y="2484.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="711.0295" y="2498.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="307.4053" x="711.0295" y="2512.7803">The generated runtime tracks create, update, and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="293.3916" x="711.0295" y="2526.7803">delete through API Gateway work requests and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="234.2471" x="711.0295" y="2540.7803">rereads the Gateway before declaring</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="84.0547" x="711.0295" y="2554.7803">convergence.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="304.2744" x="711.0295" y="2568.7803">Existing Gateways are reused only through exact</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="277.04" x="711.0295" y="2582.7803">compartment and display-name lookup or an</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="242.0127" x="711.0295" y="2596.7803">explicitly supplied spec.id; lifecycle and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="282.4678" x="711.0295" y="2610.7803">certificate filters narrow candidates only when</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="50.5859" x="711.0295" y="2624.7803">present.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="305.0469" x="711.0295" y="2638.7803">A package-local companion writes the ready-only</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="271.5781" x="711.0295" y="2652.7803">hostname Secret and removes only Secrets</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="315.9297" x="711.0295" y="2666.7803">carrying the current Gateway kind/name ownership</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="62.2617" x="711.0295" y="2680.7803">metadata.</text><ellipse cx="674.0295" cy="2341" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="674.0295" cy="2341" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="674.0295" x2="674.0295" y1="157" y2="177"/><polygon fill="#0F172A" points="670.0295,167,674.0295,177,678.0295,167,674.0295,171" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="843.2341" x2="843.2341" y1="341" y2="361"/><polygon fill="#0F172A" points="839.2341,351,843.2341,361,847.2341,351,843.2341,355" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="843.2341" x2="843.2341" y1="409" y2="429"/><polygon fill="#0F172A" points="839.2341,419,843.2341,429,847.2341,419,843.2341,423" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="532.5637" x2="504.825" y1="257" y2="257"/><line style="stroke:#0F172A;stroke-width:1;" x1="504.825" x2="504.825" y1="257" y2="279"/><polygon fill="#0F172A" points