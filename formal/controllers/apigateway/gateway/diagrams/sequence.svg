cing" textLength="281.709" x="778" y="1977.7803">archetype batch: Generated service-manager</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="266.1504" x="778" y="1991.7803">controllers follow the shared resolution and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="259.9297" x="778" y="2005.7803">delete sequences with imported waits and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="134.6064" x="778" y="2019.7803">controller-local policy.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="122.9512" x="778" y="2033.7803">service: apigateway</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="85.6064" x="778" y="2047.7803">slug: gateway</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="108.9443" x="778" y="2061.7803">kind: ApiGateway</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="241.2402" x="778" y="2075.7803">archetype: generated-service-manager</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="156.4063" x="778" y="2089.7803">status/finalizer: required /</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="174.3027" x="778" y="2103.7803">retain-until-confirmed-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="272.3984" x="778" y="2117.7803">requeue: provisioning, updating, terminating</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="265.3369" x="778" y="2131.7803">provider states: create CREATING; update</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="192.165" x="778" y="2145.7803">UPDATING; delete DELETING</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="209.6992" x="778" y="2159.7803">follow-up: create=read-after-write;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="288.7158" x="778" y="2173.7803">update=read-after-write; delete=confirm-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="245.9092" x="778" y="2187.7803">supported drift: caBundles, certificateId,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="230.7197" x="778" y="2201.7803">definedTags, displayName (+3 more)</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="230.3301" x="778" y="2215.7803">reject before mutate: force-new fields</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="243.5781" x="778" y="2229.7803">compartmentId, endpointType, ipMode,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="225.2783" x="778" y="2243.7803">ipv4AddressConfiguration (+2 more)</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="145.5029" x="778" y="2257.7803">create-only fields: locks</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="270.8125" x="778" y="2271.7803">list lookup: oci_apigateway_gateways filters</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="265.3301" x="778" y="2285.7803">compartmentId, displayName, certificateId,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="248.2334" x="778" y="2299.7803">lifecycleState; exact compartmentId and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="261.4678" x="778" y="2313.7803">displayName identify a reusable Gateway;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="284.8193" x="778" y="2327.7803">optional certificateId and lifecycleState narrow</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="155.6611" x="778" y="2341.7803">candidates when present</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="778" y="2355.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="778" y="2369.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="307.4053" x="778" y="2383.7803">The generated runtime tracks create, update, and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="293.3916" x="778" y="2397.7803">delete through API Gateway work requests and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="234.2471" x="778" y="2411.7803">rereads the Gateway before declaring</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="84.0547" x="778" y="2425.7803">convergence.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="304.2744" x="778" y="2439.7803">Existing Gateways are reused only through exact</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="277.04" x="778" y="2453.7803">compartment and display-name lookup or an</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="242.0127" x="778" y="2467.7803">explicitly supplied spec.id; lifecycle and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="282.4678" x="778" y="2481.7803">certificate filters narrow candidates only when</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="50.5859" x="778" y="2495.7803">present.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="305.0469" x="778" y="2509.7803">A package-local companion writes the ready-only</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="271.5781" x="778" y="2523.7803">hostname Secret and removes only Secrets</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="315.9297" x="778" y="2537.7803">carrying the current Gateway kind/name ownership</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="62.2617" x="778" y="2551.7803">metadata.</text><?plantuml-src lLXRRnit5dxdho2wBmcgiUF4QLCPMS1nijcWRbF4wPk1WfhXI5oFo5cI8qMxsF--t-5bBhBKg2XsuGVF3Cbp_Svt3kKUb6w55MlkLg8oMwMNl1QDayprAmjHFYojwNHrOnfZ-L_g4d_LQ4SbQz4r_cz6-v_5MlA_osOZlIh5uJrtwb-INroE5eMrPfkaFwilldy-FgcDbsyUsL3NtrVVxUyojf8sxLXSldpnx8Uz7QG-hRzuSNdnykLeFOWlZTNIyellc5U-aVnE_hEJkfIyuA9LI-7bLkpEhrlrFZwobQeahutn2_Db9CpbS_zcd8lI6pinBZcPb_Qzay_bg_ePbY4CSLIjqFxm-V66KwIC0j3BQ5GjRvMUXk-7I_5YyGgh9BATB9MBwgMyw9SUfUPLBUgI_OS5t_YFtK8YfbuwDhA3ty0GQvf6siddDyB9Jx8qkbJxIzzylFluuvsq6rNAduGMIsc_uSBnwQV9aOyt7wOY1cDmhBJI9mdqU0Th9IEKSBC11gQcpFRKe5wihBYLpZITLqRFqwVpIeab8E3EutinR2aoAixSPfabLBA1FKTFn-NfIQchW6OsSgVuwoYaSourzdUI3qY5gSaNDcoaOrC_vxn_Vc99gVDFsNGB7Pf6Opu8XpzEaL-Z6WauuRV6FE2VWF4BfIic6i-z1Ngm6JYHNze6UGf9uoWgZGBSST5OAQeTLfNpZatLaY7OFUVlfS-w9CYh5zkBKOwlbNEWjsCYRY4_oN1FQjLuQTsSbsPD-5b3p8TgTgyhvTf6x8ZbPhoKG5ODclCoB58TbRkoaNSUdvu61wtid5WWBEGL8Q6p80MOW_o1Db0rnmowWUDUPhSQOrfUXa-yHVw9g6y-lRl-_E7dzwT41Nf2P0xRyyUZVC3k0r1g4KH8Z5MoGK8ckLMQEqIgSq4SHIk2dIVSoIeXvstuVCoik9ejEx89DjNAhhE6ZH8ZTm2_Upq6G0ntsfl3_VRTxRlJmarmdeYJ1zCyefrvLcQs6c6AAr